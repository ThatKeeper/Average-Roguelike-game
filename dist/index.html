    <style>
/* Estilos base: página, canvas, capa de menús (#ov), tipografía y botones */
:root {
  color-scheme: dark;
  --bg: #0b0a10;
  --fg: #e8e2f0;
  --ac: #c9a24a;
  --pn: #1a1722;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
html,
body {
  height: 100%;
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: Georgia, serif;
}
body {
  display: flex;
  align-items: center;
  justify-content: center;
}
#w {
  position: relative;
  width: min(100vw, 160vh);
  width: min(100vw, 160dvh);
}
html {
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
body {
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
}
canvas {
  width: 100%;
  display: block;
  background: #000;
  cursor: crosshair;
}
#ov {
  position: absolute;
  inset: 0;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: 10px;
  background: rgba(8, 6, 12, 0.94);
  overscroll-behavior: contain;
  text-align: center;
  padding: 12px;
  overflow: auto;
}
#ov > :first-child {
  margin-top: auto;
}
#ov > :last-child {
  margin-bottom: auto;
}
h1 {
  margin: 0;
  color: var(--ac);
  letter-spacing: 0.15em;
  font-size: clamp(22px, 5vw, 44px);
}
h2 {
  margin: 0;
  color: var(--ac);
}
button {
  background: var(--pn);
  color: var(--fg);
  border: 1px solid var(--ac);
  padding: 10px 18px;
  font: inherit;
  cursor: pointer;
  border-radius: 4px;
  max-width: 92%;
}
button:hover {
  background: #2c2538;
}
p {
  margin: 2px;
  max-width: 640px;
  font-size: clamp(11px, 1.6vw, 15px);
  opacity: 0.88;
}
</style>

/* Controles táctiles: iconos, joystick de ataque, joystick/cruceta de movimiento y editor de distribución */
.tc { position: fixed; inset: 0; pointer-events: none; z-index: 5; display: none; --s: 1; }
.tc.on { display: block; }
.tctl { position: absolute; pointer-events: auto; touch-action: none; user-select: none; -webkit-user-select: none; box-sizing: border-box; }
/* joystick de movimiento */
.tj { border-radius: 50%; border: 2px solid #c9a24acc; background: radial-gradient(circle, #1f1830cc, #161120aa); }
.tj .ch { position: absolute; width: 26%; height: 26%; color: #c9a24a99; pointer-events: none; }
.tj .ch svg { width: 100%; height: 100%; }
.tj .c0 { left: 37%; top: 3%; } .tj .c1 { right: 3%; top: 37%; transform: rotate(90deg); }
.tj .c2 { left: 37%; bottom: 3%; transform: rotate(180deg); } .tj .c3 { left: 3%; top: 37%; transform: rotate(-90deg); }
.tk { position: absolute; left: 50%; top: 50%; width: 44%; height: 44%; margin: -22% 0 0 -22%; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #f1d58a, #b88a2e); border: 2px solid #fff6; pointer-events: none; box-shadow: 0 3px 8px #0008; }
/* cruceta */
.td { border-radius: 14px; }
.td .da { position: absolute; width: 34%; height: 34%; display: flex; align-items: center; justify-content: center; background: #161120cc; border: 2px solid #c9a24acc; color: #e8c97a; pointer-events: none; }
.td .da svg { width: 70%; height: 70%; }
.td .u { left: 33%; top: 0; border-radius: 10px 10px 4px 4px; }
.td .d { left: 33%; bottom: 0; border-radius: 4px 4px 10px 10px; transform: rotate(180deg); }
.td .l { left: 0; top: 33%; border-radius: 10px 4px 4px 10px; transform: rotate(-90deg); }

/* joystick de ataque: anillo + botón con el icono del arma */
.ta { border-radius: 50%; border: 2px solid #d4566e; background: radial-gradient(circle, #3a1522cc, #2a1019aa); }
.ta .ar { position: absolute; inset: 9%; border-radius: 50%; border: 2px dashed #d4566e77; pointer-events: none; }

.ta .ak div { line-height: 1; }
.ta.p .ak { background: radial-gradient(circle at 35% 30%, #d4566e, #8a2a3e); }
/* botones con icono */
.tb { border-radius: 50%; border: 2px solid var(--c, #c9a24a); background: radial-gradient(circle at 35% 30%, #261d38dd, #161120cc); color: var(--c, #fff); display: flex; align-items: center; justify-content: center; position: absolute; }
.tb .ic { width: 62%; height: 62%; display: flex; align-items: center; justify-content: center; pointer-events: none; position: relative; }
.tb .ic svg { width: 100%; height: 100%; filter: drop-shadow(0 1px 2px #000a); }
.tb.top, .tb.card { border-radius: 12px; }
.tb.top .ic { width: 70%; height: 70%; }
.tb.card .ic { width: 66%; height: 66%; }
.tb .num { position: absolute; right: -3px; bottom: -4px; font: bold 11px Georgia; font-style: normal; color: #fff; background: #000a; border-radius: 6px; padding: 0 3px; }
.tb .n { position: absolute; inset: 0; border-radius: inherit; display: none; align-items: center; justify-content: center; background: #000a; color: #ffd98a; font: bold 1em Georgia; pointer-events: none; }
.tb.cd .n { display: flex; }
.tb.cd { border-color: #666; }
.tb.p { background: var(--c, #c9a24a); transform: scale(.94); }
.tb.p .ic { color: #120c1a; }
.tb[data-q]::after { content: attr(data-q); position: absolute; right: -4px; top: -5px; min-width: 16px; height: 16px; border-radius: 8px; background: var(--c); color: #fff; font: bold 11px/16px Georgia; text-align: center; padding: 0 3px; box-sizing: border-box; text-shadow: 0 0 2px #000; }
.tb.empty { opacity: .55; }
/* editor */
.tc.edit { background: #0008; }
.tc.edit .tctl { outline: 2px dashed #ffffff88; outline-offset: 2px; cursor: grab; }
.tc.edit .tctl.bad { outline-color: #f44; box-shadow: 0 0 12px #f44; }
.tc.edit .tctl.dragging { opacity: .8; cursor: grabbing; }
.tedit { position: fixed; top: 42%; left: 50%; transform: translate(-50%, -50%); z-index: 20; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; background: #161120ee; border: 2px solid #c9a24a; border-radius: 10px; padding: 6px 10px; max-width: 94vw; pointer-events: auto; }
.tedit small { color: #b8b0c8; font-size: 11px; }
.tedit button { padding: 5px 10px; font-size: 12px; }
.rot { display: none; position: fixed; inset: 0; background: #0b0a10; color: #e8e2f0; align-items: center; justify-content: center; text-align: center; font: 18px Georgia; z-index: 9; pointer-events: auto; padding: 20px; }
</style>

.iv { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 100%; max-width: 980px; --sl: clamp(30px, 8.4vh, 46px); }

.sl { position: relative; width: var(--sl); height: var(--sl); box-sizing: border-box; border: 2px solid var(--rc, #3a3150); border-radius: 7px; background: #1a1722; display: flex; align-items: center; justify-content: center; cursor: grab; user-select: none; -webkit-user-select: none; transition: transform .08s, box-shadow .15s; }

.sl .q { position: absolute; right: 2px; bottom: 0; font-size: 11px; font-style: normal; font-weight: bold; color: #fff; text-shadow: 0 0 3px #000, 0 0 3px #000; pointer-events: none; }

.sl:hover:not(.empty) { transform: scale(1.06); box-shadow: 0 0 8px var(--rc, #fff); }

.sl.trash { width: calc(var(--sl) * .95); height: calc(var(--sl) * .95); border-color: #6a3a3a; }

/* favoritos: marco dorado, brillo pulsante y destello */
.sl.fav, .cfav { border-color: #ffd54a !important; background: linear-gradient(135deg, #3a2f12, #1a1722 60%); animation: favp 2.2s ease-in-out infinite; overflow: hidden; }
.sl.fav::after { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 40%, #fff5 50%, transparent 60%); transform: translateX(-100%); animation: favs 3s ease-in-out infinite; pointer-events: none; }
@keyframes favp { 0%, 100% { box-shadow: 0 0 4px #ffd54a88; } 50% { box-shadow: 0 0 11px #ffd54acc; } }
@keyframes favs { 0%, 55% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

.sh-tabs { display: flex; gap: 8px; }

  <body>
    <div id="w">
      <canvas id="c" width="960" height="600"></canvas>
      <div id="ov"></div>
    </div>
  <script>
// ---- src/js/core/helpers.js ----
/* ======================================================================
 * src/js/core/helpers.js
 * Referencias al DOM/canvas, constantes de pantalla y utilidades matemáticas y de formato.
 *
 * Define:
 * $, cv, x, W, H, ov, rnd, pick, cl, ang, dist, nrm, rngS, fmt
 * ====================================================================== */

const $ = (i) => document.getElementById(i),
  cv = $("c"),
  x = cv.getContext("2d"),
  W = 960,
  H = 600,
  ov = $("ov");
const rnd = (a, b) => a + Math.random() * (b - a),
  pick = (a) => a[(Math.random() * a.length) | 0],
  cl = (v, a, b) => Math.max(a, Math.min(b, v));
const ang = (a, b) => Math.atan2(b.y - a.y, b.x - a.x),
  dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y),
  nrm = (v) => Math.atan2(Math.sin(v), Math.cos(v));
const rngS = (s) => () => {
  s |= 0;
  s = (s + 0x6d2b79f5) | 0;
  let t = Math.imul(s ^ (s >>> 15), 1 | s);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
};
const fmt = (n) =>
  n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? (n / 1e3).toFixed(1) + "k" : Math.round(n);

// ---- src/js/core/storage.js ----
/* ======================================================================
 * src/js/core/storage.js
 * Versión del juego, progreso permanente (S) en localStorage y reinicios por versión (hard/soft reset).
 *
 * Define:
 * GAME_VERSION, HARD_RESET, SOFT_RESET, SKEY, SOFT_WIPE, S, RESET_MSG, save
 * ====================================================================== */

// ===== VERSIONES =====
// GAME_VERSION: solo informativa (se muestra en el titulo y fuerza a renovar el service worker).
// HARD_RESET: sube +1 para BORRAR TODO el guardado (partida nueva desde cero, incluidos logros y bestiario).
// SOFT_RESET: sube +1 para reiniciar solo el PROGRESO (claves de SOFT_WIPE); se conservan logros, bestiario, estadisticas, jefes derrotados y ajustes.
const GAME_VERSION = "1.3.7",
  HARD_RESET = 1,
  SOFT_RESET = 1,
  SKEY = "idv1",
  SOFT_WIPE = ["best", "souls", "pw", "fv", "hard", "hv2", "up", "cards"];
let S = { best: 0, souls: 0, pw: 0 },
  RESET_MSG = "";
try {
  const raw = JSON.parse(localStorage.getItem(SKEY)) || {};
  if (raw.hv === undefined) {
    raw.hv = HARD_RESET;
    raw.sv = SOFT_RESET;
  }
  if (raw.hv !== HARD_RESET) {
    RESET_MSG = "Nueva versión: partida reiniciada desde cero.";
  } else {
    if (raw.sv !== SOFT_RESET) {
      SOFT_WIPE.forEach((k) => delete raw[k]);
      RESET_MSG = "Nueva versión: progreso reiniciado (logros y bestiario conservados).";
    }
    S = Object.assign(S, raw);
  }
} catch (e) {}
S.hv = HARD_RESET;
S.sv = SOFT_RESET;
const save = () => {
  try {
    localStorage.setItem(SKEY, JSON.stringify(S));
  } catch (e) {}
};
save();

// ---- src/js/core/audio.js ----
/* ======================================================================
 * src/js/core/audio.js
 * Sonido procedural con WebAudio: efectos (snd) y sonidos de jefe (bsnd).
 *
 * Define:
 * AC, snd, lootSnd, bsT, bsnd
 * ====================================================================== */

let AC;
function snd(f, d, t = "sine", v = 0.04, m = 0) {
  try {
    AC = AC || new AudioContext();
    const o = AC.createOscillator(),
      g = AC.createGain(),
      n = AC.currentTime;
    o.type = t;
    o.frequency.value = f;
    g.gain.setValueAtTime(v * (S.vol ?? 1) * (m ? (S.vm ?? 1) : (S.vfx ?? 1)), n);
    g.gain.exponentialRampToValueAtTime(0.001, n + d);
    o.connect(g);
    g.connect(AC.destination);
    o.start();
    o.stop(n + d);
  } catch (e) {}
}
/**
 * Sonido al conseguir un objeto: r = rareza (2 épico, 3 legendario; las demás no suenan especial).
 * Épico: arpegio ascendente brillante. Legendario: acorde grave que se abre en fanfarria con destello.
 */
function lootSnd(r) {
  const at = (ms, f) => setTimeout(f, ms);
  if (r == 2) {
    [523, 659, 784, 1047].forEach((f, i) => at(i * 70, () => snd(f, 0.28, "triangle", 0.05)));
    at(300, () => snd(1568, 0.5, "sine", 0.03));
  } else if (r >= 3) {
    [392, 523, 659, 784].forEach((f, i) =>
      at(i * 90, () => {
        snd(f, 0.5, "sawtooth", 0.03);
        snd(f * 2, 0.5, "triangle", 0.04);
      }),
    );
    at(420, () => {
      [523, 659, 784, 1047].forEach((f) => snd(f, 1.1, "triangle", 0.05));
      snd(2093, 0.9, "sine", 0.03);
    });
    at(520, () => snd(3136, 0.6, "sine", 0.02));
  }
}
let bsT = 0;
function bsnd(i, k) {
  const n = Date.now();
  if (k == "atk") {
    if (n - bsT < 140) return;
    bsT = n;
  }
  const f = 90 + i * 32,
    w = ["sawtooth", "square", "triangle", "sine"][i % 4];
  if (k == "in") {
    snd(f, 0.9, w, 0.08);
    snd(f * 1.5, 0.6, w, 0.05);
  } else if (k == "ph") {
    snd(f * 0.5, 0.7, w, 0.1);
    snd(f * 2, 0.4, w, 0.06);
  } else if (k == "die")
    for (let j = 0; j < 4; j++) snd(f * (1 + j * 0.25), 0.6 + j * 0.1, "triangle", 0.06);
  else snd(f * 3, 0.08, w, 0.03);
}

// ---- src/js/data/world.js ----
/* ======================================================================
 * src/js/data/world.js
 * Datos del mundo: biomas, nombres de los jefes de bioma y direcciones del mapa de salas.
 *
 * Define:
 * BI, BN, DIR, TS, GW, GH, RB
 * ====================================================================== */

const BI = [
  ["Catacumbas", "#26222e", "#4a4257", "#8a7fa3"],
  ["Criptas malditas", "#221828", "#432a52", "#b05fd0"],
  ["Minas abandonadas", "#2b2218", "#52402a", "#c9964a"],
  ["Bosque subterráneo", "#14241a", "#2c4a30", "#5fd078"],
  ["Ruinas arcanas", "#18203a", "#2e3f6a", "#5f9bd0"],
  ["Cavernas de lava", "#2e1410", "#5a2a1c", "#ff7a3a"],
  ["Abismos helados", "#142830", "#2f5566", "#8fe3ff"],
  ["Dimensión corrupta", "#2a0e20", "#5a1f45", "#ff4fa0"],
];
const BN = [
  "Rey Exhumado",
  "Devoradora de Luz",
  "Coloso de Mena",
  "Madre Raíz",
  "Arconte Roto",
  "Señor del Magma",
  "Reina Escarcha",
  "Voz del Vacío",
];
const DIR = [
  [0, -1],
  [1, 0],
  [0, 1],
  [-1, 0],
];


// Sala = cuadrícula de 24x15 tiles de 40 px (960x600). El anillo exterior es muro; la zona jugable es RB.
const TS = 40,
  GW = 24,
  GH = 15,
  RB = { x0: TS, y0: TS, x1: (GW - 1) * TS, y1: (GH - 1) * TS };
// ---- src/js/data/weapons.js ----
/* ======================================================================
 * src/js/data/weapons.js
 * Rarezas, catálogo de armas (WP), colores elementales y fábrica de armas (mk).
 *
 * Define:
 * RN, RMU, WP, EC, mk
 * ====================================================================== */

const RN = ["Común", "Rara", "Épica", "Legendaria"],
  RMU = [1, 1.2, 1.5, 1.9];
const WP = [
  { n: "Espada", s: "m", cd: 0.38, rng: 78, arc: 2.1, dmg: 1, crit: 0.08, sc: "str" },
  { n: "Dagas", s: "m", cd: 0.2, rng: 48, arc: 1.7, dmg: 0.5, crit: 0.28, sc: "str" },
  { n: "Gran espada", s: "m", cd: 0.75, rng: 100, arc: 3.2, dmg: 2.3, crit: 0.06, sc: "str" },
  { n: "Martillo", s: "m", cd: 0.95, rng: 76, arc: 1.8, dmg: 2.5, crit: 0.05, sc: "str", stun: 1 },
  { n: "Lanza", s: "m", cd: 0.5, rng: 135, arc: 0.55, dmg: 1.25, crit: 0.1, sc: "str" },
  {
    n: "Arco",
    mag: 12,
    rt: 1.9,
    s: "r",
    cd: 0.38,

  magia_helada: { s: 2.2, r: 7, ax: 9, ay: 7 },
  magia_tormenta: { s: 2.2, r: 7, ax: 8, ay: 7.5 },
  magia_venenosa: { s: 2.2, r: 7, ax: 11, ay: 9 },
  magia_marea: { s: 2.2, r: 7, ax: 9, ay: 7.5 },
  magia_runica: { s: 2, r: 5, ax: 10.5, ay: 8 },
  chakram: { s: 1.9, r: 11, ax: 8, ay: 8, spin: 22 },
};

// Elemento de un hechizo de carta -> sprite de proyectil (los demás elementos siguen como orbe de color)
const SPELL_SPR = { fire: "magia_ignea", water: "magia_marea", ice: "magia_helada", light: "magia_tormenta", plant: "magia_venenosa", dark: "magia_arcana" };

// Registro de sprites cargados: clave -> { img, circ (círculos de colisión), ready }
const WSPR = {};
const ART_CACHE = {};

/** Configuración de animación del arma; si no tiene sprite propio usa un tajo genérico. */
function meleeArt(w) {
  if (MELEE_ART[w.n]) return MELEE_ART[w.n];
  return (ART_CACHE[w.n] ||= {
    spr: null, fam: "sweep", gu: -7, tu: 10, s: Math.max(1.5, (0.95 * (w.rng || 60) - 14) / 17),
    dur: 0.22, w: 0.24, r: 0.22, back: 0.45, lunge: 4, pull: 7, idle: 0.85, trail: "#e8f2ff",
  });
}

/**
 * Convierte el sprite en una lista de círculos de colisión (celdas de 2x2 píxeles
 * con algo opaco). Cada círculo se guarda como (u, v): u a lo largo del eje del arma
 * y v perpendicular a él. Así la zona de daño es la silueta real del sprite.
 */
function spriteCircles(src) {
  const c = document.createElement("canvas");
  c.width = c.height = 16;
  const g = c.getContext("2d");
  g.drawImage(src, 0, 0, 16, 16);
  let d;
  try {
    d = g.getImageData(0, 0, 16, 16).data;
  } catch (e) {
    return null;
  }
  const out = [];
  for (let cy = 0; cy < 8; cy++)
    for (let cx = 0; cx < 8; cx++) {
      let on = 0;
      for (let j = 0; j < 2; j++)
        for (let i = 0; i < 2; i++) if (d[((cy * 2 + j) * 16 + cx * 2 + i) * 4 + 3] > 40) on++;
      if (!on) continue;
      const X = cx * 2 + 1 - 8,
        Y = cy * 2 + 1 - 8;
      out.push({ u: (X - Y) / SQ2, v: (X + Y) / SQ2 });
    }
  return out;
}

function loadWeaponSprites() {
  const keys = new Set(Object.values(MELEE_ART).map((a) => a.spr));
  for (const a of Object.values(RANGED_ART)) keys.add(a.spr).add(a.spr2);
  for (const k of Object.keys(PROJ_ART)) keys.add(k);
  for (const key of keys) {
    const rec = (WSPR[key] = { img: null, circ: null, ready: false });
    const uri = WEAPON_SPRITE_DATA[key];
    if (!uri) continue;
    const img = new Image();
    img.onload = () => {
      rec.img = img;
      rec.circ = spriteCircles(img);
      rec.ready = true;
    };
    img.src = uri;
  }
}
loadWeaponSprites();

onkeyup = (e) => (K[e.code] = 0);
cv.onmousemove = (e) => {
  const b = cv.getBoundingClientRect();
  M.x = ((e.clientX - b.left) * W) / b.width;
  M.y = ((e.clientY - b.top) * H) / b.height;
};
cv.onmousedown = (e) => {
  e.button ? (M.r = 1) : (M.d = 1);
};
onmouseup = (e) => {
  e.button ? (M.r = 0) : (M.d = 0);
};
cv.oncontextmenu = (e) => e.preventDefault();

// Táctil/lápiz: el navegador emite mousedown+mouseup juntos al soltar el dedo, así que M.d
// vuelve a 0 antes de que el bucle lo lea y los menús (título, hub) nunca ven el clic.
// pointerdown registra el toque y lo conserva un instante; tapped() lo consume una vez.
cv.addEventListener("pointerdown", (e) => {
  if (e.pointerType == "mouse") return;
  const b = cv.getBoundingClientRect();
  M.x = ((e.clientX - b.left) * W) / b.width;
  M.y = ((e.clientY - b.top) * H) / b.height;
  M.tap = performance.now();
});
const tapped = () => {
  const v = M.tap && performance.now() - M.tap < 400;
  M.tap = 0;
  return !!v;
};

/* ======================================================================
 * src/js/spells/casting.js
 * Construcción y lanzamiento de hechizos, impacto de hechizo y zonas persistentes.
 *
 * Define:
 * build, spHit, castSp, zn
 * ====================================================================== */

function build(a, b, f) {
  const k = [a, b].filter(Boolean).sort().join("+"),
    c = CB[k],
    f2 = c?.f || f,
    F = {
      bolt: [20, 2.5, 1, 0],
      nova: [28, 5, 0.85, 120],
      cone: [22, 3, 1.1, 170],
      zone: [30, 7, 0.55, 90],
    }[f2],
    has = (z) => a == z || b == z,
    els =
      b && b != a
        ? [
            [a, 0.6],
            [b, 0.4],
          ]
        : [[a, 1]];
  let cost = F[0] * (b && b != a ? 1.2 : 1) * (1 - 0.08 * (P.tal.alch || 0)) * mpK(),
    cd = F[1],
    hpc = has("blood") ? P.mhp * (k == "blood+dark" ? 0.15 : 0.06) : 0;
  const dmg = wd(1) * F[2] * (c?.m || 1) * (has("blood") ? 1.35 : 1);
  if (has("corr")) {
    cost *= 1.25;
    cd *= 1.25;
  }
  return {
    a,
    b,
    f: f2,
    c,
    els,
    name: c ? c.n : EL[a].n + (b && b != a ? " + " + EL[b].n : ""),
    cost,
    cd: cd * (c?.cdm || 1),
    hpc,
    dmg,
    r: F[3] * (c?.r || 1) * (has("wind") ? 1.3 : 1),
    dur: 4,
    k: 1,
    desc: els.map(([z]) => EL[z].d).join(" ") + (c ? " \u2605 " + c.d : ""),
    risk:
      [
        hpc ? `Sacrificas ${Math.ceil(hpc)} de vida.` : "",
        has("corr") ? "+25% coste y enfriamiento." : "",
        (c && c.rk) || "",
        k == "fire+water" || k == "fire+ice" ? "Los elementos se contrarrestan." : "",
      ]
        .filter(Boolean)
        .join(" ") || "Sin riesgos.",
  };
}
function spHit(e, s, x0, y0) {
  if (e.hp <= 0 || e.sp > 0) return;
  for (const [k, sh] of s.els) {
    hit(e, s.dmg * sh, "m", { el: k, ch: k == "light", a: Math.atan2(e.y - y0, e.x - x0) });
    if (e.hp > 0) EL[k].h(e, s, x0, y0);
  }
  if (s.c && e.hp > 0) s.c.h(e, s);
}
function castSp(spec, ci = 4) {
  const s = spec || P.sp;
  if (!s || P.cd[ci] > 0 || P.dash) return;
  const sp = build(s.a, s.b, s.f);
  if (P.mp < sp.cost || P.hp <= sp.hpc + 1) {
    flash(P.mp < sp.cost ? "Man\u00e1 insuficiente" : "Vida insuficiente");
    return;
  }
  P.mp -= sp.cost;
  P.hp -= sp.hpc;
  P.cd[ci] = sp.cd;
  sp.st = !(P.stcd > 0);
  const col = EL[sp.a].c;
  if (sp.f == "bolt")
    shoot(P.face, 560, sp.dmg, "m", {
      sf: sp,
      c: col,
      r: 8,
      pierce: sp.c ? 1 : 0,
      spr: SPELL_SPR[sp.a],
    });
  else if (sp.f == "zone") {
    const d = Math.min(300, dist(P, M)),
      a = P.face;
    ZN.push({ x: P.x + Math.cos(a) * d, y: P.y + Math.sin(a) * d, r: sp.r, t: sp.dur, k: 0, sp });
  } else {
    FX.push({ k: "ring", x: P.x, y: P.y, r: sp.r, t: 0.3, m: 0.3, c: col });
    for (const e of E)
      if (
        e.hp > 0 &&
        dist(P, e) < sp.r + e.r &&
        (sp.f == "nova" || Math.abs(nrm(ang(P, e) - P.face)) < 0.65)
      )
        spHit(e, sp, P.x, P.y);
  }
  if (sp.c && sp.c.cap) P.stcd = 6;
  rangedKick();
  snd(500, 0.12, "sine");
}
function zn(dt) {
  for (const z of ZN) {
    z.t -= dt;
    z.k -= dt;
    if (z.k <= 0) {
      z.k = 0.6;
      for (const e of E) if (e.hp > 0 && dist(z, e) < z.r + e.r) spHit(e, z.sp, z.x, z.y);
    }
  }
  ZN = ZN.filter((z) => z.t > 0);
}

// ===== PARTIDA =====
function run(wi) {
  trnCubes("down"); // el estado nuevo se prepara ya; los cubitos tapan el cambio
  G = { st: "play", seed: Date.now() % 1e9, d: 1, ov: 0, kills: 0, fromRun: 1 };
  const a = { str: 3, dex: 3, int: 3, vit: 3, agi: 3, luk: 3 },
    w = mk(wi);
  a[w.sc] += 4;
  P = {
    x: 480,
    y: 300,
    vx: 0,
    vy: 0,
    r: 12,
    lv: 1,
    xp: 0,
    nx: 30,
    pend: 0,
    a,
    w,
    gold: 0,
    relics: [],
    inv: 0,
    dcd: 0,
    acd: 0,
    cd: [0, 0, 0, 0],
    eq: {},
    tal: {},
    pts: 0,
    cls: w.s,
    cb: 0,
    gt: 0,
    dm: 1 + 0.005 * U("pow"),
    cm: 1.6,
    ccb: 0,
    ls: 0,
    bhp: 0,
    bmp: 0,
    bmr: 0,
    bsp: 0,
    barm: 0,
    bn: 0,
    fz: 0,
    fl: 0,
    pcd: 0,
  };
  bagInit();
  ST();
  P.hp = P.mhp;
  P.mp = P.mmp;
  AL = [];
  TR = [];
  ZN = [];
  K = {};
  M.d = M.r = 0;
  E = [];
  PR = [];
  Z = [];
  FX = [];
  NM = [];
  shake = 0;
  hide();
  genLevel();
  enter(0, 4);
  music();
}
function ST() {
  const a = P.a;
  P.mhp = 60 + a.vit * 10 + P.bhp;
  P.mmp = 30 + a.int * 6 + P.bmp;
  P.spd = 185 * (1 + 0.015 * a.agi + P.bsp + 0.01 * U("spd"));
  P.as = 1 + 0.015 * a.agi;
  P.arm = a.vit * 1.5 + P.barm + U("arm");
  P.mr = 3 + a.int * 0.5 + P.bmr;
  P.cc = Math.min(0.75, P.w.crit + a.dex * 0.004 + a.luk * 0.004 + P.ccb);
  P.edm = 1;
  P.els = 0;
  P.ecm = 0;
  for (const s in P.eq) {
    const q = P.eq[s].st;
    P.mhp += q.hp || 0;
    P.mmp += q.mp || 0;
    P.arm += q.arm || 0;
    P.spd *= 1 + (q.spd || 0);
    P.as += q.as || 0;
    P.cc = Math.min(0.85, P.cc + (q.cc || 0));
    P.edm += q.dm || 0;
    P.els += q.ls || 0;
    P.ecm += q.cm || 0;
  }
  P.res = {};
  for (const s in P.eq) {
    const q = P.eq[s].st;
    for (const k in q)
      if (k.startsWith("r_")) P.res[k.slice(2)] = Math.min(0.6, (P.res[k.slice(2)] || 0) + q[k]);
  }
  const T = P.tal;
  P.arm += 6 * (T.skin || 0);
  P.cc = Math.min(0.85, P.cc + 0.04 * (T.hunt || 0));
  P.els += 0.01 * (T.thirst || 0);
  P.mmp += 20 * (T.will || 0);
  P.mr += 1.5 * (T.will || 0);
  P.mhp = Math.round(P.mhp * (1 + 0.01 * U("vig")));
  if (P.hp > P.mhp) P.hp = P.mhp;
  if (P.mp > P.mmp) P.mp = P.mmp;
}

// ---- src/js/combat/damage.js ----
/* ======================================================================
 * src/js/combat/damage.js
 * Fórmula de daño y escalado, estados alterados, golpes, áreas, cadenas y muerte de enemigos.
 *
 * Define:
 * wd, hpM, dmM, col, nm, apply, hit, area, chain, kill
 * ====================================================================== */

// ===== DAÑO (fórmula centralizada) =====
// final = 10*dañoArma*rareza * (1+0.06*(nivel-1)) * (1+0.045*atributoEscalado) * modHabilidad * dmPermanente/reliquias
//         * crítico(×cm) * (1 - resistenciaObjetivo[tipo]) * (escudo?0.5)   | físico 'p', mágico 'm'
// Escalado enemigo por profundidad d: vida=(1+.22(d-1))*(1+.35*floor((d-1)/4)) ; daño=1+.09(d-1)+.12*floor((d-1)/4)
// Más allá de los números: d>=3 oleadas dobles, campeones con modificadores, más tipos de enemigo y patrones de jefe.

const wd = (k = 1) =>
  10 *
  P.w.dmg *
  P.w.rm *
  (1 + 0.06 * (P.lv - 1)) *
  (1 + 0.045 * P.a[P.w.sc]) *
  k *
  P.dm *
  P.edm *
  (P.bt > 0 ? 1.35 : 1);
// Maná de los hechizos: el coste base se multiplica por la raíz cuadrada del crecimiento de daño del personaje
// (nivel × atributo principal × multiplicadores de daño), respecto al inicio de la partida (nivel 1, atributo 7).
// Así crece más despacio que el daño (mejorar sigue compensando), el coste nunca baja de su valor base
// y se limita a ×4 para que a niveles altos el maná siga gestionándose sin volverse imposible.
const MP_G0 = 1 + 0.045 * 7,
  mpK = () => {
    const g = (1 + 0.06 * (P.lv - 1)) * (1 + 0.045 * P.a[P.w.sc]) * P.dm * P.edm;
    return Math.min(4, Math.max(1, Math.sqrt(g / MP_G0)));
  },
  spMp = (base) => base * mpK();
// Vida enemiga = (1+0.22(d-1)) * (1+0.35*floor((d-1)/4)) * (1+0.025*max(0,d-8))  (suave al inicio, tramos cada 4 niveles y empuje extra desde d>8)
const hpM = () =>
    (1 + 0.22 * (G.d - 1)) *
    (1 + 0.35 * Math.floor((G.d - 1) / 4)) *
    (1 + 0.025 * Math.max(0, G.d - 8)) *
    (S.hard ? 1.2 : 1),
  dmM = () => (1 + 0.09 * (G.d - 1) + 0.12 * Math.floor((G.d - 1) / 4)) * (S.hard ? 1.12 : 1);

// ===== COMBATE =====
const BOMB_DELAY = 0.6; // segundos hasta que explota un kamikaze al que matas (igual que su mecha propia)
function col(o) {
  const r = o.r;
  o.x = cl(o.x, RB.x0 + r, RB.x1 - r);
  o.y = cl(o.y, RB.y0 + r, RB.y1 - r);
  for (const b of RM_.obs) {
    const cx = cl(o.x, b.x, b.x + b.w),
      cy = cl(o.y, b.y, b.y + b.h),
      dx = o.x - cx,
      dy = o.y - cy,
      d = Math.hypot(dx, dy);
    if (d < r) {
      if (d > 0) {
        o.x += (dx / d) * (r - d);
        o.y += (dy / d) * (r - d);
      } else o.y -= r;
    }
  }
}
const nm = (x0, y0, t, c) => NM.push({ x: x0 + rnd(-8, 8), y: y0, t: fmt(t), c, l: 0.8 });
function apply(e, f) {
  if (!f) return;
  if (e.t == "boss") f = Object.assign({}, f, { stun: 0, freeze: 0, root: 0 });
  if (f.bleed) {
    e.st.bleedN = Math.min(8 + (P.bl || 0) + (P.tal.bleed || 0), (e.st.bleedN || 0) + f.bleed);
    e.st.bleed = 5;
    e.bd = Math.max(e.bd || 0, wd(0.3));
  }
  if (f.wet) {
    e.st.wet = f.wet;
    e.st.burn = 0;
  }
  const rs = e.t == "boss" ? 0.5 : e.t == "elite" ? 0.7 : 1;
  if (f.root) e.st.root = f.root * rs;
  if (f.frac) e.st.frac = f.frac;
  if (f.curse) e.st.curse = f.curse;
  if (f.freeze) e.st.stun = Math.max(e.st.stun || 0, f.freeze * rs);
  if (f.cor) {
    e.st.cor = Math.min(10, (e.st.cor || 0) + f.cor);
    e.st.cort = 4;
    e.cdm = Math.max(e.cdm || 0, wd(0.06));
  }
  if (f.burn) {
    e.st.burn = f.burn;
    e.dot = Math.max(e.dot, wd(0.25));
  }
  if (f.poison) {
    e.st.poison = f.poison;
    e.dot = Math.max(e.dot, wd(0.18));
  }
  if (f.slow) {
    if (e.st.slow > 0 && e.t != "boss") e.st.stun = Math.max(e.st.stun || 0, 0.9);
    e.st.slow = f.slow;
  }
  if (f.stun) e.st.stun = Math.max(e.st.stun || 0, f.stun);
}
function hit(e, b, t, o = {}) {
  if (e.hp <= 0 || e.sp > 0) return;
  const cr = Math.random() < P.cc;
  let d = Math.max(
    1,
    b *
      (cr ? P.cm + P.ecm : 1) *
      (1 - (ET[e.t].res?.[t] || 0)) *
      (e.sh > 0 ? 0.5 : 1) *
      (e.mod == "blindado" ? 0.8 : 1) *
      (o.ch && e.st.wet > 0 ? 1.6 : 1) *
      (e.imm > 0 ? 0.01 : 1) *
      (e.vul > 0 ? 1.6 : 1) *
      (e.st.frac > 0 ? 1.2 : 1) *
      (1 + (e.st.cor || 0) * 0.04) *
      (o.el == "dark" && Object.keys(e.st).some((k) => e.st[k] > 0 && k != "cort") ? 1.3 : 1),
  );
  if (e.t == "boss") {
    d = Math.min(d, e.mhp * 0.1);
    const n = Date.now();
    if (n - (e.dwt || 0) > 1000) {
      e.dwt = n;
      e.dwv = 0;
    }
    d = Math.min(d, Math.max(e.mhp * 0.25 - e.dwv, e.mhp * 0.004));
    e.dwv += d;
  }
  e.hp -= d;
  e.fl = 0.1;
  if (cr && P.det && e.st.bleedN > 0) {
    const n = e.st.bleedN;
    e.st.bleedN = Math.ceil(n / 2);
    e.hp -= d * 0.25 * n;
  }
  if (!o.nl)
    P.hp = Math.min(P.mhp, P.hp + Math.min(d * Math.min(0.06, P.ls + P.els), P.mhp * 0.03));
  if (o.kb && e.t != "boss") {
    e.vx += Math.cos(o.a) * o.kb;
    e.vy += Math.sin(o.a) * o.kb;
  }
  apply(e, o.fx);
  if (P.bn) apply(e, { burn: 2 });
  if (P.pzn) apply(e, { poison: 3 });
  if (P.fz) apply(e, { slow: 1.5 });
  if (o.stun) apply(e, { stun: o.stun });
  nm(e.x, e.y - e.r, d, cr ? "#ffd34a" : "#fff");
  snd(cr ? 320 : 170, 0.05, "square");
  if (cr) shake = Math.max(shake, 3);
  if (e.hp <= 0) kill(e);
}
function area(x0, y0, r, d, t, o = {}) {
  FX.push({ k: "ring", x: x0, y: y0, r, t: 0.3, m: 0.3, c: o.c || "#fff" });
  shake = Math.max(shake, 4);
  for (const e of E)
    if (e.hp > 0 && dist({ x: x0, y: y0 }, e) < r + e.r)
      hit(e, d, t, Object.assign({ a: ang({ x: x0, y: y0 }, e), kb: 200 }, o));
}
function chain(e, d, n) {
  let cur = e,
    used = new Set([e]);
  while (n-- > 0) {
    let b = null,
      bd = 180;
    for (const q of E)
      if (q.hp > 0 && !used.has(q) && dist(q, cur) < bd) {
        bd = dist(q, cur);
        b = q;
      }
    if (!b) break;
    used.add(b);
    FX.push({ k: "line", x: cur.x, y: cur.y, x2: b.x, y2: b.y, t: 0.15, m: 0.15 });
    hit(b, d, "m", { ch: 1 });
    cur = b;
  }
}
function kill(e) {
  e.dead = 1;
  if (G.train) {
    FX.push({ k: "dead", x: e.x, y: e.y, r: e.r, c: "#a86", t: 0.5, m: 0.5 });
    return;
  }
  if (e.t == "decoy" || e.t == "orb") {
    if (e.t == "decoy") brs(e, 6, 180, 6 * dmM(), 0, 0, "#ddd");
    return;
  }
  bk(e);
  if (e.t == "boss") bossDie(e);
  else FX.push({ k: "dead", x: e.x, y: e.y, r: e.r, c: ET[e.t].c, t: 0.5, m: 0.5 });
  G.kills++;
  const T = ET[e.t];
  // Los enemigos invocados (por el Invocador o por jefes) no dan oro ni experiencia
  if (!e.minion)
    for (
      let i = 0;
      i < (e.t == "boss" ? 12 : 1 + (Math.random() < 0.4) + (e.t == "elite" ? 3 : 0));
      i++
    )
      O.push({
        x: e.x + rnd(-15, 15),
        y: e.y + rnd(-15, 15),
        k: "g",
        v: Math.ceil((3 + G.d * 1.5) * (1 + P.a.luk * 0.02) * (1 + 0.03 * U("gre"))),
      });
  // Corazón: cura el 10 % de la vida máxima. Probabilidad a la mitad (0,10 → 0,05 base; la Suerte también).
  if (Math.random() < 0.05 + P.a.luk * 0.0025) O.push({ x: e.x, y: e.y, k: "h", v: 0.1 });
  for (let i = 0; i < 8; i++)
    FX.push({
      k: "p",
      x: e.x,
      y: e.y,
      vx: rnd(-140, 140),
      vy: rnd(-140, 140),
      t: 0.5,
      m: 0.5,
      c: T.c,
    });
  if (e.mod == "explosivo" || e.t == "bomber") {
    // El kamikaze abatido no estalla al instante: la zona avisa durante BOMB_DELAY segundos
    // para que, si lo mataste de cerca, tengas tiempo de alejarte (esquivar o correr).
    const dl = e.t == "bomber" ? BOMB_DELAY : 0.01;
    Z.push({ x: e.x, y: e.y, r: 75, t: dl, m: dl, d: e.dmg * (e.t == "bomber" ? 1 : 0.8), c: "#fa4" });
    if (e.t == "bomber") snd(380, 0.12, "square", 0.05);
  }
  // Botín de objetos y pociones: los enemigos invocados no sueltan ninguno.
  // Objetos: probabilidad base a la mitad (0,04 → 0,02; la Suerte y las ranuras vacías también se reducen a la mitad).
  // Pociones: un tercio menos (0,05 → 0,0333). Jefes y élites siguen soltando siempre un objeto.
  if (!e.minion) {
    if (
      Math.random() <
      (e.t == "boss" || e.t == "elite" ? 1 : (0.04 + P.a.luk * 0.002 + emptyB()) * 0.5)
    )
      O.push({
        x: e.x,
        y: e.y,
        k: "i",
        it: Object.assign({}, pickIT(), { id: Date.now() + Math.random() }),
      });
    else if (Math.random() < 0.05 * (2 / 3))
      O.push({ x: e.x, y: e.y, k: "i", it: newPotion(Math.random() < 0.6 ? "hp" : "mp") });
  }
  if (!e.minion) xp((6 + G.d * 1.5) * (e.t == "boss" ? 15 : e.t == "elite" ? 5 : 1));
}

/* ======================================================================
 * src/js/game/levels.js
 * Generación de niveles/salas, entrada a salas, aparición de enemigos y oleadas.
 *
 * Define:
 * doorVis, genLevel, enter, spawn, wave
 * ====================================================================== */

// doorVis: una puerta se dibuja siempre salvo la de una sala secreta aun no descubierta (mecanica intencional)
function doorVis(r, k) {
  const n = G.R[r.nb[k]];
  return !(n.sec && !G.seen[r.nb[k]]);
}
function genLevel() {
  const d = G.d,
    rng = rngS(G.seed + d * 7919),
    n = S.hard ? Math.min(10 + (d >> 1), 20) : Math.min(5 + (d >> 1), 12),
    R = [{ gx: 0, gy: 0, nb: {}, tp: "start", cl: 1, dist: 0 }],
    mp = { "0,0": 0 };
  while (R.length < n) {
    const b = R[(rng() * R.length) | 0],
      di = (rng() * 4) | 0,
      gx = b.gx + DIR[di][0],
      gy = b.gy + DIR[di][1],
      k = gx + "," + gy;
    if (mp[k] !== undefined) continue;
    mp[k] = R.length;
    const r = { gx, gy, nb: {}, dist: b.dist + 1 };
    r.nb[(di + 2) % 4] = R.indexOf(b);
    b.nb[di] = R.length;
    R.push(r);
  }
  if (S.hard)
    for (const a of R)
      for (let di = 0; di < 4; di++) {
        if (a.nb[di] !== undefined) continue;
        const j = mp[a.gx + DIR[di][0] + "," + (a.gy + DIR[di][1])];
        if (j !== undefined && rng() < 0.3 && R[j].nb[(di + 2) % 4] === undefined) {
          a.nb[di] = j;
          R[j].nb[(di + 2) % 4] = R.indexOf(a);
        }
      }
  let bi = 1;
  R.forEach((r, i) => {
    if (r.dist > R[bi].dist) bi = i;
  });
  R.forEach((r, i) => {
    if (i == 0) {
      r.obs = [];
      r.hz = [];
      r.wv = 1;
      return;
    }
    const q = rng();
    r.tp =
      i == bi
        ? "boss"
        : q < 0.5
          ? "combat"
          : q < 0.62 && d > 1
            ? "elite"
            : q < 0.74
              ? "treasure"
              : q < 0.82
                ? "shrine"
                : q < 0.88
                  ? "shop"
                  : q < 0.95
                    ? "event"
                    : "combat";
    r.cl = !["combat", "elite", "boss"].includes(r.tp);
    r.wv = d >= 3 && i != bi ? 2 : 1;
    const o = [],
      rr = rngS(G.seed + d * 7919 + i * 131),
      k = r.tp == "boss" ? 2 : 2 + ((rr() * (S.hard ? 7 : 5)) | 0);
    for (let j = 0; j < k; j++) {
      const t = rr(),
        w = t < 0.5 ? 40 : t < 0.8 ? 30 : 110,
        h = t < 0.5 ? 40 : t < 0.8 ? 110 : 30,
        ox = 90 + rr() * (780 - w),
        oy = 90 + rr() * (420 - h);
      if ((ox + w > 400 && ox < 560) || (oy + h > 240 && oy < 360)) continue;
      o.push({ x: ox, y: oy, w, h });
    }
    r.obs = snapObs(layout(o, r.tp, rr));
    r.hz = [];
    if ([3, 5, 6, 7].includes((d - 1) % 8))
      for (let j = 0; j < 2; j++)
        r.hz.push({ x: 150 + rr() * 660, y: 120 + rr() * 360, r: 40 + rr() * 30 });
  });
  if (!R.some((r) => r.tp == "treasure")) {
    const r = R.find((q, i) => i && i != bi);
    r.tp = "treasure";
    r.cl = 1;
  }
  const sr = R.find(
    (q, i) => i && i != bi && q.tp == "combat" && q.dist > 1 && Object.keys(q.nb).length == 1,
  );
  if (sr && d >= 2) {
    sr.sec = 1;
    sr.tp = "treasure";
    sr.cl = 1;
  }
  const sr2 =
    S.hard &&
    R.find(
      (q, i) =>
        i && i != bi && q != sr && q.tp == "combat" && q.dist > 1 && Object.keys(q.nb).length == 1,
    );
  if (sr2 && d >= 2) {
    sr2.sec = 1;
    sr2.tp = "treasure";
    sr2.cl = 1;
  }
  G.R = R;
  G.seen = { 0: 1 };
  G.vis = {};
  G.bi = BI[(d - 1) % 8];
}
function enter(i, from) {
  G.cur = i;
  G.hurt = 0;
  const r = G.R[i];
  RM_ = r;
  G.seen[i] = 1;
  (G.vis || (G.vis = {}))[i] = 1;
  E = [];
  PR = [];
  Z = [];
  TR = [];
  ZN = [];
  O = r.O || (r.O = []);
  const pos = [
    [480, 80],
    [880, 300],
    [480, 520],
    [80, 300],
  ];
  if (from < 4) {
    P.x = pos[from][0];
    P.y = pos[from][1];
  } else {
    P.x = 480;
    P.y = 300;
  }
  for (const k in r.nb) if (!G.R[r.nb[k]].sec) G.seen[r.nb[k]] = 1;
  if (!r.cl && !r.st) {
    r.st = 1;
    wave(r);
  } else if (!r.cl && r.st) {
    wave(r);
  }
}
function spawn(t, x0, y0, mod) {
  const T = ET[t];
  let px, py;
  for (let i = 0; i < 25; i++) {
    px = x0 ?? rnd(100, 860);
    py = y0 ?? rnd(100, 500);
    if (
      dist({ x: px, y: py }, P) > 230 &&
      !RM_.obs.some(
        (b) => px > b.x - 20 && px < b.x + b.w + 20 && py > b.y - 20 && py < b.y + b.h + 20,
      )
    )
      break;
  }
  const hm = hpM() * adH() * (t == "boss" ? 1 + G.d * 0.1 : 1);
  const e = {
    id: ++EID,
    t,
    x: px,
    y: py,
    r: T.r,
    hp: T.hp * hm,
    mhp: T.hp * hm,
    dmg: T.dm * dmM() * adD(),
    vx: 0,
    vy: 0,
    st: {},
    cd: rnd(0.8, 2),
    sp: 0.8,
    wind: 0,
    lu: 0,
    dir: Math.random() < 0.5 ? 1 : -1,
    sh: 0,
    fl: 0,
    dot: 0,
    mod,
    fz: 0,
    ph: 0,
    tm: 0,
  };
  {
    const v = BV[(G.d - 1) % 8];
    e.hp = e.mhp *= v[1];
    e.sx = (e.sx || 1) * v[2];
    e.vn = v[0];
  }
  if (mod == "veloz") e.sx = 1.4;
  if (mod == "blindado") e.hp = e.mhp *= 1.4;
  E.push(e);
  return e;
}
function wave(r) {
  const d = G.d;
  if (r.tp == "boss" && !r.bs) {
    r.bs = 1;
    spawnBoss();
    return;
  }
  const n = Math.min(
      S.hard ? 18 : 14,
      3 + (S.hard ? 2 : 0) + Math.floor(Math.sqrt(d) * 2) + ((Math.random() * 3) | 0),
    ),
    pool = ["grunt", "runner", "archer"];
  if (d > 1) pool.push("mage", "tank");
  if (d > 2) pool.push("bomber", "guardian");
  if (d > 3) pool.push("summoner", "stalker");
  const bf = ["grunt", "summoner", "bomber", "stalker", "mage", "bomber", "tank", "summoner"][
    (d - 1) % 8
  ];
  pool.push(bf, bf);
  if (r.tp == "elite" && r.wv == (d >= 3 ? 2 : 1))
    spawn(
      "elite",
      undefined,
      undefined,
      d > 2 ? pick(["veloz", "blindado", "vampírico", "explosivo"]) : 0,
    );
  for (let i = 0; i < n; i++)
    spawn(
      pick(pool),
      undefined,
      undefined,
      Math.random() < Math.min(0.45, 0.035 * d)
        ? pick(["veloz", "blindado", "vampírico", "explosivo"])
        : 0,
    );
}

/* ======================================================================
 * src/js/game/progression.js
 * Experiencia y subida de nivel.
 *
 * Define:
 * xp, lvUp

function xp(v) {
  P.xp += v * (1 + 0.02 * U("gro"));
  while (P.xp >= P.nx) {
    P.xp -= P.nx;
    P.lv++;
    P.nx = Math.floor(P.nx * 1.32 + 10);
    P.pend++;
    P.pts++;
    chk();
    P.hp = Math.min(P.mhp, P.hp + P.mhp * 0.15);
    levelUpFX();
  }
}
function lvUp() {
  P.pend--;
  const ks = ["str", "dex", "int", "vit", "agi", "luk"],
    nmz = {
      str: "Fuerza (arm. pesadas)",
      dex: "Destreza (crítico, a distancia)",
      int: "Inteligencia (magia, maná)",
      vit: "Vitalidad (vida, armadura)",
      agi: "Agilidad (velocidad)",
      luk: "Suerte (botín, crítico)",
    };
  const o = ks.sort(() => Math.random() - 0.5).slice(0, 3);
  show(
    `<h2>¡Nivel ${P.lv}!</h2><p>Elige un atributo (+2)</p>`,
    o.map((k) => ({
      i: ATI[k],
      n: ATN[k],
      tp: "Atributo",
      r: 0,
      d: ATD[k],
      stx: `${k.toUpperCase()} ${P.a[k]} → ${P.a[k] + 2}`,
      f: () => {
        P.a[k] += 2;
        ST();
      },
    })),
  );
}

/* ======================================================================
 * src/js/combat/melee-swing.js
 * Golpes cuerpo a cuerpo con el sprite del arma: el arma se mueve de verdad,
 * deja una estela y el daño se aplica donde el sprite (y su estela) pasa.
 *
 * Cada golpe tiene tres fases: preparación (el arma se echa atrás),
 * golpe (daño activo) y recuperación (vuelve a la posición de reposo).
 *
 * Define:
 * SW, SWDIR, startSwing, swingPose, swingStrike, swingHitEnemy, trailSample, swingTick
 * ====================================================================== */

let SW = null; // golpe en curso (null si no hay)
let SWDIR = 1; // sentido del golpe; se alterna en cada ataque
const IDLE_HR = 10; // distancia de la mano al centro del jugador en reposo
const IDLE_K = 0.78; // el arma se ve algo más pequeña en reposo
const TRAIL_LIFE = 0.18; // segundos que tarda en desvanecerse la estela
const FALLBACK_CIRC = [-7, -5, -3, -1, 1, 3, 5, 7, 9].map((u) => ({ u, v: 0 }));

const mlerp = (a, b, t) => a + (b - a) * t;
const mOut3 = (q) => 1 - Math.pow(1 - q, 3);
const mIO = (q) => (q < 0.5 ? 2 * q * q : 1 - Math.pow(-2 * q + 2, 2) / 2);

/** Inicia un golpe. `c` = tercer golpe del combo (más grande y fuerte, como antes). */
function startSwing(w, aim, c, cdv) {
  const A = meleeArt(w),
    kS = c ? 1.15 : 1,
    arc = (w.arc || 1.6) * (c ? 1.3 : 1);
  SWDIR = -SWDIR;
  const sw = (SW = {
    owner: P,
    w,
    art: A,
    a0: aim,
    dir: SWDIR,
    c,
    kS,
    t: 0,
    dur: Math.min(A.dur, Math.max(0.08, cdv * 0.95)),
    amp: A.fam == "thrust" ? 0.12 : A.fam == "jab" ? arc * A.jab : arc,
    back: A.back || 0,
    seen: new Set(),
    ring: false,
  });
  const L = (A.tu - A.gu) * A.s * kS;
  sw.qa = A.fam == "thrust" ? 0.05 : sw.back / (sw.amp + sw.back);
  sw.hmax = A.fam == "sweep" ? IDLE_HR + A.lunge : Math.max(IDLE_HR, 0.95 * w.rng * kS - L);
  sw.reach = sw.hmax + L + A.s * kS * 4 + 10;
  sw.fx = {
    k: "trail",
    x: P.x,
    y: P.y,
    pts: [],
    art: A,
    c: c ? "#ffd34a" : A.trail,
    lw: c ? 4 : 3,
    life: TRAIL_LIFE,
    t: sw.dur + TRAIL_LIFE,
    m: sw.dur + TRAIL_LIFE,
  };
  FX.push(sw.fx);
  P.at = sw.dur;
}

/**
 * Posición del arma en el instante `t` del golpe.
 * Devuelve la mano (relativa al jugador), el ángulo del eje del arma, la escala,
 * si hay que voltear el sprite (filo hacia delante) y si el daño está activo.
 */
function swingPose(sw, t) {
  const A = sw.art,
    p = cl(t / sw.dur, 0, 1),
    Wn = A.w,
    Rc = A.r,
    S = 1 - Wn - Rc,
    startRel = -sw.dir * (sw.amp / 2 + sw.back),
    endRel = (sw.dir * sw.amp) / 2;
  let rel, hd, kb, ph, q, prog;
  if (p < Wn) {
    ph = 0;
    q = mIO(p / Wn);
    prog = 0;
    rel = mlerp(A.idle, startRel, q);
    hd = mlerp(IDLE_HR, A.pull, q);
    kb = mlerp(IDLE_K, 1, q);
  } else if (p < 1 - Rc) {
    ph = 1;
    q = (p - Wn) / S;
    prog = mOut3(q);
    rel = mlerp(startRel, endRel, prog);
    hd = mlerp(A.pull, sw.hmax, prog);
    kb = 1;
  } else {
    ph = 2;
    q = mIO((p - (1 - Rc)) / Rc);
    prog = 1;
    rel = mlerp(endRel, A.idle, q);
    hd = mlerp(sw.hmax, IDLE_HR, q);
    kb = mlerp(1, IDLE_K, q);
  }
  // al recuperar, el arma vuelve a seguir al cursor
  const base = sw.a0 + nrm(P.face - sw.a0) * (ph == 2 ? q : 0),
    wa = base + rel,
    hdir = A.fam == "sweep" ? wa : base,
    env = ph == 0 ? q : ph == 1 ? 1 : 1 - q,
    lat = A.lat ? sw.dir * A.lat * env : 0,
    bump = A.slam && ph == 1 ? 1 + 0.12 * Math.sin(Math.PI * q) : 1;
  return {
    hx: Math.cos(hdir) * hd - Math.sin(hdir) * lat,
    hy: Math.sin(hdir) * hd + Math.cos(hdir) * lat,
    ang: wa,
    k: kb * sw.kS * bump,
    sy: A.edge ? (A.edge === sw.dir ? 1 : -1) : 1,
    ph,
    prog,
    active: ph == 1 && prog >= sw.qa,
  };
}

/** Comprueba qué enemigos toca el sprite en esta pose y les aplica el golpe (una vez por golpe). */
function swingStrike(sw, pose) {
  const A = sw.art,
    rec = A.spr && WSPR[A.spr],
    circ = rec && rec.ready && rec.circ ? rec.circ : FALLBACK_CIRC,
    s = A.s * pose.k,
    ca = Math.cos(pose.ang),
    sa = Math.sin(pose.ang),
    wx = P.x + pose.hx,
    wy = P.y + pose.hy,
    rc = 1.45 * s;
  for (const e of E) {
    if (e.hp <= 0 || sw.seen.has(e)) continue;
    if (Math.abs(e.x - P.x) > sw.reach + e.r || Math.abs(e.y - P.y) > sw.reach + e.r) continue;
    for (const c of circ) {
      if (c.u < A.gu - 2.5) continue; // el pomo o la contera, detrás de la mano, no hieren
      const lu = (c.u - A.gu) * s,
        lv = c.v * s * pose.sy,
        px = wx + ca * lu - sa * lv,
        py = wy + sa * lu + ca * lv;
      if (Math.hypot(px - e.x, py - e.y) < e.r + rc) {
        swingHitEnemy(sw, e, px, py);
        break;
      }
    }
  }
}

function swingHitEnemy(sw, e, px, py) {
  const w = sw.w;
  sw.seen.add(e);
  hit(e, wd(sw.c ? 1.5 : 1), "p", {
    kb: w.stun ? 300 : 150,
    a: ang(P, e),
    stun: w.stun ? 0.8 : 0,
    fx: w.bleed ? { bleed: 1 + (Math.random() < P.cc ? 1 : 0) } : null,
  });
  for (let i = 0; i < (LOW ? 2 : 4); i++)
    FX.push({ k: "p", x: px, y: py, vx: rnd(-160, 160), vy: rnd(-160, 160), t: 0.22, m: 0.22, c: sw.fx.c });
  if (sw.art.shake) shake = Math.max(shake, sw.art.shake);
}

/** Guarda un punto de la estela (segmento interior-exterior del arma y una copia fantasma del sprite). */
function trailSample(sw, pose, t) {
  const A = sw.art,
    s = A.s * pose.k,
    L = (A.tu - A.gu) * s,
    ca = Math.cos(pose.ang),
    sa = Math.sin(pose.ang),
    wx = P.x + pose.hx,
    wy = P.y + pose.hy,
    at = (f, lv) => [wx + ca * f * L - sa * lv, wy + sa * f * L + ca * lv],
    inner = at(A.fam == "jab" ? 0.45 : A.fam == "thrust" ? 0.3 : 0.38, 0),
    outer = at(1.04, 0);
  sw.fx.pts.push({
    t,
    x1: inner[0],
    y1: inner[1],
    x2: outer[0],
    y2: outer[1],
    gx: wx,
    gy: wy,
    ang: pose.ang,
    k: pose.k,
    sy: pose.sy,
  });
}

/** Avanza el golpe en curso; se llama una vez por fotograma desde upP. */
function swingTick(dt) {
  const sw = SW;
  if (!sw) return;
  if (sw.owner !== P || G.st != "play") {
    SW = null;
    return;
  }
  const t0 = sw.t,
    t1 = Math.min(sw.dur, t0 + dt),
    N = sw.art.fam == "sweep" ? 3 : 4; // subpasos: evitan que un golpe rápido atraviese enemigos
  for (let i = 1; i <= N; i++) {
    const t = t0 + ((t1 - t0) * i) / N,
      pose = swingPose(sw, t);
    if (!pose.active) continue;
    swingStrike(sw, pose);
    trailSample(sw, pose, t);
  }
  sw.t = t1;
  if (sw.art.slam && !sw.ring && t1 / sw.dur >= 1 - sw.art.r) {
    sw.ring = true;
    const pose = swingPose(sw, t1),
      L = (sw.art.tu - sw.art.gu) * sw.art.s * pose.k;
    FX.push({
      k: "ring",
      x: P.x + pose.hx + Math.cos(pose.ang) * L,
      y: P.y + pose.hy + Math.sin(pose.ang) * L,
      r: 38,
      t: 0.25,
      m: 0.25,
      c: sw.art.trail,
    });
  }
  if (t1 >= sw.dur) SW = null;
}

/* ======================================================================
 * src/js/combat/ranged-hold.js
 * Estado del arma a distancia en la mano: retroceso al disparar, si está
 * "cargada" (lista para disparar) y desde dónde sale el proyectil.
 *
 * Define:
 * RK, RK_TIME, rangedKick, rangedTick, rangedReady, rangedMuzzle, projFor
 * ====================================================================== */

let RK = 0; // tiempo restante de retroceso tras el último disparo
const RK_TIME = 0.14;

/** Llamar al disparar: el arma retrocede (o se adelanta, en los báculos) y se descarga. */
function rangedKick() {
  RK = RK_TIME;
}
function rangedTick(dt) {
  if (RK > 0) RK = Math.max(0, RK - dt);
}

/** ¿Está el arma lista para disparar? (enfriamiento cumplido, sin recargar y con maná). */
function rangedReady() {
  const w = P.w;
  return P.acd <= 0 && !(P.rl > 0) && (w.s != "g" || P.mp >= w.mp);
}

/** Distancia desde el centro del jugador hasta la boca del arma (sale de aquí el proyectil). */
function rangedMuzzle(w) {
  const A = RANGED_ART[w.n];
  return A ? A.hd + (A.tu - A.gu) * A.s : 14;
}

/** Sprite de flecha según el arma: la ballesta dispara virotes. `charged` = versión encendida. */
function projFor(charged) {
  const bolt = P.w.n == "Ballesta";
  return charged ? (bolt ? "virote_cargado" : "flecha_cargada") : bolt ? "virote" : "flecha";
}

/* ======================================================================
 * src/js/combat/player-actions.js
 * Acciones de combate del jugador: parry, daño recibido, esquivar, disparar, atacar y habilidades Q/E/clic derecho.
 *
 * Define:
 * parryFx, parryProj, hurtP, die, dodge, shoot, atk, AB, ab
 * ====================================================================== */

function parryFx() {
  cnt("pf");
  chk();
  P.pcd = 0.9;
  P.inv = 0.25;
  G.hs = 0.07;
  FX.push(
    { k: "ring", x: P.x, y: P.y, r: 60, t: 0.25, m: 0.25, c: "#fff" },
    { k: "ring", x: P.x, y: P.y, r: 34, t: 0.2, m: 0.2, c: "#ffd34a" },
  );
  snd(1300, 0.12, "triangle", 0.07);
  snd(1900, 0.2, "sine", 0.05);
}
function parryProj(p) {
  cnt("pj");
  let b = null,
    bd = 1e9;
  for (const q of E)
    if (q.hp > 0 && q.t != "decoy" && q.t != "orb" && dist(p, q) < bd) {
      bd = dist(p, q);
      b = q;
    }
  parryFx();
  const a = b ? ang(p, b) : Math.atan2(-p.vy, -p.vx),
    sp = Math.max(420, Math.hypot(p.vx, p.vy) * 1.3);
  Object.assign(p, {
    rf: 1,
    f: "p",
    t: "p",
    d: p.d * 2,
    h: new Set(),
    pc: 0,
    l: 2,
    hm: 0,
    cv: 0,
    sf: null,
    vx: Math.cos(a) * sp,
    vy: Math.sin(a) * sp,
    c: "#fff",
  });
}
function hurtP(d, src) {
  if (DBG.god) return;
  if (P.inv > 0 || (P.dash && P.dash.inv)) return;
  d *= 1 - P.arm / (P.arm + 100);
  if (src && src.st && src.st.curse > 0) d *= 0.75;
  const be = EBI[(G.d - 1) % 8];
  if (be && P.res[be]) d *= 1 - P.res[be];
  if (P.g) {
    if (P.gt < 0.22 && src && !(P.pcd > 0)) {
      parryFx();
      apply(src, { stun: 1.2 });
      if (src.hp > 0) hit(src, (src.dmg || d) * 2, "p", { nl: 1 });
      return;
    }
    d *= P.gr ? 0.2 : 0.35;
  }
  if (P.sh > 0) {
    const a = Math.min(P.sh, d);
    P.sh -= a;
    d -= a;
  }
  P.hp -= d;
  if (G.train && P.hp < 1) P.hp = P.mhp;
  G.hurt = 1;
  P.inv = 0.5;
  P.fl = 0.15;
  shake = Math.max(shake, 6);
  nm(P.x, P.y - 20, d, "#f66");
  snd(110, 0.12, "sawtooth", 0.06);
  if (P.hp <= 0) die();
}
function die(q) {
  if (G.st != "play") return;
  if (!q && U("rev") && !G.revd && !G.arena) {
    G.revd = 1;
    P.hp = P.mhp * 0.5;
    P.inv = 2.5;
    flash("¡Renaces!");
    FX.push({ k: "ring", x: P.x, y: P.y, r: 120, t: 0.5, m: 0.5, c: "#ffd34a" });
    return;
  }
  G.st = "over";
  cnt("dt");
  chk();
  const s = G.arena ? 0 : Math.floor(P.gold / 2);
  if (!G.arena) {
    S.best = Math.max(S.best, G.d);
    S.souls += s;
    G.nu = checkUnlocks();
    save();
  }
  show(
    `<h1>${q ? "EXPEDICIÓN ABANDONADA" : "HAS CAÍDO"}</h1><p>Profundidad ${G.d} · Nivel ${P.lv} · ${G.kills} enemigos</p>${G.nu && G.nu.length ? "<p>¡Cartas nuevas: " + G.nu.join(", ") + "!</p>" : ""}<p>Pierdes tu equipo y reliquias. Conviertes ${s} oro en almas (total ${S.souls}).</p>`,
    [{ t: "Volver a la zona segura", nc: 1, f: menu }],
  );
}
function dodge() {
  if (P.dcd > 0 || P.dash) return;
  const ix = (K[KY.right] ? 1 : 0) - (K[KY.left] ? 1 : 0),
    iy = (K[KY.down] ? 1 : 0) - (K[KY.up] ? 1 : 0);
  let a = ix || iy ? Math.atan2(iy, ix) : P.face;
  P.dash = { t: 0.17, vx: Math.cos(a) * 540, vy: Math.sin(a) * 540, inv: 1 };
  P.inv = 0.3;
  P.dcd = (0.8 * (1 - 0.1 * (P.tal.refl || 0))) / (1 + 0.01 * P.a.agi);
  snd(400, 0.1, "triangle");
  FX.push({ k: "ring", x: P.x, y: P.y, r: 18, t: 0.2, m: 0.2, c: "#9cf" });
}
function shoot(a, sp, d, t, o = {}) {
  const sd = a + (o.sp ? rnd(-o.sp, o.sp) : 0),
    mz = Math.min(30, o.mz ?? rangedMuzzle(P.w)); // sale de la boca del arma (con tope para no nacer dentro de un muro)
  PR.push(
    Object.assign(
      {
        x: P.x + Math.cos(a) * mz,
        y: P.y + Math.sin(a) * mz,
        vx: Math.cos(sd) * sp,
        vy: Math.sin(sd) * sp,
        s: sp,
        r: o.r || 5,
        d,
        t,
        l: o.l || 1.1,
        l0: o.l || 1.1,
        pc: o.pierce || 0,
        bn: o.bounce || 0,
        f: "p",
        h: new Set(),
        c: o.c || "#ffe9a0",
      },
      o,
    ),
  );
}
function atk() {
  const w = P.w,
    a = P.face;
  P.at = w.s == "m" ? 0.2 : 0.12;
  if (w.s == "m") {
    // el daño lo aplica el propio sprite al moverse (ver combat/melee-swing.js)
    const c = (P.cb = (P.cb + 1) % 3) == 2;
    P.acd = w.cd / P.as;
    startSwing(w, a, c, P.acd);
    snd(w.n == "Martillo" ? 90 : 230, 0.08, "sawtooth");
  } else if (w.s == "r") {
    if (P.rl > 0) return;
    if (w.mag && (P.am = (P.am ?? w.mag) - 1) <= 0) {
      P.rl = w.rt || 1.6;
      P.am = w.mag;
      flash("Recargando...");
    }
    const art = RANGED_ART[w.n],
      o = {
        pierce: w.pierce,
        bounce: w.bounce,
        ret: w.ret,
        sp: w.spread,
        fx: w.fx ? { poison: 3 } : null,
        c: w.ret ? "#ccc" : "#fff",
        spr: art && art.proj,
      };
    if (w.n == "Chakram") o.r = 11; // el radio de colisión sigue al tamaño del sprite
    shoot(a, w.sp, wd(), "p", o);
    rangedKick();
    P.acd = w.cd / P.as;
    snd(w.n == "Ballesta" ? 140 : 520, 0.07, "square");
  } else {
    if (P.mp < w.mp) return;
    P.mp -= w.mp;
    const el = w.el,
      f =
        el == "fire"
          ? { burn: 3 }
          : el == "ice"
            ? { slow: 2.5 }
            : el == "poison"
              ? { poison: 5 }
              : el == "water"
                ? { wet: 5 }
                : null;
    shoot(a, w.sp, wd(), "m", {
      pierce: w.pierce,
      fx: f,
      ex: el == "fire" ? 55 : 0,
      ch: el == "light" ? 2 : 0,
      c: EC[el],
      r: 7,
      spr: RANGED_ART[w.n] && RANGED_ART[w.n].proj,
    });
    rangedKick();
    P.acd = w.cd / P.as;
    snd(700, 0.08, "sine");
  }
}
const AB = {
  m: [
    { cd: 6, f: () => area(P.x, P.y, 115, wd(1.8), "p", { c: "#f93" }) },
    {
      cd: 8,
      f: () => {
        const a = P.face;
        P.dash = {
          t: 0.25,
          vx: Math.cos(a) * 620,
          vy: Math.sin(a) * 620,
          inv: 1,
          end: () => area(P.x, P.y, 90, wd(2.2), "p", { stun: 1, c: "#fc6" }),
        };
      },
    },
    {},
  ],
  r: [
    {
      cd: 6,
      f: () => {
        for (let i = -2; i <= 2; i++)
          shoot(P.face + i * 0.13, P.w.sp || 640, wd(0.7), "p", { c: "#fff", spr: projFor(false) });
      },
    },
    {
      cd: 7,
      f: () => shoot(P.face, 560, wd(1.5), "p", { ex: 95, c: "#fa4", r: 7, spr: projFor(true) }),
    },
    {
      cd: 5,
      f: () =>
        shoot(P.face, 600, wd(1.2), "p", {
          pierce: 3,
          fx: { poison: 5 },
          c: "#6e4",
          r: 6,
          spr: projFor(false),
          gl: "#6e4",
        }),
    },
  ],
  g: [
    {
      cd: 4,
      mp: 22,
      f: () =>
        shoot(P.face, 450, wd(2), "m", {
          ex: 100,
          fx: { burn: 3 },
          c: "#f60",
          r: 9,
          spr: "magia_ignea",
        }),
    },
    {
      cd: 8,
      mp: 25,
      f: () => area(P.x, P.y, 150, wd(0.8), "m", { fx: { slow: 3 }, c: "#9fe8ff", stun: 0.5 }),
    },
    {
      cd: 2.5,
      mp: 18,
      f: () => shoot(P.face, 1000, wd(1.1), "m", { ch: 4, c: "#fff27a", spr: "magia_tormenta" }),
    },
  ],
};
function ab(i) {
  const s = P.w.s,
    A = AB[s][i];
  if (!A.f || P.cd[i] > 0 || P.dash) return;
  const mcost = A.mp ? spMp(A.mp) : 0; // el coste de maná escala con el daño (ver mpK)
  if (mcost && P.mp < mcost) return;
  P.mp -= mcost;
  P.cd[i] = A.cd * (1 - 0.01 * U("cdr"));
  A.f();
  if (s != "m") rangedKick();
  snd(300, 0.15, "triangle");
}

/* ======================================================================
 * src/js/game/player-update.js
 * Actualización por fotograma del jugador (upP) y cambio de sala (go).
 *
 * Define:
 * upP, go
 * ====================================================================== */

// ===== ACTUALIZACIÓN =====
function upP(dt) {
  ST();
  if (TC.ah) tcAim();
  P.invc -= dt;
  const sg = P.invc > 0 ? -1 : 1,
    ix = sg * ((K[KY.right] ? 1 : 0) - (K[KY.left] ? 1 : 0)),
    iy = sg * ((K[KY.down] ? 1 : 0) - (K[KY.up] ? 1 : 0)),
    il = Math.hypot(ix, iy) || 1;
  P.face = Math.atan2(M.y - P.y, M.x - P.x);
  P.g = M.r && P.w.s == "m";
  if (!P.g && P.pg0) P.pcd = Math.max(P.pcd, 0.45);
  P.pg0 = P.g;
  P.pcd -= dt;
  P.potcd -= dt;
  P.gt = P.g ? P.gt + dt : 0;
  const sp = P.spd * (P.g ? 0.5 : 1) * (P.slow > 0 ? 0.55 : 1);
  if (P.dash) {
    P.x += P.dash.vx * dt;
    P.y += P.dash.vy * dt;
    P.dash.t -= dt;
    if (P.dash.t <= 0) {
      const e = P.dash.end;
      P.dash = null;
      e && e();
    }
  } else {
    const k = Math.min(1, dt * 12);
    P.vx += ((ix / il) * sp - P.vx) * k;
    P.vy += ((iy / il) * sp - P.vy) * k;
    P.x += P.vx * dt;
    P.y += P.vy * dt;
  }
  col(P);
  P.inv -= dt;
  P.acd -= dt;
  P.dcd -= dt;
  P.fl -= dt;
  P.bt -= dt;
  P.rl -= dt;
  P.at -= dt;
  P.slow -= dt;
  spl(dt);
  P.cd = P.cd.map((c) => c - dt);
  P.mp = Math.min(P.mmp, P.mp + P.mr * dt);
  P.hp = Math.min(P.mhp, P.hp + 0.1 * U("rec") * dt);
  swingTick(dt);
  rangedTick(dt);
  if (M.d && P.acd <= 0 && !P.dash && !G.ov) atk();
  if (K[KY.q]) ab(0);
  if (K[KY.e]) ab(1);
  if (M.r && P.w.s != "m") ab(2);
  if (K[KY.r]) classAction(dt);
  if (P.cls == "g") for (let i = 0; i < 4; i++) if (K[KY["c" + (i + 1)]]) castCard(i);
  const r = RM_;
  // Puertas: solo se cruzan con la sala limpia (r.cl). Arriba/abajo miden 2 tiles (80 px) y los lados 3 tiles (120 px).
  if (r.cl)
    for (const k in r.nb) {
      if (k == 0 && P.y <= RB.y0 + P.r + 2 && Math.abs(P.x - 480) < 40) return go(r.nb[0], 2, 0);
      if (k == 2 && P.y >= RB.y1 - P.r - 2 && Math.abs(P.x - 480) < 40) return go(r.nb[2], 0, 2);
      if (k == 1 && P.x >= RB.x1 - P.r - 2 && Math.abs(P.y - 300) < 60) return go(r.nb[1], 3, 1);
      if (k == 3 && P.x <= RB.x0 + P.r + 2 && Math.abs(P.y - 300) < 60) return go(r.nb[3], 1, 3);
    }
}

  trnSlide(k, i, f);
}

/* ======================================================================
 * src/js/render/item-icons.js
 * Iconos de objetos: usa el sprite si existe y, si no, el emoji provisional.
 *
 * Armas: el sprite sale de MELEE_ART / RANGED_ART (en las de distancia, la
 * versión "cargada", que luce más como icono).
 * Resto de objetos (equipo, reliquias...): basta con dejar en
 * src/assets/sprites un PNG llamado <nombre del objeto en minúsculas, sin
 * tildes y con guiones bajos>_16x16.png (p. ej. yelmo_del_abismo_16x16.png)
 * y volver a ejecutar el build: el icono aparece solo, sin tocar código.
 *
 * Define:
 * slug, itemSprKey, iconImg, icoHTML, drawItemIcon
 * ====================================================================== */

const ICON_CACHE = {};

/** "Yelmo del Abismo" -> "yelmo_del_abismo" */
function slug(s) {
  return String(s)
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, "_")
    .replace(/^_+|_+$/g, "");
}

/** Clave del sprite de un objeto (o null si todavía no tiene). */
function itemSprKey(it) {
  if (!it || !it.n) return null;
  const m = MELEE_ART[it.n],
    r = RANGED_ART[it.n];
  if (m) return m.spr;
  if (r) return r.spr2;
  const k = slug(it.n);
  return WEAPON_SPRITE_DATA[k] ? k : null;
}

/** Imagen ya cargada para una clave de sprite, o null si aún no está lista. */
function iconImg(key) {
  const w = WSPR[key];
  if (w && w.ready) return w.img;
  const c = (ICON_CACHE[key] ||= (() => {
    const img = new Image();
    img.src = WEAPON_SPRITE_DATA[key] || "";
    return img;
  })());
  return c.complete && c.naturalWidth ? c : null;
}

/** HTML del icono para tarjetas y menús: <img> pixelado si hay sprite, emoji si no. */
function icoHTML(it, px = 48) {
  const k = itemSprKey(it);
  if (k && WEAPON_SPRITE_DATA[k])
    return `<img src="${WEAPON_SPRITE_DATA[k]}" alt="" style="width:${px}px;height:${px}px;image-rendering:pixelated;display:block">`;
  return `<div style="font-size:26px">${it.i || ""}</div>`;
}

/** Dibuja el icono en el canvas centrado en (cx, cy). Devuelve false si no hay sprite (usar emoji). */
function drawItemIcon(it, cx, cy, size) {
  const k = itemSprKey(it),
    img = k && iconImg(k);
  if (!img) return false;
  const sz = 16 * Math.max(1, Math.round(size / 16)); // escala entera: sin píxeles deformados
  x.save();
  x.imageSmoothingEnabled = false;
  x.drawImage(img, Math.round(cx - sz / 2), Math.round(cy - sz / 2), sz, sz);
  x.restore();
  return true;
}

/* ======================================================================
 * src/js/game/bag.js
 * Mochila por slots (32 casillas fijas), consumibles apilables (pociones), equipar/desequipar,
 * papelera de un solo hueco y valor de venta.
 *
 * P.bag    : array de BAG_N posiciones (objeto o null). El índice es el slot.
 * P.trash  : último objeto tirado (al tirar otro, el anterior se borra del todo).
 * Objetos  : equipo {s:'h|b|g|f|a'}, armas {s:'w', wp:<arma>}, consumibles {cons:'hp|mp', q}.
 * Favoritos: it.fav = true (no se tiran ni se venden en lote).
 *
 * Define:
 * BAG_N, POT, SLOT_ORDER, bagInit, bagAll, bagFree, bagAdd, isWeapon, wrapWeapon, itemKind,
 * canEquip, equipFromBag, unequipSlot, giveItem, dropFloor, trashItem, restoreTrash, toggleFav,
 * usePotion, potCount, sellValue, newPotion, itemTip
 * ====================================================================== */

const BAG_N = 32,
  SLOT_ORDER = ["w", "h", "b", "g", "f", "a"],
  POT = {
    hp: { n: "Poción de vida", i: "🧪", d: "Restaura el 50% de la vida máxima.", c: "#e55" },
    mp: { n: "Poción de maná", i: "🔹", d: "Restaura el 60% del maná máximo.", c: "#58f" },
  };
const POT_MAX = 10;

function bagInit() {
  P.bag = new Array(BAG_N).fill(null);
  P.trash = null;
  P.potcd = 0;
}
const bagAll = () => P.bag.filter(Boolean),
  bagFree = () => P.bag.indexOf(null),
  isWeapon = (it) => !!it && it.s == "w",
  potCount = (k) => P.bag.reduce((a, b) => a + (b && b.cons == k ? b.q : 0), 0);

function newPotion(k, q = 1) {
  const p = POT[k];
  return { cons: k, n: p.n, i: p.i, s: "c", tp: "Consumible", r: 0, d: p.d, q, st: {}, id: Date.now() + Math.random() };
}
const itemKind = (it) => (it.cons ? "Consumible" : it.tp && isWeapon(it) ? it.tp : SLOT[it.s] || it.tp || "Objeto");

// Un arma se guarda en la mochila envuelta como objeto (conserva todos sus datos en .wp).
function wrapWeapon(w) {
  return {
    id: Date.now() + Math.random(),
    s: "w",
    wp: w,
    fav: !!w.fav,
    n: w.n,
    i: WI[w.n] || "⚔️",
    r: Math.max(0, RN.indexOf(w.rn)),
    tp: { m: "Arma cuerpo a cuerpo", r: "Arma a distancia", g: "Arma mágica" }[w.s],
    d: `Escala con ${w.sc.toUpperCase()}.`,
    stx: `Daño ×${(w.dmg * w.rm).toFixed(2)} · Crít ${Math.round(w.crit * 100)}%`,
    st: {},
  };
}

// Añade a la mochila (apila pociones). Devuelve false si no hay sitio.
function bagAdd(it) {
  if (it.cons) {
    for (const b of P.bag)
      if (b && b.cons == it.cons && b.q < POT_MAX) {
        const t = Math.min(POT_MAX - b.q, it.q || 1);
        b.q += t;
        it.q = (it.q || 1) - t;
        if (it.q <= 0) return true;
      }
  }
  const i = bagFree();
  if (i < 0) return false;
  P.bag[i] = it;
  return true;
}

function dropFloor(it) {
  const a = Math.random() * 6.28;
  it.hold = 1.2;
  O.push({ x: cl(P.x + Math.cos(a) * 46, RB.x0 + 14, RB.x1 - 14), y: cl(P.y + Math.sin(a) * 46, RB.y0 + 14, RB.y1 - 14), k: "i", it, hold: 1.5 });
  flash("Mochila llena: " + it.n + " cae al suelo");
}

const canEquip = (it) => !!it && !it.cons && it.s != "c" && (isWeapon(it) || meets(it));

function setWeapon(w) {
  P.w = w;
  P.am = undefined;
  P.rl = 0;

function equipItem(it, into) {
  const old = isWeapon(it) ? wrapWeapon(P.w) : P.eq[it.s];
  if (isWeapon(it)) {
    it.wp.fav = !!it.fav;
    setWeapon(it.wp);
  }
  else P.eq[it.s] = it;
  if (old) {

    else if (!bagAdd(old)) dropFloor(old);

    return false;

  const j = into !== undefined && !P.bag[into] ? into : bagFree();
  if (j < 0) {

    return false;

  delete P.eq[s];
  P.bag[j] = it;
  ST();
  return true;

function giveItem(it, fromFloor) {
  if (it.cons) {
    if (!bagAdd(it)) {
      if (fromFloor) return false;
      dropFloor(it);
    }
    return true;

  if (!canEquip(it)) {
    if (!bagAdd(it)) {
      if (fromFloor) return false;
      dropFloor(it);
    } else flash("Guardado en la mochila (no cumples los requisitos)");
    return true;
  }
  if (fromFloor) {
    const need = isWeapon(it) || P.eq[it.s];
    if (need && bagFree() < 0) return false;
  }
  equipItem(it);
  flash("Equipas: " + it.n);
  return true;
}

function trashItem(it, from) {

    return false;

  if (from && from.k == "b") P.bag[from.i] = null;
  else if (from && from.k == "e") {
    if (from.s == "w") {
      flash("No puedes tirar tu arma equipada");

const toggleFav = (it) => {

function usePotion(k, fromBag) {
  if (!P || G.st != "play" || trnBusy()) return false;
  const i = P.bag.findIndex((b) => b && b.cons == k);
  if (i < 0) {
    flash("No tienes " + POT[k].n.toLowerCase());
    return false;
  }
  if (P.potcd > 0 && !fromBag) return false;
  if (k == "hp") {
    if (P.hp >= P.mhp) return flash("Vida completa"), false;
    P.hp = Math.min(P.mhp, P.hp + P.mhp * 0.5);
  } else {
    if (P.mp >= P.mmp) return flash("Maná completo"), false;
    P.mp = Math.min(P.mmp, P.mp + P.mmp * 0.6);

  flash(POT[k].n + " usada");
  return true;
}

const SLOT_ICO = { w: "⚔️", h: "⛑️", b: "🦺", g: "🧤", f: "👢", a: "💍" };
let DRG = null, LASTCK = null;

// Casilla visual: icono, borde de rareza, cantidad (pociones) y estrella de favorito.
function mkSlot(it, o = {}) {
  const d = document.createElement("div");

function invSort(m) {
  const L = bagAll(),
    t = (a) => SLOT_ORDER.indexOf(a.s) + (a.cons ? 9 : 0);
  L.sort(
    (a, b) =>
      (b.fav ? 1 : 0) - (a.fav ? 1 : 0) ||
      (m == "n" ? 0 : m == "t" ? t(a) - t(b) : (b.r || 0) - (a.r || 0)) ||
      (m == "t" ? (b.r || 0) - (a.r || 0) : 0) ||

function invCloseDrag() {

// Acción rápida: equipar/desequipar o usar (atajo MAYÚS+clic o doble toque/clic).
function invQuick(r) {
  const it = refIt(r);
  if (!it) return;
  if (r.k == "b") {
    if (it.cons) usePotion(it.cons, 1);
    else equipFromBag(r.i);

function invDrop(a, b) {
  const it = refIt(a);
  if (!it) return;
  if (b.k == "t") {
    if (a.k != "t" && trashItem(it, a)) G.isel = null;
  } else if (b.k == "b") {
    if (a.k == "b") {
      if (a.i == b.i) return;
      const o = P.bag[b.i];
      if (o && o.cons && it.cons && o.cons == it.cons) {
        const t = Math.min(POT_MAX - o.q, it.q);
        o.q += t;
        it.q -= t;
        if (it.q <= 0) P.bag[a.i] = null;
        if (t > 0) return invAfter();
      }
      P.bag[b.i] = it;
      P.bag[a.i] = o;
    } else if (a.k == "e") {
      const o = P.bag[b.i];
      if (!o) unequipSlot(a.s, b.i);
      else if (o.s == a.s && canEquip(o)) {
        P.bag[b.i] = null;
        equipItem(o, b.i);
      } else flash("Ese hueco está ocupado");
    } else if (a.k == "t") {
      if (!P.bag[b.i]) {
        P.bag[b.i] = P.trash;
        P.trash = null;
      } else flash("Ese hueco está ocupado");
    }
  } else if (b.k == "e") {
    if (it.cons || it.s != b.s) return flash("No va en esa ranura");
    if (!canEquip(it)) return flash("No cumples los requisitos");
    if (a.k == "b") P.bag[a.i] = null;

function invClick(r, e) {
  const it = refIt(r);
  if (!it) return (G.isel = null), invAfter();
  if (e.altKey) {
    toggleFav(it);
    if (r.k == "e" && r.s == "w") P.w.fav = it.fav;
    return invAfter();
  }
  if (e.ctrlKey || e.metaKey) {
    if (r.k != "t" && trashItem(it, r)) G.isel = null;
    return invAfter();

  if (e.shiftKey) return invQuick(r);
  const key = r.k + (r.i ?? r.s ?? ""),
    now = Date.now();

function invWire(el, r) {
  el._ref = r;

  el.onpointerdown = (e) => {
    if (e.button > 0) return;
    e.preventDefault();
    el.setPointerCapture && el.setPointerCapture(e.pointerId);
    DRG = { r, el, sx: e.clientX, sy: e.clientY, on: 0, ghost: null, id: e.pointerId };
  };
  el.onpointermove = (e) => {
    if (!DRG || DRG.el !== el || e.pointerId !== DRG.id) return;
    const it = refIt(r);
    if (!DRG.on && it && Math.hypot(e.clientX - DRG.sx, e.clientY - DRG.sy) > 7) {
      DRG.on = 1;
      el.classList.add("drag");
      const g = document.createElement("div");
      g.className = "sl ghost";
      g.style.setProperty("--rc", RC[it.r || 0]);
      g.innerHTML = icoHTML(it, 34);
      document.body.appendChild(g);
      DRG.ghost = g;
    }
    if (DRG.on) {
      DRG.ghost.style.left = e.clientX + "px";
      DRG.ghost.style.top = e.clientY + "px";
      document.querySelectorAll(".sl.dov").forEach((q) => q.classList.remove("dov", "dno"));
      const t = document.elementFromPoint(e.clientX, e.clientY),
        s = t && t.closest && t.closest(".sl");
      if (s && s._ref && s !== el) {
        const it2 = refIt(r),
          ok = s._ref.k != "e" || (!it2.cons && it2.s == s._ref.s && canEquip(it2));
        s.classList.add("dov");
        if (!ok) s.classList.add("dno");
      }
    }
  };
  const end = (e, cancel) => {
    if (!DRG || DRG.el !== el || e.pointerId !== DRG.id) return;
    const d = DRG;
    el.classList.remove("drag");
    if (d.on && !cancel) {
      d.ghost.style.display = "none";
      const t = document.elementFromPoint(e.clientX, e.clientY),
        s = t && t.closest && t.closest(".sl");
      invCloseDrag();
      if (s && s._ref && s !== el) invDrop(r, s._ref);
      else invAfter();
    } else {
      invCloseDrag();
      if (!cancel && !d.on) invClick(r, e);
    }
  };
  el.onpointerup = (e) => end(e, 0);
  el.onpointercancel = (e) => end(e, 1);
}

/* ======================================================================
 * src/js/ui/shop.js
 * Mercader: comprar (el equipo se equipa al instante), vender y "vender todos los comunes".
 * Nivel oculto del mercader según las compras totales: 10 compras → nivel 2 (4 objetos), 20 → nivel 3 (5 objetos).
 *
 * Define:
 * merchLv, shopStock, shop
 * ====================================================================== */

const merchLv = () => 1 + (st("sh") >= 10 ? 1 : 0) + (st("sh") >= 20 ? 1 : 0);

// Objetos a la venta: arma, equipo y reliquia (nivel 1) + 1 pieza más por nivel (equipo, luego tomo).
function shopStock() {
  const ra = lootRa(),
    k = 1 + 0.1 * G.d,
    rel = [...RL.keys()].sort(() => Math.random() - 0.5),
    L = [
      [lootWeapon(ra), [80, 110, 170, 260]],
      [lootGear(), [60, 100, 160, 250]],
      [lootRelic(RL[rel[0]], Math.min(rcap(), 1 + (Math.random() < 0.5 ? 1 : 0))), [130, 130, 190, 260]],
      [lootGear(), [60, 100, 160, 250]],
      [lootTome(ra), [90, 120, 180, 270]],
    ].slice(0, 2 + merchLv());
  return L.map(([o, pr]) => Object.assign(o, { c: Math.round(pr[o.r || 0] * k) }));
}

function shop(r) {
  const stock = r.stock || (r.stock = shopStock()),
    pots = [
      ["hp", 30],
      ["mp", 30],
    ];
  let tab = G.shtab || "b",
    sel = -1,
    confirm = 0;
  const E_ = (t, c, h) => {
      const e = document.createElement(t);

    btn = (t, fn, dis, on) => {

      e.onclick = fn;
      return e;
    },
    commons = () =>
      P.bag.map((it, i) => (it && !it.cons && !it.fav && !(it.r > 0) ? i : -1)).filter((i) => i >= 0),
    render = () => {
      G.shtab = tab;
      G.ov = 1;
      G.pz = 1;
      ov.style.display = "flex";
      ov.innerHTML = "";
      const w = E_("div", "sh");
      ov.appendChild(w);
      w.appendChild(E_("h2", "", `Mercader · ${P.gold} 🪙`));
      const tb = E_("div", "sh-tabs");
      tb.appendChild(btn("Comprar", () => ((tab = "b"), render()), 0, tab == "b"));
      tb.appendChild(btn("Vender", () => ((tab = "s"), (sel = -1), (confirm = 0), render()), 0, tab == "s"));
      tb.appendChild(btn("Salir", hide));
      w.appendChild(tb);
      if (tab == "b") {
        const l = E_("div", "sh-list");
        pots.forEach(([k, c0]) => {
          const p = POT[k],
            c = Math.round(c0 * (1 + 0.1 * G.d)),
            it = newPotion(k);
          l.appendChild(
            card(Object.assign({}, it, { stx: `En mochila: ${potCount(k)}` }), [
              [
                `${c} 🪙`,
                () => {
                  if (P.gold < c) return flash("Oro insuficiente");
                  if (bagFree() < 0 && !P.bag.some((b) => b && b.cons == k && b.q < POT_MAX)) return flash("Mochila llena");
                  P.gold -= c;
                  bagAdd(newPotion(k));
                  cnt("sh");
                  chk();
                  render();
                },
                P.gold < c,
              ],
            ]),
          );
        });
        stock.forEach((x) => {
          if (x.sold) {
            l.appendChild(card({ i: "✔️", n: "(vendido)", tp: "—", r: 0, d: "" }, []));
            return;
          }
          l.appendChild(
            card(
              { i: x.i, n: x.n, tp: x.tp, r: x.r || 0, d: x.d, stx: x.stx || (x.st ? stT(x.st) : ""), st: x.st, req: x.req, s: x.s },
              [
                [
                  `${x.c} 🪙`,
                  () => {
                    if (P.gold < x.c) return flash("Oro insuficiente");
                    P.gold -= x.c;
                    x.sold = 1;
                    cnt("sh");
                    chk();
                    x.f();
                    if (x.r >= 2) {
                      lootSnd(x.r);
                      lootFX(P.x, P.y, x.r);
                    }
                    render();
                  },
                  P.gold < x.c,
                ],
              ],
              x.cp,
            ),
          );
        });
        w.appendChild(l);
        w.appendChild(E_("small", "", "El equipo comprado se equipa directamente; lo que sustituye pasa a tu mochila."));
        return;
      }
      // ---- vender ----
      const sw = E_("div", "sh-sell"),
        grid = E_("div", "iv-grid"),
        side = E_("div", "iv-info");
      P.bag.forEach((it, i) => {
        const e = mkSlot(it);
        if (i == sel) e.classList.add("sel");
        if (it) e.onclick = () => ((sel = i), (confirm = 0), render());
        grid.appendChild(e);
      });
      sw.appendChild(grid);
      const it = P.bag[sel];
      if (it) {
        const v = sellValue(it) * (it.cons ? it.q : 1);
        side.style.borderColor = RC[it.r || 0];
        side.innerHTML = `<div class="ih">${icoHTML(it, 40)}<div><b style="color:${RC[it.r || 0]}">${it.fav ? "★ " : ""}${it.n}${it.cons ? " ×" + it.q : ""}</b><br><small>${itemKind(it)} · ${RN[it.r || 0]}</small></div></div><p>${it.d || ""}</p><small>${it.stx || stT(it.st || {})}</small>`;
        const ab = E_("div", "ia");
        ab.appendChild(
          btn(
            it.fav ? "Es favorito" : `Vender (+${v} 🪙)`,
            () => {
              P.gold += v;
              P.bag[sel] = null;
              sel = -1;
              snd(900, 0.08, "triangle", 0.04);
              render();
            },
            it.fav,
          ),
        );
        ab.appendChild(
          btn(it.fav ? "★ Quitar favorito" : "☆ Favorito", () => (toggleFav(it), render()), 0, it.fav),
        );
        side.appendChild(ab);
      } else side.innerHTML = "<small>Toca un objeto de tu mochila para venderlo. Los favoritos (★) y el equipo puesto no se venden.</small>";
      sw.appendChild(side);
      w.appendChild(sw);
      const cm = commons(),
        tot = cm.reduce((a, i) => a + sellValue(P.bag[i]), 0),
        bar = E_("div", "iv-bar");
      bar.appendChild(
        btn(
          cm.length ? `Vender todos los comunes (+${tot} 🪙)` : "No tienes comunes para vender",
          () => ((confirm = 1), render()),
          !cm.length,
        ),
      );
      w.appendChild(bar);
      if (confirm && cm.length) {
        const pv = E_("div", "sh-prev");
        pv.innerHTML = `<b>Vista previa de la venta</b><ul>${cm
          .map((i) => `<li>${P.bag[i].n} — ${sellValue(P.bag[i])} 🪙</li>`)
          .join("")}</ul><b>${cm.length} objeto(s) → +${tot} 🪙</b> <small>(los favoritos y los consumibles se conservan)</small>`;
        const ab = E_("div", "ia");
        ab.appendChild(
          btn(`Confirmar: +${tot} 🪙`, () => {
            const c2 = commons();
            P.gold += c2.reduce((a, i) => a + sellValue(P.bag[i]), 0);
            c2.forEach((i) => (P.bag[i] = null));
            confirm = 0;
            sel = -1;
            snd(1000, 0.12, "triangle", 0.05);
            render();
          }),
        );
        ab.appendChild(btn("Cancelar", () => ((confirm = 0), render())));
        pv.appendChild(ab);
        w.appendChild(pv);
      }
    };
  render();
}
