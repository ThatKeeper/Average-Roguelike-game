/* Estilos base: página, canvas, capa de menús (#ov), tipografía y botones */
:root {
  color-scheme: dark;
  --bg: #0b0a10;
  --fg: #e8e2f0;
  --ac: #c9a24a;
  --pn: #1a1722;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
html,
body {
  height: 100%;
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: Georgia, serif;
}
body {
  display: flex;
  align-items: center;
  justify-content: center;
}
#w {
  position: relative;
  width: min(100vw, 160vh);
  width: min(100vw, 160dvh);
}
html {
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
body {
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
}
canvas {
  width: 100%;
  display: block;
  background: #000;
  cursor: crosshair;
}
#ov {
  position: absolute;
  inset: 0;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: 10px;
  background: rgba(8, 6, 12, 0.94);
  overscroll-behavior: contain;
  text-align: center;
  padding: 12px;
  overflow: auto;
}
#ov > :first-child {
  margin-top: auto;
}
#ov > :last-child {
  margin-bottom: auto;
}
h1 {
  margin: 0;
  color: var(--ac);
  letter-spacing: 0.15em;
  font-size: clamp(22px, 5vw, 44px);
}
h2 {
  margin: 0;
  color: var(--ac);
}
button {
  background: var(--pn);
  color: var(--fg);
  border: 1px solid var(--ac);
  padding: 10px 18px;
  font: inherit;
  cursor: pointer;
  border-radius: 4px;
  max-width: 92%;
}
button:hover {
  background: #2c2538;
}
p {
  margin: 2px;
  max-width: 640px;
  font-size: clamp(11px, 1.6vw, 15px);
  opacity: 0.88;
}
</style>

/* ---- controles táctiles ---- */
.tc {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 5;
  display: none;
  --s: 1;
}
.tc.on {
  display: block;
}
.tj {
  position: absolute;
  left: calc(26px + env(safe-area-inset-left, 0px));
  bottom: calc(26px + env(safe-area-inset-bottom, 0px));
  width: calc(var(--s) * 130px);
  height: calc(var(--s) * 130px);
  border-radius: 50%;
  border: 2px solid #c9a24acc;
  background: #161120aa;
  pointer-events: auto;
  touch-action: none;
}
.tk {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 46%;
  height: 46%;
  margin: -23% 0 0 -23%;
  border-radius: 50%;
  background: #c9a24acc;
  border: 2px solid #fff6;
  pointer-events: none;
}
.tb {
  position: absolute;
  pointer-events: auto;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  border-radius: 50%;
  border: 2px solid #c9a24acc;
  background: #161120aa;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font: bold calc(var(--s) * 13px) Georgia;

  background: #0b0a10;

  align-items: center;
  justify-content: center;
  text-align: center;
  font: 18px Georgia;
  z-index: 9;
  pointer-events: auto;
  padding: 20px;
}

// ---- src/js/core/helpers.js ----
/* ======================================================================
 * src/js/core/helpers.js
 * Referencias al DOM/canvas, constantes de pantalla y utilidades matemáticas y de formato.
 *
 * Define:
 * $, cv, x, W, H, ov, rnd, pick, cl, ang, dist, nrm, rngS, fmt
 * ====================================================================== */

const $ = (i) => document.getElementById(i),
  cv = $("c"),
  x = cv.getContext("2d"),
  W = 960,
  H = 600,
  ov = $("ov");
const rnd = (a, b) => a + Math.random() * (b - a),
  pick = (a) => a[(Math.random() * a.length) | 0],
  cl = (v, a, b) => Math.max(a, Math.min(b, v));
const ang = (a, b) => Math.atan2(b.y - a.y, b.x - a.x),
  dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y),
  nrm = (v) => Math.atan2(Math.sin(v), Math.cos(v));
const rngS = (s) => () => {
  s |= 0;
  s = (s + 0x6d2b79f5) | 0;
  let t = Math.imul(s ^ (s >>> 15), 1 | s);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
};
const fmt = (n) =>
  n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? (n / 1e3).toFixed(1) + "k" : Math.round(n);

// ---- src/js/core/storage.js ----
/* ======================================================================
 * src/js/core/storage.js
 * Versión del juego, progreso permanente (S) en localStorage y reinicios por versión (hard/soft reset).
 *
 * Define:
 * GAME_VERSION, HARD_RESET, SOFT_RESET, SKEY, SOFT_WIPE, S, RESET_MSG, save
 * ====================================================================== */

// ===== VERSIONES =====
// GAME_VERSION: solo informativa (se muestra en el titulo y fuerza a renovar el service worker).
// HARD_RESET: sube +1 para BORRAR TODO el guardado (partida nueva desde cero, incluidos logros y bestiario).
// SOFT_RESET: sube +1 para reiniciar solo el PROGRESO (claves de SOFT_WIPE); se conservan logros, bestiario, estadisticas, jefes derrotados y ajustes.
const GAME_VERSION = "1.3.5",
  HARD_RESET = 1,
  SOFT_RESET = 1,
  SKEY = "idv1",
  SOFT_WIPE = ["best", "souls", "pw", "fv", "hard", "hv2", "up", "cards"];
let S = { best: 0, souls: 0, pw: 0 },
  RESET_MSG = "";
try {
  const raw = JSON.parse(localStorage.getItem(SKEY)) || {};
  if (raw.hv === undefined) {
    raw.hv = HARD_RESET;
    raw.sv = SOFT_RESET;
  }
  if (raw.hv !== HARD_RESET) {
    RESET_MSG = "Nueva versión: partida reiniciada desde cero.";
  } else {
    if (raw.sv !== SOFT_RESET) {
      SOFT_WIPE.forEach((k) => delete raw[k]);
      RESET_MSG = "Nueva versión: progreso reiniciado (logros y bestiario conservados).";
    }
    S = Object.assign(S, raw);
  }
} catch (e) {}
S.hv = HARD_RESET;
S.sv = SOFT_RESET;
const save = () => {
  try {
    localStorage.setItem(SKEY, JSON.stringify(S));
  } catch (e) {}
};
save();

// ---- src/js/core/audio.js ----
/* ======================================================================
 * src/js/core/audio.js
 * Sonido procedural con WebAudio: efectos (snd) y sonidos de jefe (bsnd).
 *
 * Define:
 * AC, snd, bsT, bsnd
 * ====================================================================== */

let AC;
function snd(f, d, t = "sine", v = 0.04, m = 0) {
  try {
    AC = AC || new AudioContext();
    const o = AC.createOscillator(),
      g = AC.createGain(),
      n = AC.currentTime;
    o.type = t;
    o.frequency.value = f;
    g.gain.setValueAtTime(v * (S.vol ?? 1) * (m ? (S.vm ?? 1) : (S.vfx ?? 1)), n);
    g.gain.exponentialRampToValueAtTime(0.001, n + d);
    o.connect(g);
    g.connect(AC.destination);
    o.start();
    o.stop(n + d);
  } catch (e) {}
}
let bsT = 0;
function bsnd(i, k) {
  const n = Date.now();
  if (k == "atk") {
    if (n - bsT < 140) return;
    bsT = n;
  }
  const f = 90 + i * 32,
    w = ["sawtooth", "square", "triangle", "sine"][i % 4];
  if (k == "in") {
    snd(f, 0.9, w, 0.08);
    snd(f * 1.5, 0.6, w, 0.05);
  } else if (k == "ph") {
    snd(f * 0.5, 0.7, w, 0.1);
    snd(f * 2, 0.4, w, 0.06);
  } else if (k == "die")
    for (let j = 0; j < 4; j++) snd(f * (1 + j * 0.25), 0.6 + j * 0.1, "triangle", 0.06);
  else snd(f * 3, 0.08, w, 0.03);
}

const SPELL_SPR = { fire: "magia_ignea", water: "magia_marea", ice: "magia_helada", light: "magia_tormenta", plant: "magia_venenosa", dark: "magia_arcana" };

// Registro de sprites cargados: clave -> { img, circ (círculos de colisión), ready }
const WSPR = {};
const ART_CACHE = {};

/** Configuración de animación del arma; si no tiene sprite propio usa un tajo genérico. */
function meleeArt(w) {
  if (MELEE_ART[w.n]) return MELEE_ART[w.n];
  return (ART_CACHE[w.n] ||= {
    spr: null, fam: "sweep", gu: -7, tu: 10, s: Math.max(1.5, (0.95 * (w.rng || 60) - 14) / 17),
    dur: 0.22, w: 0.24, r: 0.22, back: 0.45, lunge: 4, pull: 7, idle: 0.85, trail: "#e8f2ff",
  });
}

/**
 * Convierte el sprite en una lista de círculos de colisión (celdas de 2x2 píxeles
 * con algo opaco). Cada círculo se guarda como (u, v): u a lo largo del eje del arma
 * y v perpendicular a él. Así la zona de daño es la silueta real del sprite.
 */
function spriteCircles(src) {
  const c = document.createElement("canvas");
  c.width = c.height = 16;
  const g = c.getContext("2d");
  g.drawImage(src, 0, 0, 16, 16);
  let d;
  try {
    d = g.getImageData(0, 0, 16, 16).data;
  } catch (e) {
    return null;
  }
  const out = [];
  for (let cy = 0; cy < 8; cy++)
    for (let cx = 0; cx < 8; cx++) {
      let on = 0;
      for (let j = 0; j < 2; j++)
        for (let i = 0; i < 2; i++) if (d[((cy * 2 + j) * 16 + cx * 2 + i) * 4 + 3] > 40) on++;
      if (!on) continue;
      const X = cx * 2 + 1 - 8,
        Y = cy * 2 + 1 - 8;
      out.push({ u: (X - Y) / SQ2, v: (X + Y) / SQ2 });
    }
  return out;
}

function loadWeaponSprites() {
  const keys = new Set(Object.values(MELEE_ART).map((a) => a.spr));
  for (const a of Object.values(RANGED_ART)) keys.add(a.spr).add(a.spr2);
  for (const k of Object.keys(PROJ_ART)) keys.add(k);
  for (const key of keys) {
    const rec = (WSPR[key] = { img: null, circ: null, ready: false });
    const uri = WEAPON_SPRITE_DATA[key];
    if (!uri) continue;
    const img = new Image();
    img.onload = () => {
      rec.img = img;
      rec.circ = spriteCircles(img);
      rec.ready = true;
    };
    img.src = uri;
  }
}
loadWeaponSprites();

/* ======================================================================

 * Teclas configurables (KD/KY) y manejadores de teclado y ratón.
 *
 * Define:
 * KD, KY, tapped
 * ====================================================================== */

// ===== ENTRADA =====
const KD = {
    up: "KeyW",
    down: "KeyS",
    left: "KeyA",
    right: "KeyD",
    q: "KeyQ",
    e: "KeyE",
    r: "KeyR",
    dodge: "Space",
    inv: "KeyI",
    map: "KeyM",
    use: "KeyF",
    c1: "Digit1",
    c2: "Digit2",
    c3: "Digit3",
    c4: "Digit4",
    book: "KeyB",
    tal: "KeyT",
  },
  KY = Object.assign({}, KD, S.keys);
onkeydown = (e) => {
  if (G.rb) {
    e.preventDefault();
    if (e.code != "Escape") {
      KY[G.rb] = e.code;
      S.keys = KY;
      save();
    }
    G.rb = 0;
    ctrls();
    return;
  }
  K[e.code] = 1;
  if (G.st == "title") {
    if (!G.tf) G.tf = 0.5;
    return;
  }
  if (G.st == "hub") {
    if (e.code == KY.use && !G.ov) hubUse();
    else if (e.code == "Escape" && G.ov) hide();
    return;
  }
  if (G.st != "play") return;
  if (e.code == "Escape") pause();
  if (e.code == KY.map) bigmap ^= 1;
  if (e.code == KY.inv) inv();
  if (e.code == KY.use) interact();
  if (e.code == KY.book) book();
  if (e.code == KY.tal) tal();
  if (e.code == KY.dodge) {
    e.preventDefault();
    if (!G.ov) dodge();
  }
};
onkeyup = (e) => (K[e.code] = 0);
cv.onmousemove = (e) => {
  const b = cv.getBoundingClientRect();
  M.x = ((e.clientX - b.left) * W) / b.width;
  M.y = ((e.clientY - b.top) * H) / b.height;
};
cv.onmousedown = (e) => {
  e.button ? (M.r = 1) : (M.d = 1);
};
onmouseup = (e) => {
  e.button ? (M.r = 0) : (M.d = 0);
};
cv.oncontextmenu = (e) => e.preventDefault();

// Táctil/lápiz: el navegador emite mousedown+mouseup juntos al soltar el dedo, así que M.d
// vuelve a 0 antes de que el bucle lo lea y los menús (título, hub) nunca ven el clic.
// pointerdown registra el toque y lo conserva un instante; tapped() lo consume una vez.
cv.addEventListener("pointerdown", (e) => {
  if (e.pointerType == "mouse") return;
  const b = cv.getBoundingClientRect();
  M.x = ((e.clientX - b.left) * W) / b.width;
  M.y = ((e.clientY - b.top) * H) / b.height;
  M.tap = performance.now();
});
const tapped = () => {
  const v = M.tap && performance.now() - M.tap < 400;
  M.tap = 0;
  return !!v;
};

/* ======================================================================
 * src/js/spells/casting.js
 * Construcción y lanzamiento de hechizos, impacto de hechizo y zonas persistentes.
 *
 * Define:
 * build, spHit, castSp, zn
 * ====================================================================== */

function build(a, b, f) {
  const k = [a, b].filter(Boolean).sort().join("+"),
    c = CB[k],
    f2 = c?.f || f,
    F = {
      bolt: [20, 2.5, 1, 0],
      nova: [28, 5, 0.85, 120],
      cone: [22, 3, 1.1, 170],
      zone: [30, 7, 0.55, 90],
    }[f2],
    has = (z) => a == z || b == z,
    els =
      b && b != a
        ? [
            [a, 0.6],
            [b, 0.4],
          ]
        : [[a, 1]];
  let cost = F[0] * (b && b != a ? 1.2 : 1) * (1 - 0.08 * (P.tal.alch || 0)),
    cd = F[1],
    hpc = has("blood") ? P.mhp * (k == "blood+dark" ? 0.15 : 0.06) : 0;
  const dmg = wd(1) * F[2] * (c?.m || 1) * (has("blood") ? 1.35 : 1);
  if (has("corr")) {
    cost *= 1.25;
    cd *= 1.25;
  }
  return {
    a,
    b,
    f: f2,
    c,
    els,
    name: c ? c.n : EL[a].n + (b && b != a ? " + " + EL[b].n : ""),
    cost,
    cd: cd * (c?.cdm || 1),
    hpc,
    dmg,
    r: F[3] * (c?.r || 1) * (has("wind") ? 1.3 : 1),
    dur: 4,
    k: 1,
    desc: els.map(([z]) => EL[z].d).join(" ") + (c ? " \u2605 " + c.d : ""),
    risk:
      [
        hpc ? `Sacrificas ${Math.ceil(hpc)} de vida.` : "",
        has("corr") ? "+25% coste y enfriamiento." : "",
        (c && c.rk) || "",
        k == "fire+water" || k == "fire+ice" ? "Los elementos se contrarrestan." : "",
      ]
        .filter(Boolean)
        .join(" ") || "Sin riesgos.",
  };
}
function spHit(e, s, x0, y0) {
  if (e.hp <= 0 || e.sp > 0) return;
  for (const [k, sh] of s.els) {
    hit(e, s.dmg * sh, "m", { el: k, ch: k == "light", a: Math.atan2(e.y - y0, e.x - x0) });
    if (e.hp > 0) EL[k].h(e, s, x0, y0);
  }
  if (s.c && e.hp > 0) s.c.h(e, s);
}
function castSp(spec, ci = 4) {
  const s = spec || P.sp;
  if (!s || P.cd[ci] > 0 || P.dash) return;
  const sp = build(s.a, s.b, s.f);
  if (P.mp < sp.cost || P.hp <= sp.hpc + 1) {
    flash(P.mp < sp.cost ? "Man\u00e1 insuficiente" : "Vida insuficiente");
    return;
  }
  P.mp -= sp.cost;
  P.hp -= sp.hpc;
  P.cd[ci] = sp.cd;
  sp.st = !(P.stcd > 0);
  const col = EL[sp.a].c;
  if (sp.f == "bolt")
    shoot(P.face, 560, sp.dmg, "m", {
      sf: sp,
      c: col,
      r: 8,
      pierce: sp.c ? 1 : 0,
      spr: SPELL_SPR[sp.a],
    });
  else if (sp.f == "zone") {
    const d = Math.min(300, dist(P, M)),
      a = P.face;
    ZN.push({ x: P.x + Math.cos(a) * d, y: P.y + Math.sin(a) * d, r: sp.r, t: sp.dur, k: 0, sp });
  } else {
    FX.push({ k: "ring", x: P.x, y: P.y, r: sp.r, t: 0.3, m: 0.3, c: col });
    for (const e of E)
      if (
        e.hp > 0 &&
        dist(P, e) < sp.r + e.r &&
        (sp.f == "nova" || Math.abs(nrm(ang(P, e) - P.face)) < 0.65)
      )
        spHit(e, sp, P.x, P.y);
  }
  if (sp.c && sp.c.cap) P.stcd = 6;
  rangedKick();
  snd(500, 0.12, "sine");
}
function zn(dt) {
  for (const z of ZN) {
    z.t -= dt;
    z.k -= dt;
    if (z.k <= 0) {
      z.k = 0.6;
      for (const e of E) if (e.hp > 0 && dist(z, e) < z.r + e.r) spHit(e, z.sp, z.x, z.y);
    }
  }
  ZN = ZN.filter((z) => z.t > 0);
}

/* ======================================================================
 * src/js/game/run.js
 * Inicio de partida (run) y recálculo de estadísticas del jugador (ST).
 *
 * Define:
 * run, ST
 * ====================================================================== */

// ===== PARTIDA =====
function run(wi) {
  G = { st: "play", seed: Date.now() % 1e9, d: 1, ov: 0, kills: 0 };
  const a = { str: 3, dex: 3, int: 3, vit: 3, agi: 3, luk: 3 },
    w = mk(wi);
  a[w.sc] += 4;
  P = {
    x: 480,
    y: 300,
    vx: 0,
    vy: 0,
    r: 12,
    lv: 1,
    xp: 0,
    nx: 30,
    pend: 0,
    a,
    w,
    gold: 0,
    relics: [],
    inv: 0,
    dcd: 0,
    acd: 0,
    cd: [0, 0, 0, 0],
    eq: {},
    bag: [],
    tal: {},
    pts: 0,
    cls: w.s,
    cb: 0,
    gt: 0,
    dm: 1 + 0.005 * U("pow"),
    cm: 1.6,
    ccb: 0,
    ls: 0,
    bhp: 0,
    bmp: 0,
    bmr: 0,
    bsp: 0,
    barm: 0,
    bn: 0,
    fz: 0,
    fl: 0,
    pcd: 0,
  };
  ST();
  P.hp = P.mhp;
  P.mp = P.mmp;
  AL = [];
  TR = [];
  ZN = [];
  K = {};
  M.d = M.r = 0;
  E = [];
  PR = [];
  Z = [];
  FX = [];
  NM = [];
  shake = 0;
  hide();
  genLevel();
  enter(0, 4);
  music();
}
function ST() {
  const a = P.a;
  P.mhp = 60 + a.vit * 10 + P.bhp;
  P.mmp = 30 + a.int * 6 + P.bmp;
  P.spd = 185 * (1 + 0.015 * a.agi + P.bsp + 0.01 * U("spd"));
  P.as = 1 + 0.015 * a.agi;
  P.arm = a.vit * 1.5 + P.barm + U("arm");
  P.mr = 3 + a.int * 0.5 + P.bmr;
  P.cc = Math.min(0.75, P.w.crit + a.dex * 0.004 + a.luk * 0.004 + P.ccb);
  P.edm = 1;
  P.els = 0;
  P.ecm = 0;
  for (const s in P.eq) {
    const q = P.eq[s].st;
    P.mhp += q.hp || 0;
    P.mmp += q.mp || 0;
    P.arm += q.arm || 0;
    P.spd *= 1 + (q.spd || 0);
    P.as += q.as || 0;
    P.cc = Math.min(0.85, P.cc + (q.cc || 0));
    P.edm += q.dm || 0;
    P.els += q.ls || 0;
    P.ecm += q.cm || 0;
  }
  P.res = {};
  for (const s in P.eq) {
    const q = P.eq[s].st;
    for (const k in q)
      if (k.startsWith("r_")) P.res[k.slice(2)] = Math.min(0.6, (P.res[k.slice(2)] || 0) + q[k]);
  }
  const T = P.tal;
  P.arm += 6 * (T.skin || 0);
  P.cc = Math.min(0.85, P.cc + 0.04 * (T.hunt || 0));
  P.els += 0.01 * (T.thirst || 0);
  P.mmp += 20 * (T.will || 0);
  P.mr += 1.5 * (T.will || 0);
  P.mhp = Math.round(P.mhp * (1 + 0.01 * U("vig")));
  if (P.hp > P.mhp) P.hp = P.mhp;
  if (P.mp > P.mmp) P.mp = P.mmp;
}

// ---- src/js/combat/damage.js ----
/* ======================================================================
 * src/js/combat/damage.js
 * Fórmula de daño y escalado, estados alterados, golpes, áreas, cadenas y muerte de enemigos.
 *
 * Define:
 * wd, hpM, dmM, col, nm, apply, hit, area, chain, kill
 * ====================================================================== */

// ===== DAÑO (fórmula centralizada) =====
// final = 10*dañoArma*rareza * (1+0.06*(nivel-1)) * (1+0.045*atributoEscalado) * modHabilidad * dmPermanente/reliquias
//         * crítico(×cm) * (1 - resistenciaObjetivo[tipo]) * (escudo?0.5)   | físico 'p', mágico 'm'
// Escalado enemigo por profundidad d: vida=(1+.22(d-1))*(1+.35*floor((d-1)/4)) ; daño=1+.09(d-1)+.12*floor((d-1)/4)
// Más allá de los números: d>=3 oleadas dobles, campeones con modificadores, más tipos de enemigo y patrones de jefe.

const wd = (k = 1) =>
  10 *
  P.w.dmg *
  P.w.rm *
  (1 + 0.06 * (P.lv - 1)) *
  (1 + 0.045 * P.a[P.w.sc]) *
  k *
  P.dm *
  P.edm *
  (P.bt > 0 ? 1.35 : 1);
// Vida enemiga = (1+0.22(d-1)) * (1+0.35*floor((d-1)/4)) * (1+0.025*max(0,d-8))  (suave al inicio, tramos cada 4 niveles y empuje extra desde d>8)
const hpM = () =>
    (1 + 0.22 * (G.d - 1)) *
    (1 + 0.35 * Math.floor((G.d - 1) / 4)) *
    (1 + 0.025 * Math.max(0, G.d - 8)) *
    (S.hard ? 1.2 : 1),
  dmM = () => (1 + 0.09 * (G.d - 1) + 0.12 * Math.floor((G.d - 1) / 4)) * (S.hard ? 1.12 : 1);

// ===== COMBATE =====
const BOMB_DELAY = 0.6; // segundos hasta que explota un kamikaze al que matas (igual que su mecha propia)
function col(o) {
  const r = o.r;
  o.x = cl(o.x, 50 + r, 910 - r);
  o.y = cl(o.y, 50 + r, 550 - r);
  for (const b of RM_.obs) {
    const cx = cl(o.x, b.x, b.x + b.w),
      cy = cl(o.y, b.y, b.y + b.h),
      dx = o.x - cx,
      dy = o.y - cy,
      d = Math.hypot(dx, dy);
    if (d < r) {
      if (d > 0) {
        o.x += (dx / d) * (r - d);
        o.y += (dy / d) * (r - d);
      } else o.y -= r;
    }
  }
}
const nm = (x0, y0, t, c) => NM.push({ x: x0 + rnd(-8, 8), y: y0, t: fmt(t), c, l: 0.8 });
function apply(e, f) {
  if (!f) return;
  if (e.t == "boss") f = Object.assign({}, f, { stun: 0, freeze: 0, root: 0 });
  if (f.bleed) {
    e.st.bleedN = Math.min(8 + (P.bl || 0) + (P.tal.bleed || 0), (e.st.bleedN || 0) + f.bleed);
    e.st.bleed = 5;
    e.bd = Math.max(e.bd || 0, wd(0.3));
  }
  if (f.wet) {
    e.st.wet = f.wet;
    e.st.burn = 0;
  }
  const rs = e.t == "boss" ? 0.5 : e.t == "elite" ? 0.7 : 1;
  if (f.root) e.st.root = f.root * rs;
  if (f.frac) e.st.frac = f.frac;
  if (f.curse) e.st.curse = f.curse;
  if (f.freeze) e.st.stun = Math.max(e.st.stun || 0, f.freeze * rs);
  if (f.cor) {
    e.st.cor = Math.min(10, (e.st.cor || 0) + f.cor);
    e.st.cort = 4;
    e.cdm = Math.max(e.cdm || 0, wd(0.06));
  }
  if (f.burn) {
    e.st.burn = f.burn;
    e.dot = Math.max(e.dot, wd(0.25));
  }
  if (f.poison) {
    e.st.poison = f.poison;
    e.dot = Math.max(e.dot, wd(0.18));
  }
  if (f.slow) {
    if (e.st.slow > 0 && e.t != "boss") e.st.stun = Math.max(e.st.stun || 0, 0.9);
    e.st.slow = f.slow;
  }
  if (f.stun) e.st.stun = Math.max(e.st.stun || 0, f.stun);
}
function hit(e, b, t, o = {}) {
  if (e.hp <= 0 || e.sp > 0) return;
  const cr = Math.random() < P.cc;
  let d = Math.max(
    1,
    b *
      (cr ? P.cm + P.ecm : 1) *
      (1 - (ET[e.t].res?.[t] || 0)) *
      (e.sh > 0 ? 0.5 : 1) *
      (e.mod == "blindado" ? 0.8 : 1) *
      (o.ch && e.st.wet > 0 ? 1.6 : 1) *
      (e.imm > 0 ? 0.01 : 1) *
      (e.vul > 0 ? 1.6 : 1) *
      (e.st.frac > 0 ? 1.2 : 1) *
      (1 + (e.st.cor || 0) * 0.04) *
      (o.el == "dark" && Object.keys(e.st).some((k) => e.st[k] > 0 && k != "cort") ? 1.3 : 1),
  );
  if (e.t == "boss") {
    d = Math.min(d, e.mhp * 0.1);
    const n = Date.now();
    if (n - (e.dwt || 0) > 1000) {
      e.dwt = n;
      e.dwv = 0;
    }
    d = Math.min(d, Math.max(e.mhp * 0.25 - e.dwv, e.mhp * 0.004));
    e.dwv += d;
  }
  e.hp -= d;
  e.fl = 0.1;
  if (cr && P.det && e.st.bleedN > 0) {
    const n = e.st.bleedN;
    e.st.bleedN = Math.ceil(n / 2);
    e.hp -= d * 0.25 * n;
  }
  if (!o.nl)
    P.hp = Math.min(P.mhp, P.hp + Math.min(d * Math.min(0.06, P.ls + P.els), P.mhp * 0.03));
  if (o.kb && e.t != "boss") {
    e.vx += Math.cos(o.a) * o.kb;
    e.vy += Math.sin(o.a) * o.kb;
  }
  apply(e, o.fx);
  if (P.bn) apply(e, { burn: 2 });
  if (P.pzn) apply(e, { poison: 3 });
  if (P.fz) apply(e, { slow: 1.5 });
  if (o.stun) apply(e, { stun: o.stun });
  nm(e.x, e.y - e.r, d, cr ? "#ffd34a" : "#fff");
  snd(cr ? 320 : 170, 0.05, "square");
  if (cr) shake = Math.max(shake, 3);
  if (e.hp <= 0) kill(e);
}
function area(x0, y0, r, d, t, o = {}) {
  FX.push({ k: "ring", x: x0, y: y0, r, t: 0.3, m: 0.3, c: o.c || "#fff" });
  shake = Math.max(shake, 4);
  for (const e of E)
    if (e.hp > 0 && dist({ x: x0, y: y0 }, e) < r + e.r)
      hit(e, d, t, Object.assign({ a: ang({ x: x0, y: y0 }, e), kb: 200 }, o));
}
function chain(e, d, n) {
  let cur = e,
    used = new Set([e]);
  while (n-- > 0) {
    let b = null,
      bd = 180;
    for (const q of E)
      if (q.hp > 0 && !used.has(q) && dist(q, cur) < bd) {
        bd = dist(q, cur);
        b = q;
      }
    if (!b) break;
    used.add(b);
    FX.push({ k: "line", x: cur.x, y: cur.y, x2: b.x, y2: b.y, t: 0.15, m: 0.15 });

}
function kill(e) {

  else FX.push({ k: "dead", x: e.x, y: e.y, r: e.r, c: ET[e.t].c, t: 0.5, m: 0.5 });

  if (!e.minion)
    for (
      let i = 0;

      i++
    )
      O.push({

      });
  if (Math.random() < 0.1 + P.a.luk * 0.005) O.push({ x: e.x, y: e.y, k: "h", v: 0.15 });
  for (let i = 0; i < 8; i++)
    FX.push({
      k: "p",
      x: e.x,
      y: e.y,
      vx: rnd(-140, 140),
      vy: rnd(-140, 140),
      t: 0.5,
      m: 0.5,
      c: T.c,
    });

    // El kamikaze abatido no estalla al instante: la zona avisa durante BOMB_DELAY segundos
    // para que, si lo mataste de cerca, tengas tiempo de alejarte (esquivar o correr).
    const dl = e.t == "bomber" ? BOMB_DELAY : 0.01;
    Z.push({ x: e.x, y: e.y, r: 75, t: dl, m: dl, d: e.dmg * (e.t == "bomber" ? 1 : 0.8), c: "#fa4" });
    if (e.t == "bomber") snd(380, 0.12, "square", 0.05);
  }
  if (Math.random() < (e.t == "boss" || e.t == "elite" ? 1 : 0.04 + P.a.luk * 0.002 + emptyB()))
    O.push({
      x: e.x,
      y: e.y,
      k: "i",
      it: Object.assign({}, pickIT(), { id: Date.now() + Math.random() }),
    });
  if (!e.minion) xp((6 + G.d * 1.5) * (e.t == "boss" ? 15 : e.t == "elite" ? 5 : 1));
}

/* ======================================================================
 * src/js/game/levels.js
 * Generación de niveles/salas, entrada a salas, aparición de enemigos y oleadas.
 *
 * Define:
 * doorVis, genLevel, enter, spawn, wave
 * ====================================================================== */

// doorVis: una puerta se dibuja siempre salvo la de una sala secreta aun no descubierta (mecanica intencional)
function doorVis(r, k) {
  const n = G.R[r.nb[k]];
  return !(n.sec && !G.seen[r.nb[k]]);
}
function genLevel() {
  const d = G.d,
    rng = rngS(G.seed + d * 7919),
    n = S.hard ? Math.min(10 + (d >> 1), 20) : Math.min(5 + (d >> 1), 12),
    R = [{ gx: 0, gy: 0, nb: {}, tp: "start", cl: 1, dist: 0 }],
    mp = { "0,0": 0 };
  while (R.length < n) {
    const b = R[(rng() * R.length) | 0],
      di = (rng() * 4) | 0,
      gx = b.gx + DIR[di][0],
      gy = b.gy + DIR[di][1],
      k = gx + "," + gy;
    if (mp[k] !== undefined) continue;
    mp[k] = R.length;
    const r = { gx, gy, nb: {}, dist: b.dist + 1 };
    r.nb[(di + 2) % 4] = R.indexOf(b);
    b.nb[di] = R.length;
    R.push(r);
  }
  if (S.hard)
    for (const a of R)
      for (let di = 0; di < 4; di++) {
        if (a.nb[di] !== undefined) continue;
        const j = mp[a.gx + DIR[di][0] + "," + (a.gy + DIR[di][1])];
        if (j !== undefined && rng() < 0.3 && R[j].nb[(di + 2) % 4] === undefined) {
          a.nb[di] = j;
          R[j].nb[(di + 2) % 4] = R.indexOf(a);
        }
      }
  let bi = 1;
  R.forEach((r, i) => {
    if (r.dist > R[bi].dist) bi = i;
  });
  R.forEach((r, i) => {
    if (i == 0) {
      r.obs = [];
      r.hz = [];
      r.wv = 1;
      return;
    }
    const q = rng();
    r.tp =
      i == bi
        ? "boss"
        : q < 0.5
          ? "combat"
          : q < 0.62 && d > 1
            ? "elite"
            : q < 0.74
              ? "treasure"
              : q < 0.82
                ? "shrine"
                : q < 0.88
                  ? "shop"
                  : q < 0.95
                    ? "event"
                    : "combat";
    r.cl = !["combat", "elite", "boss"].includes(r.tp);
    r.wv = d >= 3 && i != bi ? 2 : 1;
    const o = [],
      rr = rngS(G.seed + d * 7919 + i * 131),
      k = r.tp == "boss" ? 2 : 2 + ((rr() * (S.hard ? 7 : 5)) | 0);
    for (let j = 0; j < k; j++) {
      const t = rr(),
        w = t < 0.5 ? 40 : t < 0.8 ? 30 : 110,
        h = t < 0.5 ? 40 : t < 0.8 ? 110 : 30,
        ox = 90 + rr() * (780 - w),
        oy = 90 + rr() * (420 - h);
      if ((ox + w > 400 && ox < 560) || (oy + h > 240 && oy < 360)) continue;
      o.push({ x: ox, y: oy, w, h });
    }
    r.obs = layout(o, r.tp, rr);
    r.hz = [];
    if ([3, 5, 6, 7].includes((d - 1) % 8))
      for (let j = 0; j < 2; j++)
        r.hz.push({ x: 150 + rr() * 660, y: 120 + rr() * 360, r: 40 + rr() * 30 });
  });
  if (!R.some((r) => r.tp == "treasure")) {
    const r = R.find((q, i) => i && i != bi);
    r.tp = "treasure";
    r.cl = 1;
  }
  const sr = R.find(
    (q, i) => i && i != bi && q.tp == "combat" && q.dist > 1 && Object.keys(q.nb).length == 1,
  );
  if (sr && d >= 2) {
    sr.sec = 1;
    sr.tp = "treasure";
    sr.cl = 1;
  }
  const sr2 =
    S.hard &&
    R.find(
      (q, i) =>
        i && i != bi && q != sr && q.tp == "combat" && q.dist > 1 && Object.keys(q.nb).length == 1,
    );
  if (sr2 && d >= 2) {
    sr2.sec = 1;
    sr2.tp = "treasure";
    sr2.cl = 1;
  }
  G.R = R;
  G.seen = { 0: 1 };
  G.bi = BI[(d - 1) % 8];
}
function enter(i, from) {
  G.cur = i;
  G.hurt = 0;
  const r = G.R[i];
  RM_ = r;
  G.seen[i] = 1;
  E = [];
  PR = [];
  Z = [];
  TR = [];
  ZN = [];
  O = r.O || (r.O = []);
  const pos = [
    [480, 80],
    [880, 300],
    [480, 520],
    [80, 300],
  ];
  if (from < 4) {
    P.x = pos[from][0];
    P.y = pos[from][1];
  } else {
    P.x = 480;
    P.y = 300;
  }
  for (const k in r.nb) if (!G.R[r.nb[k]].sec) G.seen[r.nb[k]] = 1;
  if (!r.cl && !r.st) {
    r.st = 1;
    wave(r);
  } else if (!r.cl && r.st) {
    wave(r);
  }
}
function spawn(t, x0, y0, mod) {
  const T = ET[t];
  let px, py;
  for (let i = 0; i < 25; i++) {
    px = x0 ?? rnd(100, 860);
    py = y0 ?? rnd(100, 500);
    if (
      dist({ x: px, y: py }, P) > 230 &&
      !RM_.obs.some(
        (b) => px > b.x - 20 && px < b.x + b.w + 20 && py > b.y - 20 && py < b.y + b.h + 20,
      )
    )
      break;
  }
  const hm = hpM() * adH() * (t == "boss" ? 1 + G.d * 0.1 : 1);
  const e = {
    id: ++EID,
    t,
    x: px,
    y: py,
    r: T.r,
    hp: T.hp * hm,
    mhp: T.hp * hm,
    dmg: T.dm * dmM() * adD(),
    vx: 0,
    vy: 0,
    st: {},
    cd: rnd(0.8, 2),
    sp: 0.8,
    wind: 0,
    lu: 0,
    dir: Math.random() < 0.5 ? 1 : -1,
    sh: 0,
    fl: 0,
    dot: 0,
    mod,
    fz: 0,
    ph: 0,
    tm: 0,
  };
  {
    const v = BV[(G.d - 1) % 8];
    e.hp = e.mhp *= v[1];
    e.sx = (e.sx || 1) * v[2];
    e.vn = v[0];
  }
  if (mod == "veloz") e.sx = 1.4;
  if (mod == "blindado") e.hp = e.mhp *= 1.4;
  E.push(e);
  return e;
}
function wave(r) {
  const d = G.d;
  if (r.tp == "boss" && !r.bs) {
    r.bs = 1;
    spawnBoss();
    return;
  }
  const n = Math.min(
      S.hard ? 18 : 14,
      3 + (S.hard ? 2 : 0) + Math.floor(Math.sqrt(d) * 2) + ((Math.random() * 3) | 0),
    ),
    pool = ["grunt", "runner", "archer"];
  if (d > 1) pool.push("mage", "tank");
  if (d > 2) pool.push("bomber", "guardian");
  if (d > 3) pool.push("summoner", "stalker");
  const bf = ["grunt", "summoner", "bomber", "stalker", "mage", "bomber", "tank", "summoner"][
    (d - 1) % 8
  ];
  pool.push(bf, bf);
  if (r.tp == "elite" && r.wv == (d >= 3 ? 2 : 1))
    spawn(
      "elite",
      undefined,
      undefined,
      d > 2 ? pick(["veloz", "blindado", "vampírico", "explosivo"]) : 0,
    );
  for (let i = 0; i < n; i++)
    spawn(
      pick(pool),
      undefined,
      undefined,
      Math.random() < Math.min(0.45, 0.035 * d)
        ? pick(["veloz", "blindado", "vampírico", "explosivo"])
        : 0,
    );
}

/* ======================================================================
 * src/js/game/progression.js
 * Experiencia y subida de nivel.
 *
 * Define:
 * xp, lvUp

function xp(v) {
  P.xp += v * (1 + 0.02 * U("gro"));
  while (P.xp >= P.nx) {
    P.xp -= P.nx;
    P.lv++;
    P.nx = Math.floor(P.nx * 1.32 + 10);
    P.pend++;
    P.pts++;
    chk();
    P.hp = Math.min(P.mhp, P.hp + P.mhp * 0.25);
  }
}
function lvUp() {
  P.pend--;
  const ks = ["str", "dex", "int", "vit", "agi", "luk"],
    nmz = {
      str: "Fuerza (arm. pesadas)",
      dex: "Destreza (crítico, a distancia)",
      int: "Inteligencia (magia, maná)",
      vit: "Vitalidad (vida, armadura)",
      agi: "Agilidad (velocidad)",
      luk: "Suerte (botín, crítico)",
    };
  const o = ks.sort(() => Math.random() - 0.5).slice(0, 3);
  show(
    `<h2>¡Nivel ${P.lv}!</h2><p>Elige un atributo (+2)</p>`,
    o.map((k) => ({
      i: ATI[k],
      n: ATN[k],
      tp: "Atributo",
      r: 0,
      d: ATD[k],
      stx: `${k.toUpperCase()} ${P.a[k]} → ${P.a[k] + 2}`,
      f: () => {
        P.a[k] += 2;
        ST();
      },
    })),
  );
}

// ---- src/js/combat/melee-swing.js ----
/* ======================================================================
 * src/js/combat/melee-swing.js
 * Golpes cuerpo a cuerpo con el sprite del arma: el arma se mueve de verdad,
 * deja una estela y el daño se aplica donde el sprite (y su estela) pasa.
 *
 * Cada golpe tiene tres fases: preparación (el arma se echa atrás),
 * golpe (daño activo) y recuperación (vuelve a la posición de reposo).
 *
 * Define:
 * SW, SWDIR, startSwing, swingPose, swingStrike, swingHitEnemy, trailSample, swingTick
 * ====================================================================== */

let SW = null; // golpe en curso (null si no hay)
let SWDIR = 1; // sentido del golpe; se alterna en cada ataque
const IDLE_HR = 10; // distancia de la mano al centro del jugador en reposo
const IDLE_K = 0.78; // el arma se ve algo más pequeña en reposo
const TRAIL_LIFE = 0.18; // segundos que tarda en desvanecerse la estela
const FALLBACK_CIRC = [-7, -5, -3, -1, 1, 3, 5, 7, 9].map((u) => ({ u, v: 0 }));

const mlerp = (a, b, t) => a + (b - a) * t;
const mOut3 = (q) => 1 - Math.pow(1 - q, 3);
const mIO = (q) => (q < 0.5 ? 2 * q * q : 1 - Math.pow(-2 * q + 2, 2) / 2);

/** Inicia un golpe. `c` = tercer golpe del combo (más grande y fuerte, como antes). */
function startSwing(w, aim, c, cdv) {
  const A = meleeArt(w),
    kS = c ? 1.15 : 1,
    arc = (w.arc || 1.6) * (c ? 1.3 : 1);
  SWDIR = -SWDIR;
  const sw = (SW = {
    owner: P,
    w,
    art: A,
    a0: aim,
    dir: SWDIR,
    c,
    kS,
    t: 0,
    dur: Math.min(A.dur, Math.max(0.08, cdv * 0.95)),
    amp: A.fam == "thrust" ? 0.12 : A.fam == "jab" ? arc * A.jab : arc,
    back: A.back || 0,
    seen: new Set(),
    ring: false,
  });
  const L = (A.tu - A.gu) * A.s * kS;
  sw.qa = A.fam == "thrust" ? 0.05 : sw.back / (sw.amp + sw.back);
  sw.hmax = A.fam == "sweep" ? IDLE_HR + A.lunge : Math.max(IDLE_HR, 0.95 * w.rng * kS - L);
  sw.reach = sw.hmax + L + A.s * kS * 4 + 10;
  sw.fx = {
    k: "trail",
    x: P.x,
    y: P.y,
    pts: [],
    art: A,
    c: c ? "#ffd34a" : A.trail,
    lw: c ? 4 : 3,
    life: TRAIL_LIFE,
    t: sw.dur + TRAIL_LIFE,
    m: sw.dur + TRAIL_LIFE,
  };
  FX.push(sw.fx);
  P.at = sw.dur;
}

/**
 * Posición del arma en el instante `t` del golpe.
 * Devuelve la mano (relativa al jugador), el ángulo del eje del arma, la escala,
 * si hay que voltear el sprite (filo hacia delante) y si el daño está activo.
 */
function swingPose(sw, t) {
  const A = sw.art,
    p = cl(t / sw.dur, 0, 1),
    Wn = A.w,
    Rc = A.r,
    S = 1 - Wn - Rc,
    startRel = -sw.dir * (sw.amp / 2 + sw.back),
    endRel = (sw.dir * sw.amp) / 2;
  let rel, hd, kb, ph, q, prog;
  if (p < Wn) {
    ph = 0;
    q = mIO(p / Wn);
    prog = 0;
    rel = mlerp(A.idle, startRel, q);
    hd = mlerp(IDLE_HR, A.pull, q);
    kb = mlerp(IDLE_K, 1, q);
  } else if (p < 1 - Rc) {
    ph = 1;
    q = (p - Wn) / S;
    prog = mOut3(q);
    rel = mlerp(startRel, endRel, prog);
    hd = mlerp(A.pull, sw.hmax, prog);
    kb = 1;
  } else {
    ph = 2;
    q = mIO((p - (1 - Rc)) / Rc);
    prog = 1;
    rel = mlerp(endRel, A.idle, q);
    hd = mlerp(sw.hmax, IDLE_HR, q);
    kb = mlerp(1, IDLE_K, q);
  }
  // al recuperar, el arma vuelve a seguir al cursor
  const base = sw.a0 + nrm(P.face - sw.a0) * (ph == 2 ? q : 0),
    wa = base + rel,
    hdir = A.fam == "sweep" ? wa : base,
    env = ph == 0 ? q : ph == 1 ? 1 : 1 - q,
    lat = A.lat ? sw.dir * A.lat * env : 0,
    bump = A.slam && ph == 1 ? 1 + 0.12 * Math.sin(Math.PI * q) : 1;
  return {
    hx: Math.cos(hdir) * hd - Math.sin(hdir) * lat,
    hy: Math.sin(hdir) * hd + Math.cos(hdir) * lat,
    ang: wa,
    k: kb * sw.kS * bump,
    sy: A.edge ? (A.edge === sw.dir ? 1 : -1) : 1,
    ph,
    prog,
    active: ph == 1 && prog >= sw.qa,
  };
}

/** Comprueba qué enemigos toca el sprite en esta pose y les aplica el golpe (una vez por golpe). */
function swingStrike(sw, pose) {
  const A = sw.art,
    rec = A.spr && WSPR[A.spr],
    circ = rec && rec.ready && rec.circ ? rec.circ : FALLBACK_CIRC,
    s = A.s * pose.k,
    ca = Math.cos(pose.ang),
    sa = Math.sin(pose.ang),
    wx = P.x + pose.hx,
    wy = P.y + pose.hy,
    rc = 1.45 * s;
  for (const e of E) {
    if (e.hp <= 0 || sw.seen.has(e)) continue;
    if (Math.abs(e.x - P.x) > sw.reach + e.r || Math.abs(e.y - P.y) > sw.reach + e.r) continue;
    for (const c of circ) {
      if (c.u < A.gu - 2.5) continue; // el pomo o la contera, detrás de la mano, no hieren
      const lu = (c.u - A.gu) * s,
        lv = c.v * s * pose.sy,
        px = wx + ca * lu - sa * lv,
        py = wy + sa * lu + ca * lv;
      if (Math.hypot(px - e.x, py - e.y) < e.r + rc) {
        swingHitEnemy(sw, e, px, py);
        break;
      }
    }
  }
}

function swingHitEnemy(sw, e, px, py) {
  const w = sw.w;
  sw.seen.add(e);
  hit(e, wd(sw.c ? 1.5 : 1), "p", {
    kb: w.stun ? 300 : 150,
    a: ang(P, e),
    stun: w.stun ? 0.8 : 0,
    fx: w.bleed ? { bleed: 1 + (Math.random() < P.cc ? 1 : 0) } : null,
  });
  for (let i = 0; i < (LOW ? 2 : 4); i++)
    FX.push({ k: "p", x: px, y: py, vx: rnd(-160, 160), vy: rnd(-160, 160), t: 0.22, m: 0.22, c: sw.fx.c });
  if (sw.art.shake) shake = Math.max(shake, sw.art.shake);
}

/** Guarda un punto de la estela (segmento interior-exterior del arma y una copia fantasma del sprite). */
function trailSample(sw, pose, t) {
  const A = sw.art,
    s = A.s * pose.k,
    L = (A.tu - A.gu) * s,
    ca = Math.cos(pose.ang),
    sa = Math.sin(pose.ang),
    wx = P.x + pose.hx,
    wy = P.y + pose.hy,
    at = (f, lv) => [wx + ca * f * L - sa * lv, wy + sa * f * L + ca * lv],
    inner = at(A.fam == "jab" ? 0.45 : A.fam == "thrust" ? 0.3 : 0.38, 0),
    outer = at(1.04, 0);
  sw.fx.pts.push({
    t,
    x1: inner[0],
    y1: inner[1],
    x2: outer[0],
    y2: outer[1],
    gx: wx,
    gy: wy,
    ang: pose.ang,
    k: pose.k,
    sy: pose.sy,
  });
}

/** Avanza el golpe en curso; se llama una vez por fotograma desde upP. */
function swingTick(dt) {
  const sw = SW;
  if (!sw) return;
  if (sw.owner !== P || G.st != "play") {
    SW = null;
    return;
  }
  const t0 = sw.t,
    t1 = Math.min(sw.dur, t0 + dt),
    N = sw.art.fam == "sweep" ? 3 : 4; // subpasos: evitan que un golpe rápido atraviese enemigos
  for (let i = 1; i <= N; i++) {
    const t = t0 + ((t1 - t0) * i) / N,
      pose = swingPose(sw, t);
    if (!pose.active) continue;
    swingStrike(sw, pose);
    trailSample(sw, pose, t);
  }
  sw.t = t1;
  if (sw.art.slam && !sw.ring && t1 / sw.dur >= 1 - sw.art.r) {
    sw.ring = true;
    const pose = swingPose(sw, t1),
      L = (sw.art.tu - sw.art.gu) * sw.art.s * pose.k;
    FX.push({
      k: "ring",
      x: P.x + pose.hx + Math.cos(pose.ang) * L,
      y: P.y + pose.hy + Math.sin(pose.ang) * L,
      r: 38,
      t: 0.25,
      m: 0.25,
      c: sw.art.trail,
    });
  }
  if (t1 >= sw.dur) SW = null;
}

/* ======================================================================
 * src/js/combat/ranged-hold.js
 * Estado del arma a distancia en la mano: retroceso al disparar, si está
 * "cargada" (lista para disparar) y desde dónde sale el proyectil.
 *
 * Define:
 * RK, RK_TIME, rangedKick, rangedTick, rangedReady, rangedMuzzle, projFor
 * ====================================================================== */

let RK = 0; // tiempo restante de retroceso tras el último disparo
const RK_TIME = 0.14;

/** Llamar al disparar: el arma retrocede (o se adelanta, en los báculos) y se descarga. */
function rangedKick() {
  RK = RK_TIME;
}
function rangedTick(dt) {
  if (RK > 0) RK = Math.max(0, RK - dt);
}

/** ¿Está el arma lista para disparar? (enfriamiento cumplido, sin recargar y con maná). */
function rangedReady() {
  const w = P.w;
  return P.acd <= 0 && !(P.rl > 0) && (w.s != "g" || P.mp >= w.mp);
}

/** Distancia desde el centro del jugador hasta la boca del arma (sale de aquí el proyectil). */
function rangedMuzzle(w) {
  const A = RANGED_ART[w.n];
  return A ? A.hd + (A.tu - A.gu) * A.s : 14;
}

/** Sprite de flecha según el arma: la ballesta dispara virotes. `charged` = versión encendida. */
function projFor(charged) {
  const bolt = P.w.n == "Ballesta";
  return charged ? (bolt ? "virote_cargado" : "flecha_cargada") : bolt ? "virote" : "flecha";
}

/* ======================================================================
 * src/js/combat/player-actions.js
 * Acciones de combate del jugador: parry, daño recibido, esquivar, disparar, atacar y habilidades Q/E/clic derecho.
 *
 * Define:
 * parryFx, parryProj, hurtP, die, dodge, shoot, atk, AB, ab
 * ====================================================================== */

function parryFx() {
  cnt("pf");
  chk();
  P.pcd = 0.9;
  P.inv = 0.25;
  G.hs = 0.07;
  FX.push(
    { k: "ring", x: P.x, y: P.y, r: 60, t: 0.25, m: 0.25, c: "#fff" },
    { k: "ring", x: P.x, y: P.y, r: 34, t: 0.2, m: 0.2, c: "#ffd34a" },
  );
  snd(1300, 0.12, "triangle", 0.07);
  snd(1900, 0.2, "sine", 0.05);
}
function parryProj(p) {
  cnt("pj");
  let b = null,
    bd = 1e9;
  for (const q of E)
    if (q.hp > 0 && q.t != "decoy" && q.t != "orb" && dist(p, q) < bd) {
      bd = dist(p, q);
      b = q;
    }
  parryFx();
  const a = b ? ang(p, b) : Math.atan2(-p.vy, -p.vx),
    sp = Math.max(420, Math.hypot(p.vx, p.vy) * 1.3);
  Object.assign(p, {
    rf: 1,
    f: "p",
    t: "p",
    d: p.d * 2,
    h: new Set(),
    pc: 0,
    l: 2,
    hm: 0,
    cv: 0,
    sf: null,
    vx: Math.cos(a) * sp,
    vy: Math.sin(a) * sp,
    c: "#fff",
  });
}
function hurtP(d, src) {
  if (P.inv > 0 || (P.dash && P.dash.inv)) return;
  d *= 1 - P.arm / (P.arm + 100);
  if (src && src.st && src.st.curse > 0) d *= 0.75;
  const be = EBI[(G.d - 1) % 8];
  if (be && P.res[be]) d *= 1 - P.res[be];
  if (P.g) {
    if (P.gt < 0.22 && src && !(P.pcd > 0)) {
      parryFx();
      apply(src, { stun: 1.2 });
      if (src.hp > 0) hit(src, (src.dmg || d) * 2, "p", { nl: 1 });
      return;
    }
    d *= P.gr ? 0.2 : 0.35;
  }
  if (P.sh > 0) {
    const a = Math.min(P.sh, d);
    P.sh -= a;
    d -= a;
  }
  P.hp -= d;
  if (G.train && P.hp < 1) P.hp = P.mhp;
  G.hurt = 1;
  P.inv = 0.5;
  P.fl = 0.15;
  shake = Math.max(shake, 6);
  nm(P.x, P.y - 20, d, "#f66");
  snd(110, 0.12, "sawtooth", 0.06);
  if (P.hp <= 0) die();
}
function die(q) {
  if (G.st != "play") return;
  if (!q && U("rev") && !G.revd && !G.arena) {
    G.revd = 1;
    P.hp = P.mhp * 0.5;
    P.inv = 2.5;
    flash("¡Renaces!");
    FX.push({ k: "ring", x: P.x, y: P.y, r: 120, t: 0.5, m: 0.5, c: "#ffd34a" });
    return;
  }
  G.st = "over";
  cnt("dt");
  chk();
  const s = G.arena ? 0 : Math.floor(P.gold / 2);
  if (!G.arena) {
    S.best = Math.max(S.best, G.d);
    S.souls += s;
    G.nu = checkUnlocks();
    save();
  }
  show(
    `<h1>${q ? "EXPEDICIÓN ABANDONADA" : "HAS CAÍDO"}</h1><p>Profundidad ${G.d} · Nivel ${P.lv} · ${G.kills} enemigos</p>${G.nu && G.nu.length ? "<p>¡Cartas nuevas: " + G.nu.join(", ") + "!</p>" : ""}<p>Pierdes tu equipo y reliquias. Conviertes ${s} oro en almas (total ${S.souls}).</p>`,
    [{ t: "Volver a la zona segura", nc: 1, f: menu }],
  );
}
function dodge() {
  if (P.dcd > 0 || P.dash) return;
  const ix = (K[KY.right] ? 1 : 0) - (K[KY.left] ? 1 : 0),
    iy = (K[KY.down] ? 1 : 0) - (K[KY.up] ? 1 : 0);
  let a = ix || iy ? Math.atan2(iy, ix) : P.face;
  P.dash = { t: 0.17, vx: Math.cos(a) * 540, vy: Math.sin(a) * 540, inv: 1 };
  P.inv = 0.3;
  P.dcd = (0.8 * (1 - 0.1 * (P.tal.refl || 0))) / (1 + 0.01 * P.a.agi);
  snd(400, 0.1, "triangle");
  FX.push({ k: "ring", x: P.x, y: P.y, r: 18, t: 0.2, m: 0.2, c: "#9cf" });
}
function shoot(a, sp, d, t, o = {}) {
  const sd = a + (o.sp ? rnd(-o.sp, o.sp) : 0),
    mz = Math.min(30, o.mz ?? rangedMuzzle(P.w)); // sale de la boca del arma (con tope para no nacer dentro de un muro)
  PR.push(
    Object.assign(
      {
        x: P.x + Math.cos(a) * mz,
        y: P.y + Math.sin(a) * mz,
        vx: Math.cos(sd) * sp,
        vy: Math.sin(sd) * sp,
        s: sp,
        r: o.r || 5,
        d,
        t,
        l: o.l || 1.1,
        l0: o.l || 1.1,
        pc: o.pierce || 0,
        bn: o.bounce || 0,
        f: "p",
        h: new Set(),
        c: o.c || "#ffe9a0",
      },
      o,
    ),
  );
}
function atk() {
  const w = P.w,
    a = P.face;
  P.at = w.s == "m" ? 0.2 : 0.12;
  if (w.s == "m") {
    // el daño lo aplica el propio sprite al moverse (ver combat/melee-swing.js)
    const c = (P.cb = (P.cb + 1) % 3) == 2;
    P.acd = w.cd / P.as;
    startSwing(w, a, c, P.acd);
    snd(w.n == "Martillo" ? 90 : 230, 0.08, "sawtooth");
  } else if (w.s == "r") {
    if (P.rl > 0) return;
    if (w.mag && (P.am = (P.am ?? w.mag) - 1) <= 0) {
      P.rl = w.rt || 1.6;
      P.am = w.mag;
      flash("Recargando...");
    }
    const art = RANGED_ART[w.n],
      o = {
        pierce: w.pierce,
        bounce: w.bounce,
        ret: w.ret,
        sp: w.spread,
        fx: w.fx ? { poison: 3 } : null,
        c: w.ret ? "#ccc" : "#fff",
        spr: art && art.proj,
      };
    if (w.n == "Chakram") o.r = 11; // el radio de colisión sigue al tamaño del sprite
    shoot(a, w.sp, wd(), "p", o);
    rangedKick();
    P.acd = w.cd / P.as;
    snd(w.n == "Ballesta" ? 140 : 520, 0.07, "square");
  } else {
    if (P.mp < w.mp) return;
    P.mp -= w.mp;
    const el = w.el,
      f =
        el == "fire"
          ? { burn: 3 }
          : el == "ice"
            ? { slow: 2.5 }
            : el == "poison"
              ? { poison: 5 }
              : el == "water"
                ? { wet: 5 }
                : null;
    shoot(a, w.sp, wd(), "m", {
      pierce: w.pierce,
      fx: f,
      ex: el == "fire" ? 55 : 0,
      ch: el == "light" ? 2 : 0,
      c: EC[el],
      r: 7,
      spr: RANGED_ART[w.n] && RANGED_ART[w.n].proj,
    });
    rangedKick();
    P.acd = w.cd / P.as;
    snd(700, 0.08, "sine");
  }
}
const AB = {
  m: [
    { cd: 6, f: () => area(P.x, P.y, 115, wd(1.8), "p", { c: "#f93" }) },
    {
      cd: 8,
      f: () => {
        const a = P.face;
        P.dash = {
          t: 0.25,
          vx: Math.cos(a) * 620,
          vy: Math.sin(a) * 620,
          inv: 1,
          end: () => area(P.x, P.y, 90, wd(2.2), "p", { stun: 1, c: "#fc6" }),
        };
      },
    },
    {},
  ],
  r: [
    {
      cd: 6,
      f: () => {
        for (let i = -2; i <= 2; i++)
          shoot(P.face + i * 0.13, P.w.sp || 640, wd(0.7), "p", { c: "#fff", spr: projFor(false) });
      },
    },
    {
      cd: 7,
      f: () => shoot(P.face, 560, wd(1.5), "p", { ex: 95, c: "#fa4", r: 7, spr: projFor(true) }),
    },
    {
      cd: 5,
      f: () =>
        shoot(P.face, 600, wd(1.2), "p", {
          pierce: 3,
          fx: { poison: 5 },
          c: "#6e4",
          r: 6,
          spr: projFor(false),
          gl: "#6e4",
        }),
    },
  ],
  g: [
    {
      cd: 4,
      mp: 22,
      f: () =>
        shoot(P.face, 450, wd(2), "m", {
          ex: 100,
          fx: { burn: 3 },
          c: "#f60",
          r: 9,
          spr: "magia_ignea",
        }),
    },
    {
      cd: 8,
      mp: 25,
      f: () => area(P.x, P.y, 150, wd(0.8), "m", { fx: { slow: 3 }, c: "#9fe8ff", stun: 0.5 }),
    },
    {
      cd: 2.5,
      mp: 18,
      f: () => shoot(P.face, 1000, wd(1.1), "m", { ch: 4, c: "#fff27a", spr: "magia_tormenta" }),
    },
  ],
};
function ab(i) {
  const s = P.w.s,
    A = AB[s][i];
  if (!A.f || P.cd[i] > 0 || P.dash) return;
  if (A.mp && P.mp < A.mp) return;
  P.mp -= A.mp || 0;
  P.cd[i] = A.cd * (1 - 0.01 * U("cdr"));
  A.f();
  if (s != "m") rangedKick();
  snd(300, 0.15, "triangle");
}

/* ======================================================================
 * src/js/game/player-update.js
 * Actualización por fotograma del jugador (upP) y cambio de sala (go).
 *
 * Define:
 * upP, go
 * ====================================================================== */

// ===== ACTUALIZACIÓN =====
function upP(dt) {
  ST();
  if (TC.ah) tcAim();
  P.invc -= dt;
  const sg = P.invc > 0 ? -1 : 1,
    ix = sg * ((K[KY.right] ? 1 : 0) - (K[KY.left] ? 1 : 0)),
    iy = sg * ((K[KY.down] ? 1 : 0) - (K[KY.up] ? 1 : 0)),
    il = Math.hypot(ix, iy) || 1;
  P.face = Math.atan2(M.y - P.y, M.x - P.x);
  P.g = M.r && P.w.s == "m";
  if (!P.g && P.pg0) P.pcd = Math.max(P.pcd, 0.45);
  P.pg0 = P.g;
  P.pcd -= dt;
  P.gt = P.g ? P.gt + dt : 0;
  const sp = P.spd * (P.g ? 0.5 : 1) * (P.slow > 0 ? 0.55 : 1);
  if (P.dash) {
    P.x += P.dash.vx * dt;
    P.y += P.dash.vy * dt;
    P.dash.t -= dt;
    if (P.dash.t <= 0) {
      const e = P.dash.end;
      P.dash = null;
      e && e();
    }
  } else {
    const k = Math.min(1, dt * 12);
    P.vx += ((ix / il) * sp - P.vx) * k;
    P.vy += ((iy / il) * sp - P.vy) * k;
    P.x += P.vx * dt;
    P.y += P.vy * dt;
  }
  col(P);
  P.inv -= dt;
  P.acd -= dt;
  P.dcd -= dt;
  P.fl -= dt;
  P.bt -= dt;
  P.rl -= dt;
  P.at -= dt;
  P.slow -= dt;
  spl(dt);
  P.cd = P.cd.map((c) => c - dt);
  P.mp = Math.min(P.mmp, P.mp + P.mr * dt);
  P.hp = Math.min(P.mhp, P.hp + 0.1 * U("rec") * dt);
  swingTick(dt);
  rangedTick(dt);
  if (M.d && P.acd <= 0 && !P.dash && !G.ov) atk();
  if (K[KY.q]) ab(0);
  if (K[KY.e]) ab(1);
  if (M.r && P.w.s != "m") ab(2);
  if (K[KY.r]) classAction(dt);
  if (P.cls == "g") for (let i = 0; i < 4; i++) if (K[KY["c" + (i + 1)]]) castCard(i);
  const r = RM_;
  if (r.cl)
    for (const k in r.nb) {
      const L = Math.abs([P.x, P.y, P.x, P.y][k] - 480 + (k % 2 ? -180 : 0));
      if (k == 0 && P.y <= P.r + 52 && Math.abs(P.x - 480) < 50) return go(r.nb[0], 2);
      if (k == 2 && P.y >= 548 - P.r && Math.abs(P.x - 480) < 50) return go(r.nb[2], 0);
      if (k == 1 && P.x >= 908 - P.r && Math.abs(P.y - 300) < 50) return go(r.nb[1], 3);
      if (k == 3 && P.x <= P.r + 52 && Math.abs(P.y - 300) < 50) return go(r.nb[3], 1);
    }
}
function go(i, f) {
  enter(i, f);
}

// ===== VENTANAS DE TARJETAS (menús, nivel, cofres, mercader, santuarios, sucesos) =====
const ATI = { str: "💪", dex: "🎯", int: "📘", vit: "❤️", agi: "👟", luk: "🍀" },
  ATN = {
    str: "Fuerza",
    dex: "Destreza",
    int: "Inteligencia",
    vit: "Vitalidad",
    agi: "Agilidad",
    luk: "Suerte",
  },
  ATD = {
    str: "Daño de todas las armas cuerpo a cuerpo.",
    dex: "Crítico y daño de armas a distancia.",
    int: "Potencia de hechizos y maná.",
    vit: "Vida máxima y armadura.",
    agi: "Velocidad de movimiento y de ataque.",
    luk: "Crítico y botín.",
  };
const TD = {
  shield: "Absorbe daño (15 maná).",
  trap: "Trampa que congela al pisarla.",
  summon: "Espíritu aliado que dispara.",
  beam: "Rayo continuo (mantener R).",
  cone: "Cono de fuego con quemadura.",
};
function show(h, btns, keep) {
  ov.style.display = "flex";
  ov.innerHTML = h;
  G.ov = 1;
  const cs = btns.filter((b) => !b.nc && !b.x).length >= 3,
    row = document.createElement("div");
  row.style.cssText = "display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:96%";
  ov.appendChild(row);
  const bw = document.createElement("div");
  bw.style.cssText = "display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:96%";
  ov.appendChild(bw);
  btns.forEach((b) => {
    const act = () => {
      if (b.nc) {
        b.f();
        return;
      }
      if (b.c && P.gold < b.c) {
        flash("Oro insuficiente");
        return;
      }
      if (b.c) P.gold -= b.c;
      if (b.f) b.f();
      if (!keep || b.x) hide();
      else if (b.re) b.re();
    };
    if (b.i || b.c !== undefined || (cs && !b.nc && !b.x)) {
      const p = (b.t || "").split(": "),
        ic =
          b.i ||
          (/vida|sanaci|poci/i.test(b.t)
            ? "🧪"
            : /dañ|poder/i.test(b.t)
              ? "⚔️"
              : /reliquia/i.test(b.t)
                ? "💎"
                : /pacto|sangre/i.test(b.t)
                  ? "🩸"
                  : /oro/i.test(b.t)
                    ? "🪙"
                    : "📜"),
        no = b.c && P.gold < b.c;
      row.appendChild(
        card(
          {
            i: ic,
            n: b.n || p[0],
            tp: b.tp || "Opción",
            r: b.r || 0,
            d: b.d || p.slice(1).join(": "),
            stx: b.stx,
            st: b.st,
            req: b.req,
          },
          [[b.c ? `${b.c} 🪙` : "Elegir", act, no || b.dis]],
          b.cp,
        ),
      );
    } else {
      const e = document.createElement("button");
      e.innerHTML = b.t;
      e.onclick = act;
      bw.appendChild(e);
    }
  });
}
function loot2(n) {
  const o = [],
    q = Math.random() + G.d * 0.03 + P.a.luk * 0.01,
    ra = Math.min(rcap(), q > 1.1 ? 3 : q > 0.85 ? 2 : q > 0.55 ? 1 : 0);
  if (Math.random() < 0.3) {
    const k = pick(Object.keys(TM));
    o.push({
      i: "📖",
      n: "Tomo: " + TM[k],
      tp: "Tomo mágico",
      r: ra,
      d: TD[k],
      stx: "Se lanza con R",
      f: () => {
        P.tm = k;
      },
    });
  } else {
    const w = mk((Math.random() * WP.length) | 0, ra);
    o.push({
      i: WI[w.n] || "⚔️",
      n: w.n,
      tp: { m: "Arma cuerpo a cuerpo", r: "Arma a distancia", g: "Arma mágica" }[w.s],
      r: ra,
      d: w.bleed
        ? "Cada golpe aplica hemorragia acumulable (máx. 8); los críticos añaden una acumulación extra."
        : w.el == "water"
          ? "Empapa al objetivo: la electricidad le hace +60% de daño."
          : "Cambia tu estilo de combate.",
      stx: `Daño ×${(w.dmg * w.rm).toFixed(2)} · Crít ${Math.round(w.crit * 100)}% · ${w.sc.toUpperCase()}`,
      cp: `${P.w.n} → ${w.n}`,
      f: () => {
        P.w = w;
        ST();
        P.am = undefined;
        P.rl = 0;
      },
    });
  }
  const it = Object.assign({}, pickIT(), { id: Date.now() + Math.random() });
  o.push(
    Object.assign({}, it, {
      tp: SLOT[it.s],
      cp: cmp(it),
      f: () => {
        P.bag.push(it);
      },
    }),
  );
  const ix = [...RL.keys()].sort(() => Math.random() - 0.5);
  for (let i = 0; i < n - 2; i++) {
    const R = RL[ix[i]];
    o.push({
      i: "💎",
      n: R[0],
      tp: "Reliquia",
      r: Math.min(rcap(), 1 + (i & 1)),
      d: R[1],
      f: () => {
        R[2](P);
        P.relics.push(R[0]);
        ST();
      },
    });
  }
  return o;
}

/* ======================================================================
 * src/js/ui/inventory.js
 * Comparación de objetos, tarjeta de objeto y ventana de inventario.
 *
 * Define:
 * cmp, card, inv
 * ====================================================================== */

function cmp(it) {
  const o = P.eq[it.s]?.st || {};
  return [...new Set([...Object.keys(it.st), ...Object.keys(o)])]
    .map((k) => {
      const d = Math.round(((it.st[k] || 0) - (o[k] || 0)) * 100) / 100;
      return d
        ? `<span style="color:${d > 0 ? "#8c8" : "#e66"}">${d > 0 ? "+" : ""}${fv(k, d)} ${N[k]}</span>`
        : "";
    })
    .join(" ");
}
function card(it, btns, cp) {
  const c = RC[it.r || 0],
    d = document.createElement("div");
  d.style.cssText = `border:2px solid ${c};border-radius:8px;padding:8px;width:165px;text-align:left;background:#1a1722;font-size:12px`;
  d.innerHTML = `<div style="font-size:26px">${it.i}</div><b style="color:${c}">${it.n}</b><br><small>${it.tp || SLOT[it.s]} · ${RN[it.r || 0]}</small><p style="margin:4px 0;font-size:11px">${it.d || ""}</p><small>${it.stx || stT(it.st || {})}</small>${
    it.req
      ? `<br><small style="color:${meets(it) ? "#8c8" : "#e66"}">Req: ${Object.entries(it.req)
          .map(([k, v]) => k.toUpperCase() + " " + v)
          .join(", ")}${meets(it) ? "" : " (no cumples)"}</small>`
      : ""
  }${cp ? `<br><small>vs equipado: ${cp}</small>` : ""}<br>`;
  btns.forEach((b) => {
    const e = document.createElement("button");
    e.textContent = b[0];
    e.disabled = !!b[2];
    e.style.cssText = "padding:3px 8px;margin:4px 3px 0 0;font-size:11px";
    e.onclick = b[1];
    d.appendChild(e);
  });
  return d;
}
function inv(f) {
  if (G.st != "play" || (G.ov && !G.pz)) return;
  if (G.iv && !f) {
    hide();
    return;
  }
  G.pz = 1;
  G.iv = 1;
  G.ov = 1;
  ov.style.display = "flex";
  const FL = G.ifl || "",
    SO = G.iso || "x",
    PS = 6,
    mkb = (t, fn, on) => {
      const e = document.createElement("button");
      e.textContent = t;
      e.style.cssText =
        "padding:4px 9px;font-size:12px;" + (on ? "background:#4a3d60;border-color:#fff" : "");
      e.onclick = fn;
      return e;
    },
    row = () => {
      const r = document.createElement("div");
      r.style.cssText = "display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:96%";
      ov.appendChild(r);
      return r;
    };
  ov.innerHTML = `<h2>Inventario \u00b7 Oro ${P.gold}</h2><p>Nv ${P.lv} \u00b7 FUE ${P.a.str} DES ${P.a.dex} INT ${P.a.int} VIT ${P.a.vit} AGI ${P.a.agi} SUE ${P.a.luk} \u00b7 Vida ${P.mhp} \u00b7 Man\u00e1 ${P.mmp} \u00b7 Armadura ${P.arm.toFixed(0)} \u00b7 Cr\u00edtico ${(P.cc * 100).toFixed(0)}% \u00b7 Da\u00f1o \u00d7${(P.dm * P.edm).toFixed(2)}</p>`;
  let r = row();
  r.appendChild(mkb("Cerrar (I)", hide));
  ov.insertAdjacentHTML("beforeend", "<b>Equipado</b>");
  r = row();
  const w = P.w;
  r.appendChild(
    card(
      {
        i: WI[w.n] || "\u2694\ufe0f",
        n: w.n,
        s: "w",
        r: RN.indexOf(w.rn),
        d: `Da\u00f1o \u00d7${w.dmg}, cr\u00edtico ${Math.round(w.crit * 100)}%, escala con ${w.sc.toUpperCase()}`,
        st: {},
      },
      [],
    ),
  );
  for (const s in P.eq)
    r.appendChild(
      card(P.eq[s], [
        [
          "Desequipar",
          () => {
            P.bag.push(P.eq[s]);
            delete P.eq[s];
            ST();
            inv(1);
          },
        ],
      ]),
    );
  const L = P.bag
      .filter((it) => !FL || it.s == FL)
      .sort(
        SO == "r"
          ? (a, b) => (b.r || 0) - (a.r || 0) || a.n.localeCompare(b.n)
          : SO == "n"
            ? (a, b) => a.n.localeCompare(b.n)
            : SO == "s"
              ? (a, b) => a.s.localeCompare(b.s) || (b.r || 0) - (a.r || 0)
              : () => 0,
      ),
    pg = Math.min(G.ipg || 0, Math.max(0, Math.ceil(L.length / PS) - 1));
  ov.insertAdjacentHTML("beforeend", `<b>Mochila (${L.length}/${P.bag.length})</b>`);
  r = row();
  [
    ["", "Todo"],
    ...Object.keys(SLOT)
      .filter((k) => k != "w")
      .map((k) => [k, SLOT[k]]),
  ].forEach(([k, n]) =>
    r.appendChild(
      mkb(
        n,
        () => {
          G.ifl = k;
          G.ipg = 0;
          inv(1);
        },
        FL == k,
      ),
    ),
  );
  r = row();
  [
    ["x", "Recientes"],
    ["r", "Rareza"],
    ["n", "Nombre"],
    ["s", "Ranura"],
  ].forEach(([k, n]) =>
    r.appendChild(
      mkb(
        "Orden: " + n,
        () => {
          G.iso = k;
          G.ipg = 0;
          inv(1);
        },
        SO == k,
      ),
    ),
  );
  r = row();
  L.slice(pg * PS, pg * PS + PS).forEach((it) =>
    r.appendChild(
      card(
        it,
        [
          [
            "Equipar",
            () => {
              const i = P.bag.indexOf(it),
                o = P.eq[it.s];
              if (i < 0) return;
              P.bag.splice(i, 1);
              if (o) P.bag.push(o);
              P.eq[it.s] = it;
              ST();
              inv(1);
            },
            !meets(it),
          ],
          [
            "Descartar",
            () => {
              const i = P.bag.indexOf(it);
              if (i >= 0) P.bag.splice(i, 1);
              inv(1);
            },
          ],
        ],
        cmp(it),
      ),
    ),
  );
  if (L.length > PS) {
    r = row();
    const pv = mkb(
      "\u2039 Anterior",
      () => {
        G.ipg = pg - 1;
        inv(1);
      },
      0,
    );
    pv.disabled = pg <= 0;
    r.appendChild(pv);
    const nx = mkb(
      "Siguiente \u203a",
      () => {
        G.ipg = pg + 1;
        inv(1);
      },
      0,
    );
    nx.disabled = (pg + 1) * PS >= L.length;
    r.appendChild(nx);
    ov.insertAdjacentHTML(
      "beforeend",
      `<small>P\u00e1gina ${pg + 1}/${Math.ceil(L.length / PS)}</small>`,
    );
  }
}

/* ======================================================================
 * src/js/game/class-actions.js
 * Acción de clase (tecla R): escudo, trampa, invocación, rayo, cono, etc. y lógica de trampas/aliados.
 *
 * Define:
 * TR, AL, TM, classAction, spl
 * ====================================================================== */

let TR = [],
  AL = [];
const TM = {
  shield: "Escudo arcano",
  trap: "Trampa de escarcha",
  summon: "Invocar espíritu",
  beam: "Rayo canalizado",
  cone: "Aliento ígneo",
};
function classAction(dt) {
  const s = P.tm;
  if (s == "beam") {
    if (P.mp > 0) {
      P.mp -= 25 * dt;
      P.bd = (P.bd || 0) - dt;
      if (P.bd <= 0) {
        P.bd = 0.12;
        const a = P.face;
        FX.push({
          k: "line",
          x: P.x,
          y: P.y,
          x2: P.x + Math.cos(a) * 380,
          y2: P.y + Math.sin(a) * 380,
          t: 0.12,
          m: 0.12,
        });
        for (const e of E)
          if (e.hp > 0) {
            const px = e.x - P.x,
              py = e.y - P.y,
              u = cl(px * Math.cos(a) + py * Math.sin(a), 0, 380);
            if (Math.hypot(px - Math.cos(a) * u, py - Math.sin(a) * u) < e.r + 8)
              hit(e, wd(0.35), "m", { fx: { slow: 0.5 } });
          }
      }
    }
    return;
  }
  if (P.cd[3] > 0) return;
  const w = P.w.s;
  if (s == "shield") {
    if (P.mp < 20) return;
    P.mp -= 20;
    P.sh = 30 + P.a.int * 8;
    P.cd[3] = 10;
  } else if (s == "trap") {
    if (P.mp < 15) return;
    P.mp -= 15;
    P.cd[3] = 4;
    TR.push({ x: M.x, y: M.y, t: 15 });
  } else if (s == "summon") {
    if (P.mp < 30) return;
    P.mp -= 30;
    P.cd[3] = 14;
    AL.push({ x: P.x, y: P.y, t: 15, c: 0 });
  } else if (s == "cone") {
    if (P.mp < 18) return;
    P.mp -= 18;
    P.cd[3] = 5;
    FX.push({ k: "arc", x: P.x, y: P.y, a: P.face, r: 150, w: 1.2, t: 0.25, m: 0.25 });
    for (const e of E)
      if (e.hp > 0 && dist(P, e) < 150 + e.r && Math.abs(nrm(ang(P, e) - P.face)) < 0.6)
        hit(e, wd(1.6), "m", { fx: { burn: 3 } });
  } else if (w == "m" && P.w.bleed) {
    P.cd[3] = 8;
    for (const e of E)
      if (e.hp > 0 && e.st.bleedN > 0 && dist(P, e) < 300) {
        const n = e.st.bleedN;
        e.st.bleedN = 0;
        e.st.bleed = 0;
        hit(e, wd(0.6) * n, "p", { a: ang(P, e), kb: 100 });
      }
    flash("¡Detonación de hemorragia!");
  } else if (w == "m") {
    P.bt = 6;
    P.cd[3] = 14;
    P.sh = 20 + P.a.vit * 4;
    flash("¡Grito de guerra!");
  } else if (w == "r") {
    P.cd = P.cd.map((c, i) => (i < 3 ? 0 : c));
    P.cd[3] = 18;
    flash("Recarga ágil");
  } else {
    P.mp = Math.min(P.mmp, P.mp + P.mmp * 0.4);
    P.cd[3] = 12;
    flash("Canalizas maná");
  }
}
function spl(dt) {
  zn(dt);
  P.stcd -= dt;
  for (const t of TR) {
    t.t -= dt;
    for (const e of E)
      if (e.hp > 0 && dist(t, e) < e.r + 30) {
        t.t = 0;
        area(t.x, t.y, 100, wd(1), "m", { fx: { slow: 3, stun: 1 }, c: "#9fe8ff" });
        break;
      }
  }
  TR = TR.filter((t) => t.t > 0);
  for (const a of AL) {
    a.t -= dt;
    a.c -= dt;
    const tg = E.filter((e) => e.hp > 0).sort((p, q) => dist(p, a) - dist(q, a))[0],
      d = ang(a, P);
    if (dist(a, P) > 70) {
      a.x += Math.cos(d) * 150 * dt;
      a.y += Math.sin(d) * 150 * dt;
    }
    if (tg && a.c <= 0) {
      a.c = 0.8;
      const g = ang(a, tg);
      PR.push({
        x: a.x,
        y: a.y,
        vx: Math.cos(g) * 500,
        vy: Math.sin(g) * 500,
        s: 500,
        r: 5,
        d: wd(0.5),
        t: "m",
        l: 1,
        l0: 1,
        pc: 0,
        bn: 0,
        f: "p",
        h: new Set(),
        c: "#8fe",
      });
    }
  }
  AL = AL.filter((a) => a.t > 0);
}

/* ======================================================================

 * Interacción con el entorno (tecla F / clic): puertas, cofres, mercader, santuarios.
 *
 * Define:
 * interact
 * ====================================================================== */

function interact() {
  if (G.st == "hub") {
    if (!G.ov) hubUse();
    return;
  }
  const r = RM_;
  if (G.ov || dist(P, { x: 480, y: 300 }) > 70) return;
  if (r.tp == "boss" && r.cl) {
    if (G.arena) {
      endPractice();
      return;
    }
    if (G.d % 10 == 0 && !r.vc) {
      r.vc = 1;
      vic();
      return;
    }
    G.d++;
    P.hp = Math.min(P.mhp, P.hp + P.mhp * 0.3);
    genLevel();
    enter(0, 4);
    flash("Profundidad " + G.d + " — " + G.bi[0]);
    S.best = Math.max(S.best, G.d);
    checkUnlocks();
    save();
    chk();
    return;
  }
  if (r.used) return;
  if (r.tp == "treasure") {
    r.used = 1;
    cnt("ch");
    if (r.sec) cnt("sc");
    chk();
    show(
      `<h2>${r.sec ? "Cámara secreta" : "Cofre antiguo"}</h2><p>Elige un tesoro</p>`,
      loot2(r.sec ? 4 : 3),
    );
  } else if (r.tp == "shrine") {
    r.used = 1;
    show("<h2>Santuario</h2><p>Un altar susurra...</p>", [
      { t: "Sanación completa", f: () => (P.hp = P.mhp) },
      { t: "Bendición: +10% daño", f: () => (P.dm *= 1.1) },
      {
        t: "Pacto: −20 vida máx., +3 a un atributo al azar",
        f: () => {
          P.bhp -= 20;
          P.hp = Math.min(P.hp, P.mhp - 20);
          P.a[pick(Object.keys(P.a))] += 3;
        },
      },
    ]);
  } else if (r.tp == "event") {
    r.used = 1;
    show("<h2>Suceso extraño</h2><p>Algo antiguo te observa...</p>", [
      {
        t: "Pozo de deseos: paga 25 oro → reliquia al azar",
        c: 25,
        f: () => {
          const q = pick(RL);
          q[2](P);
          P.relics.push(q[0]);
          ST();
        },
      },
      {
        t: "Altar de sangre: −25% vida → +60 oro y experiencia",
        f: () => {
          P.hp = Math.max(1, P.hp * 0.75);
          P.gold += 60;
          xp(30 + G.d * 8);
        },
      },
      {
        t: "Despertar la emboscada (botín mayor)",
        f: () => {
          r.cl = 0;
          r.st = 1;
          r.wv = 1;
          r.tp = "combat";
          wave(r);
          wave(r);
        },
      },

  } else if (r.tp == "shop") {

        },
        ...loot2(3).map((x, i) =>

/* ======================================================================

 * IA y actualización de enemigos normales.
 *
 * Define:
 * EID, slots, upE, eshot

let EID = 0;
// Agresividad ag (0..1 hasta d13): menos pausas (+60% cadencia), +25% velocidad, más ataques simultáneos. Desde d3 los cuerpo a cuerpo se reparten en un anillo alrededor del jugador (flanqueo).
function slots() {
  const m = E.filter(
      (q) => q.hp > 0 && q.al && q.sp <= 0 && q.t != "boss" && ET[q.t].ai == "melee",
    ),
    n = m.length;
  if (G.d < 3 || n < 2) {
    m.forEach((q) => (q.sl = null));
    return;
  }
  const k = G.d < 6 ? n >> 1 : n,
    a0 = Math.atan2(300 - P.y, 480 - P.x);
  m.sort((p, q) => p.id - q.id);
  m.forEach((q, i) => {
    if (i >= k) {
      q.sl = null;
      return;
    }
    const a = a0 + ((i + 0.5) * 2 * Math.PI) / k;
    q.sl = { x: cl(P.x + Math.cos(a) * 150, 90, 870), y: cl(P.y + Math.sin(a) * 150, 90, 510) };
  });
}
function upE(dt) {
  slots();
  const ag = Math.min(1, (G.d - 1) / 12);
  for (const e of E) {
    if (e.hp <= 0) continue;
    const T = ET[e.t];
    e.fl -= dt;
    e.cd -= dt * (1 + ag * 0.6);
    e.sh -= dt;
    e.tm += dt;
    if (e.sp > 0) {
      e.sp -= dt;
      continue;
    }
    for (const k of ["burn", "poison"]) {
      if (e.st[k] > 0) {
        e.st[k] -= dt;
        e.hp -= e.dot * dt;
        if (e.hp <= 0) {
          kill(e);
          break;
        }
      }
    }
    if (e.hp > 0 && e.st.bleed > 0) {
      e.st.bleed -= dt;
      e.hp -= e.bd * e.st.bleedN * dt;
      if (e.hp <= 0) kill(e);
    } else if (!(e.st.bleed > 0)) e.st.bleedN = 0;
    if (e.st.wet > 0) e.st.wet -= dt;
    for (const k of ["frac", "curse", "root"]) if (e.st[k] > 0) e.st[k] -= dt;
    if (e.hp > 0 && e.st.cor > 0) {
      e.hp -= e.cdm * e.st.cor * dt;
      e.st.cort -= dt;
      if (e.st.cort <= 0) {
        e.st.cor--;
        e.st.cort = 3;
      }
      if (e.hp <= 0) kill(e);
    }
    if (e.hp <= 0) continue;
    if (e.st.slow > 0) e.st.slow -= dt;
    e.x += e.vx * dt;
    e.y += e.vy * dt;
    const dc = Math.pow(0.01, dt);
    e.vx *= dc;
    e.vy *= dc;
    if (e.st.stun > 0) {
      e.st.stun -= dt;
      col(e);
      continue;
    }
    const dx = P.x - e.x,
      dy = P.y - e.y,
      d = Math.hypot(dx, dy) || 1,
      nx = dx / d,
      ny = dy / d,
      sp = T.sp * (e.sx || 1) * (e.st.slow > 0 ? 0.5 : 1) * (1 + ag * 0.25),
      mv = (vx, vy) => {
        if (e.st.root > 0) return;
        e.x += vx * dt;
        e.y += vy * dt;
      },
      near = T.r + P.r;
    const strike = (rg, dm) => {
      if (e.wind > 0) {
        e.wind -= dt;
        if (e.wind <= 0 && dist(e, P) < rg + near) hurtP(dm, e);
        if (e.wind <= 0 && e.mod == "vampírico") e.hp = Math.min(e.mhp, e.hp + dm * 0.5);
      } else if (d > near + rg - 14) {
        if (e.sl && d > 150 && los(e, e.sl)) {
          const q = Math.hypot(e.sl.x - e.x, e.sl.y - e.y) || 1;
          mv(((e.sl.x - e.x) / q) * sp, ((e.sl.y - e.y) / q) * sp);
        } else mv(nx * sp, ny * sp);
      } else if (e.cd <= 0) {
        if (E.filter((q) => q.wind > 0).length < 3 + ((ag * 3) | 0)) {
          e.wind = 0.5;
          e.cd = 1.5;
        } else e.cd = 0.5;
      }
    };
    if (!e.al) {
      if ((d < 340 && los(e, P)) || e.hp < e.mhp || e.t == "boss") e.al = 1;
      else {
        e.wt = (e.wt || 0) - dt;
        if (e.wt <= 0) {
          e.wt = rnd(1, 2.5);
          e.wa = rnd(0, 6.28);
        }
        mv(Math.cos(e.wa) * sp * 0.4, Math.sin(e.wa) * sp * 0.4);
        col(e);
        continue;
      }
    }
    if (e.t != "boss" && e.t != "decoy" && e.al && !e.lu) {
      if (los(e, P)) {
        e.lk = { x: P.x, y: P.y };
        e.nl = 0;
        e.iw = 0;
      } else {
        e.nl = (e.nl || 0) + dt;
        if (e.nl > 1.5 && e.lk) {
          const q = Math.hypot(e.lk.x - e.x, e.lk.y - e.y);
          if (q > 20) mv(((e.lk.x - e.x) / q) * sp, ((e.lk.y - e.y) / q) * sp);
          else e.iw = (e.iw || 0) + dt;
          if (e.iw > 2.5) {
            e.al = 0;
            e.iw = 0;
            e.nl = 0;
            e.lk = null;
          }
          col(e);
          continue;
        }
      }
    }
    if ((T.ai == "flank" || T.ai == "range" || T.ai == "cast" || T.ai == "leap") && !e.lu) {
      e.dgt -= dt;
      if (!(e.dgt > 0)) {
        const p = PR.find(
          (p) =>
            p.f == "p" &&
            Math.hypot(p.x - e.x, p.y - e.y) < 150 &&
            (e.x - p.x) * p.vx + (e.y - p.y) * p.vy > 0,
        );
        if (p) {
          e.dgt = 2.2;
          const m = Math.hypot(p.vx, p.vy) || 1;
          e.vx += (-p.vy / m) * e.dir * 380;
          e.vy += (p.vx / m) * e.dir * 380;
        }
      }
    }
    if (e.lu > 0) {
      e.lu -= dt;
      mv(e.lvx, e.lvy);
      if (d < near + 4 && !e.lh) {
        e.lh = 1;
        hurtP(e.dmg, e);
      }
      if (e.lu <= 0 && !e.nr) e.st.stun = 0.5;
    } else
      switch (T.ai) {
        case "melee":
          strike(24, e.dmg);
          break;
        case "flank":
          if (d > 100) mv((nx * 0.7 - ny * e.dir * 0.7) * sp, (ny * 0.7 + nx * e.dir * 0.7) * sp);
          if (e.cd <= 0 && d < 240) {
            e.lu = 0.22;
            e.lh = 0;
            e.lvx = nx * 400;
            e.lvy = ny * 400;
            e.cd = 1.8;
          }
          break;
        case "range":
          if (d < 200) mv(-nx * sp, -ny * sp);
          else if (d > 320) mv(nx * sp, ny * sp);
          else mv(-ny * e.dir * sp * 0.6, nx * e.dir * sp * 0.6);
          if (e.cd <= 0 && los(e, P)) {
            e.cd = 1.9;
            eshot(e, nx, ny, 290, e.dmg);
          } else if (e.cd <= 0) mv(-ny * e.dir * sp, nx * e.dir * sp);
          break;
        case "cast":
          if (d < 230) mv(-nx * sp, -ny * sp);
          else if (d > 300) mv(nx * sp, ny * sp);
          if (e.cd <= 0 && los(e, P)) {
            e.cd = 2.7;
            Z.push({ x: P.x, y: P.y, r: 55, t: 0.9, m: 0.9, d: e.dmg, c: "#a6f" });
          }
          break;
        case "bomb":
          mv(nx * sp, ny * sp);
          if (d < 60) {
            e.fuse = (e.fuse || 0.6) - dt;
            if (e.fuse <= 0) {
              e.hp = 0;
              Z.push({ x: e.x, y: e.y, r: 75, t: 0.01, d: e.dmg, c: "#fa4" });
              e.dead = 1;
            }
          }
          break;
        case "sum":
          if (d < 220) mv(-nx * sp, -ny * sp);
          if (e.cd <= 0 && E.length < 18) {
            e.cd = 5;
            spawn("grunt", e.x + 20, e.y + 20).minion = 1; // invocado: sin oro ni XP
          }
          break;
        case "shield": {
          const a = E.find((q) => q != e && q.hp > 0 && q.t != "guardian");
          if (a && dist(a, e) > 80)
            mv(((a.x - e.x) / dist(a, e)) * sp, ((a.y - e.y) / dist(a, e)) * sp);
          else if (d < 120) strike(24, e.dmg);
          if (e.cd <= 0) {
            e.cd = 3.5;
            for (const q of E) if (dist(q, e) < 170) q.sh = 3;
            FX.push({ k: "ring", x: e.x, y: e.y, r: 170, t: 0.4, m: 0.4, c: "#4a8" });
          }
          break;
        }
        case "leap":
          if (Math.abs(d - 220) > 30)
            mv(nx * sp * (d > 220 ? 1 : -1), ny * sp * (d > 220 ? 1 : -1));
          else mv(-ny * e.dir * sp, nx * e.dir * sp);
          if (e.cd <= 0 && d < 300) {
            e.lu = 0.35;
            e.lh = 0;
            e.lvx = nx * 520;
            e.lvy = ny * 520;
            e.cd = 2.5;
          }
          break;
        case "elite":
          strike(30, e.dmg);
          e.nv = (e.nv ?? 2) - dt;
          if (e.nv <= 0) {
            e.nv = 4;
            Z.push({ x: e.x, y: e.y, r: 115, t: 0.8, m: 0.8, d: e.dmg * 1.2, c: "#f44" });
          }
          break;
        case "boss": {
          e.imm -= dt;
          e.vul -= dt;
          e.sr -= dt;
          const ph = e.hp < e.mhp * 0.33 ? 2 : e.hp < e.mhp * 0.66 ? 1 : 0;
          if (e.ph1 !== ph) {
            if (e.ph1 !== undefined) bsnd(e.bi, "ph");
            e.ph1 = ph;
          }
          const cx = { d, nx, ny, mv, sp, a: Math.atan2(dy, dx), ph };
          guard(e, dt);
          schd(e, dt);
          BO[e.bi].up(e, dt, cx);
          if (e.bi < 12) xat(e, dt, cx);
          break;
        }
      }
    col(e);
    for (const q of E)
      if (q != e && q.hp > 0) {
        const ddx = e.x - q.x,
          ddy = e.y - q.y,
          dd = Math.hypot(ddx, ddy),
          m = e.r + q.r;
        if (dd < m && dd > 0) {
          e.x += (ddx / dd) * (m - dd) * 0.3;
          e.y += (ddy / dd) * (m - dd) * 0.3;
        }
      }
  }
  E = E.filter((e) => !e.dead && e.hp > 0);
}
function eshot(e, nx, ny, sp, d) {
  PR.push({ x: e.x, y: e.y, vx: nx * sp, vy: ny * sp, r: 5, d, l: 3, f: "e", c: "#cf6" });
}

/* ======================================================================

// Límite de proyectiles: enemigos 120 hasta d3 y luego baja 5 por nivel (mínimo 48); jugador 220 aparte. Al exceder se descartan los más antiguos del mismo bando.
function capPR() {
  const ec = G.d <= 3 ? 120 : Math.max(48, 120 - 5 * (G.d - 3));
  let ne = 0,
    np = 0;
  for (const p of PR) p.f == "e" ? ne++ : np++;
  if (ne > ec || np > 220) {
    let a = Math.max(0, ne - ec),
      b = Math.max(0, np - 220);
    PR = PR.filter((p) => (p.f == "e" ? !(a-- > 0) : !(b-- > 0)));
  }
}
function upPR(dt) {
  capPR();
  for (const p of PR) {
    if (p.cv) {
      const q = Math.atan2(p.vy, p.vx) + p.cv * dt,
        s = Math.hypot(p.vx, p.vy);
      p.vx = Math.cos(q) * s;
      p.vy = Math.sin(q) * s;
    }
    if (p.hm && p.f == "e") {
      const q0 = Math.atan2(p.vy, p.vx),
        q = q0 + cl(nrm(ang(p, P) - q0), -p.hm * dt, p.hm * dt),
        s = Math.hypot(p.vx, p.vy);
      p.vx = Math.cos(q) * s;
      p.vy = Math.sin(q) * s;
    }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.l -= dt;
    if (p.ret && !p.rt && p.l < p.l0 * 0.55) {
      p.rt = 1;
      p.h = new Set();
    }
    if (p.rt) {
      const a = ang(p, P);
      p.vx = Math.cos(a) * p.s;
      p.vy = Math.sin(a) * p.s;
      if (dist(p, P) < 20) p.l = 0;
    }
    if (p.x < 50 || p.x > 910 || p.y < 50 || p.y > 550) {
      if (p.bn > 0) {
        p.bn--;
        if (p.x < 50 || p.x > 910) p.vx *= -1;
        else p.vy *= -1;
        p.x = cl(p.x, 50, 910);
        p.y = cl(p.y, 50, 550);
      } else p.l = 0;
    }
    for (const b of RM_.obs)
      if (!b.pit && p.x > b.x && p.x < b.x + b.w && p.y > b.y && p.y < b.y + b.h) {
        if (p.ex) area(p.x, p.y, p.ex, p.d * 0.8, p.t, { fx: p.fx });
        p.l = 0;
      }
    if (p.f == "p") {
      if (p.l <= 0) continue;
      for (const e of E) {
        if (e.sp > 0 || e.hp <= 0 || p.h.has(e) || dist(p, e) > e.r + p.r) continue;
        p.h.add(e);
        if (p.sf) spHit(e, p.sf, p.x, p.y);
        else hit(e, p.d, p.t, { kb: 60, a: Math.atan2(p.vy, p.vx), fx: p.fx, ch: p.ch });
        if (p.ex) area(p.x, p.y, p.ex, p.d * 0.8, p.t, { fx: p.fx });
        if (p.ch) chain(e, p.d * 0.6, p.ch);
        if (p.pc-- <= 0) {
          p.l = 0;
          break;
        }
      }
    } else if (dist(p, P) < P.r + p.r) {
      if (P.g && P.gt < 0.22 && !(P.pcd > 0) && !p.rf) parryProj(p);
      else {
        hurtP(p.d);
        p.l = 0;
      }
    }
  }
  PR = PR.filter((p) => p.l > 0);
}
function upMisc(dt) {
  if (G.train) trainTick(dt);
  if (G.intro) G.intro.t -= dt;
  if (G.ban) G.ban[1] -= dt;
  const fm = LOW ? 120 : 250;
  if (FX.length > fm) FX.splice(0, FX.length - fm);
  for (const z of Z) {
    z.t -= dt;
    if (z.t <= 0) {
      FX.push({ k: "ring", x: z.x, y: z.y, r: z.r, t: 0.25, m: 0.25, c: z.c });
      if (dist(z, P) < z.r + P.r) hurtP(z.d);
    }
  }
  Z = Z.filter((z) => z.t > 0);
  for (const f of FX) {
    f.t -= dt;
    if (f.k == "p") {
      f.x += f.vx * dt;
      f.y += f.vy * dt;
    }
  }
  FX = FX.filter((f) => f.t > 0);
  for (const n of NM) {
    n.l -= dt;
    n.y -= 40 * dt;
  }
  NM = NM.filter((n) => n.l > 0);
  for (const o of O) {
    const d = dist(o, P);
    if (d < 100 * (1 + 0.1 * U("mag"))) {
      o.x += (P.x - o.x) * dt * 6;
      o.y += (P.y - o.y) * dt * 6;
    }
    if (d < 20) {
      o.got = 1;
      if (o.k == "g") P.gold += o.v;
      else if (o.k == "i") {
        P.bag.push(o.it);
        flash("Recoges: " + o.it.n + " (I)");
      } else P.hp = Math.min(P.mhp, P.hp + P.mhp * o.v);
      snd(900, 0.05, "triangle", 0.03);
    }
  }
  RM_.O = O = O.filter((o) => !o.got);
  const r = RM_;
  if (!r.cl && r.st && E.length == 0) {
    if (r.wv > 1) {
      r.wv--;
      wave(r);
    } else {
      r.cl = 1;
      if (!G.hurt) {
        cnt("fl");
        if (r.tp == "elite") cnt("fe");
        if (r.tp == "boss") cnt("fbs");
      }
      chk();
      flash(r.tp == "boss" ? "¡Jefe derrotado! Pulsa F en el portal" : "Sala despejada");
      for (let i = 0; i < 3; i++)
        O.push({ x: 480 + rnd(-40, 40), y: 300 + rnd(-40, 40), k: "g", v: Math.ceil(G.d * 3) });
      if (r.tp == "elite") O.push({ x: 480, y: 300, k: "h", v: 0.3 });
    }
  }
  for (const h of RM_.hz || [])
    if (dist(h, P) < h.r) {
      const q = (G.d - 1) % 8;
      if (q == 6) P.slow = 0.3;
      else {
        P.hp -= (q == 5 ? 7 : 3) * dt * (1 - (P.res[q == 5 ? "fire" : "poison"] || 0));
        if (P.hp <= 0) die();
      }
    }
  msg[1] -= dt;
  shake *= Math.pow(0.01, dt);
}
