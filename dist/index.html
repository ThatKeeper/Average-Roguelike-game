/* ======================================================================
 * src/js/game/class-actions.js
 * Acción de clase (tecla R): escudo, trampa, invocación, rayo, cono, etc. y lógica de trampas/aliados.
 *
 * Define:
 * TR, AL, TM, classAction, spl
 * ====================================================================== */

let TR = [],
  AL = [];
const TM = {
  shield: "Escudo arcano",
  trap: "Trampa de escarcha",
  summon: "Invocar espíritu",
  beam: "Rayo canalizado",
  cone: "Aliento ígneo",
};
function classAction(dt) {
  const s = P.tm;
  if (s == "beam") {
    if (P.mp > 0) {
      P.mp -= 25 * dt * mpK();
      P.bd = (P.bd || 0) - dt;
      if (P.bd <= 0) {
        P.bd = 0.12;
        const a = P.face;
        FX.push({
          k: "line",
          x: P.x,
          y: P.y,
          x2: P.x + Math.cos(a) * 380,
          y2: P.y + Math.sin(a) * 380,
          t: 0.12,
          m: 0.12,
        });
        for (const e of E)
          if (e.hp > 0) {
            const px = e.x - P.x,
              py = e.y - P.y,
              u = cl(px * Math.cos(a) + py * Math.sin(a), 0, 380);
            if (Math.hypot(px - Math.cos(a) * u, py - Math.sin(a) * u) < e.r + 8)
              hit(e, wd(0.35), "m", { fx: { slow: 0.5 } });
          }
      }
    }
    return;
  }
  if (P.cd[3] > 0) return;
  const w = P.w.s;
  if (s == "shield") {
    if (P.mp < spMp(20)) return;
    P.mp -= spMp(20);
    P.sh = 30 + P.a.int * 8;
    P.cd[3] = 10;
  } else if (s == "trap") {
    if (P.mp < spMp(15)) return;
    P.mp -= spMp(15);
    P.cd[3] = 4;
    TR.push({ x: M.x, y: M.y, t: 15 });
  } else if (s == "summon") {
    if (P.mp < spMp(30)) return;
    P.mp -= spMp(30);
    P.cd[3] = 14;
    AL.push({ x: P.x, y: P.y, t: 15, c: 0 });
  } else if (s == "cone") {
    if (P.mp < spMp(18)) return;
    P.mp -= spMp(18);
    P.cd[3] = 5;
    FX.push({ k: "arc", x: P.x, y: P.y, a: P.face, r: 150, w: 1.2, t: 0.25, m: 0.25 });
    for (const e of E)
      if (e.hp > 0 && dist(P, e) < 150 + e.r && Math.abs(nrm(ang(P, e) - P.face)) < 0.6)
        hit(e, wd(1.6), "m", { fx: { burn: 3 } });
  } else if (w == "m" && P.w.bleed) {
    P.cd[3] = 8;
    for (const e of E)
      if (e.hp > 0 && e.st.bleedN > 0 && dist(P, e) < 300) {
        const n = e.st.bleedN;
        e.st.bleedN = 0;
        e.st.bleed = 0;
        hit(e, wd(0.6) * n, "p", { a: ang(P, e), kb: 100 });
      }
    flash("¡Detonación de hemorragia!");
  } else if (w == "m") {
    P.bt = 6;
    P.cd[3] = 14;
    P.sh = 20 + P.a.vit * 4;
    flash("¡Grito de guerra!");
  } else if (w == "r") {
    P.cd = P.cd.map((c, i) => (i < 3 ? 0 : c));
    P.cd[3] = 18;
    flash("Recarga ágil");
  } else {
    P.mp = Math.min(P.mmp, P.mp + P.mmp * 0.4);
    P.cd[3] = 12;
    flash("Canalizas maná");
  }
}
function spl(dt) {
  zn(dt);
  P.stcd -= dt;
  for (const t of TR) {
    t.t -= dt;
    for (const e of E)
      if (e.hp > 0 && dist(t, e) < e.r + 30) {
        t.t = 0;
        area(t.x, t.y, 100, wd(1), "m", { fx: { slow: 3, stun: 1 }, c: "#9fe8ff" });
        break;
      }
  }
  TR = TR.filter((t) => t.t > 0);
  for (const a of AL) {
    a.t -= dt;
    a.c -= dt;
    const tg = E.filter((e) => e.hp > 0).sort((p, q) => dist(p, a) - dist(q, a))[0],
      d = ang(a, P);
    if (dist(a, P) > 70) {
      a.x += Math.cos(d) * 150 * dt;
      a.y += Math.sin(d) * 150 * dt;
    }
    if (tg && a.c <= 0) {
      a.c = 0.8;
      const g = ang(a, tg);
      PR.push({
        x: a.x,
        y: a.y,
        vx: Math.cos(g) * 500,
        vy: Math.sin(g) * 500,
        s: 500,
        r: 5,
        d: wd(0.5),
        t: "m",
        l: 1,
        l0: 1,
        pc: 0,
        bn: 0,
        f: "p",
        h: new Set(),
        c: "#8fe",
      });
    }
  }
  AL = AL.filter((a) => a.t > 0);
}

function interact() {
  if (G.st == "hub") {
    if (!G.ov) hubUse();
    return;
  }
  const r = RM_;
  if (G.ov || trnBusy() || dist(P, { x: 480, y: 300 }) > 70) return;
  if (r.tp == "boss" && r.cl) {
    if (G.arena) {
      endPractice();
      return;
    }
    if (G.d % 10 == 0 && !r.vc) {
      r.vc = 1;
      vic();
      return;
    }
    trnCubes("down");
    G.d++; // la vida se conserva tal cual al bajar de piso (ya no se cura)
    genLevel();
    enter(0, 4);
    flash("Profundidad " + G.d + " — " + G.bi[0]);
    S.best = Math.max(S.best, G.d);
    checkUnlocks();
    save();
    chk();
    return;
  }
  if (r.used) return;
  if (r.tp == "treasure") {
    r.used = 1;
    cnt("ch");
    if (r.sec) cnt("sc");
    chk();
    chestFX(480, 300);
    show(
      `<h2>${r.sec ? "Cámara secreta" : "Cofre antiguo"}</h2><p>Elige un tesoro</p>`,
      loot2(r.sec ? 4 : 3),
    );
  } else if (r.tp == "shrine") {
    r.used = 1;
    show("<h2>Santuario</h2><p>Un altar susurra...</p>", [
      // El trago solo se ofrece si te falta vida.
      ...(P.hp < P.mhp ? [{ t: "Beber un trago: recuperas el 40% de la vida", f: () => (P.hp = Math.min(P.mhp, P.hp + P.mhp * 0.4)) }] : []),
      { t: "Bendición: +10% daño", f: () => (P.dm *= 1.1) },
      {
        t: "Pacto: −20 vida máx., +3 a un atributo al azar",
        f: () => {
          P.bhp -= 20;
          P.hp = Math.min(P.hp, P.mhp - 20);
          P.a[pick(Object.keys(P.a))] += 3;
        },
      },
    ]);
  } else if (r.tp == "event") {
    r.used = 1;
    show("<h2>Suceso extraño</h2><p>Algo antiguo te observa...</p>", [
      {
        t: "Pozo de deseos: paga 25 oro → reliquia al azar",
        c: 25,
        f: () => {
          const q = pick(RL);
          q[2](P);
          P.relics.push(q[0]);
          ST();
        },
      },
      {
        t: "Altar de sangre: −25% vida → +60 oro y experiencia",
        f: () => {
          P.hp = Math.max(1, P.hp * 0.75);
          P.gold += 60;
          xp(30 + G.d * 8);
        },
      },
      {
        t: "Despertar la emboscada (botín mayor)",
        f: () => {
          r.cl = 0;
          r.st = 1;
          r.wv = 1;
          r.tp = "combat";
          wave(r);
          wave(r);
        },
      },
      { t: "Ignorar", f: () => {} },
    ]);
  } else if (r.tp == "shop") shop(r);
}

/* ======================================================================
 * src/js/ai/enemies.js
 * IA y actualización de enemigos normales.
 *
 * Define:
 * EID, slots, upE, eshot
 * ====================================================================== */

let EID = 0;
// Agresividad ag (0..1 hasta d13): menos pausas (+60% cadencia), +25% velocidad, más ataques simultáneos. Desde d3 los cuerpo a cuerpo se reparten en un anillo alrededor del jugador (flanqueo).
function slots() {
  const m = E.filter(
      (q) => q.hp > 0 && q.al && q.sp <= 0 && q.t != "boss" && ET[q.t].ai == "melee",
    ),
    n = m.length;
  if (G.d < 3 || n < 2) {
    m.forEach((q) => (q.sl = null));
    return;
  }
  const k = G.d < 6 ? n >> 1 : n,
    a0 = Math.atan2(300 - P.y, 480 - P.x);
  m.sort((p, q) => p.id - q.id);
  m.forEach((q, i) => {
    if (i >= k) {
      q.sl = null;
      return;
    }
    const a = a0 + ((i + 0.5) * 2 * Math.PI) / k;
    q.sl = { x: cl(P.x + Math.cos(a) * 150, 90, 870), y: cl(P.y + Math.sin(a) * 150, 90, 510) };
  });
}
function upE(dt) {
  slots();
  const ag = Math.min(1, (G.d - 1) / 12);
  for (const e of E) {
    if (e.hp <= 0) continue;
    const T = ET[e.t];
    e.fl -= dt;
    e.cd -= dt * (1 + ag * 0.6);
    e.sh -= dt;
    e.tm += dt;
    if (e.sp > 0) {
      e.sp -= dt;
      continue;
    }
    for (const k of ["burn", "poison"]) {
      if (e.st[k] > 0) {
        e.st[k] -= dt;
        e.hp -= e.dot * dt;
        if (e.hp <= 0) {
          kill(e);
          break;
        }
      }
    }
    if (e.hp > 0 && e.st.bleed > 0) {
      e.st.bleed -= dt;
      e.hp -= e.bd * e.st.bleedN * dt;
      if (e.hp <= 0) kill(e);
    } else if (!(e.st.bleed > 0)) e.st.bleedN = 0;
    if (e.st.wet > 0) e.st.wet -= dt;
    for (const k of ["frac", "curse", "root"]) if (e.st[k] > 0) e.st[k] -= dt;
    if (e.hp > 0 && e.st.cor > 0) {
      e.hp -= e.cdm * e.st.cor * dt;
      e.st.cort -= dt;
      if (e.st.cort <= 0) {
        e.st.cor--;
        e.st.cort = 3;
      }
      if (e.hp <= 0) kill(e);
    }
    if (e.hp <= 0) continue;
    if (e.st.slow > 0) e.st.slow -= dt;
    e.x += e.vx * dt;
    e.y += e.vy * dt;
    const dc = Math.pow(0.01, dt);
    e.vx *= dc;
    e.vy *= dc;
    if (e.st.stun > 0) {
      e.st.stun -= dt;
      col(e);
      continue;
    }
    const dx = P.x - e.x,
      dy = P.y - e.y,
      d = Math.hypot(dx, dy) || 1,
      nx = dx / d,
      ny = dy / d,
      sp = T.sp * (e.sx || 1) * (e.st.slow > 0 ? 0.5 : 1) * (1 + ag * 0.25),
      mv = (vx, vy) => {
        if (e.st.root > 0) return;
        e.x += vx * dt;
        e.y += vy * dt;
      },
      near = T.r + P.r;
    const strike = (rg, dm) => {
      if (e.wind > 0) {
        e.wind -= dt;
        if (e.wind <= 0 && dist(e, P) < rg + near) hurtP(dm, e);
        if (e.wind <= 0 && e.mod == "vampírico") e.hp = Math.min(e.mhp, e.hp + dm * 0.5);
      } else if (d > near + rg - 14) {
        if (e.sl && d > 150 && los(e, e.sl)) {
          const q = Math.hypot(e.sl.x - e.x, e.sl.y - e.y) || 1;
          mv(((e.sl.x - e.x) / q) * sp, ((e.sl.y - e.y) / q) * sp);
        } else mv(nx * sp, ny * sp);
      } else if (e.cd <= 0) {
        if (E.filter((q) => q.wind > 0).length < 3 + ((ag * 3) | 0)) {
          e.wind = 0.5;
          e.cd = 1.5;
        } else e.cd = 0.5;
      }
    };
    if (!e.al) {
      if ((d < 340 && los(e, P)) || e.hp < e.mhp || e.t == "boss") e.al = 1;
      else {
        e.wt = (e.wt || 0) - dt;
        if (e.wt <= 0) {
          e.wt = rnd(1, 2.5);
          e.wa = rnd(0, 6.28);
        }
        mv(Math.cos(e.wa) * sp * 0.4, Math.sin(e.wa) * sp * 0.4);
        col(e);
        continue;
      }
    }
    if (e.t != "boss" && e.t != "decoy" && e.al && !e.lu) {
      if (los(e, P)) {
        e.lk = { x: P.x, y: P.y };
        e.nl = 0;
        e.iw = 0;
      } else {
        e.nl = (e.nl || 0) + dt;
        if (e.nl > 1.5 && e.lk) {
          const q = Math.hypot(e.lk.x - e.x, e.lk.y - e.y);
          if (q > 20) mv(((e.lk.x - e.x) / q) * sp, ((e.lk.y - e.y) / q) * sp);
          else e.iw = (e.iw || 0) + dt;
          if (e.iw > 2.5) {
            e.al = 0;
            e.iw = 0;
            e.nl = 0;
            e.lk = null;
          }
          col(e);
          continue;
        }
      }
    }
    if ((T.ai == "flank" || T.ai == "range" || T.ai == "cast" || T.ai == "leap") && !e.lu) {
      e.dgt -= dt;
      if (!(e.dgt > 0)) {
        const p = PR.find(
          (p) =>
            p.f == "p" &&
            Math.hypot(p.x - e.x, p.y - e.y) < 150 &&
            (e.x - p.x) * p.vx + (e.y - p.y) * p.vy > 0,
        );
        if (p) {
          e.dgt = 2.2;
          const m = Math.hypot(p.vx, p.vy) || 1;
          e.vx += (-p.vy / m) * e.dir * 380;
          e.vy += (p.vx / m) * e.dir * 380;
        }
      }
    }
    if (e.lu > 0) {
      e.lu -= dt;
      mv(e.lvx, e.lvy);
      if (d < near + 4 && !e.lh) {
        e.lh = 1;

      }

    } else

          if (e.cd <= 0 && d < 240) {

            e.lh = 0;
            e.lvx = nx * 400;
            e.lvy = ny * 400;
            e.cd = 1.8;

        case "range":

          if (e.cd <= 0 && los(e, P)) {
            e.cd = 1.9;
            eshot(e, nx, ny, 290, e.dmg);
          } else if (e.cd <= 0) mv(-ny * e.dir * sp, nx * e.dir * sp);
          break;
        case "cast":
          if (d < 230) mv(-nx * sp, -ny * sp);
          else if (d > 300) mv(nx * sp, ny * sp);

          break;
        case "bomb":
          mv(nx * sp, ny * sp);
          if (d < 60) {

            if (e.fuse <= 0) {

          }
          break;
        case "shield": {
          const a = E.find((q) => q != e && q.hp > 0 && q.t != "guardian");
          if (a && dist(a, e) > 80)
            mv(((a.x - e.x) / dist(a, e)) * sp, ((a.y - e.y) / dist(a, e)) * sp);
          else if (d < 120) strike(24, e.dmg);
          if (e.cd <= 0) {

            for (const q of E) if (dist(q, e) < 170) q.sh = 3;
            FX.push({ k: "ring", x: e.x, y: e.y, r: 170, t: 0.4, m: 0.4, c: "#4a8" });
          }

        }
        case "leap":

          else mv(-ny * e.dir * sp, nx * e.dir * sp);
          if (e.cd <= 0 && d < 300) {
            e.lu = 0.35;
            e.lh = 0;
            e.lvx = nx * 520;
            e.lvy = ny * 520;
            e.cd = 2.5;
          }
          break;
        case "elite":
          strike(30, e.dmg);
          e.nv = (e.nv ?? 2) - dt;
          if (e.nv <= 0) {
            e.nv = 4;
            Z.push({ x: e.x, y: e.y, r: 115, t: 0.8, m: 0.8, d: e.dmg * 1.2, c: "#f44" });
          }
          break;
        case "boss": {
          e.imm -= dt;
          e.vul -= dt;
          e.sr -= dt;
          const ph = e.hp < e.mhp * 0.33 ? 2 : e.hp < e.mhp * 0.66 ? 1 : 0;
          if (e.ph1 !== ph) {
            if (e.ph1 !== undefined) bsnd(e.bi, "ph");
            e.ph1 = ph;
          }
          const cx = { d, nx, ny, mv, sp, a: Math.atan2(dy, dx), ph };
          guard(e, dt);
          schd(e, dt);
          BO[e.bi].up(e, dt, cx);
          if (e.bi < 12) xat(e, dt, cx);
          break;
        }
      }
    col(e);
    for (const q of E)
      if (q != e && q.hp > 0) {
        const ddx = e.x - q.x,
          ddy = e.y - q.y,
          dd = Math.hypot(ddx, ddy),
          m = e.r + q.r;
        if (dd < m && dd > 0) {
          e.x += (ddx / dd) * (m - dd) * 0.3;
          e.y += (ddy / dd) * (m - dd) * 0.3;

  E = E.filter((e) => !e.dead && e.hp > 0);
}

  PR.push({ x: e.x, y: e.y, vx: nx * sp, vy: ny * sp, r: 5, d, l: 3, f: "e", c: "#cf6" });
}

/* ======================================================================

 * Proyectiles (límite, actualización) y actualización de efectos varios.

 * capPR, upPR, upMisc

// Límite de proyectiles: enemigos 120 hasta d3 y luego baja 5 por nivel (mínimo 48); jugador 220 aparte. Al exceder se descartan los más antiguos del mismo bando.
function capPR() {
  const ec = G.d <= 3 ? 120 : Math.max(48, 120 - 5 * (G.d - 3));
  let ne = 0,
    np = 0;
  for (const p of PR) p.f == "e" ? ne++ : np++;
  if (ne > ec || np > 220) {
    let a = Math.max(0, ne - ec),
      b = Math.max(0, np - 220);
    PR = PR.filter((p) => (p.f == "e" ? !(a-- > 0) : !(b-- > 0)));
  }
}
function upPR(dt) {
  capPR();
  for (const p of PR) {
    if (p.cv) {
      const q = Math.atan2(p.vy, p.vx) + p.cv * dt,
        s = Math.hypot(p.vx, p.vy);
      p.vx = Math.cos(q) * s;
      p.vy = Math.sin(q) * s;
    }
    if (p.hm && p.f == "e") {
      const q0 = Math.atan2(p.vy, p.vx),
        q = q0 + cl(nrm(ang(p, P) - q0), -p.hm * dt, p.hm * dt),
        s = Math.hypot(p.vx, p.vy);
      p.vx = Math.cos(q) * s;
      p.vy = Math.sin(q) * s;
    }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.l -= dt;
    if (p.ret && !p.rt && p.l < p.l0 * 0.55) {
      p.rt = 1;
      p.h = new Set();
    }
    if (p.rt) {
      const a = ang(p, P);
      p.vx = Math.cos(a) * p.s;
      p.vy = Math.sin(a) * p.s;
      if (dist(p, P) < 20) p.l = 0;
    }
    if (p.x < RB.x0 || p.x > RB.x1 || p.y < RB.y0 || p.y > RB.y1) {
      if (p.bn > 0) {
        p.bn--;
        if (p.x < RB.x0 || p.x > RB.x1) p.vx *= -1;
        else p.vy *= -1;
        p.x = cl(p.x, RB.x0, RB.x1);
        p.y = cl(p.y, RB.y0, RB.y1);
      } else p.l = 0;
    }
    for (const b of RM_.obs)
      if (!b.pit && p.x > b.x && p.x < b.x + b.w && p.y > b.y && p.y < b.y + b.h) {
        if (p.ex) area(p.x, p.y, p.ex, p.d * 0.8, p.t, { fx: p.fx });
        p.l = 0;
      }
    if (p.f == "p") {
      if (p.l <= 0) continue;
      for (const e of E) {
        if (e.sp > 0 || e.hp <= 0 || p.h.has(e) || dist(p, e) > e.r + p.r) continue;
        p.h.add(e);
        if (p.sf) spHit(e, p.sf, p.x, p.y);
        else hit(e, p.d, p.t, { kb: 60, a: Math.atan2(p.vy, p.vx), fx: p.fx, ch: p.ch });
        if (p.ex) area(p.x, p.y, p.ex, p.d * 0.8, p.t, { fx: p.fx });
        if (p.ch) chain(e, p.d * 0.6, p.ch);
        if (p.pc-- <= 0) {
          p.l = 0;
          break;
        }
      }
    } else if (dist(p, P) < P.r + p.r) {
      if (P.g && P.gt < 0.22 && !(P.pcd > 0) && !p.rf) parryProj(p);
      else {
        hurtP(p.d);
        p.l = 0;
      }
    }
  }
  PR = PR.filter((p) => p.l > 0);
}
function upMisc(dt) {
  if (G.train) trainTick(dt);
  if (G.intro) G.intro.t -= dt;
  if (G.ban) G.ban[1] -= dt;
  const fm = LOW ? 120 : 250;
  if (FX.length > fm) FX.splice(0, FX.length - fm);
  for (const z of Z) {
    z.t -= dt;
    if (z.t <= 0) {
      FX.push({ k: "ring", x: z.x, y: z.y, r: z.r, t: 0.25, m: 0.25, c: z.c });
      if (dist(z, P) < z.r + P.r) hurtP(z.d);
    }
  }
  Z = Z.filter((z) => z.t > 0);
  for (const f of FX) {
    f.t -= dt;
    if (f.k == "p" || f.k == "star") {
      f.x += f.vx * dt;
      f.y += f.vy * dt;
      if (f.g) f.vy += f.g * dt;
    }
  }
  FX = FX.filter((f) => f.t > 0);
  for (const n of NM) {
    n.l -= dt;
    n.y -= 40 * dt;
  }
  NM = NM.filter((n) => n.l > 0);
  for (const o of O) {
    const d = dist(o, P);
    if (o.hold > 0) o.hold -= dt; // objeto soltado o con mochila llena: no se recoge hasta que pase el tiempo
    if (d < 100 * (1 + 0.1 * U("mag")) && !(o.hold > 0)) {
      o.x += (P.x - o.x) * dt * 6;
      o.y += (P.y - o.y) * dt * 6;
    }
    if (d < 20 && !(o.hold > 0)) {
      if (o.k == "i" && !bagAdd(o.it)) {
        o.hold = 2.5;
        flash("Mochila llena (I)");
        continue;
      }
      o.got = 1;
      if (o.k == "g") P.gold += o.v;
      else if (o.k == "i") {
        flash("Recoges: " + o.it.n + " (I)");
        lootSnd(o.it.r);
        lootFX(o.x, o.y, o.it.r);
      } else P.hp = Math.min(P.mhp, P.hp + P.mhp * o.v);
      snd(900, 0.05, "triangle", 0.03);
    }
  }
  RM_.O = O = O.filter((o) => !o.got);
  const r = RM_;
  if (!r.cl && r.st && E.length == 0) {
    if (r.wv > 1) {
      r.wv--;
      wave(r);
    } else {
      r.cl = 1;
      if (!G.hurt) {
        cnt("fl");
        if (r.tp == "elite") cnt("fe");
        if (r.tp == "boss") cnt("fbs");
      }
      chk();
      flash(r.tp == "boss" ? "¡Jefe derrotado! Pulsa F en el portal" : "Sala despejada");
      for (let i = 0; i < 3; i++)
        O.push({ x: 480 + rnd(-40, 40), y: 300 + rnd(-40, 40), k: "g", v: Math.ceil(G.d * 3) });
      if (r.tp == "elite") O.push({ x: 480, y: 300, k: "h", v: 0.1 });
    }
  }
  for (const h of RM_.hz || [])
    if (dist(h, P) < h.r) {
      const q = (G.d - 1) % 8;
      if (q == 6) P.slow = 0.3;
      else {
        P.hp -= (q == 5 ? 7 : 3) * dt * (1 - (P.res[q == 5 ? "fire" : "poison"] || 0));
        if (P.hp <= 0) die();
      }
    }
  msg[1] -= dt;
  shake *= Math.pow(0.01, dt);
}

Object.assign(ET, {
  dummy: { hp: 300, sp: 0, dm: 0, r: 16, c: "#a86", ai: "x" },

    AMB.push({ x: rnd(RB.x0, RB.x1), y: rnd(RB.y0, RB.y1), v: rnd(8, 26), s: rnd(1, 3), p: rnd(0, 6) });

      for (let i = 1; i < 12; i++) {

          py = a.y + ((b.y - a.y) * i) / 12;

    x: e.x,
    y: e.y,
    vx: Math.cos(a) * sp,
    vy: Math.sin(a) * sp,
    r: 6,
    d,
    l: 5,
    f: "e",

const ring = (e, r, c) => FX.push({ k: "ring", x: e.x, y: e.y, r, t: 0.5, m: 0.5, c });
const tp = (e, rg) => {
  const a = rnd(0, 6.28);
  e.x = cl(P.x + Math.cos(a) * rg, 90, 870);

const BD = [
  { n: "Valdris, el Duelista", c: "#d8d8f0", r: 24, hp: 0.8 },
  { n: "Gorgrim, el Coloso", c: "#b87", r: 38, hp: 1.4 },

  { n: "Zeth, el Arconte", c: "#a4f", r: 30, hp: 1.1 },

  { n: "Fulgor, Heraldo del Rayo", c: "#fe6", r: 30, hp: 2 },

const FIN = (i) => (i > 6 && i < 12) || i >= 34,

function spawnBoss() {
  const i = G.bo ?? bossIdx(G.d),
    B = BD[i],
    b = spawn("boss", 480, 150);
  b.bi = i;
  b.nm = B.n;
  b.r = B.r;
  b.hp = b.mhp *= B.hp * (FIN(i) ? 1.1 : 1);
  b.dmg *= FIN(i) ? 1.25 : 1;
  b.al = 1;
  b.sp = 2.4;
  b.t1 = 2;
  b.dir = Math.random() < 0.5 ? 1 : -1;
  G.intro = { n: B.n, i, t: 2.4 };
  bsnd(i, "in");
  ring(b, 120, B.c);
  G.bo = undefined;
  return b;
}
function bossDie(e) {
  let nu = [];
  if (!G.arena) {
    S.bosses[e.bi] = 1;
    nu = checkUnlocks();
    save();
  }
  (e.mn || []).concat(e.dc || [], e.orb || []).forEach((q) => {
    q.hp = 0;
    q.dead = 1;
  });
  E.forEach((q) => {
    if (q != e) {
      q.hp = 0;
      q.dead = 1;
    }
  });
  shake = 18;
  bsnd(e.bi, "die");
  for (let i = 0; i < 4; i++)
    FX.push({
      k: "ring",
      x: e.x,
      y: e.y,
      r: 80 + i * 50,
      t: 0.5 + i * 0.2,
      m: 0.5 + i * 0.2,
      c: BD[e.bi].c,
    });
  G.dk = 0;
  P.invc = 0;
  if (!G.arena && G.d >= 10 && !S.hard) {
    S.hard = 1;
    S.hv2 = 1;
    save();
    G.ban = ["Todo se ha vuelto un poco más difícil", 7];
  }
  chk();
  flash("\u00a1" + e.nm + " derrotado!" + (nu.length ? " Carta nueva: " + nu.join(", ") : ""));
}
// Practica (revancha): al derrotar al jefe y cruzar el portal vuelve al menu SIN recompensas, almas, mejor profundidad ni desbloqueos.
function endPractice() {
  if (G.done) return;
  G.done = 1;
  G.st = "menu";
  menu();
}

      ...BD.map((b, i) => ({ k: "b" + i, i, b: 1 })),
    ]
      .filter((e) => !F || (F == 1 ? !e.b : e.b))
      .filter(
        (e) => !G.bq || (S.bk[e.k] && (e.b ? BD[e.i].n : SN[e.k]).toLowerCase().includes(G.bq)),
      ),
    d = nBk();

    `<h2>Bestiario ${Math.round((d / TOT()) * 100)}%</h2><p>${d}/${TOT()} descubiertos. Derrota a un enemigo para revelar su ficha.</p>`,
    [
      {
        t: "Filtro: " + ["Todos", "Enemigos", "Jefes"][F],
        nc: 1,
        f: () => {
          G.bf = (F + 1) % 3;
          bestMenu();
        },
      },
      {
        t: "Buscar: " + (G.bq || "(todo)"),
        nc: 1,
        f: () => {
          G.bq = (prompt("Buscar entre los descubiertos (vacío = todo)", "") || "")
            .trim()
            .toLowerCase();
          bestMenu();
        },
      },
    ]
      .concat(
        L.map((e) => {
          const n = S.bk[e.k],
            z = { nc: 1, dis: 1, f: () => {} };
          if (!n)
            return {
              ...z,
              i: "❔",
              n: "???",
              tp: e.b ? "Jefe" : "Enemigo",
              r: 0,
              d: "Aún no descubierto.",
            };
          if (e.b) {
            const b = BD[e.i];
            return {
              ...z,
              i: `<span style="color:${b.c}">◆</span>`,
              n: b.n,
              tp: FIN(e.i) ? "Jefe final" : "Jefe",
              r: FIN(e.i) ? 3 : 1,
              d: BDS[e.i],
              stx: `Derrotado ${n}× · Profundidad ${bossDepth(e.i)}`,
            };
          }
          const T = ET[e.k],
            a = AT[T.ai];
          return {
            ...z,
            i: ET_I[e.k],
            n: SN[e.k],
            tp: a[0],
            r: e.k == "elite" ? 2 : 0,
            d: a[1] + " Consejo: " + a[2],
            stx:
              `Vida base ${T.hp} · Daño base ${T.dm} · Vel ${T.sp}` +
              (T.res
                ? " · Res. " +
                  Object.entries(T.res)
                    .filter((v) => v[1])
                    .map(([k, v]) => (k == "p" ? "físico " : "mágico ") + v * 100 + "%")
                    .join(", ")
                : "") +
              ` · Derrotado ${n}×`,
          };
        }),
      )
      .concat([{ t: "Volver", nc: 1, f: menu }]),
  );

          const an = (a * 6.283) / (8 + (p.n % 3) * 2);
          tz(P.x + Math.cos(an) * R_, P.y + Math.sin(an) * R_, 40, 0.8, e.dmg, k);
        }
      }),
    );
  },
  (e, c, k, p) => {
    for (let j = 0; j < p.reps; j++)
      later(e, j * 0.45, () => {
        const a = ang(e, P);
        for (let i = 0; i < p.n; i++)
          bt(e, a + (i - (p.n - 1) / 2) * 0.09, p.spd + j * 40, e.dmg * 0.5, 0, k);
      });
  },
  (e, c, k, p) => {
    for (let j = 0; j < p.reps; j++)
      later(e, j * 0.5, () => {
        const o = Math.random() * 6.28,
          m = 12 + p.n;
        for (let i = 0; i < m; i++)
          if ((i + j) % 5 > 1) bt(e, o + (i * 6.283) / m, p.spd, e.dmg * 0.45, 0, k);
      });
  },
];
function mkSig(i) {
  const j = i - 12,
    r = rngS(i * 131 + 7);
  return {
    nm: SNM[j],
    kd: j % 8,
    tr: (j * 5 + (j >> 3)) % 8,
    n: 6 + ((r() * 8) | 0),
    reps: 2 + ((r() * 3) | 0),
    spd: 150 + ((r() * 120) | 0),
    cb: (j * 3 + 1) % 5,
  };
}
const SIG = {};
function sig(e, c, k) {
  const p = SIG[e.bi],
    q = c.ph == 2 && FIN(e.bi) ? { ...p, reps: p.reps + 1, n: p.n + 2 } : p;
  flash("«" + p.nm + "»");
  SG[p.kd](e, c, k, q);
  const K = KIT[e.bi];
  later(e, 1.1, () => AT2[K[p.cb]][1](e, c, k));
}
for (let i = 12; i < 44; i++) {
  SIG[i] = mkSig(i);
  const F = i >= 34,
    r = rngS(i * 7919 + 13),
    ks = Object.keys(AT2)
      .map((v) => [r(), v])
      .sort((a, b) => a[0] - b[0])
      .map((a) => a[1])
      .slice(0, F ? 7 : 5);
  KIT[i] = ks;
  BD.push({
    n: NN[i - 12],
    c: PAL[i % 12],
    r: F ? 32 + (i % 3) * 2 : 22 + ((i * 5) % 12),
    hp: F ? 2 + (i % 3) * 0.15 : 0.8 + ((i * 7) % 6) * 0.1,
    sh: i % 6,
  });
  BO.push({ up: kitUp });
  BDS.push(
    (F ? "Jefe final de 3 fases. " : "") +
      "Firma «" +
      SIG[i].nm +
      "» · Rasgo: " +
      TRN[SIG[i].tr] +
      " · Ataques: " +
      ks.map((k) => AT2[k][0]).join(", ") +
      (F ? ". Fase 3: el suelo cede y los controles se invierten." : "."),
  );
}

  G.tf = 0;

    for (let i = 0; i < 70; i++)
      TE.push({ x: rnd(0, W), y: rnd(0, H), v: rnd(10, 40), s: rnd(1, 3.5), p: rnd(0, 6) });
}
function titleFrame(dt) {
  tcSync();
  const t = Date.now() / 1000,
    bx = 480,
    by = 430,
    bw = 270,
    bh = 58,
    hov = Math.abs(M.x - bx) < bw / 2 && Math.abs(M.y - by) < bh / 2;
  cv.style.cursor = hov ? "pointer" : "default";
  if (G.tf > 0) {
    G.tf -= dt;
    if (G.tf <= 0) {

    }
  } else if (M.d || tapped()) {

  }

  x.clearRect(0, 0, W, H);
  const g = x.createLinearGradient(0, 0, 0, H);

  g.addColorStop(1, "#1c1226");
  x.fillStyle = g;
  x.fillRect(0, 0, W, H);
  for (const q of TE) {

    q.x += Math.sin((q.p += dt)) * 12 * dt;

      dy = q.y - M.y,

      q.x += (dx / d) * 160 * dt;

    if (q.y < -5) {

      q.x = rnd(0, W);

    x.fillRect(q.x, q.y, q.s, q.s);
  }
  x.globalAlpha = 1;
  for (const tx of [110, 850]) {
    const f = 0.6 + 0.4 * Math.sin(t * 8 + tx);
    x.fillStyle = "#ff9a3a";
    x.globalAlpha = 0.1 * f;

    x.arc(tx, 300, 170, 0, 7);
    x.fill();
    x.globalAlpha = 0.9;
    x.beginPath();
    x.ellipse(tx, 300, 12 * f, 22 * f, 0, 0, 7);

    x.fillStyle = "#ffe08a";
    x.beginPath();
    x.ellipse(tx, 304, 6 * f, 12 * f, 0, 0, 7);

    x.globalAlpha = 1;
    x.fillRect(tx - 5, 322, 10, 90);

      px += cw;
    }
  };
  row(L1, 190, 76, "#c9a24a");
  row(L2, 262, 44, "#e8e2f0");
  x.fillStyle = "#8a7fa3";
  x.font = "italic 16px Georgia";

function okItems(it) {
  const cs = 20,
    nx = 43,
    ny = 25,
    B = new Uint8Array(nx * ny);
  for (let j = 0; j < ny; j++)
    for (let i = 0; i < nx; i++) {
      const cx = 60 + i * cs,
        cy = 60 + j * cs;
      if (
        it.some((b) => cx > b.x - 14 && cx < b.x + b.w + 14 && cy > b.y - 14 && cy < b.y + b.h + 14)
      )
        B[j * nx + i] = 1;
    }
  const id = (px, py) => (((py - 50) / cs) | 0) * nx + (((px - 50) / cs) | 0),
    a0 = id(480, 300);
  if (B[a0]) return false;
  const sn = new Uint8Array(nx * ny),
    st = [a0];
  sn[a0] = 1;
  let n = 0;
  while (st.length) {
    const c = st.pop();
    n++;
    const ci = c % nx,
      cj = (c / nx) | 0;
    for (const [di, dj] of [
      [1, 0],
      [-1, 0],
      [0, 1],
      [0, -1],
    ]) {
      const a = ci + di,
        b = cj + dj;
      if (a < 0 || b < 0 || a >= nx || b >= ny) continue;
      const q = b * nx + a;
      if (!B[q] && !sn[q]) {
        sn[q] = 1;
        st.push(q);

    }
  }
  let fr = 0;
  for (let q = 0; q < nx * ny; q++) if (!B[q]) fr++;
  return (
    n == fr &&
    [
      [480, 80],
      [880, 300],
      [480, 520],
      [80, 300],
      [480, 170],
    ].every((p) => sn[id(p[0], p[1])])

// Alinea cada obstáculo/hoyo a la cuadrícula de tiles (40 px) para que lo dibujado coincida con la colisión.
// Después descarta obstáculos (del último al primero) hasta que la sala vuelva a ser transitable.
function snapObs(list) {
  const out = [];
  for (const b of list) {
    let x0 = Math.round(b.x / TS),
      y0 = Math.round(b.y / TS),
      x1 = Math.round((b.x + b.w) / TS),
      y1 = Math.round((b.y + b.h) / TS);
    if (x1 <= x0) x1 = x0 + 1;
    if (y1 <= y0) y1 = y0 + 1;
    x0 = cl(x0, 1, GW - 2);
    y0 = cl(y0, 1, GH - 2);
    x1 = cl(x1, x0 + 1, GW - 1);
    y1 = cl(y1, y0 + 1, GH - 1);
    out.push({ x: x0 * TS, y: y0 * TS, w: (x1 - x0) * TS, h: (y1 - y0) * TS, pit: !!b.pit });
  }
  while (out.length && !okItems(out)) out.pop();
  return out;
}
function pitDraw(o) {
  x.save();

  g.addColorStop(0, "#000");
  g.addColorStop(1, "#140b1c");
  x.fillStyle = g;
  x.fillRect(o.x, o.y, o.w, o.h);
  x.strokeStyle = "#4a3858";
  x.lineWidth = 3;
  x.strokeRect(o.x + 1.5, o.y + 1.5, o.w - 3, o.h - 3);
  x.globalAlpha = 0.3;
  x.fillStyle = "#000";
  for (let i = 8; i < o.w - 4; i += 16) x.fillRect(o.x + i, o.y + 5, 2, o.h - 10);
  x.restore();
}

      const g = x.createRadialGradient(0, 0, r * 0.4, 0, 0, r + 20);

      g.addColorStop(1, `rgba(255,211,74,${0.35 + 0.2 * Math.sin(t * 10)})`);
      x.fillStyle = g;
      x.beginPath();
      x.arc(0, 0, r + 20, 0, 7);
      x.fill();
      // cuenta atrás: el anillo se consume hasta que termina la ventana
      x.strokeStyle = "#ffd34a";
      x.lineWidth = 4;
      x.beginPath();
      x.arc(0, 0, r + 10, -Math.PI / 2, -Math.PI / 2 + 6.2832 * (e.vul / (e._vm || e.vul)));
      x.stroke();
      for (let i = 0; i < 4; i++) {
        const sa = t * 2 + (i * Math.PI) / 2;
        x.fillStyle = "#fff2a8";
        x.beginPath();
        x.arc(Math.cos(sa) * (r + 16), Math.sin(sa) * (r + 16), 2.5, 0, 7);
        x.fill();
      }
      x.textAlign = "center";
      x.font = "bold 11px Georgia";
      x.fillStyle = "#ffd34a";
      x.fillText("✦ VULNERABLE +60%", 0, -r - 38);
    }
  }
  x.restore();
}

/* ======================================================================
 * src/js/render/draw-melee.js
 * Dibujo del arma cuerpo a cuerpo en la mano (reposo, guardia y golpe)
 * y de la estela que deja al atacar.
 *
 * Define:
 * drawMeleeSprite, drawHeldMelee, drawSwingTrail
 * ====================================================================== */

/**
 * Dibuja el sprite con la mano en (px, py) y el eje del arma apuntando a `wa`.
 * `k` escala el arma, `sy` = -1 la voltea, `alpha` multiplica la opacidad actual.
 */
function drawMeleeSprite(A, px, py, wa, k, sy, alpha, glow) {
  const rec = A.spr && WSPR[A.spr],
    s = A.s * k;
  x.save();
  x.globalAlpha *= alpha;
  x.translate(px, py);
  x.rotate(wa);
  if (sy < 0) x.scale(1, -1);
  if (rec && rec.ready) {
    x.imageSmoothingEnabled = false;
    x.rotate(Math.PI / 4); // el sprite viene en diagonal: así su eje queda en +x
    x.scale(s, s);
    if (glow) {
      x.shadowColor = glow;
      x.shadowBlur = 8;
    }
    // la mano queda en el origen: la empuñadura está en gu sobre el eje
    x.drawImage(rec.img, -(8 + A.gu / SQ2), -(8 - A.gu / SQ2));
  } else {
    // sin sprite: hoja sencilla
    x.strokeStyle = "#dde";
    x.lineWidth = 4;
    x.beginPath();
    x.moveTo(0, 0);
    x.lineTo((A.tu - A.gu) * s, 0);
    x.stroke();
    x.strokeStyle = "#864";
    x.lineWidth = 5;
    x.beginPath();
    x.moveTo(2, -5);
    x.lineTo(2, 5);
    x.stroke();
  }
  x.restore();
}

/** Arma en la mano del jugador. Se llama dentro de drawP, ya trasladado al jugador. */
function drawHeldMelee() {
  const A = meleeArt(P.w),
    f = P.face;
  if (SW && SW.owner === P) {
    const pose = swingPose(SW, SW.t);
    drawMeleeSprite(A, pose.hx, pose.hy, pose.ang, pose.k, pose.sy, 1, pose.ph == 1 ? SW.fx.c : null);
  } else if (P.g) {
    // guardia: el arma cruzada delante del cuerpo; brilla durante la ventana de parry
    const parry = P.gt < 0.22 && !(P.pcd > 0);
    drawMeleeSprite(A, Math.cos(f + 0.25) * 12, Math.sin(f + 0.25) * 12, f - 1.1, 0.9, 1, 1, parry ? "#fff" : null);
  } else {
    const wob = Math.sin(Date.now() / 240) * 0.03,
      sy = A.edge ? (A.edge === SWDIR ? 1 : -1) : 1;
    drawMeleeSprite(A, Math.cos(f + A.idle * 0.45) * IDLE_HR, Math.sin(f + A.idle * 0.45) * IDLE_HR, f + A.idle + wob, IDLE_K, sy, 1, null);
  }
}

/** Estela de un golpe: banda translúcida entre posiciones sucesivas del arma + copias fantasma del sprite. */
function drawSwingTrail(f) {
  const age = f.m - f.t,
    pts = f.pts,
    A = f.art;
  x.save();
  for (let i = 0; i < pts.length; i++) {
    const b = pts[i],
      al = 1 - (age - b.t) / f.life;
    if (al <= 0) continue;
    if (i % 3 == 0) {
      // copia fantasma del sprite (uno por fotograma)
      x.globalAlpha = 1;
      drawMeleeSprite(A, b.gx, b.gy, b.ang, b.k, b.sy, al * 0.22, null);
    }
    if (i == 0) continue;
    const a = pts[i - 1];
    if (A.fam == "thrust") {
      // estocada: líneas de velocidad a lo largo del arma
      const dx = b.x2 - b.x1,
        dy = b.y2 - b.y1,
        n = Math.hypot(dx, dy) || 1;
      x.strokeStyle = f.c;
      x.lineWidth = 2;
      for (const o of [-6, 0, 6]) {
        x.globalAlpha = al * 0.6;
        x.beginPath();
        x.moveTo(b.x1 - (dy / n) * o, b.y1 + (dx / n) * o);
        x.lineTo(b.x2 - (dy / n) * o, b.y2 + (dx / n) * o);
        x.stroke();
      }
      continue;
    }
    x.globalAlpha = al * 0.5;
    x.fillStyle = f.c;
    x.beginPath();
    x.moveTo(a.x1, a.y1);
    x.lineTo(a.x2, a.y2);
    x.lineTo(b.x2, b.y2);
    x.lineTo(b.x1, b.y1);
    x.closePath();
    x.fill();
    x.globalAlpha = al * 0.9;
    x.strokeStyle = "#fff";
    x.lineWidth = f.lw;
    x.beginPath();
    x.moveTo(a.x2, a.y2);
    x.lineTo(b.x2, b.y2);
    x.stroke();
  }
  x.restore();
}

/* ======================================================================
 * src/js/render/status-icons.js
 * Iconos de efectos de estado. Cada icono se va oscureciendo conforme se
 * agota el efecto y parpadea cuando le queda poco.
 *
 * Para añadir un estado nuevo basta con una entrada en STATUS_E (enemigos,
 * clave de e.st) o en STATUS_P (jugador, clave de P). Opcionales: stack = clave
 * con el número de pilas (se muestra como número) y tm = clave del temporizador
 * si el efecto no se mide con su propia clave.
 *
 * Define:
 * STATUS_E, STATUS_P, statusFrac, statusList, drawStatusRow
 * ====================================================================== */

// clave -> icono (emoji provisional, sustituible por sprite), color del borde y nombre
const STATUS_E = {
  burn: { i: "🔥", c: "#f80", n: "Quemadura" },
  poison: { i: "☠️", c: "#6c4", n: "Veneno" },
  bleed: { i: "🩸", c: "#d22", n: "Hemorragia", stack: "bleedN" },
  wet: { i: "💧", c: "#4af", n: "Empapado" },
  slow: { i: "🐌", c: "#9ef", n: "Ralentizado" },
  stun: { i: "💫", c: "#ff4", n: "Aturdido" },
  root: { i: "🌿", c: "#4a4", n: "Enraizado" },
  frac: { i: "💔", c: "#999", n: "Armadura rota" },
  curse: { i: "😈", c: "#a4f", n: "Maldición" },
  cor: { i: "🟣", c: "#c2a", n: "Corrupción", stack: "cor", tm: "cort" }, // pilas; el temporizador es el de la siguiente pila
};
const STATUS_P = {
  slow: { i: "🐌", c: "#9ef", n: "Ralentizado" },
  invc: { i: "🔄", c: "#f5a", n: "Controles invertidos" },
  bt: { i: "💢", c: "#f84", n: "Furia" },
};

/**
 * Fracción (0-1) que le queda a un efecto. Recuerda el valor máximo visto de cada efecto
 * en o._sm para saber cuánto duraba al empezar; al terminar se olvida y se reinicia.
 */
function statusFrac(o, key, v) {
  const m = (o._sm ||= {});
  if (v <= 0) {
    m[key] = 0;
    return 0;
  }
  if (v > (m[key] || 0)) m[key] = v;
  return Math.min(1, v / m[key]);
}

/** Lista de efectos activos de `src` (e.st para enemigos, P para el jugador) según la tabla `defs`. */
function statusList(owner, src, defs) {
  const out = [];
  for (const k in defs) {
    const d = defs[k],
      v = d.tm ? src[d.tm] : src[k];
    if (src[k] > 0 && v > 0) out.push({ k, d, f: statusFrac(owner, k, v), n: d.stack ? src[d.stack] : 0 });
    else if (owner._sm && owner._sm[k]) owner._sm[k] = 0;
  }
  return out;
}

/** Dibuja la fila de iconos centrada en (cx, cy); más de 6 pasan a una segunda fila hacia arriba. */
function drawStatusRow(list, cx, cy, sz) {
  if (!list.length) return;
  const gap = 2,
    per = 6,
    tm = Date.now() / 1000;
  x.save();
  x.textAlign = "center";
  x.textBaseline = "middle";
  list.forEach((s, i) => {
    const row = (i / per) | 0,
      n = Math.min(per, list.length - row * per),
      px = cx + ((i % per) - (n - 1) / 2) * (sz + gap),
      py = cy - row * (sz + gap),
      blink = s.f < 0.25 ? 0.55 + 0.45 * Math.sin(tm * 18) : 1;
    x.globalAlpha = blink;
    x.fillStyle = "#000b";
    x.beginPath();
    x.arc(px, py, sz / 2, 0, 7);
    x.fill();
    x.font = `${sz - 4}px serif`;
    x.fillStyle = "#fff";
    x.fillText(s.d.i, px, py + 1);
    // se oscurece a medida que se agota
    x.fillStyle = `rgba(0,0,0,${(1 - s.f) * 0.8})`;
    x.beginPath();
    x.arc(px, py, sz / 2, 0, 7);
    x.fill();
    x.strokeStyle = s.d.c;
    x.lineWidth = 1.5;
    x.beginPath();
    x.arc(px, py, sz / 2, 0, 7);
    x.stroke();
    if (s.n > 1) {
      x.font = `bold ${Math.max(8, sz - 5)}px Georgia`;
      x.fillStyle = "#fff";
      x.fillText(s.n, px + sz / 2 - 1, py + sz / 2 - 1);
    }
  });
  x.restore();
}

/* ======================================================================

 * Efectos de partículas: subida de nivel, apertura de cofres y botín raro.

/** Una estrella de cuatro puntas que sube/cae con gravedad `g` y se encoge al desvanecerse. */
function starFX(px, py, c, o = {}) {
  const t = o.t ?? rnd(0.6, 1.1);
  FX.push({
    k: "star",
    x: px,
    y: py,
    vx: o.vx ?? 0,
    vy: o.vy ?? 0,
    g: o.g ?? 0,
    s: o.s ?? rnd(4, 8),

/** Subida de nivel: columna de luz, anillos dorados y chispas que ascienden alrededor del jugador. */
function levelUpFX() {
  if (!P) return;
  const n = LOW ? 18 : 42,
    cols = ["#ffd34a", "#fff2a8", "#ffffff", "#ffb02e"];
  FX.push({ k: "beam", x: P.x, y: P.y + P.r, t: 1, m: 1, c: "#ffd34a" });

  for (let i = 0; i < n; i++) {

      v = rnd(40, 170);
    starFX(P.x + Math.cos(a) * 10, P.y + Math.sin(a) * 10, pick(cols), {

  snd(660, 0.12, "triangle", 0.04);
  setTimeout(() => snd(990, 0.25, "triangle", 0.04), 90);

/** Cofre abierto: estallido de monedas y destellos que saltan hacia arriba, con anillo de luz. */
function chestFX(px, py) {
  const n = LOW ? 16 : 36,
    cols = ["#ffd34a", "#fff2a8", "#ffe27a", "#ffffff"];
  FX.push({ k: "ring", x: px, y: py, r: 70, t: 0.45, m: 0.45, c: "#ffd34a" });
  FX.push({ k: "beam", x: px, y: py + 10, t: 0.7, m: 0.7, c: "#ffe27a" });
  for (let i = 0; i < n; i++) {

/** Destello al conseguir un objeto épico (2) o legendario (3), con el color de su rareza. */
function lootFX(px, py, r) {
  if (r < 2) return;
  const c = r >= 3 ? ["#ff9a2e", "#ffd34a", "#ffffff"] : ["#b07af0", "#d9b8ff", "#ffffff"],

      v = rnd(50, 170);

/* ======================================================================
 * src/js/render/draw-ranged.js
 * Dibujo del arma a distancia en la mano (arco, ballesta, arma rúnica,
 * chakram y báculos) y de los proyectiles con sus sprites.
 *
 * Define:
 * drawRangedSprite, drawHeldRanged, drawProj
 * ====================================================================== */

/**
 * Dibuja un sprite de arma a distancia con la mano en (px, py) y su dirección de disparo hacia `wa`.
 * `extra` es un giro adicional sobre su propio centro (chakram).
 */
function drawRangedSprite(A, key, px, py, wa, extra, glow) {
  const rec = WSPR[key];
  if (!rec || !rec.ready) return;
  x.save();
  x.translate(px, py);
  x.rotate(wa);
  x.imageSmoothingEnabled = false;
  if (extra) x.rotate(extra);
  x.rotate(A.rot);
  x.scale(A.s, A.s);
  if (glow) {
    x.shadowColor = glow;
    x.shadowBlur = 10;
  }
  x.drawImage(rec.img, -(8 + A.gu * Math.cos(A.rot)), -(8 - A.gu * Math.sin(A.rot)));
  x.restore();
}

/** Arma a distancia en la mano del jugador. Se llama dentro de drawP, ya trasladado al jugador. */
function drawHeldRanged() {
  const A = RANGED_ART[P.w.n];
  if (!A) return;
  const f = P.face,
    e = RK / RK_TIME, // 1 justo al disparar, 0 en reposo
    ready = rangedReady(),
    hd = A.hd - A.kick * e,
    tilt = A.kick > 0 ? -0.25 * e * (Math.cos(f) >= 0 ? 1 : -1) : 0,
    wob = A.kick < 0 ? Math.sin(Date.now() / 300) * 0.04 : 0;
  drawRangedSprite(
    A,
    ready ? A.spr2 : A.spr,
    Math.cos(f) * hd,
    Math.sin(f) * hd,
    f + tilt + wob,
    A.spin ? (Date.now() / 1000) * A.spin : 0,
    (ready && A.kick < 0) || e > 0 ? A.glow : null,
  );
}

/** Dibuja un proyectil del jugador con su sprite. Devuelve false si no hay sprite listo (se usa el círculo). */
function drawProj(p) {
  const A = PROJ_ART[p.spr],
    rec = A && WSPR[p.spr];
  if (!rec || !rec.ready) return false;
  const s = A.s * cl(p.r / A.r, 0.8, 1.5);
  x.save();
  x.translate(p.x, p.y);
  x.rotate(A.spin ? (p.l0 - p.l) * A.spin : Math.atan2(p.vy, p.vx));
  x.imageSmoothingEnabled = false;
  x.scale(s, s);
  if (p.gl) {
    x.shadowColor = p.gl;
    x.shadowBlur = 8;
  }
  x.drawImage(rec.img, -A.ax, -A.ay);
  x.restore();
  return true;
}

/* ======================================================================
 * src/js/render/draw-entities.js
 * Sprites procedurales del jugador y de los enemigos normales.
 *
 * Define:
 * star, drawEnemy, drawP
 * ====================================================================== */

// ===== SPRITES PROCEDURALES (formas por capas con animación) Y SONIDOS DE JEFE =====
// Los enemigos normales y el jugador se dibujan con siluetas propias, orientadas hacia su objetivo, con balanceo al moverse,
// anticipación de ataque (pulso), estiramiento en embestidas, destello al recibir daño y animación de muerte (FX 'dead').
const star = (n, r1, r2, o) => {
  x.beginPath();
  for (let i = 0; i < n * 2; i++) {
    const q = o + (i * Math.PI) / n,
      rr = i % 2 ? r2 : r1;
    x.lineTo(Math.cos(q) * rr, Math.sin(q) * rr);
  }
  x.closePath();
  x.fill();
  x.stroke();
};
function drawEnemy(e) {
  const T = ET[e.t],
    r = e.r,
    a = Math.atan2(P.y - e.y, P.x - e.x),
    t = e.tm || 0,
    F = e.fl > 0 ? "#fff" : T.c,
    mvs = e.sp > 0 ? 0 : 1,
    bob = Math.sin(t * 7 + e.x) * 1.6 * mvs;
  x.save();
  x.fillStyle = "#0005";
  x.beginPath();
  x.ellipse(e.x, e.y + r * 0.85, r * 0.95, r * 0.35, 0, 0, 7);
  x.fill();
  x.translate(e.x, e.y + bob);
  const pw = e.wind > 0 ? 1 + 0.12 * Math.sin(t * 35) : 1,
    st = e.lu > 0 ? 1.25 : 1;
  x.scale(pw * st, pw / (st * 0.95 + 0.05));
  x.rotate(a);
  x.strokeStyle = e.mod ? "#ffd34a" : "#000";
  x.lineWidth = e.mod ? 3 : 2;
  x.fillStyle = F;
  const C = (q, f = 1) => {
      x.beginPath();
      x.arc(0, 0, q, 0, 7);
      if (f) x.fill();
      x.stroke();
    },
    L = (x1, y1, x2, y2, c, w) => {
      x.save();
      x.strokeStyle = c;
      x.lineWidth = w;
      x.beginPath();
      x.moveTo(x1, y1);
      x.lineTo(x2, y2);
      x.stroke();
      x.restore();
    },
    eye = (ex, ey) => {
      x.save();
      x.fillStyle = "#fff";
      x.beginPath();
      x.arc(ex, ey, r * 0.16, 0, 7);
      x.fill();
      x.fillStyle = "#000";
      x.beginPath();
      x.arc(ex + r * 0.05, ey, r * 0.07, 0, 7);
      x.fill();
      x.restore();
    };
  switch (e.t) {
    case "grunt":
      C(r * 0.9);
      L(r * 0.3, r * 0.6, r * 1.5, -r * 0.4, "#7a5a3a", 4);
      x.save();
      x.fillStyle = "#7a5a3a";
      x.beginPath();
      x.arc(r * 1.5, -r * 0.4, r * 0.28, 0, 7);
      x.fill();
      x.restore();
      eye(r * 0.45, -r * 0.25);
      eye(r * 0.45, r * 0.25);
      break;
    case "runner":
      x.beginPath();
      x.ellipse(0, 0, r * 1.2, r * 0.7, 0, 0, 7);
      x.fill();
      x.stroke();
      L(r * 0.6, -r * 0.45, r * 1.7, -r * 0.2, "#fff", 3);
      L(r * 0.6, r * 0.45, r * 1.7, r * 0.2, "#fff", 3);
      eye(r * 0.6, 0);
      break;
    case "archer":
      x.beginPath();
      x.moveTo(r * 1.1, 0);
      x.lineTo(-r * 0.8, -r * 0.95);
      x.lineTo(-r * 0.8, r * 0.95);
      x.closePath();
      x.fill();
      x.stroke();
      x.save();
      x.strokeStyle = "#cb8";
      x.lineWidth = 3;
      x.beginPath();
      x.arc(r * 0.5, 0, r * 1.05, -1.1, 1.1);
      x.stroke();
      x.restore();
      eye(r * 0.3, 0);
      break;
    case "mage":
      C(r);
      x.save();
      x.rotate(-a);
      x.beginPath();
      x.moveTo(-r * 0.7, -r * 0.7);
      x.lineTo(0, -r * 1.9);
      x.lineTo(r * 0.7, -r * 0.7);
      x.closePath();
      x.fill();
      x.stroke();
      x.restore();
      L(r * 0.2, r * 0.9, r * 1.4, -r * 0.9, "#8a6a4a", 3);
      x.save();
      x.fillStyle = "#e8a8ff";
      x.shadowColor = "#c8f";
      x.shadowBlur = 10;
      x.beginPath();
      x.arc(r * 1.4, -r * 0.9, r * 0.28 + Math.sin(t * 8) * 1.5, 0, 7);
      x.fill();
      x.restore();
      eye(r * 0.45, 0);
      break;
    case "tank":
      x.fillRect(-r, -r, 2 * r, 2 * r);
      x.strokeRect(-r, -r, 2 * r, 2 * r);
      x.save();
      x.fillStyle = "#9ab";
      x.fillRect(r * 0.45, -r * 1.05, r * 0.45, r * 2.1);
      x.strokeRect(r * 0.45, -r * 1.05, r * 0.45, r * 2.1);
      x.restore();

      x.lineTo(r * 0.9, r * 1.1);

}
/**
 * Cuerpo del héroe (capa, círculo, adorno de clase y ojo) centrado en el origen del contexto `c`.
 * Lo usa drawP() en el juego y el muñeco del inventario, para que ambos se vean idénticos.
 *  s: estilo de arma (m/r/g) · a: ángulo de mirada · r: radio · mv: 0..1 (largo de la capa)
 *  col / dk: color principal y oscuro de la clase.
 */
function drawHeroBody(c, s, a, r, mv, col, dk) {
  c.fillStyle = dk;
  c.beginPath();
  c.moveTo(-Math.cos(a) * 6, -Math.sin(a) * 6 - 8);
  c.lineTo(
    -Math.cos(a) * (20 + mv * 9) + Math.sin(a) * 8,
    -Math.sin(a) * (20 + mv * 9) - Math.cos(a) * 8,
  );
  c.lineTo(
    -Math.cos(a) * (20 + mv * 9) - Math.sin(a) * 8,
    -Math.sin(a) * (20 + mv * 9) + Math.cos(a) * 8,
  );
  c.closePath();
  c.fill();
  c.fillStyle = col;
  c.strokeStyle = "#000";
  c.lineWidth = 2;
  c.beginPath();
  c.arc(0, 0, r, 0, 7);
  c.fill();
  c.stroke();
  c.save();
  c.rotate(a);
  c.fillStyle = dk;
  if (s == "m") {
    c.fillRect(r * 0.2, -r * 0.55, r * 0.7, r * 1.1);
    c.fillStyle = "#000";
    c.fillRect(r * 0.55, -r * 0.2, r * 0.3, r * 0.4);
  } else if (s == "r") {
    c.beginPath();
    c.moveTo(r * 0.9, 0);
    c.lineTo(-r * 0.4, -r * 1.1);
    c.lineTo(-r * 0.4, r * 1.1);
    c.closePath();
    c.fill();
  } else {
    c.save();
    c.rotate(-a);
    c.beginPath();
    c.moveTo(-r * 0.8, -r * 0.6);
    c.lineTo(0, -r * 2.1);
    c.lineTo(r * 0.8, -r * 0.6);
    c.closePath();
    c.fill();
    c.stroke();
    c.restore();
  }
  c.restore();
  c.fillStyle = "#fff";
  c.beginPath();
  c.arc(Math.cos(a) * r * 0.45, Math.sin(a) * r * 0.45, 2.2, 0, 7);
  c.fill();
}
function drawP() {
  drawStatusRow(statusList(P, P, STATUS_P), P.x, P.y - P.r - 14, 12);

    bob = Math.sin(Date.now() / 85) * 2.2 * mv,
    col = P.fl > 0 ? "#fff" : { m: "#d8b36a", r: "#7fd08a", g: "#8aa8ff" }[s],
    dk = { m: "#6b5530", r: "#3c6a44", g: "#3a4a8a" }[s];
  x.save();
  x.fillStyle = "#0006";
  x.beginPath();
  x.ellipse(P.x, P.y + 11, 12, 4.5, 0, 0, 7);
  x.fill();
  x.translate(P.x, P.y + bob);
  drawHeroBody(x, s, a, P.r, mv, col, dk);
  if (s == "m") drawHeldMelee();
  else if (RANGED_ART[P.w.n]) drawHeldRanged();
  if (P.g) {

    x.lineWidth = 4;

    x.strokeStyle = "#6cf";

  }

}

/* ======================================================================
 * src/js/spells/cards.js
 * Cartas de hechizo (Mago): niveles, requisitos, desbloqueos, normalización del guardado y equipamiento.
 *
 * Define:
 * ETIER, EFORM, STARTERS, EREQ, FN, tsum, CARDS, CORDER, reqOK, reqTxt, checkUnlocks
 * normS, equipCard, unequipCard, castCard
 * ====================================================================== */

// ===== CARTAS DE HECHIZO (solo Mago), PROGRESO PERMANENTE Y HUD =====
// Progreso PERMANENTE (localStorage, S): mejor profundidad, jefes derrotados en partidas normales, cartas desbloqueadas y espacios equipados.
// Progreso TEMPORAL (P, se reinicia en cada run): vida, maná, nivel, equipo, reliquias, talentos. La práctica (Arena) no escribe nada permanente.
const ETIER = {
    fire: 0,
    ice: 0,
    light: 0,
    water: 1,
    plant: 1,
    wind: 1,
    rock: 2,
    dark: 2,
    blood: 3,
    corr: 3,
  },
  EFORM = {
    fire: "bolt",
    ice: "nova",
    light: "bolt",
    water: "zone",
    plant: "zone",
    wind: "cone",
    rock: "bolt",
    dark: "cone",
    blood: "bolt",
    corr: "zone",
  },
  STARTERS = ["fire", "ice", "light"];
const EREQ = {
    water: [["depth", 2]],
    plant: [["depth", 3]],
    wind: [["depth", 4]],
    rock: [["boss", 0]],
    dark: [["boss", 2]],
    blood: [["boss", 4]],
    corr: [["boss", 6]],
  },
  FN = { bolt: "Proyectil", nova: "Nova", cone: "Cono", zone: "Zona" };
const tsum = (k) => k.split("+").reduce((s, z) => s + ETIER[z], 0),
  CARDS = {},
  CORDER = [];
Object.keys(EL)
  .sort((a, b) => ETIER[a] - ETIER[b])
  .forEach((k) => {
    CARDS[k] = { k, a: k, b: "", f: EFORM[k], n: EL[k].n, req: EREQ[k] || [] };
    CORDER.push(k);
  });
Object.keys(CB)
  .sort((p, q) => tsum(p) - tsum(q) || p.localeCompare(q))
  .forEach((k) => {
    const [a, b] = k.split("+"),
      t = tsum(k),
      req = [
        ["card", a],
        ["card", b],
        ["depth", 2 + t],
      ];
    if (t >= 4) req.push(["boss", t - 2]);
    CARDS[k] = { k, a, b, f: CB[k].f || "bolt", n: CB[k].n, req };
    CORDER.push(k);
  });
const reqOK = (r) =>
  r[0] == "depth"
    ? S.best >= r[1]
    : r[0] == "boss"
      ? Object.keys(S.bosses).length > r[1]
      : !!S.cards.unlocked[r[1]];
const reqTxt = (r) =>
  r[0] == "depth"
    ? `Alcanzar la profundidad ${r[1]} (tu mejor: ${S.best})`
    : r[0] == "boss"
      ? `Derrotar a ${r[1] + 1} jefes distintos en partidas normales`
      : `Tener la carta de ${EL[r[1]].n}`;
function checkUnlocks() {
  const nu = [];
  let ch = 1;
  while (ch) {
    ch = 0;
    for (const k of CORDER)
      if (!S.cards.unlocked[k] && CARDS[k].req.every(reqOK)) {
        S.cards.unlocked[k] = 1;
        nu.push(CARDS[k].n);
        ch = 1;
      }
  }
  return nu;
}
// Guardado: tolera datos inexistentes, incompletos, corruptos o antiguos (v1 sin cartas → v2; los jefes de profundidades superadas se dan por derrotados)
function normS() {
  const o = (v) => (v && typeof v == "object" && !Array.isArray(v) ? v : {});
  S.best = +S.best || 0;
  S.souls = +S.souls || 0;
  S.pw = +S.pw || 0;
  S.hard = !!S.hard;
  if (S.hard && !S.hv2 && S.best < 11) S.hard = false;
  if (S.best >= 11) S.hard = true;
  if (S.hard) S.hv2 = 1;
  S.st = o(S.st);
  S.up = o(S.up);
  if (S.fv !== 2) {
    S.fv = 2;
    S.souls += (40 * S.pw * (S.pw + 1)) / 2;
    S.pw = 0;
  }
  S.bk = o(S.bk);
  S.ach = o(S.ach);
  S.bosses = o(S.bosses);
  S.cards = o(S.cards);
  S.cards.unlocked = o(S.cards.unlocked);
  const sl = Array.isArray(S.cards.slots) ? S.cards.slots.slice(0, 4) : [];
  while (sl.length < 4) sl.push(null);
  if (S.v !== 2) {
    S.v = 2;
    for (let i = 0; i < 7; i++) if (S.best > i + 1) S.bosses[i] = 1;
    STARTERS.forEach((k, i) => {
      S.cards.unlocked[k] = 1;
      sl[i] = k;
    });
  }
  checkUnlocks();
  for (const k in S.cards.unlocked) if (!CARDS[k]) delete S.cards.unlocked[k];
  S.cards.slots = sl.map((k) => (CARDS[k] && S.cards.unlocked[k] ? k : null));
  save();
}
normS();
function equipCard(k, sl) {
  if (!P || P.cls != "g" || !CARDS[k] || sl < 0 || sl > 3) return false;
  if (!S.cards.unlocked[k]) {
    flash("Carta bloqueada: " + CARDS[k].req.filter((r) => !reqOK(r)).map(reqTxt)[0]);
    return false;
  }
  const s = S.cards.slots,
    o = s.indexOf(k);
  if (o >= 0) s[o] = s[sl];
  s[sl] = k;
  save();
  return true;
}
function unequipCard(sl) {
  S.cards.slots[sl] = null;
  save();
}
function castCard(i) {
  const k = S.cards.slots[i];
  if (!k || !S.cards.unlocked[k] || !P || P.cls != "g") return;
  const c = CARDS[k];
  castSp({ a: c.a, b: c.b, f: c.f }, 4 + i);
}

/* ======================================================================
 * src/js/ui/spell-book.js

// ---- ventana de cartas: arrastrar (ratón y táctil) o tocar carta y luego espacio ----
function slotAt(ev) {
  const el = document.elementFromPoint(ev.clientX, ev.clientY),
    s = el && el.closest && el.closest("[data-slot]");
  return s ? +s.dataset.slot : -1;
}
function drop(k, s, from) {
  if (s >= 0) {
    if (!S.cards.unlocked[k]) flash("Carta bloqueada");
    else equipCard(k, s);
  } else if (from >= 0) unequipCard(from);
  book(1);
}
function dragify(el, k, from) {
  el.style.touchAction = "none";

    const sx = e.clientX,
      sy = e.clientY;
    let g = null;
    const mv = (ev) => {
        if (!g && Math.hypot(ev.clientX - sx, ev.clientY - sy) > 6) {
          g = el.cloneNode(true);
          g.style.cssText += ";position:fixed;pointer-events:none;opacity:.85;z-index:99";
          ov.appendChild(g);
          el.style.opacity = 0.4;
        }
        if (g) {
          g.style.left = ev.clientX - 60 + "px";
          g.style.top = ev.clientY - 40 + "px";
        }
      },
      up = (ev) => {
        window.removeEventListener("pointermove", mv);
        window.removeEventListener("pointerup", up);
        if (g) {
          g.remove();
          el.style.opacity = 1;
          drop(k, slotAt(ev), from);
        } else {
          G.csel = k;
          book(1);
        }
      };
    window.addEventListener("pointermove", mv);
    window.addEventListener("pointerup", up);
  };
}
function book(f) {

  if (G.bk && !f) {
    hide();
    return;
  }

  G.pz = 1;
  G.ov = 1;

    PS = 6,
    mkb = (t, fn, on, c) => {

      e.textContent = t;
      e.style.cssText =
        `padding:4px 9px;font-size:12px;border-color:${c || "#c9a24a"};` +
        (on ? "background:#4a3d60;border-color:#fff" : "");

      return e;
    },

    };

  let r = row();

    d.innerHTML = `<small>Espacio ${i + 1} \u00b7 tecla ${KL(KY["c" + (i + 1)])}</small><br><b>${k ? CARDS[k].n : "(vac\u00edo)"}</b>`;
    d.onclick = () => {
      if (G.csel && equipCard(G.csel, i)) {
        G.csel = null;

  }
  ov.insertAdjacentHTML(

    `<small>${G.csel ? "Seleccionada: " + CARDS[G.csel].n + " \u2192 toca un espacio" : "Toca un espacio ocupado para vaciarlo"}</small>`,
  );

    ([k, n]) =>
      r.appendChild(

    d.style.cssText = `width:170px;text-align:left;border:2px solid ${u ? e.c : "#555"};border-radius:10px;padding:8px;font-size:12px;background:linear-gradient(160deg,#1a1722,${e.c}33);${u ? "" : "opacity:.72;"}${G.csel == k ? "box-shadow:0 0 10px #fff;" : ""}`;
    d.innerHTML =
      `<b style="color:${e.c}">${c.n}</b><br><small>${EL[c.a].n}${c.b ? " + " + EL[c.b].n : ""} \u00b7 ${FN[sp.f]}</small><p style="margin:4px 0;font-size:11px">${c.b ? CB[k].d : e.d}</p><small>Coste ${Math.ceil(sp.cost)} \u00b7 Enfr. ${sp.cd.toFixed(1)}s \u00b7 Da\u00f1o ${Math.round(sp.dmg)} \u00b7 Radio ${Math.round(sp.r)}</small><br>` +
      (u

              .filter((q) => !reqOK(q))

    r = row();
    const pv = mkb(
      "\u2039 Anterior",
      () => {

        book(1);
      },
      0,
    );
    pv.disabled = pg <= 0;
    r.appendChild(pv);
    const nx = mkb(
      "Siguiente \u203a",
      () => {
        G.cpg = pg + 1;

      },
      0,
    );
    nx.disabled = (pg + 1) * PS >= L.length;
    r.appendChild(nx);
    ov.insertAdjacentHTML(
      "beforeend",
      `<small>P\u00e1gina ${pg + 1}/${Math.ceil(L.length / PS)}</small>`,
    );
  }
}

/* ======================================================================
 * src/js/render/hud-slots.js
 * Casillas del HUD con iconos, teclas, estado y etiquetas.
 *
 * Define:
 * KL, rr, ico, HT, slot, hudSlots
 * ====================================================================== */

// ---- HUD: casillas con icono, tecla, estado (listo, enfriamiento, sin maná, seleccionado) y etiqueta contextual al pasar el ratón ----
const KL = (c) =>
  (c || "").replace("Key", "").replace("Digit", "").replace("Space", "ESP").replace("Arrow", "");
function rr(px, py, w, h, r) {
  x.beginPath();
  x.moveTo(px + r, py);
  x.arcTo(px + w, py, px + w, py + h, r);
  x.arcTo(px + w, py + h, px, py + h, r);
  x.arcTo(px, py + h, px, py, r);
  x.arcTo(px, py, px + w, py, r);
  x.closePath();
}
function ico(id, cx, cy, s, c) {
  x.save();
  x.translate(cx, cy);
  x.strokeStyle = c;
  x.fillStyle = c;
  x.lineWidth = 2;
  const r = s / 2;
  switch (id) {
    case "whirl":
      x.beginPath();
      x.arc(0, 0, r * 0.7, 0, 4.7);
      x.stroke();
      x.beginPath();
      x.moveTo(r * 0.7, -r * 0.1);
      x.lineTo(r * 0.4, -r * 0.5);
      x.lineTo(r * 0.95, -r * 0.45);
      x.fill();
      break;
    case "leap":
      x.beginPath();
      x.moveTo(-r * 0.7, r * 0.6);
      x.quadraticCurveTo(0, -r, r * 0.7, r * 0.6);
      x.stroke();
      x.fillRect(-r * 0.8, r * 0.6, r * 1.6, 3);
      break;
    case "guard":
      x.beginPath();
      x.moveTo(0, -r * 0.8);
      x.lineTo(r * 0.7, -r * 0.4);
      x.lineTo(r * 0.5, r * 0.5);
      x.lineTo(0, r * 0.85);
      x.lineTo(-r * 0.5, r * 0.5);
      x.lineTo(-r * 0.7, -r * 0.4);
      x.closePath();
      x.stroke();
      break;
    case "volley":
      for (let i = -1; i <= 1; i++) {
        x.beginPath();
        x.moveTo(-r * 0.7, i * r * 0.45);
        x.lineTo(r * 0.7, i * r * 0.45);
        x.lineTo(r * 0.45, i * r * 0.45 - 4);
        x.stroke();
      }
      break;
    case "bomb":
      x.beginPath();
      x.arc(0, r * 0.1, r * 0.5, 0, 7);
      x.fill();
      x.beginPath();
      x.moveTo(0, -r * 0.4);
      x.lineTo(r * 0.3, -r * 0.8);
      x.stroke();
      break;
    case "drop":
      x.beginPath();
      x.moveTo(0, -r * 0.8);
      x.quadraticCurveTo(r * 0.7, r * 0.2, 0, r * 0.8);
      x.quadraticCurveTo(-r * 0.7, r * 0.2, 0, -r * 0.8);
      x.fill();
      break;
    case "orb":
      x.beginPath();
      x.arc(0, 0, r * 0.55, 0, 7);
      x.fill();
      break;
    case "nova":
      for (let i = 0; i < 8; i++) {
        x.beginPath();
        x.moveTo(Math.cos(i * 0.785) * r * 0.3, Math.sin(i * 0.785) * r * 0.3);
        x.lineTo(Math.cos(i * 0.785) * r * 0.85, Math.sin(i * 0.785) * r * 0.85);
        x.stroke();
      }
      break;
    case "bolt":
      x.beginPath();
      x.moveTo(r * 0.2, -r * 0.9);
      x.lineTo(-r * 0.4, r * 0.1);
      x.lineTo(0, r * 0.1);
      x.lineTo(-r * 0.2, r * 0.9);
      x.lineTo(r * 0.5, -r * 0.2);
      x.lineTo(r * 0.1, -r * 0.2);
      x.closePath();
      x.fill();
      break;
    case "cone":
      x.beginPath();
      x.moveTo(-r * 0.8, 0);
      x.lineTo(r * 0.8, -r * 0.6);
      x.lineTo(r * 0.8, r * 0.6);
      x.closePath();
      x.stroke();
      break;
    case "zone":
      x.setLineDash([3, 3]);
      x.beginPath();
      x.arc(0, 0, r * 0.7, 0, 7);
      x.stroke();
      x.setLineDash([]);
      break;
    case "rage":
      x.beginPath();
      for (let i = 0; i < 10; i++) {
        const q = i * 0.628 - 1.57,
          rr2 = i % 2 ? r * 0.35 : r * 0.85;
        x.lineTo(Math.cos(q) * rr2, Math.sin(q) * rr2);
      }
      x.closePath();
      x.fill();
      break;
    case "reload":
      x.beginPath();
      x.arc(0, 0, r * 0.65, 0.5, 5.8);
      x.stroke();
      x.beginPath();
      x.moveTo(r * 0.6, -r * 0.5);
      x.lineTo(r * 0.9, -r * 0.1);
      x.lineTo(r * 0.3, -r * 0.05);
      x.fill();
      break;
    case "dodge":
      for (let i = 0; i < 2; i++) {
        x.beginPath();
        x.moveTo(-r * 0.6 + i * r * 0.5, -r * 0.6);
        x.lineTo(-r * 0.1 + i * r * 0.5, 0);
        x.lineTo(-r * 0.6 + i * r * 0.5, r * 0.6);
        x.stroke();
      }
      break;
    default:
      x.beginPath();
      x.arc(0, 0, r * 0.4, 0, 7);
      x.fill();
  }
  x.restore();
}
let HT = null;
function slot(px, py, s, o) {
  const hov = M.x >= px && M.x <= px + s && M.y >= py && M.y <= py + s;
  x.save();
  rr(px, py, s, s, 7);
  x.fillStyle = o.off ? "#0c0a10dd" : "#161120dd";
  x.fill();
  x.lineWidth = o.sel ? 3 : 2;
  x.strokeStyle = o.sel ? "#fff" : o.col || "#6a5d80";
  if (o.empty) x.setLineDash([4, 3]);
  x.stroke();
  x.setLineDash([]);
  if (o.ico) ico(o.ico, px + s / 2, py + s / 2 + 2, s * 0.8, o.off ? "#666" : o.col || "#ddd");
  else if (o.em && !(o.it && drawItemIcon(o.it, px + s / 2, py + s / 2, s * 0.78)))
    spr(o.em, px + s / 2, py + s / 2 + 1, s * 0.6);
  if (o.cd > 0) {
    x.fillStyle = "#000b";
    x.fillRect(px + 2, py + 2, s - 4, (s - 4) * cl(o.cd / (o.cdm || 1), 0, 1));
    x.fillStyle = "#fff";
    x.font = "bold 13px Georgia";
    x.textAlign = "center";
    x.fillText(o.cd.toFixed(o.cd < 10 ? 1 : 0), px + s / 2, py + s / 2 + 5);
  } else if (o.nomp) {
    x.fillStyle = "#2a4cc088";
    x.fillRect(px + 2, py + 2, s - 4, s - 4);
  }
  if (o.key) {
    x.font = "bold 10px Georgia";
    const w = x.measureText(o.key).width + 8;
    rr(px - 2, py - 4, w, 13, 4);
    x.fillStyle = "#c9a24a";
    x.fill();
    x.fillStyle = "#000";
    x.textAlign = "left";
    x.fillText(o.key, px + 2, py + 6);
  }
  if (o.mp) {
    x.fillStyle = "#8cf";
    x.font = "9px Georgia";
    x.textAlign = "right";
    x.fillText(o.mp, px + s - 3, py + s - 3);
  }
  x.restore();
  if (hov && o.tip) HT = o.tip;
}
function hudSlots() {
  const s = 42,
    g = 7,
    y = H - s - 14,
    w = P.w.s,
    A = AB[w],
    mg = P.cls == "g",
    IC = {
      m: ["whirl", "leap", "guard"],
      r: ["volley", "bomb", "drop"],
      g: ["orb", "nova", "bolt"],
    },
    NM = {
      m: ["Remolino", "Salto con impacto", "Guardia (mantener)"],
      r: ["Andanada", "Flecha explosiva", "Flecha venenosa"],
      g: ["Bola de fuego", "Nova de hielo", "Rayo en cadena"],
    },
    EC2 = { m: "#d8b36a", r: "#7fd08a", g: "#8aa8ff" }[w];
  HT = null;
  tcSync();
  if (!TOUCH)
    ["hp", "mp"].forEach((k, n) =>
      slot(12 + n * 38, y - 38, 32, {
        em: POT[k].i,
        key: KL(KY[k == "hp" ? "php" : "pmp"]),
        col: POT[k].c,
        off: !potCount(k),
        cd: P.potcd,
        cdm: 1,
        mp: potCount(k) || "",
        tip: [POT[k].n, `Tecla ${KL(KY[k == "hp" ? "php" : "pmp"])} · tienes ${potCount(k)}`],
      }),
    );
  let px = TOUCH ? Math.max(12, (W - (5 + (mg ? 4 : 0)) * (s + g)) / 2) : 12;
  for (let i = 0; i < 3; i++) {
    const a = A[i],
      ok = a && a.f;
    slot(px, y, s, {
      ico: IC[w][i],
      key: i < 2 ? KL(KY[i ? "e" : "q"]) : "CLIC D",
      col: EC2,
      off: !ok,
      cd: ok ? P.cd[i] : 0,
      cdm: a.cd,
      nomp: a.mp && P.mp < spMp(a.mp),
      sel: i == 2 && P.g,
      mp: a.mp ? Math.ceil(spMp(a.mp)) : "",
      tip: [
        NM[w][i],
        ok
          ? `Enfriamiento ${a.cd || 0}s${a.mp ? " \u00b7 " + Math.ceil(spMp(a.mp)) + " man\u00e1" : ""}`
          : "Mant\u00e9n el clic derecho para guardia",
      ],
    });
    px += s + g;
  }
  const tm = P.tm,
    rI = tm
      ? { shield: "guard", trap: "zone", summon: "orb", beam: "bolt", cone: "cone" }[tm]
      : w == "m"
        ? P.w.bleed
          ? "drop"
          : "rage"
        : w == "r"
          ? "reload"
          : "orb";
  slot(px, y, s, {
    ico: rI,
    key: KL(KY.r),
    col: "#c9a24a",
    cd: P.cd[3],
    cdm: tm ? 10 : 14,
    tip: [tm ? TM[tm] : "Acci\u00f3n de clase", "Tecla " + KL(KY.r)],
  });
  px += s + g;
  slot(px, y, s, {
    ico: "dodge",
    key: KL(KY.dodge),
    col: "#9cf",
    cd: P.dcd,
    cdm: 0.8,
    tip: ["Esquivar", "Breve invulnerabilidad"],
  });
  px += s + g * 2;
  if (mg)
    for (let i = 0; i < 4; i++) {
      const k = S.cards.slots[i],
        c = k && CARDS[k];
      if (!c) {
        slot(px, y, s, {
          empty: 1,
          key: KL(KY["c" + (i + 1)]),
          tip: ["Espacio de carta vac\u00edo", "Pulsa B para equipar una carta"],
        });
      } else {
        const sp = build(c.a, c.b, c.f);
        slot(px, y, s, {
          ico: { bolt: "orb", nova: "nova", cone: "cone", zone: "zone" }[sp.f],
          key: KL(KY["c" + (i + 1)]),
          col: EL[c.a].c,
          cd: P["cd"][4 + i],
          cdm: sp.cd,
          nomp: P.mp < sp.cost,
          mp: Math.ceil(sp.cost),
          tip: [
            c.n,
            `Coste ${Math.ceil(sp.cost)} \u00b7 Enfr. ${sp.cd.toFixed(1)}s \u00b7 Da\u00f1o ${Math.round(sp.dmg)}`,
          ],
        });
      }
      px += s + g;
    }
  if (TOUCH) return;
  // equipo visible a la derecha
  const eq = [
    ["w", { i: WI[P.w.n] || "\u2694\ufe0f", n: P.w.n, r: RN.indexOf(P.w.rn), st: {} }],
    ...["h", "b", "g", "f", "a"].map((k) => [k, P.eq[k]]),
  ];
  let ex = W - 12 - eq.length * (s - 4 + g);
  eq.forEach(([k, it]) => {
    slot(ex, y, s - 4, {
      em: it && it.i,
      it,
      col: it ? RC[it.r || 0] : "#4a4258",
      empty: !it,
      key: "",
      tip: it
        ? [it.n, it.st && Object.keys(it.st).length ? stT(it.st) : `${SLOT[k]}`]
        : [SLOT[k] + " vac\u00edo", "Abre el inventario (I)"],
    });
    ex += s - 4 + g;
  });
  x.fillStyle = "#fffb";
  x.font = "11px Georgia";
  x.textAlign = "center";
  x.fillText(
    `[${KL(KY.inv)}] Inventario   [${KL(KY.tal)}] Talentos${mg ? "   [" + KL(KY.book) + "] Cartas" : ""}   [${KL(KY.map)}] Mapa`,
    W / 2,
    H - 2,
  );
  if (HT) {
    x.font = "12px Georgia";
    const w1 = Math.max(x.measureText(HT[0]).width, x.measureText(HT[1]).width) + 16,
      tx = cl(M.x - w1 / 2, 6, W - w1 - 6),
      ty = y - 46;
    rr(tx, ty, w1, 40, 6);
    x.fillStyle = "#000d";
    x.fill();
    x.strokeStyle = "#c9a24a";
    x.stroke();
    x.fillStyle = "#fff";
    x.textAlign = "left";
    x.fillText(HT[0], tx + 8, ty + 16);
    x.fillStyle = "#bbb";
    x.fillText(HT[1], tx + 8, ty + 32);
  }
}

// ---- carga de imágenes (data-URI incrustados por scripts/build.js) ----
const WIMG = {};
function wImg(src) {
  if (!src) return null;
  if (!WIMG[src]) {
    const im = new Image();
    im.src = src;
    WIMG[src] = im;
  }
  return WIMG[src];
}
const wReady = (im) => !!im && im.complete && im.naturalWidth > 0;
[].concat(WORLD_ASSETS.ts || [], WORLD_ASSETS.d2 || [], WORLD_ASSETS.d3 || [], Object.values(WORLD_ASSETS.pr || {})).forEach(wImg);

const biomeIdx = () => Math.max(0, BI.indexOf(G.bi));

// ---- cuadrícula de la sala ----
// Casillas de las puertas: arriba/abajo 2 tiles (centradas en x=480), izquierda/derecha 3 tiles (centradas en y=300).
const DOOR_CELLS = [
  [[11, 0], [12, 0]],
  [[GW - 1, 6], [GW - 1, 7], [GW - 1, 8]],
  [[11, GH - 1], [12, GH - 1]],
  [[0, 6], [0, 7], [0, 8]],
];
// Centro (px) de cada puerta y giro que hay que aplicar al dibujo de la pared superior.
const DOOR_POS = [
  [480, TS / 2, 0],
  [GW * TS - TS / 2, 300, Math.PI / 2],
  [480, GH * TS - TS / 2, Math.PI],
  [TS / 2, 300, -Math.PI / 2],
];

function roomGrid(r) {
  const g = [];
  for (let j = 0; j < GH; j++) g.push(new Array(GW).fill(TILE.FLOOR));
  for (let i = 0; i < GW; i++) g[0][i] = g[GH - 1][i] = TILE.WALL;
  for (let j = 0; j < GH; j++) g[j][0] = g[j][GW - 1] = TILE.WALL;
  for (const k in r.nb) for (const [i, j] of DOOR_CELLS[k]) g[j][i] = TILE.DOOR;
  const near = []; // casillas sin decoración: centro de la sala y entrada de cada puerta
  for (let j = 6; j <= 8; j++) for (let i = 10; i <= 13; i++) near.push(i + "," + j);
  for (let k = 0; k < 4; k++)
    for (const [i, j] of DOOR_CELLS[k]) {
      const di = i == 0 ? 1 : i == GW - 1 ? -1 : 0,
        dj = j == 0 ? 1 : j == GH - 1 ? -1 : 0;
      near.push(i + di + "," + (j + dj), i + 2 * di + "," + (j + 2 * dj));
    }
  for (const b of r.obs || [])
    for (let j = Math.floor(b.y / TS); j < Math.ceil((b.y + b.h) / TS); j++)
      for (let i = Math.floor(b.x / TS); i < Math.ceil((b.x + b.w) / TS); i++)
        if (g[j] && g[j][i] === TILE.FLOOR) g[j][i] = b.pit ? TILE.PIT : TILE.OBS;
  const idx = G.R ? G.R.indexOf(r) : 0,
    rr = rngS(G.seed + G.d * 7919 + idx * 131 + 77);
  for (let j = 1; j < GH - 1; j++)
    for (let i = 1; i < GW - 1; i++) {
      const q = rr();
      if (g[j][i] !== TILE.FLOOR || near.includes(i + "," + j)) continue;
      if (q < 0.15) g[j][i] = 1 + Math.floor((q / 0.15) * 3); // decoración 1, 2 o 3
    }
  return g;
}

// ---- sala "horneada": suelo, decoración, obstáculos, hoyos y muros en un canvas de 960x600 ----
const RCACHE = [];
function bakeRoom(r) {
  const b = biomeIdx(),
    sig = b + ":" + (r.obs ? r.obs.length : 0) + ":" + Object.keys(r.nb).join("");
  if (r.tc && r.tc.sig === sig) return r.tc.cv;
  const ts = wImg(WORLD_ASSETS.ts && WORLD_ASSETS.ts[b]);
  if (!wReady(ts)) return null;
  const cv2 = (r.tc && r.tc.cv) || document.createElement("canvas");
  cv2.width = W;
  cv2.height = H;
  const c = cv2.getContext("2d"),
    g = roomGrid(r);
  c.imageSmoothingEnabled = false;
  for (let j = 0; j < GH; j++)
    for (let i = 0; i < GW; i++) {
      let t = g[j][i];
      if (t === TILE.DOOR) t = TILE.WALL; // bajo la puerta va muro; la puerta se dibuja aparte (drawDoors)
      c.drawImage(ts, t * 16, 0, 16, 16, i * TS, j * TS, TS, TS);
    }
  // sombra suave del muro sobre el suelo
  const sh = c.createLinearGradient(0, TS, 0, TS + 14);
  sh.addColorStop(0, "rgba(0,0,0,.35)");
  sh.addColorStop(1, "rgba(0,0,0,0)");
  c.fillStyle = sh;
  c.fillRect(TS, TS, W - 2 * TS, 14);
  const sh2 = c.createLinearGradient(TS, 0, TS + 12, 0);
  sh2.addColorStop(0, "rgba(0,0,0,.28)");
  sh2.addColorStop(1, "rgba(0,0,0,0)");
  c.fillStyle = sh2;
  c.fillRect(TS, TS, 12, H - 2 * TS);
  r.tc = { cv: cv2, sig };
  if (!RCACHE.includes(r)) RCACHE.push(r);
  while (RCACHE.length > 4) delete RCACHE.shift().tc; // memoria: solo se conservan las últimas salas
  return cv2;
}

// Alternativa (solo mientras cargan las imágenes): dibujo plano con los colores del bioma.
function drawRoomFlat(r) {
  const b = G.bi;
  x.fillStyle = b[1];
  x.fillRect(0, 0, W, H);
  x.fillStyle = b[2];
  x.fillRect(RB.x0, RB.y0, RB.x1 - RB.x0, RB.y1 - RB.y0);
  for (const o of r.obs) {
    if (o.pit) {
      pitDraw(o);
      continue;
    }
    x.fillStyle = b[1];
    x.fillRect(o.x, o.y, o.w, o.h);
    x.strokeStyle = b[3];
    x.lineWidth = 2;
    x.strokeRect(o.x, o.y, o.w, o.h);
  }
}
function drawRoomBase(r) {
  const c = bakeRoom(r);
  if (c) x.drawImage(c, 0, 0);
  else drawRoomFlat(r);
}

// ---- puertas ----
// Tipo de puerta según la sala de destino.
function doorKind(r, k) {
  const n = G.R[r.nb[k]];
  if (n.sec) return 2;
  return { treasure: 1, shop: 3, shrine: 4, event: 4, boss: 5 }[n.tp] || 0;
}
let DW_T = 0;
function drawDoors(r) {
  const now = performance.now(),
    dd = Math.min(0.1, DW_T ? (now - DW_T) / 1000 : 0);
  DW_T = now;
  const tgt = r.cl ? 1 : 0;
  if (r.dop === undefined) r.dop = tgt;
  else {
    if (r.dcl === 0 && r.cl) snd(196, 0.3, "triangle", 0.05); // al limpiar la sala suenan las puertas
    r.dop += (tgt - r.dop) * Math.min(1, dd * 7);
    if (Math.abs(tgt - r.dop) < 0.01) r.dop = tgt;
  }
  r.dcl = r.cl ? 1 : 0;
  const b = biomeIdx(),
    d2 = wImg(WORLD_ASSETS.d2 && WORLD_ASSETS.d2[b]),
    d3 = wImg(WORLD_ASSETS.d3 && WORLD_ASSETS.d3[b]);
  x.save();
  x.imageSmoothingEnabled = false;
  for (const k in r.nb) {
    const wide = k % 2 ? 3 : 2,
      sheet = wide == 3 ? d3 : d2,
      row = doorKind(r, k),
      [cx, cy, rot] = DOOR_POS[k],
      cw = wide * 16,
      dw = wide * TS;
    if (!wReady(sheet)) {
      // sin imágenes todavía: rectángulo simple
      x.fillStyle = r.cl ? G.bi[3] : "#922";
      const hv = k % 2;
      x.fillRect(cx - (hv ? 14 : dw / 2), cy - (hv ? dw / 2 : 14), hv ? 28 : dw, hv ? dw : 28);
      continue;
    }
    x.save();
    x.translate(cx, cy);
    x.rotate(rot);
    const hidden = !doorVis(r, k);
    if (hidden) x.drawImage(sheet, 2 * cw, row * 16, cw, 16, -dw / 2, -TS / 2, dw, TS);
    else {
      x.drawImage(sheet, 0, row * 16, cw, 16, -dw / 2, -TS / 2, dw, TS); // cerrada
      if (r.dop > 0) {
        x.globalAlpha = r.dop;
        x.drawImage(sheet, cw, row * 16, cw, 16, -dw / 2, -TS / 2, dw, TS); // abierta
      }
    }
    x.restore();
  }
  x.restore();
}

// ---- objetos del centro de la sala ----
function drawProp(r, cx, cy) {
  const pr = WORLD_ASSETS.pr || {},
    key = r.tp == "treasure" ? (r.used ? "cofre_abierto" : "cofre_cerrado") : r.tp == "shop" ? "mercader" : "santuario",
    im = wImg(pr[key]);
  if (wReady(im)) {
    x.save();
    x.imageSmoothingEnabled = false;
    x.fillStyle = "#0006";
    x.beginPath();
    x.ellipse(cx, cy + 20, 20, 6, 0, 0, 7);
    x.fill();
    if (r.used && r.tp != "shop" && r.tp != "treasure") x.globalAlpha = 0.5;
    x.drawImage(im, cx - 24, cy - 28, 48, 48);
    x.restore();
  } else {
    x.fillStyle = r.tp == "treasure" ? "#c9a24a" : r.tp == "shrine" ? "#b07af0" : r.tp == "event" ? "#e66" : "#5c8";
    x.fillRect(cx - 16, cy - 12, 32, 24);
  }
  if (r.used && r.tp != "shop") return;
  x.fillStyle = "#fff";
  x.font = "12px Georgia";
  x.fillText({ treasure: "Cofre [F]", shrine: "Santuario [F]", shop: "Mercader [F]", event: "Suceso [F]" }[r.tp], cx, cy - 34);
}
// ---- src/js/render/transitions.js ----
/* ======================================================================
 * src/js/render/transitions.js
 * Transiciones de escena (evitan los cambios bruscos):
 *  - trnCubes(dir): cubitos negros que cubren la pantalla y la descubren, de arriba abajo
 *    ("down") o de abajo arriba ("up"). Se usa en las transiciones normales: bajar de piso,
 *    entrar a la mazmorra desde el hub y volver al hub.
 *  - trnSlide(k, sala, desde): la cámara se desplaza hacia la nueva sala por la puerta k.
 *    Se usa al cruzar puertas entre salas.
 * Mientras una transición bloquea el juego (trnBusy) la simulación queda en pausa.
 *
 * Define:
 * XTR, trnCubes, trnSlide, trnTick, trnBusy, trnFull, trnOverlay
 * ====================================================================== */

let XTR = null;
const XC = { step: 0.024, jit: 0.1, grow: 0.2, hold: 0.12, slide: 0.55 },
  XC_TOTAL = (GH - 1) * XC.step + XC.jit + XC.grow;
const xEase = (p) => p * p * (3 - 2 * p),
  xEaseIO = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);

function snapCanvas() {
  const c = document.createElement("canvas");
  c.width = W;
  c.height = H;
  c.getContext("2d").drawImage(cv, 0, 0);
  return c;
}

// dir: "down" (descendente) | "up" (ascendente). skipCover: no cubrir (la pantalla ya está oscura).
function trnCubes(dir, skipCover) {
  if (XTR) return;
  const jit = [];
  for (let i = 0; i < GW * GH; i++) jit.push(Math.random() * XC.jit);
  XTR = { k: "cubes", dir, t: 0, ph: skipCover ? 2 : 1, snap: skipCover ? null : snapCanvas(), jit };
}

// Cruza la puerta k: la cámara se mueve hacia la nueva sala (que ya queda cargada con enter()).
function trnSlide(k, to, from) {
  if (XTR) return;
  const p0 = { x: P.x, y: P.y };
  drawWorld(true);
  const A = snapCanvas();
  enter(to, from);
  drawWorld(true);
  const B = snapCanvas();
  XTR = { k: "slide", dir: +k, t: 0, A, B, p0, p1: { x: P.x, y: P.y } };
  P.vx = P.vy = 0;
}

function trnTick(dt) {
  if (!XTR) return;
  XTR.t += dt;
  if (XTR.k == "slide") {
    if (XTR.t >= XC.slide) XTR = null;
  } else if (XTR.ph == 1) {
    if (XTR.t >= XC_TOTAL + XC.hold) {
      XTR.ph = 2;
      XTR.t = 0;
      XTR.snap = null;
    }
  } else if (XTR.t >= XC_TOTAL) XTR = null;
}
// ¿hay que pausar la simulación?
const trnBusy = () => !!XTR && (XTR.k == "slide" || XTR.ph == 1);

function cubesDraw(T) {
  x.save();
  x.fillStyle = "#000";
  for (let j = 0; j < GH; j++) {
    const o = T.dir == "down" ? j : GH - 1 - j;
    for (let i = 0; i < GW; i++) {
      const p = Math.max(0, Math.min(1, (T.t - (o * XC.step + T.jit[j * GW + i])) / XC.grow)),
        e = xEase(p),
        s = T.ph == 1 ? e : 1 - e;
      if (s <= 0.01) continue;
      const cx = i * TS + TS / 2,
        cy = j * TS + TS / 2;
      if (s >= 0.999) {
        x.fillRect(i * TS - 0.5, j * TS - 0.5, TS + 1, TS + 1);
        continue;
      }
      x.save();
      x.translate(cx, cy);
      x.rotate((1 - s) * 0.9 * (T.ph == 1 ? 1 : -1));
      x.fillRect((-TS * s) / 2, (-TS * s) / 2, TS * s, TS * s);
      x.restore();
    }
  }
  x.restore();
}

// Devuelve true si la transición dibujó el fotograma completo (el bucle no dibuja el juego).
function trnFull() {
  const T = XTR;
  if (!T) return false;
  if (T.k == "slide") {
    const e = xEaseIO(Math.min(1, T.t / XC.slide)),
      v = DIR[T.dir],
      vx = v[0] * W,
      vy = v[1] * H,
      cx = vx * e,
      cy = vy * e;
    x.save();
    x.clearRect(0, 0, W, H);
    x.drawImage(T.A, -cx, -cy);
    x.drawImage(T.B, vx - cx, vy - cy);
    // el jugador recorre el trayecto entre ambas puertas mientras la cámara avanza
    const sx = P.x,
      sy = P.y;
    P.x = T.p0.x + (T.p1.x + vx - T.p0.x) * e - cx;
    P.y = T.p0.y + (T.p1.y + vy - T.p0.y) * e - cy;
    x.globalAlpha = P.inv > 0 && Math.floor(Date.now() / 60) % 2 ? 0.4 : 1;
    safe(drawP);
    x.globalAlpha = 1;
    P.x = sx;
    P.y = sy;
    x.restore();
    hud();
    dbgHud();
    return true;
  }
  if (T.ph == 1) {
    x.clearRect(0, 0, W, H);
    if (T.snap) x.drawImage(T.snap, 0, 0);
    cubesDraw(T);
    return true;
  }
  return false;
}
// Segunda mitad de los cubos: se dibuja sobre el juego ya renderizado.
function trnOverlay() {
  if (XTR && XTR.k == "cubes" && XTR.ph == 2) cubesDraw(XTR);
}

/* ======================================================================
 * src/js/render/draw.js
 * Dibujado principal del juego en el canvas.
 *
 * Define:
 * ammoBar, draw, drawWorld
