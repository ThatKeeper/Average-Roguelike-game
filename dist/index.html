// ===== RENDER =====
function ammoBar() {
  const w = P.w;
  if (!w.mag) return;
  const m = w.mag,
    rl = P.rl > 0,
    f = rl ? 1 - P.rl / (w.rt || 1.6) : (P.am ?? m) / m,
    bw = Math.min(40, 10 + m * 3),
    bx = P.x - bw / 2,
    by = P.y + 20;
  x.save();
  x.fillStyle = "#000a";
  x.fillRect(bx - 1, by - 1, bw + 2, 6);
  x.fillStyle = rl ? "#fb3" : f <= 0.25 ? "#f55" : "#8cf";
  x.fillRect(bx, by, bw * cl(f, 0, 1), 4);
  x.restore();
}
function draw() {
  if (G.st != "play") {
    x.save();
    x.clearRect(0, 0, W, H);
    x.fillStyle = "#0b0a10";
    x.fillRect(0, 0, W, H);
    x.restore();
    return;
  }
  drawWorld();
  hud();
  dbgHud();
}
// Dibuja la sala y todo lo que hay en ella (sin HUD). noPlayer: omite al jugador (transición de cámara).
function drawWorld(noPlayer) {
  x.save();
  x.clearRect(0, 0, W, H);
  const sk = S.nosh ? 0 : shake;
  x.translate(rnd(-sk, sk), rnd(-sk, sk));
  for (const a of AMB) {
    x.globalAlpha = 0.25;
    x.fillStyle = G.bi[3];
    x.fillRect(a.x, a.y, a.s, a.s);
  }
  x.globalAlpha = 1;
  const b = G.bi,
    r = RM_;
  drawRoomBase(r);
  drawDoors(r);
  x.textAlign = "center";
  const cx = 480,
    cy = 300;
  if (["treasure", "shrine", "shop", "event"].includes(r.tp)) drawProp(r, cx, cy);
  if (r.tp == "boss" && r.cl) {
    x.fillStyle = "#5ff";
    x.beginPath();
    x.arc(cx, cy, 24 + Math.sin(Date.now() / 150) * 3, 0, 7);
    x.fill();
    x.fillStyle = "#fff";
    x.font = "12px Georgia";
    x.fillText(G.train ? "Salir al hub [F]" : "Descender [F]", cx, cy - 34);
  }
  for (const o of O) {
    if (o.k == "i") {
      if (!drawItemIcon(o.it, o.x, o.y, 26)) spr(o.it.i, o.x, o.y, 20);
    }
    else {
      x.fillStyle = o.k == "g" ? "#ffd34a" : "#f55";
      x.beginPath();
      x.arc(o.x, o.y, o.k == "g" ? 4 : 6, 0, 7);
      x.fill();
    }
  }
  for (const h of r.hz || []) {
    x.globalAlpha = 0.4;
    x.fillStyle = ["", "", "", "#3a6", "", "#f60", "#8ef", "#c3a"][(G.d - 1) % 8];
    x.beginPath();
    x.arc(h.x, h.y, h.r, 0, 7);
    x.fill();
    x.globalAlpha = 1;
  }
  if (G.dk) {
    const g = x.createRadialGradient(P.x, P.y, G.dk * 0.5, P.x, P.y, G.dk);
    g.addColorStop(0, "#0000");
    g.addColorStop(1, "#000c");
    x.fillStyle = g;
    x.fillRect(0, 0, W, H);
  }
  for (const z of ZN) {
    x.globalAlpha = 0.22;
    x.fillStyle = EL[z.sp.a].c;
    x.beginPath();
    x.arc(z.x, z.y, z.r, 0, 7);
    x.fill();
    x.globalAlpha = 1;
  }
  for (const t of TR) {
    x.strokeStyle = "#9fe8ff";
    x.beginPath();
    x.arc(t.x, t.y, 30, 0, 7);
    x.stroke();
  }
  for (const a of AL) {
    x.fillStyle = "#8fe";
    x.beginPath();
    x.arc(a.x, a.y, 8, 0, 7);
    x.fill();
  }
  for (const z of Z) {
    x.strokeStyle = z.c;
    x.fillStyle = z.c;
    x.globalAlpha = 0.25 + 0.3 * (1 - z.t / (z.m || 1));
    x.beginPath();
    x.arc(z.x, z.y, z.r, 0, 7);
    x.fill();
    x.globalAlpha = 1;
    x.stroke();
  }
  for (const e of E) {
    const T = ET[e.t];
    x.globalAlpha = e.sp > 0 ? 0.3 : 1;
    if (e.t == "boss" || e.t == "decoy" || e.t == "orb") safe(drawBoss, e);
    else safe(drawEnemy, e);
    if (e.sh > 0) {
      x.strokeStyle = "#4fa";
      x.beginPath();
      x.arc(e.x, e.y, e.r + 5, 0, 7);
      x.stroke();
    }
    if (e.st.slow > 0) {
      x.strokeStyle = "#9ef";
      x.beginPath();
      x.arc(e.x, e.y, e.r + 2, 0, 7);
      x.stroke();
    }
    drawStatusRow(statusList(e, e.st, STATUS_E), e.x, e.y - e.r - 12, 12);
    {
      const a = Math.atan2(P.y - e.y, P.x - e.x);
      x.fillStyle = "#fff";
      x.beginPath();
      x.arc(e.x + Math.cos(a) * e.r * 0.5, e.y + Math.sin(a) * e.r * 0.5, e.r * 0.2, 0, 7);
      x.fill();
    }

    if (e.wind > 0) {
      x.strokeStyle = "#f44";
      x.beginPath();
      x.arc(e.x, e.y, e.r + 26, 0, 7);
      x.stroke();
    }
    if (e.t != "decoy" && e.t != "orb" && (e.hp < e.mhp || e.t == "boss")) {
      x.fillStyle = "#000";
      x.fillRect(e.x - e.r, e.y - e.r - 12, e.r * 2, 4);
      x.fillStyle = "#e44";
      x.fillRect(e.x - e.r, e.y - e.r - 12, e.r * 2 * cl(e.hp / e.mhp, 0, 1), 4);
    }
    x.globalAlpha = 1;
  }
  for (const p of PR) {
    if (p.spr && drawProj(p)) continue;
    x.fillStyle = p.c;
    x.beginPath();
    x.arc(p.x, p.y, p.r, 0, 7);
    x.fill();
  }
  for (const f of FX) {
    const a = f.t / (f.m || 1);
    x.globalAlpha = a;
    if (f.k == "trail") {
      drawSwingTrail(f);
    } else if (f.k == "arc") {
      x.fillStyle = "#fff";
      x.beginPath();
      x.moveTo(f.x, f.y);
      x.arc(f.x, f.y, f.r, f.a - f.w / 2, f.a + f.w / 2);
      x.fill();
    } else if (f.k == "ring") {
      x.strokeStyle = f.c;
      x.lineWidth = 4;
      x.beginPath();
      x.arc(f.x, f.y, f.r * (1.1 - a * 0.3), 0, 7);
      x.stroke();
    } else if (f.k == "dead") {
      const q = 1 - a;
      x.fillStyle = f.c;
      x.save();
      x.translate(f.x, f.y);
      x.rotate(q * 3);
      x.scale(1 + q * 0.3, 1 - q * 0.8);
      x.beginPath();
      x.arc(0, 0, f.r, 0, 7);
      x.fill();
      x.restore();
    } else if (f.k == "star") {
      // estrella de cuatro puntas que gira y se encoge
      const sz = f.s * (0.35 + 0.65 * a);
      x.fillStyle = f.c;
      x.save();
      x.translate(f.x, f.y);
      x.rotate(f.rot + (f.m - f.t) * f.sp);
      x.beginPath();
      for (let i = 0; i < 8; i++) {
        const rr2 = i % 2 ? sz * 0.35 : sz;
        x.lineTo(Math.cos((i * Math.PI) / 4) * rr2, Math.sin((i * Math.PI) / 4) * rr2);
      }
      x.fill();
      x.restore();
    } else if (f.k == "beam") {
      // columna de luz que se eleva y se estrecha
      const g = x.createLinearGradient(0, f.y, 0, f.y - 190);
      g.addColorStop(0, f.c);
      g.addColorStop(1, "#ffd34a00");
      x.fillStyle = g;
      const bw = 8 + 24 * a;
      x.fillRect(f.x - bw / 2, f.y - 190, bw, 190);
    } else if (f.k == "line") {
      x.strokeStyle = "#fff27a";
      x.lineWidth = 3;
      x.beginPath();
      x.moveTo(f.x, f.y);
      x.lineTo(f.x2, f.y2);
      x.stroke();
    } else {
      x.fillStyle = f.c;
      x.fillRect(f.x, f.y, 3, 3);
    }
    x.globalAlpha = 1;
  }
  if (!noPlayer) {
    x.globalAlpha = P.inv > 0 && Math.floor(Date.now() / 60) % 2 ? 0.4 : 1;
    safe(drawP);
    ammoBar();
  }
  x.globalAlpha = 1;
  for (const n of NM) {
    x.fillStyle = n.c;
    x.font = "bold 14px Georgia";
    x.fillText(n.t, n.x, n.y);
  }
  dbgWorld();
  x.restore();
}

/* ======================================================================
 * src/js/render/boss-bar.js
 * Barra de vida del jefe: nombre, fase actual, marcas en los umbrales de
 * fase (66 % y 33 %), barra de daño reciente y estado (inmune/vulnerable).
 *
 * Define:
 * BOSS_THR, bossPhase, drawBossBar
 * ====================================================================== */

const BOSS_THR = [0.66, 0.33]; // % de vida a los que el jefe cambia de fase (igual que en ai/enemies.js)
const ROMAN = ["I", "II", "III"];

/** Fase actual del jefe: 0, 1 o 2. */
function bossPhase(e) {
  const r = e.hp / e.mhp;
  return r < BOSS_THR[1] ? 2 : r < BOSS_THR[0] ? 1 : 0;
}

function drawBossBar(bs) {
  const B = BD[bs.bi],
    bx = 240,
    by = 24,
    bw = 480,
    bh = 20,
    tm = Date.now() / 1000,
    ratio = cl(bs.hp / bs.mhp, 0, 1),
    ph = bossPhase(bs),
    imm = bs.imm > 0,
    vul = bs.vul > 0;
  // barra de "daño reciente": se queda atrás y alcanza a la vida real poco a poco
  if (bs._hs === undefined || ratio > bs._hs) bs._hs = ratio;
  else bs._hs += (ratio - bs._hs) * 0.06;
  // destello al cambiar de fase
  if (bs._ph0 !== undefined && bs._ph0 !== ph) bs._fl = 1;
  bs._ph0 = ph;
  bs._fl = Math.max(0, (bs._fl || 0) - 0.025);
  const fl = bs._fl,
    pulse = 0.5 + 0.5 * Math.sin(tm * 8),
    edge = imm ? "#9ab" : vul ? "#ffd34a" : B.c;

  x.save();
  // marco
  rr(bx - 4, by - 4, bw + 8, bh + 8, 6);
  x.fillStyle = "#0b0a10e6";
  x.fill();
  x.lineWidth = vul ? 2 + pulse * 1.5 : 2;
  x.strokeStyle = edge;
  x.stroke();
  // daño reciente
  x.fillStyle = "#fff8";
  x.fillRect(bx, by, bw * bs._hs, bh);
  // vida actual: gris con rayas si es inmune, dorada si es vulnerable, color del jefe si no
  const g = x.createLinearGradient(0, by, 0, by + bh);
  const base = imm ? "#8a919a" : vul ? "#ffd34a" : B.c;
  g.addColorStop(0, base);
  g.addColorStop(1, "#000a");
  x.fillStyle = base;
  x.fillRect(bx, by, bw * ratio, bh);
  x.fillStyle = g;
  x.fillRect(bx, by, bw * ratio, bh);
  if (imm) {
    // rayas diagonales: no recibe daño ahora mismo
    x.save();
    x.beginPath();
    x.rect(bx, by, bw * ratio, bh);
    x.clip();
    x.strokeStyle = "#0006";
    x.lineWidth = 4;
    for (let i = -bh; i < bw * ratio + bh; i += 12) {
      x.beginPath();
      x.moveTo(bx + i, by + bh);
      x.lineTo(bx + i + bh, by);
      x.stroke();
    }
    x.restore();
  }
  if (fl > 0) {
    x.fillStyle = `rgba(255,255,255,${fl * 0.8})`;
    x.fillRect(bx, by, bw, bh);
  }
  // marcas de los umbrales de fase: brillan hasta que se cruzan
  BOSS_THR.forEach((t, i) => {
    const mx = bx + bw * t,
      done = ratio < t;
    x.strokeStyle = done ? "#fff3" : "#fff";
    x.lineWidth = 2;
    x.beginPath();
    x.moveTo(mx, by - 5);
    x.lineTo(mx, by + bh + 5);
    x.stroke();
    x.fillStyle = done ? "#fff3" : "#ffd34a";
    x.beginPath();
    x.moveTo(mx, by - 9);
    x.lineTo(mx + 4, by - 5);
    x.lineTo(mx, by - 1);
    x.lineTo(mx - 4, by - 5);
    x.fill();
    x.font = "10px Georgia";
    x.textAlign = "center";
    x.fillStyle = done ? "#fff4" : "#fffc";
    x.fillText(Math.round(t * 100) + "%", mx, by + bh + 16);
  });
  // porcentaje dentro de la barra
  x.font = "bold 12px Georgia";
  x.textAlign = "center";
  x.fillStyle = imm ? "#fff" : "#fff";
  x.shadowColor = "#000";
  x.shadowBlur = 3;
  x.fillText(Math.ceil(ratio * 100) + "%", bx + bw / 2, by + bh - 5);
  x.shadowBlur = 0;
  // nombre (izquierda)
  x.textAlign = "left";
  x.font = "bold 15px Georgia";
  x.fillStyle = "#fff";
  x.fillText(bs.nm + (FIN(bs.bi) ? "  ★ JEFE FINAL" : ""), bx, by - 10);
  // fase (derecha): rombos llenos hasta la fase actual
  x.textAlign = "right";
  x.font = `bold ${13 + fl * 5}px Georgia`;
  x.fillStyle = ph == 2 ? "#ff6a5a" : ph == 1 ? "#ffb04a" : "#cfe3ff";
  x.fillText("FASE " + ROMAN[ph], bx + bw, by - 10);
  for (let i = 0; i < 3; i++) {
    const dx = bx + bw - 88 - (2 - i) * 12 - 6;
    x.fillStyle = i <= ph ? "#ffd34a" : "#fff3";
    x.beginPath();
    x.moveTo(dx, by - 20);
    x.lineTo(dx + 5, by - 15);
    x.lineTo(dx, by - 10);
    x.lineTo(dx - 5, by - 15);
    x.fill();
  }
  // estado: inmune / vulnerable, debajo de la barra y alineado a la derecha (a la izquierda está el HUD)
  x.textAlign = "right";
  x.font = "bold 13px Georgia";
  if (imm) {
    x.fillStyle = "#bcd";
    x.fillText("🛡 INMUNE — rompe la protección", bx + bw, by + bh + 32);
  } else if (vul) {
    x.fillStyle = `rgba(255,${(200 + pulse * 40) | 0},80,1)`;
    x.fillText(`✦ VULNERABLE +60% · ${Math.max(0, bs.vul).toFixed(1)}s`, bx + bw, by + bh + 32);
  }
  if (P.invc > 0) {
    x.fillStyle = "#f5a";
    x.fillText("¡CONTROLES INVERTIDOS!", bx + bw, by + bh + (imm || vul ? 48 : 32));
  }
  x.restore();
}
// ---- src/js/render/minimap.js ----
/* ======================================================================
 * src/js/render/minimap.js
 * Mapa de salas con marco: minimapa que se desplaza siguiendo al jugador (las salas lejanas
 * quedan fuera del marco y se ocultan) y mapa grande (tecla M) con todas las salas descubiertas.
 *
 * Colores: las salas completadas se ven en blanco; las descubiertas pero sin visitar, con el color de su
 * tipo; las salas especiales llevan una marca de color en el centro.
 *
 * Define:
 * MMC, MAPC, mapFrame, mapRooms, drawMap
 * ====================================================================== */

let MMC = null; // centro suavizado del minimapa, en coordenadas de cuadrícula de salas
const MAPC = {
    boss: "#f35",
    treasure: "#ca4",
    shrine: "#a7e",
    shop: "#5c8",
    elite: "#e83",
    start: "#888",
    combat: "#667",
    event: "#e66",
  },
  MAP_MARK = ["boss", "elite", "treasure", "shrine", "shop", "event"],
  MAP_NAME = { boss: "Jefe", elite: "Élite", treasure: "Tesoro", shrine: "Santuario", shop: "Mercader", event: "Suceso" };

// Marco: fondo, viñeta que difumina los bordes (las salas lejanas se desvanecen) y borde con remaches.
function mapFrame(fx, fy, fw, fh, inner) {
  const b = G.bi;
  x.save();
  x.fillStyle = "#0b0a10";
  x.fillRect(fx - 6, fy - 6, fw + 12, fh + 12);
  x.fillStyle = "#14121bf0";
  x.fillRect(fx, fy, fw, fh);
  x.save();
  x.beginPath();
  x.rect(fx, fy, fw, fh);
  x.clip();
  inner();
  const f = Math.min(18, fh / 4),
    fade = (x0, y0, x1, y1, rx, ry, rw, rh) => {
      const g = x.createLinearGradient(x0, y0, x1, y1);
      g.addColorStop(0, "#14121b");
      g.addColorStop(1, "#14121b00");
      x.fillStyle = g;
      x.fillRect(rx, ry, rw, rh);
    };
  fade(fx, 0, fx + f, 0, fx, fy, f, fh);
  fade(fx + fw, 0, fx + fw - f, 0, fx + fw - f, fy, f, fh);
  fade(0, fy, 0, fy + f, fx, fy, fw, f);
  fade(0, fy + fh, 0, fy + fh - f, fx, fy + fh - f, fw, f);
  x.restore();
  x.strokeStyle = "#000";
  x.lineWidth = 2;
  x.strokeRect(fx - 5, fy - 5, fw + 10, fh + 10);
  x.strokeStyle = b[3];
  x.globalAlpha = 0.9;
  x.lineWidth = 2;
  x.strokeRect(fx - 2, fy - 2, fw + 4, fh + 4);
  x.globalAlpha = 1;
  x.strokeStyle = "#0009";
  x.lineWidth = 2;
  x.strokeRect(fx + 1, fy + 1, fw - 2, fh - 2);
  // remaches en las esquinas y placas en el centro de cada lado
  x.fillStyle = b[3];
  for (const [cx, cy] of [
    [fx - 5, fy - 5],
    [fx + fw - 1, fy - 5],
    [fx - 5, fy + fh - 1],
    [fx + fw - 1, fy + fh - 1],
  ]) {
    x.fillRect(cx, cy, 6, 6);
    x.fillStyle = "#000";
    x.fillRect(cx + 2, cy + 2, 2, 2);
    x.fillStyle = b[3];
  }
  x.fillRect(fx + fw / 2 - 10, fy - 5, 20, 4);
  x.fillRect(fx + fw / 2 - 10, fy + fh + 1, 20, 4);
  x.restore();
}

// Dibuja pasillos y salas. (cgx, cgy) es la sala que queda en el centro del marco.
function mapRooms(fx, fy, fw, fh, sz, gap, cgx, cgy) {
  const pitch = sz + gap,
    ox = fx + fw / 2 - sz / 2,
    oy = fy + fh / 2 - sz / 2,
    px = (r) => ox + (r.gx - cgx) * pitch,
    py = (r) => oy + (r.gy - cgy) * pitch,
    b = G.bi,
    pulse = 0.55 + 0.45 * Math.sin(Date.now() / 220);
  x.fillStyle = "#6c6a80";
  G.R.forEach((r, i) => {
    if (!G.seen[i]) return;
    for (const k in r.nb) {
      const j = r.nb[k];
      if (j < i || !G.seen[j]) continue;
      const q = G.R[j],
        ax = px(r) + sz / 2,
        ay = py(r) + sz / 2,
        bx = px(q) + sz / 2,
        by = py(q) + sz / 2;
      x.fillRect(Math.min(ax, bx) - 1.5, Math.min(ay, by) - 1.5, Math.abs(ax - bx) + 3, Math.abs(ay - by) + 3);
    }
  });
  G.R.forEach((r, i) => {
    if (!G.seen[i]) return;
    const rx = px(r),
      ry = py(r);
    if (rx + sz < fx || rx > fx + fw || ry + sz < fy || ry > fy + fh) return; // fuera del marco: oculta
    const here = i == G.cur,
      done = here || (G.vis && G.vis[i] && r.cl);
    x.fillStyle = done ? "#f1eff7" : MAPC[r.tp] || "#667";
    x.globalAlpha = done ? 1 : 0.6;
    x.fillRect(rx, ry, sz, sz);
    x.globalAlpha = 1;
    if (done && MAP_MARK.includes(r.tp)) {
      const m = Math.max(4, Math.round(sz * 0.4));
      x.fillStyle = r.used && r.tp != "boss" && r.tp != "shop" ? "#8a8898" : MAPC[r.tp];
      x.fillRect(rx + (sz - m) / 2, ry + (sz - m) / 2, m, m);
    }
    if (here) {
      x.strokeStyle = r.cl ? b[3] : "#f44";
      x.globalAlpha = pulse;
      x.lineWidth = 2;
      x.strokeRect(rx - 2, ry - 2, sz + 4, sz + 4);
      x.globalAlpha = 1;
    }
  });
}

function drawMap() {
  if (!G.R || G.cur === undefined) return;
  const cur = G.R[G.cur];
  if (!MMC || MMC.R !== G.R) MMC = { R: G.R, x: cur.gx, y: cur.gy, t: performance.now() };
  const now = performance.now(),
    k = 1 - Math.exp(-Math.min(0.1, (now - MMC.t) / 1000) * 9);
  MMC.t = now;
  MMC.x += (cur.gx - MMC.x) * k;
  MMC.y += (cur.gy - MMC.y) * k;
  if (!bigmap) {
    const fw = 156,
      fh = 108,
      fx = W - fw - 16,
      fy = TOUCH ? 62 : 16; // con controles táctiles, bajo la fila de botones superiores
    mapFrame(fx, fy, fw, fh, () => mapRooms(fx, fy, fw, fh, 14, 4, MMC.x, MMC.y));
    return;
  }
  // mapa grande: todas las salas descubiertas, centradas en el marco
  let x0 = 1e9,
    x1 = -1e9,
    y0 = 1e9,
    y1 = -1e9;
  G.R.forEach((r, i) => {
    if (!G.seen[i]) return;
    x0 = Math.min(x0, r.gx);
    x1 = Math.max(x1, r.gx);
    y0 = Math.min(y0, r.gy);
    y1 = Math.max(y1, r.gy);
  });
  const cols = x1 - x0 + 1,
    rows = y1 - y0 + 1,
    pitch = Math.max(22, Math.min(44, 460 / cols, 260 / rows)),
    sz = Math.round(pitch * 0.78),
    fw = Math.round(Math.max(340, Math.min(600, cols * pitch + 120))),
    fh = Math.round(Math.max(220, Math.min(360, rows * pitch + 100))),
    fx = Math.round((W - fw) / 2),
    fy = Math.round((H - fh) / 2) - 10;
  x.save();
  x.fillStyle = "#000a";
  x.fillRect(0, 0, W, H);
  mapFrame(fx, fy, fw, fh, () => mapRooms(fx, fy, fw, fh, sz, Math.round(pitch - sz), (x0 + x1) / 2, (y0 + y1) / 2));
  x.textAlign = "center";
  x.fillStyle = "#fff";
  x.font = "bold 18px Georgia";
  x.fillText(`${G.bi[0]} · Profundidad ${G.d}`, W / 2, fy - 22);
  // leyenda
  const items = [["Completada", "#f1eff7"], ["Sin visitar", "#667"]].concat(MAP_MARK.map((t) => [MAP_NAME[t], MAPC[t]]));
  x.font = "12px Georgia";
  x.textAlign = "left";
  const wd = items.map((q) => 20 + x.measureText(q[0]).width + 14),
    tot = wd.reduce((a, c) => a + c, 0);
  let lx = (W - tot) / 2 + 4;
  items.forEach((q, n) => {
    x.fillStyle = q[1];
    x.fillRect(lx, fy + fh + 18, 10, 10);
    x.fillStyle = "#ddd";
    x.fillText(q[0], lx + 16, fy + fh + 27);
    lx += wd[n];
  });
  x.restore();
}

/* ======================================================================
 * src/js/game/loop.js
 * Bucle principal con paso fijo, música y manejo de errores de render.
 *
 * Define:
 * lt, mi, music, ACC, loop
 * ====================================================================== */

let lt = performance.now(),
  mi;
function music() {
  if (mi) return;
  mi = setInterval(() => {
    if (G.st != "play" || S.mute) return;
    snd(
      pick([110, 130.8, 146.8, 164.8, 196, 220]) * (Math.random() < 0.3 ? 2 : 1),
      1.6,
      "triangle",
      0.02,
      1,
    );
  }, 900);
}
let ACC = 0;
function loop(t) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.1, (t - lt) / 1000);
  lt = t;
  ACC += dt * DBG.ts;
  dbgTick(dt);
  try {
    let n = 0;
    while (ACC >= 1 / 60 && n++ < 6) {
      ACC -= 1 / 60;
      if (G.st == "play" && !G.ov && !ROT && !trnBusy() && !(G.hs > 0 && ((G.hs -= 1 / 60), 1))) {
        const h = 1 / 60;
        upP(h);
        if (G.st == "play") {
          upE(h);
          upPR(h);
          upMisc(h);
          amb(h);
          if (P.pend > 0 && !G.ov) lvUp();
        }
      }
    }
    if (n >= 6) ACC = 0;
    trnTick(dt);
    if (!trnFull()) {
      G.st == "title" ? titleFrame(dt) : G.st == "hub" ? hubFrame(dt) : draw();
      trnOverlay();
    }
  } catch (er) {
    console.error(er);
    cv.width = W;
  }
}

// ---------- distribución sin solapamientos ----------
// Posiciones por defecto (centros en px) calculadas a partir del tamaño real de la pantalla.
function tcDefaults(vw, vh, sz) {
  const m = 14,
    p = {},
    ax = vw - m - sz.atk / 2,
    ay = vh - m - sz.atk / 2,
    R1 = sz.atk / 2 + sz.q / 2 + 8,
    R2 = R1 + sz.q + 6,
    pol = (R, deg) => [ax + R * Math.cos((deg * Math.PI) / 180), ay + R * Math.sin((deg * Math.PI) / 180)];
  p.move = [m + sz.move / 2, vh - m - sz.move / 2];
  p.atk = [ax, ay];
  p.dodge = pol(R1, 180);
  p.skill = pol(R1, 225);
  p.use = pol(R1, 270);
  p.q = pol(R2, 172);
  p.e = pol(R2, 200);
  p.r = pol(R2, 228);
  p.hp = pol(R2, 256);
  p.mp = pol(R2, 284);
  ["pause", "inv", "map", "tal", "book"].forEach((id, i) => (p[id] = [vw - m - sz[id] / 2 - i * (sz[id] + 8), m + sz[id] / 2]));
  for (let i = 0; i < 4; i++) p["c" + (i + 1)] = [vw / 2 + (i - 1.5) * (sz.c1 + 10), vh - 8 - sz.c1 / 2];
  return p;
}
// Empuja los círculos que se tocan hasta separarlos y los mantiene dentro de la pantalla.
function tcResolve(pos, sz, ids, vw, vh) {
  const gap = 6;
  for (let it = 0; it < 80; it++) {
    let moved = 0;
    for (let i = 0; i < ids.length; i++)
      for (let j = i + 1; j < ids.length; j++) {
        const a = ids[i],
          b = ids[j],
          pa = pos[a],
          pb = pos[b],
          need = sz[a] / 2 + sz[b] / 2 + gap;
        let dx = pb[0] - pa[0],
          dy = pb[1] - pa[1],
          d = Math.hypot(dx, dy);
        if (d >= need) continue;
        if (d < 0.01) {
          dx = 1;
          dy = 0;
          d = 1;
        }
        const k = (need - d) / 2 / d;
        // el control grande (movimiento/ataque) se mueve menos
        const wa = sz[a] > 90 ? 0.25 : 1,
          wb = sz[b] > 90 ? 0.25 : 1,
          t = wa + wb;
        pa[0] -= dx * k * 2 * (wa / t);
        pa[1] -= dy * k * 2 * (wa / t);
        pb[0] += dx * k * 2 * (wb / t);
        pb[1] += dy * k * 2 * (wb / t);
        moved = 1;
      }
    for (const id of ids) {
      const s = sz[id] / 2;
      pos[id][0] = cl(pos[id][0], s + 4, vw - s - 4);
      pos[id][1] = cl(pos[id][1], s + 4, vh - s - 4);
    }
    if (!moved) return true;
  }
  return false;
}
function tcLayout(editing) {
  if (!TC.box) return;
  const vw = innerWidth,
    vh = innerHeight;
  let fit = Math.min(1, Math.min(vw, vh) / 420) * (S.tscale || 1);
  const ids = Object.keys(TCDEF).filter(tcVisible);
  for (let tries = 0; tries < 8; tries++) {
    const sz = {};
    for (const id in TCDEF) sz[id] = Math.round(TCDEF[id].s * fit);
    const pos = tcDefaults(vw, vh, sz),
      src = editing || TC.edit ? Object.assign({}, S.tl || {}, TC.ed) : S.tl || {};
    for (const id in src) if (pos[id] && src[id]) pos[id] = [src[id][0] * vw, src[id][1] * vh];
    // en el editor se deja colocar libremente (los solapes se marcan en rojo); en juego se resuelven
    const ok = TC.edit ? true : tcResolve(pos, sz, ids, vw, vh);
    if (ok || tries == 7 || TC.edit) {
      TC.size = sz;
      TC.pos = pos;
      break;
    }
    fit *= 0.92; // si no cabe, se reducen los botones
  }
  const sz = TC.size,
    pos = TC.pos,
    dpad = !!S.dpad;
  TC.vis = {};
  for (const id in TCDEF) {
    const show = tcVisible(id);
    TC.vis[id] = show;
    const els = id == "move" ? [TC.els.joy, TC.els.dpad] : [TC.els[id] || TC.els.atk];
    els.forEach((el, k) => {
      if (!el) return;
      const on = show && (id != "move" || (k == 1) == dpad);
      el.style.display = on ? "" : "none";
      el.style.width = el.style.height = sz[id] + "px";
      el.style.left = pos[id][0] - sz[id] / 2 + "px";
      el.style.top = pos[id][1] - sz[id] / 2 + "px";
      el.style.fontSize = Math.round(sz[id] * 0.3) + "px";
      el.classList.remove("bad");
    });
  }
  if (TC.edit) {
    const vis = ids.filter((id) => TC.vis[id]);
    for (const a of vis)
      for (const b of vis)
        if (a < b && Math.hypot(pos[a][0] - pos[b][0], pos[a][1] - pos[b][1]) < sz[a] / 2 + sz[b] / 2 - 2)
          [a, b].forEach((id) => (id == "move" ? [TC.els.joy, TC.els.dpad] : [TC.els[id]]).forEach((el) => el && el.classList.add("bad")));
  }
  tcIcons(1);
}

/** Muestra los segundos de enfriamiento restantes sobre cada botón de habilidad. */
function tcCooldown(id, cd) {
  const b = TC.els[id];
  if (!b) return;
  const n = b.lastChild,
    on = cd > 0.05,
    txt = on ? (cd >= 1 ? String(Math.ceil(cd)) : cd.toFixed(1)) : "";
  if (b._cd !== txt) {
    b._cd = txt;
    n.textContent = txt;
    b.classList.toggle("cd", on);
  }
}
function tcCooldowns() {
  const ok = P && G.st == "play",
    A = ok && AB[P.w.s];
  tcCooldown("q", ok && A[0] && A[0].f ? P.cd[0] : 0);
  tcCooldown("e", ok && A[1] && A[1].f ? P.cd[1] : 0);
  tcCooldown("skill", ok && A[2] && A[2].f ? P.cd[2] : 0); // la guardia del guerrero no tiene enfriamiento
  tcCooldown("r", ok ? P.cd[3] : 0);
  tcCooldown("dodge", ok ? P.dcd : 0);
  tcCooldown("hp", ok && P.potcd > 0 ? P.potcd : 0);
  tcCooldown("mp", ok && P.potcd > 0 ? P.potcd : 0);
  for (let i = 0; i < 4; i++) tcCooldown("c" + (i + 1), ok && P.cls == "g" ? P.cd[4 + i] : 0);
  // contador de pociones en el borde del botón
  for (const k of ["hp", "mp"]) {
    const b = TC.els[k];
    if (b) {
      const n = ok ? potCount(k) : 0;
      if (b._pc !== n) {
        b._pc = n;
        if (n) b.dataset.q = n;
        else b.removeAttribute("data-q");
        b.classList.toggle("empty", !n);
      }
    }
  }
}
function tcFS() {
  try {
    const d = document.documentElement;
    if (d && d.requestFullscreen && !document.fullscreenElement)
      d.requestFullscreen()
        .then(
          () =>
            screen.orientation &&
            screen.orientation.lock &&
            screen.orientation.lock("landscape").catch(() => {}),
        )
        .catch(() => {});
  } catch (e) {}
}

function tcEditStart(ret) {

function tcEditEnd(saveIt) {

    const vw = innerWidth,
      vh = innerHeight,

/* ======================================================================
 * src/js/debug/debug.js
 * Sistema de debug secreto: panel flotante con herramientas para probar
 * funciones nuevas sin jugar toda la partida.
 *
 * CÓMO ABRIRLO (no aparece en ningún menú):
 *   - Teclado: escribe  debug  en cualquier momento (fuera de un campo de texto).
 *   - Móvil:   toca 7 veces seguidas la esquina superior izquierda de la pantalla.
 *   Se repite la misma acción para cerrarlo. No se guarda: al recargar vuelve oculto.
 *
 * CÓMO AÑADIR TUS PROPIAS HERRAMIENTAS (en src/js/debug/debug-features.js):
 *   dbgAdd("Grupo", "Texto del botón", () => { ...código... });
 *   dbgAdd("Grupo", "Invulnerable", null, { toggle: "god" });   // botón ON/OFF sobre DBG.god
 * Los grupos nuevos se crean solos. Para una opción de tipo interruptor, lee DBG.<clave>
 * en el código que quieras condicionar.
 *
 * Define:
 * DBG, dbgAdd, dbgToggle, dbgBuild, dbgRefresh, dbgTick, dbgWorld, dbgHud
 * ====================================================================== */

const DBG = {
  on: false,
  god: false, // no recibes daño
  mana: false, // maná infinito
  hb: false, // dibuja hitboxes
  fps: false, // muestra FPS
  ts: 1, // velocidad del juego
  groups: [], // [{ n, items: [{ t, f, tg }] }]
  fpsv: 0,
  el: null,
};

function dbgAdd(group, label, fn, opt = {}) {
  let g = DBG.groups.find((q) => q.n == group);
  if (!g) DBG.groups.push((g = { n: group, items: [] }));
  g.items.push({ t: label, f: fn, tg: opt.toggle, lb: opt.label });
  if (DBG.el) dbgBuild();
}

function dbgToggle() {
  DBG.on = !DBG.on;
  if (!DBG.el) dbgBuild();
  DBG.el.style.display = DBG.on ? "block" : "none";
  if (typeof flash == "function") flash("Debug " + (DBG.on ? "activado" : "desactivado"));
}

/** (Re)construye el panel HTML a partir de los grupos registrados. */
function dbgBuild() {
  const open = DBG.el ? [...DBG.el.querySelectorAll("details")].map((d) => d.open) : [];
  if (!DBG.el) {
    DBG.el = document.createElement("div");
    DBG.el.id = "dbg";
    DBG.el.style.cssText =
      "position:fixed;left:6px;top:6px;z-index:50;width:250px;max-height:calc(100vh - 12px);overflow:auto;background:#000d;border:1px solid #c9a24a;border-radius:6px;padding:6px;font:11px monospace;color:#eee;display:" +
      (DBG.on ? "block" : "none");
    document.body.appendChild(DBG.el);
    // no dejar que los clics en el panel lleguen al juego
    for (const ev of ["pointerdown", "pointerup", "mousedown", "mouseup", "click", "wheel"])
      DBG.el.addEventListener(ev, (e) => e.stopPropagation());
  }
  DBG.el.innerHTML = '<b style="color:#c9a24a">DEBUG</b> <small>(escribe "debug" para cerrar)</small>';
  DBG.groups.forEach((g, gi) => {
    const d = document.createElement("details");
    d.open = open[gi] ?? gi == 0;
    d.innerHTML = `<summary style="cursor:pointer;color:#ffd34a;margin-top:4px">${g.n}</summary>`;
    const box = document.createElement("div");
    box.style.cssText = "display:flex;flex-wrap:wrap;gap:3px;margin:3px 0";
    g.items.forEach((it) => {
      const b = document.createElement("button");
      b.style.cssText = "font:11px monospace;padding:3px 5px;cursor:pointer";
      b.onclick = () => {
        try {
          if (it.tg) DBG[it.tg] = !DBG[it.tg];
          if (it.f) it.f();
        } catch (er) {
          console.error(er);
        }
        dbgRefresh();
      };
      b._it = it;
      box.appendChild(b);
    });
    d.appendChild(box);
    DBG.el.appendChild(d);
  });
  dbgRefresh();
}

/** Actualiza el texto de los botones de tipo interruptor. */
function dbgRefresh() {
  if (!DBG.el) return;
  DBG.el.querySelectorAll("button").forEach((b) => {
    const it = b._it;
    b.textContent = it.tg ? `${it.t}: ${DBG[it.tg] === true ? "SÍ" : DBG[it.tg] === false ? "NO" : DBG[it.tg]}` : it.t;
    b.style.background = it.tg && DBG[it.tg] === true ? "#3a6a3a" : "";
  });
}

/** Una vez por fotograma: maná infinito y cálculo de FPS. */
function dbgTick(dt) {
  if (!DBG.on) return;
  if (DBG.mana && P && G.st == "play") P.mp = P.mmp;
  DBG.fpsv += (1 / Math.max(dt, 1e-3) - DBG.fpsv) * 0.1;
}

/** Hitboxes en coordenadas de mundo (se llama dentro de draw(), con el temblor aplicado). */
function dbgWorld() {
  if (!DBG.on || !DBG.hb || G.st != "play") return;
  x.save();
  x.lineWidth = 1;
  const ring = (px, py, r, c) => {
    x.strokeStyle = c;
    x.beginPath();
    x.arc(px, py, r, 0, 7);
    x.stroke();
  };
  ring(P.x, P.y, P.r, "#0f0");
  for (const e of E) ring(e.x, e.y, e.r, "#f44");
  for (const p of PR) ring(p.x, p.y, p.r || 4, p.f == "p" || p.t == "p" ? "#6f6" : "#f84");
  for (const z of Z) ring(z.x, z.y, z.r, "#fa4");
  // círculos de colisión del sprite del arma durante un golpe
  if (SW && SW.owner === P) {
    const pose = swingPose(SW, SW.t),
      A = SW.art,
      rec = A.spr && WSPR[A.spr],
      circ = rec && rec.ready && rec.circ ? rec.circ : FALLBACK_CIRC,
      s = A.s * pose.k,
      ca = Math.cos(pose.ang),
      sa = Math.sin(pose.ang);
    for (const c of circ) {
      const lu = (c.u - A.gu) * s,
        lv = c.v * s * pose.sy;
      ring(P.x + pose.hx + ca * lu - sa * lv, P.y + pose.hy + sa * lu + ca * lv, 1.45 * s, pose.active ? "#ff0" : "#886");
    }
  }
  x.restore();
}

/** Insignias en pantalla (FPS, modos activos). Se llama tras dibujar el HUD. */
function dbgHud() {
  if (!DBG.on) return;
  x.save();
  x.font = "11px monospace";
  x.textAlign = "left";
  const tags = ["DEBUG"];
  if (DBG.fps) tags.push(Math.round(DBG.fpsv) + " FPS");
  if (DBG.god) tags.push("INVULNERABLE");
  if (DBG.mana) tags.push("MANÁ ∞");
  if (DBG.ts != 1) tags.push("×" + DBG.ts);
  x.fillStyle = "#000a";
  const tx = tags.join("  ·  ");
  x.fillRect(4, H - 18, x.measureText(tx).width + 10, 14);
  x.fillStyle = "#ffd34a";
  x.fillText(tx, 9, H - 7);
  x.restore();
}

// --- apertura secreta: teclado (escribir "debug") ---
let dbgBuf = "";
document.addEventListener("keydown", (e) => {
  if (/INPUT|TEXTAREA|SELECT/.test((e.target && e.target.tagName) || "") || !e.key || e.key.length != 1) return;
  dbgBuf = (dbgBuf + e.key.toLowerCase()).slice(-5);
  if (dbgBuf == "debug") {
    dbgBuf = "";
    dbgToggle();
  }
});
// --- apertura secreta: móvil (7 toques en la esquina superior izquierda) ---
let dbgTaps = [];
cv.addEventListener("pointerdown", (e) => {
  const r = cv.getBoundingClientRect(),
    px = ((e.clientX - r.left) / r.width) * W,
    py = ((e.clientY - r.top) / r.height) * H;
  if (px > 70 || py > 40) return;
  const n = Date.now();
  dbgTaps = dbgTaps.filter((t) => n - t < 3000).concat(n);
  if (dbgTaps.length >= 7) {
    dbgTaps = [];
    dbgToggle();
  }
});
