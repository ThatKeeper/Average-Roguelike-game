/* ======================================================================
 * src/js/bosses/boss-core.js
 * Infraestructura común de jefes: zonas telegrafiadas, proyectiles, embestidas, tabla BD y selección de jefe.
 *
 * Define:
 * AMB, amb, los, tz, bt, brs, dsh, ring, tp, BD, FIN, bossDepth, bossIdx
 * ====================================================================== */

// ===== JEFES: 7 normales + 5 finales. Cada uno tiene su propia funcion de comportamiento (BO[i].up) =====
// Infraestructura comun: vida, daño, fases (por % de vida), inmunidad (imm), ventana de vulnerabilidad (vul, +60% daño),
// zonas telegrafiadas (tz), proyectiles (bt/brs con curva cv o rastreo hm) y embestidas (dsh). Lo específico está en cada jefe.
Object.assign(ET, {
  dummy: { hp: 300, sp: 0, dm: 0, r: 16, c: "#a86", ai: "x" },
  decoy: { hp: 1, sp: 0, dm: 0, r: 24, c: "#999", ai: "x" },
  orb: { hp: 40, sp: 0, dm: 0, r: 12, c: "#a4f", ai: "x" },
});
let AMB = [];
function amb(dt) {
  if (AMB.length < (LOW ? 16 : 40))
    AMB.push({ x: rnd(50, 910), y: rnd(50, 550), v: rnd(8, 26), s: rnd(1, 3), p: rnd(0, 6) });
  for (const a of AMB) {
    a.y -= a.v * dt;
    a.x += Math.sin((a.p += dt)) * 10 * dt;
    if (a.y < 50) {
      a.y = 550;
      a.x = rnd(50, 910);
    }
  }
}
function los(a, b) {
  for (const o of RM_.obs)
    if (!o.pit)
      for (let i = 1; i < 12; i++) {
        const px = a.x + ((b.x - a.x) * i) / 12,
          py = a.y + ((b.y - a.y) * i) / 12;
        if (px > o.x && px < o.x + o.w && py > o.y && py < o.y + o.h) return false;
      }
  return true;
}
function tz(x0, y0, r, t, d, c) {
  bsnd((E.find((q) => q.t == "boss") || { bi: 0 }).bi, "atk");
  Z.push({ x: x0, y: y0, r, t, m: t, d, c: c || "#f55" });
}
function bt(e, a, sp, d, cv = 0, c = "#cf6", hm = 0) {
  PR.push({
    x: e.x,
    y: e.y,
    vx: Math.cos(a) * sp,
    vy: Math.sin(a) * sp,
    r: 6,
    d,
    l: 5,
    f: "e",
    c,
    cv,
    hm,
  });
}
function brs(e, n, sp, d, o = 0, cv = 0, c = "#f5a") {
  for (let i = 0; i < n; i++) bt(e, (i / n) * 6.283 + o, sp, d, cv, c);
}
function dsh(e, t, sp) {
  bsnd(e.bi || 0, "atk");
  const a = Math.atan2(P.y - e.y, P.x - e.x);
  e.lu = t;
  e.lh = 0;
  e.lvx = Math.cos(a) * sp;
  e.lvy = Math.sin(a) * sp;

function spawnBoss() {
  const i = G.bo ?? bossIdx(G.d),
    B = BD[i],
    b = spawn("boss", 480, 150);
  b.bi = i;
  b.nm = B.n;
  b.r = B.r;
  b.hp = b.mhp *= B.hp * (FIN(i) ? 1.1 : 1);
  b.dmg *= FIN(i) ? 1.25 : 1;
  b.al = 1;
  b.sp = 2.4;
  b.t1 = 2;
  b.dir = Math.random() < 0.5 ? 1 : -1;
  G.intro = { n: B.n, i, t: 2.4 };
  bsnd(i, "in");
  ring(b, 120, B.c);
  G.bo = undefined;
  return b;
}
function bossDie(e) {
  let nu = [];
  if (!G.arena) {
    S.bosses[e.bi] = 1;

const adH = () =>

      ? 1 +
        Math.min(
          1.2,
          0.4 * Math.max(0, P.dm * P.edm * P.w.rm - 1.2) +
            0.35 * Math.max(0, P.mhp / (130 + 14 * G.d) - 1),
        )

  adD = () =>
    P
      ? 1 +
        Math.min(
          0.6,
          0.3 * Math.max(0, P.mhp / (130 + 14 * G.d) - 1) + 0.15 * Math.max(0, P.dm * P.edm - 1.3),

  if (!e.sc || !e.sc.length) return;

  e.sc = e.sc.filter((q) => q.t > 0);
  rd.forEach((q) => q.f());
}
function guard(e, dt) {

  e.wg = (e.wg || 0) + dt;
  if (e.wg > 20) {

    [...(e.mn || []), ...(e.dc || []), ...(e.orb || [])].forEach((q) => {

  } else if (m == 1)
    c.mv(-c.ny * c.sp * e.dir + c.nx * c.sp * 0.3, c.nx * c.sp * e.dir + c.ny * c.sp * 0.3);
  else if (c.d < 240) c.mv(-c.nx * c.sp, -c.ny * c.sp);
  else if (c.d > 330) c.mv(c.nx * c.sp, c.ny * c.sp);
  if (e.t1 <= 0) {
    const L = [...(F ? K.slice(0, 5 + c.ph) : K), "$", "$"],
      n = (e.k = (e.k || 0) + 1);
    let ak = L[rk(e, L.length)];
    if (ak == "$" && e.ls) ak = L[0];
    e.ls = ak == "$";
    if (ak == "$") sig(e, c, k);
    else AT2[ak][1](e, c, k);
    e.t1 = 2.2 - c.ph * 0.3 - (F ? 0.2 : 0) + rnd(0, 0.5);
    if (F && c.ph == 2 && Math.random() < 0.35) {
      const q = { x: rnd(120, 840), y: rnd(120, 480) };
      for (let X = 100; X < 870; X += 100)
        for (let Y = 100; Y < 520; Y += 100)
          if (Math.hypot(X - q.x, Y - q.y) > 115) tz(X, Y, 60, 1.6, e.dmg, k);
      flash("¡El suelo cede! Busca un refugio");
    }
    if (F && c.ph >= 1 && Math.random() < 0.2) {
      flash("¡Controles invertidos en 1 s!");
      later(e, 1, () => {
        P.invc = 3;
      });
    }
    e.vn = (e.vn ?? 3 + ((Math.random() * 3) | 0)) - 1;
    if (e.vn <= 0) {
      e.vn = 3 + ((Math.random() * 3) | 0);
      e.vul = 1.6;
      e.t1 = 1.6;
      flash(e.nm + " queda expuesto");
    }
  }
}

const TF = [
  () => {},

  (e, c, k) => {
    if (c.d > 40) tz(e.x, e.y, 30, 1, e.dmg * 0.6, k);
  },
  (e, c, k) => brs(e, 10, 170, e.dmg * 0.4, 0, 0, k),
  (e, c, k) => {
    e.mn = (e.mn || []).filter((q) => q.hp > 0 && !q.dead);
    if (e.mn.length < 3) {
      const q = spawn("runner", e.x + rnd(-80, 80), e.y + 60);

  (e, c, k) => {

];
const SG = [
  (e, c, k, p) => {

  (e, c, k, p) => {
    const ar = Math.max(3, p.n >> 1);

        for (let a = 0; a < ar; a++) {

        }
      });
  },
  (e, c, k, p) => {
    const g = (Math.random() * 10) | 0,
      d = p.reps % 2 ? 1 : -1;
    for (let j = 0; j < 12; j++)
      if (Math.abs(j - g) > 1)
        later(e, j * 0.12, () => {
          const X = d > 0 ? 90 + j * 70 : 860 - j * 70;
          for (let Y = 100; Y <= 520; Y += 105) tz(X, Y, 38, 0.9, e.dmg, k);
        });
  },
  (e, c, k, p) => {
    for (let q = 0; q < 2; q++)
      later(e, q * 1.1, () => {
        const a = ang(e, P);
        e.wd = 0.5;
        for (let s = 1; s <= 8; s++)
          tz(e.x + Math.cos(a) * s * 80, e.y + Math.sin(a) * s * 80, 36, 0.9 + s * 0.05, e.dmg, k);
        later(e, 0.6, () => dsh(e, 0.35, 600));
      });
  },
  (e, c, k, p) => {
    for (let ph = 0; ph < 2; ph++)
      for (let X = 90; X <= 870; X += 110)
        for (let Y = 100; Y <= 520; Y += 105)
          if (((((X - 90) / 110) | 0) + (((Y - 100) / 105) | 0)) % 2 == ph)
            tz(X, Y, 42, 1.1 + ph * 1, e.dmg, k);
  },
  (e, c, k, p) => {
    [220, 150, 80].forEach((R_, j) =>
      later(e, j * 0.5, () => {
        for (let a = 0; a < 8 + (p.n % 3) * 2; a++) {
          const an = (a * 6.283) / (8 + (p.n % 3) * 2);
          tz(P.x + Math.cos(an) * R_, P.y + Math.sin(an) * R_, 40, 0.8, e.dmg, k);
        }
      }),
    );
  },
  (e, c, k, p) => {
    for (let j = 0; j < p.reps; j++)
      later(e, j * 0.45, () => {
        const a = ang(e, P);
        for (let i = 0; i < p.n; i++)
          bt(e, a + (i - (p.n - 1) / 2) * 0.09, p.spd + j * 40, e.dmg * 0.5, 0, k);
      });
  },
  (e, c, k, p) => {
    for (let j = 0; j < p.reps; j++)
      later(e, j * 0.5, () => {
        const o = Math.random() * 6.28,
          m = 12 + p.n;
        for (let i = 0; i < m; i++)
          if ((i + j) % 5 > 1) bt(e, o + (i * 6.283) / m, p.spd, e.dmg * 0.45, 0, k);

    r = rngS(i * 131 + 7);

    nm: SNM[j],
    kd: j % 8,
    tr: (j * 5 + (j >> 3)) % 8,
    n: 6 + ((r() * 8) | 0),
    reps: 2 + ((r() * 3) | 0),
    spd: 150 + ((r() * 120) | 0),
    cb: (j * 3 + 1) % 5,
  };
}
const SIG = {};
function sig(e, c, k) {
  const p = SIG[e.bi],
    q = c.ph == 2 && FIN(e.bi) ? { ...p, reps: p.reps + 1, n: p.n + 2 } : p;
  flash("«" + p.nm + "»");
  SG[p.kd](e, c, k, q);
  const K = KIT[e.bi];
  later(e, 1.1, () => AT2[K[p.cb]][1](e, c, k));
}
for (let i = 12; i < 44; i++) {
  SIG[i] = mkSig(i);
  const F = i >= 34,
    r = rngS(i * 7919 + 13),
    ks = Object.keys(AT2)
      .map((v) => [r(), v])
      .sort((a, b) => a[0] - b[0])
      .map((a) => a[1])
      .slice(0, F ? 7 : 5);
  KIT[i] = ks;
  BD.push({
    n: NN[i - 12],
    c: PAL[i % 12],
    r: F ? 32 + (i % 3) * 2 : 22 + ((i * 5) % 12),
    hp: F ? 2 + (i % 3) * 0.15 : 0.8 + ((i * 7) % 6) * 0.1,
    sh: i % 6,
  });
  BO.push({ up: kitUp });
  BDS.push(
    (F ? "Jefe final de 3 fases. " : "") +
      "Firma «" +
      SIG[i].nm +
      "» · Rasgo: " +
      TRN[SIG[i].tr] +
      " · Ataques: " +
      ks.map((k) => AT2[k][0]).join(", ") +
      (F ? ". Fase 3: el suelo cede y los controles se invierten." : "."),
  );
}

function titleFrame(dt) {

  x.textBaseline = "middle";

    x.globalAlpha = 1 - G.tf / 0.5;

  x.restore();
}

function okItems(it) {
  const cs = 20,
    nx = 43,
    ny = 25,
    B = new Uint8Array(nx * ny);
  for (let j = 0; j < ny; j++)
    for (let i = 0; i < nx; i++) {
      const cx = 60 + i * cs,
        cy = 60 + j * cs;
      if (
        it.some((b) => cx > b.x - 14 && cx < b.x + b.w + 14 && cy > b.y - 14 && cy < b.y + b.h + 14)
      )
        B[j * nx + i] = 1;
    }
  const id = (px, py) => (((py - 50) / cs) | 0) * nx + (((px - 50) / cs) | 0),
    a0 = id(480, 300);
  if (B[a0]) return false;
  const sn = new Uint8Array(nx * ny),
    st = [a0];
  sn[a0] = 1;
  let n = 0;
  while (st.length) {
    const c = st.pop();
    n++;
    const ci = c % nx,
      cj = (c / nx) | 0;
    for (const [di, dj] of [
      [1, 0],
      [-1, 0],
      [0, 1],
      [0, -1],
    ]) {
      const a = ci + di,
        b = cj + dj;
      if (a < 0 || b < 0 || a >= nx || b >= ny) continue;
      const q = b * nx + a;
      if (!B[q] && !sn[q]) {
        sn[q] = 1;
        st.push(q);
      }
    }
  }
  let fr = 0;
  for (let q = 0; q < nx * ny; q++) if (!B[q]) fr++;
  return (
    n == fr &&
    [
      [480, 80],
      [880, 300],
      [480, 520],
      [80, 300],
      [480, 170],
    ].every((p) => sn[id(p[0], p[1])])
  );

/* ======================================================================

 * hx, safe, drawBoss
 * ====================================================================== */

// hx: añade transparencia a un color #RGB o #RRGGBB (concatenar '77' a '#b87' daba un color inválido y rompía el render)
const hx = (h, a) => (h.length == 4 ? "#" + h[1] + h[1] + h[2] + h[2] + h[3] + h[3] : h) + a;
function safe(f, e) {
  x.save();
  try {
    f(e);
  } catch (er) {
    console.error(er);
  } finally {
    x.restore();
  }
}
function drawBoss(e) {
  const B = BD[e.bi] || BD[0],
    r = e.r,
    c = e.col || B.c,
    t = e.tm || 0,
    a = Math.atan2(P.y - e.y, P.x - e.x),
    F = e.fl > 0 ? "#fff" : c;
  x.save();
  x.translate(e.x, e.y);
  if (e.t == "decoy") x.globalAlpha = 0.78 + 0.2 * Math.sin(t * 9);
  const g = x.createRadialGradient(0, 0, r * 0.2, 0, 0, r * 1.8);
  g.addColorStop(0, hx(c, "77"));
  g.addColorStop(1, hx(c, "00"));
  x.fillStyle = g;
  x.beginPath();
  x.arc(0, 0, r * 1.8, 0, 7);
  x.fill();
  const S2 = (n, r1, r2, o) => {
      x.beginPath();
      for (let i = 0; i < n * 2; i++) {
        const q = o + (i * Math.PI) / n;
        x.lineTo(Math.cos(q) * (i % 2 ? r2 : r1), Math.sin(q) * (i % 2 ? r2 : r1));
      }
      x.closePath();
      x.fill();
      x.stroke();
    },
    C = (rr, fill) => {
      x.beginPath();
      x.arc(0, 0, rr, 0, 7);
      if (fill) x.fill();
      else x.stroke();
    };

  x.strokeStyle = "#000";
  x.lineWidth = 3;
  if (e.t == "orb") {
    x.fillStyle = "#a4f";
    C(r, 1);
    x.stroke();
  } else
    switch (e.bi > 11 ? 100 + BD[e.bi].sh : e.bi) {
      case 0:
        x.save();
        x.rotate(a);
        x.beginPath();
        x.ellipse(0, 0, r, r * 0.8, 0, 0, 7);
        x.fill();
        x.stroke();
        x.strokeStyle = "#fff";
        x.lineWidth = 4;
        x.beginPath();
        x.moveTo(r * 0.4, -r * 0.5);
        x.lineTo(r * 2, r * 0.2);
        x.moveTo(r * 0.4, r * 0.5);
        x.lineTo(r * 2, -r * 0.2);
        x.stroke();
        x.restore();
        break;
      case 1:
        x.fillRect(-r, -r, 2 * r, 2 * r);
        x.strokeRect(-r, -r, 2 * r, 2 * r);
        for (const s of [-1, 1]) {
          x.beginPath();
          x.arc(s * r * 1.15, Math.sin(t * 3) * 5, r * 0.45, 0, 7);
          x.fill();
          x.stroke();
        }
        S2(8, r * 1.25, r * 0.95, t * 0.2);
        break;
      case 2:
        x.save();
        x.rotate(a);
        S2(4, r * 1.4, r * 0.5, 0);
        x.strokeStyle = "#fff";
        x.lineWidth = 3;
        x.beginPath();
        x.arc(0, 0, r * 1.7, -1, 1);
        x.stroke();
        x.restore();
        break;
      case 3:
        for (let i = 0; i < 3; i++) {
          x.save();
          x.rotate(t + i * 2.09);
          x.globalAlpha *= 0.75;
          S2(3, r * 1.1, r * 0.5, 0);
          x.restore();
        }
        break;
      case 4:
        S2(6, r, r * 0.9, 0);
        for (let i = 0; i < 4; i++) {
          const q = t * 1.5 + i * 1.57;
          x.fillRect(Math.cos(q) * r * 1.6 - 4, Math.sin(q) * r * 1.6 - 4, 8, 8);
        }
        break;
      case 5:
        if (!e.tf) S2(8, r * 1.35, r * 0.7, t);
        else {
          for (const s of [-1, 1]) {
            x.beginPath();
            x.moveTo(0, 0);
            x.lineTo(s * r * 2.2, -r * 1.1 + Math.sin(t * 8) * 6);
            x.lineTo(s * r * 1.5, r * 0.6);
            x.closePath();
            x.fill();
            x.stroke();
          }
          C(r * 0.8, 1);
          x.stroke();
        }
        break;
      case 6:
        C(r, 1);
        x.stroke();
        x.strokeStyle = "#fff";
        C(r * 1.3);
        C(r * 1.55);
        x.strokeStyle = "#000";
        x.save();
        x.translate(0, -r * 0.9);
        S2(5, r * 0.6, r * 0.3, -1.57);
        x.restore();
        break;
      case 7:
        C(r, 1);
        x.stroke();
        x.fillStyle = "#000";
        x.beginPath();
        x.arc(-r * 0.35, -r * 0.1, r * 0.2, 0, 7);
        x.arc(r * 0.35, -r * 0.1, r * 0.2, 0, 7);
        x.fill();
        x.fillRect(-r * 0.3, r * 0.3, r * 0.6, r * 0.12);
        x.fillStyle = "#fd4";
        x.save();
        x.translate(0, -r * 1.05);
        S2(4, r * 0.5, r * 0.25, -1.57);
        x.restore();
        break;

/* ======================================================================
 * src/js/render/draw-melee.js
 * Dibujo del arma cuerpo a cuerpo en la mano (reposo, guardia y golpe)
 * y de la estela que deja al atacar.
 *
 * Define:
 * drawMeleeSprite, drawHeldMelee, drawSwingTrail
 * ====================================================================== */

/**
 * Dibuja el sprite con la mano en (px, py) y el eje del arma apuntando a `wa`.
 * `k` escala el arma, `sy` = -1 la voltea, `alpha` multiplica la opacidad actual.
 */
function drawMeleeSprite(A, px, py, wa, k, sy, alpha, glow) {
  const rec = A.spr && WSPR[A.spr],
    s = A.s * k;
  x.save();
  x.globalAlpha *= alpha;
  x.translate(px, py);
  x.rotate(wa);
  if (sy < 0) x.scale(1, -1);
  if (rec && rec.ready) {
    x.imageSmoothingEnabled = false;
    x.rotate(Math.PI / 4); // el sprite viene en diagonal: así su eje queda en +x
    x.scale(s, s);
    if (glow) {
      x.shadowColor = glow;
      x.shadowBlur = 8;
    }
    // la mano queda en el origen: la empuñadura está en gu sobre el eje
    x.drawImage(rec.img, -(8 + A.gu / SQ2), -(8 - A.gu / SQ2));
  } else {
    // sin sprite: hoja sencilla
    x.strokeStyle = "#dde";
    x.lineWidth = 4;
    x.beginPath();
    x.moveTo(0, 0);
    x.lineTo((A.tu - A.gu) * s, 0);
    x.stroke();
    x.strokeStyle = "#864";
    x.lineWidth = 5;
    x.beginPath();
    x.moveTo(2, -5);
    x.lineTo(2, 5);
    x.stroke();
  }
  x.restore();
}

/** Arma en la mano del jugador. Se llama dentro de drawP, ya trasladado al jugador. */
function drawHeldMelee() {
  const A = meleeArt(P.w),
    f = P.face;
  if (SW && SW.owner === P) {
    const pose = swingPose(SW, SW.t);
    drawMeleeSprite(A, pose.hx, pose.hy, pose.ang, pose.k, pose.sy, 1, pose.ph == 1 ? SW.fx.c : null);
  } else if (P.g) {
    // guardia: el arma cruzada delante del cuerpo; brilla durante la ventana de parry
    const parry = P.gt < 0.22 && !(P.pcd > 0);
    drawMeleeSprite(A, Math.cos(f + 0.25) * 12, Math.sin(f + 0.25) * 12, f - 1.1, 0.9, 1, 1, parry ? "#fff" : null);
  } else {
    const wob = Math.sin(Date.now() / 240) * 0.03,
      sy = A.edge ? (A.edge === SWDIR ? 1 : -1) : 1;
    drawMeleeSprite(A, Math.cos(f + A.idle * 0.45) * IDLE_HR, Math.sin(f + A.idle * 0.45) * IDLE_HR, f + A.idle + wob, IDLE_K, sy, 1, null);
  }
}

/** Estela de un golpe: banda translúcida entre posiciones sucesivas del arma + copias fantasma del sprite. */
function drawSwingTrail(f) {
  const age = f.m - f.t,
    pts = f.pts,
    A = f.art;
  x.save();
  for (let i = 0; i < pts.length; i++) {
    const b = pts[i],
      al = 1 - (age - b.t) / f.life;
    if (al <= 0) continue;
    if (i % 3 == 0) {
      // copia fantasma del sprite (uno por fotograma)
      x.globalAlpha = 1;
      drawMeleeSprite(A, b.gx, b.gy, b.ang, b.k, b.sy, al * 0.22, null);
    }
    if (i == 0) continue;
    const a = pts[i - 1];
    if (A.fam == "thrust") {
      // estocada: líneas de velocidad a lo largo del arma
      const dx = b.x2 - b.x1,
        dy = b.y2 - b.y1,
        n = Math.hypot(dx, dy) || 1;
      x.strokeStyle = f.c;
      x.lineWidth = 2;
      for (const o of [-6, 0, 6]) {
        x.globalAlpha = al * 0.6;
        x.beginPath();
        x.moveTo(b.x1 - (dy / n) * o, b.y1 + (dx / n) * o);
        x.lineTo(b.x2 - (dy / n) * o, b.y2 + (dx / n) * o);
        x.stroke();
      }
      continue;
    }
    x.globalAlpha = al * 0.5;
    x.fillStyle = f.c;
    x.beginPath();
    x.moveTo(a.x1, a.y1);
    x.lineTo(a.x2, a.y2);
    x.lineTo(b.x2, b.y2);
    x.lineTo(b.x1, b.y1);
    x.closePath();
    x.fill();
    x.globalAlpha = al * 0.9;
    x.strokeStyle = "#fff";
    x.lineWidth = f.lw;
    x.beginPath();
    x.moveTo(a.x2, a.y2);
    x.lineTo(b.x2, b.y2);
    x.stroke();
  }
  x.restore();
}

/* ======================================================================
 * src/js/render/draw-ranged.js
 * Dibujo del arma a distancia en la mano (arco, ballesta, arma rúnica,
 * chakram y báculos) y de los proyectiles con sus sprites.
 *
 * Define:
 * drawRangedSprite, drawHeldRanged, drawProj
 * ====================================================================== */

/**
 * Dibuja un sprite de arma a distancia con la mano en (px, py) y su dirección de disparo hacia `wa`.
 * `extra` es un giro adicional sobre su propio centro (chakram).
 */
function drawRangedSprite(A, key, px, py, wa, extra, glow) {
  const rec = WSPR[key];
  if (!rec || !rec.ready) return;
  x.save();
  x.translate(px, py);
  x.rotate(wa);
  x.imageSmoothingEnabled = false;
  if (extra) x.rotate(extra);
  x.rotate(A.rot);
  x.scale(A.s, A.s);
  if (glow) {
    x.shadowColor = glow;
    x.shadowBlur = 10;
  }
  x.drawImage(rec.img, -(8 + A.gu * Math.cos(A.rot)), -(8 - A.gu * Math.sin(A.rot)));
  x.restore();
}

/** Arma a distancia en la mano del jugador. Se llama dentro de drawP, ya trasladado al jugador. */
function drawHeldRanged() {
  const A = RANGED_ART[P.w.n];
  if (!A) return;
  const f = P.face,
    e = RK / RK_TIME, // 1 justo al disparar, 0 en reposo
    ready = rangedReady(),
    hd = A.hd - A.kick * e,
    tilt = A.kick > 0 ? -0.25 * e * (Math.cos(f) >= 0 ? 1 : -1) : 0,
    wob = A.kick < 0 ? Math.sin(Date.now() / 300) * 0.04 : 0;
  drawRangedSprite(
    A,
    ready ? A.spr2 : A.spr,
    Math.cos(f) * hd,
    Math.sin(f) * hd,
    f + tilt + wob,
    A.spin ? (Date.now() / 1000) * A.spin : 0,
    (ready && A.kick < 0) || e > 0 ? A.glow : null,
  );
}

/** Dibuja un proyectil del jugador con su sprite. Devuelve false si no hay sprite listo (se usa el círculo). */
function drawProj(p) {
  const A = PROJ_ART[p.spr],
    rec = A && WSPR[p.spr];
  if (!rec || !rec.ready) return false;
  const s = A.s * cl(p.r / A.r, 0.8, 1.5);
  x.save();
  x.translate(p.x, p.y);
  x.rotate(A.spin ? (p.l0 - p.l) * A.spin : Math.atan2(p.vy, p.vx));
  x.imageSmoothingEnabled = false;
  x.scale(s, s);
  if (p.gl) {
    x.shadowColor = p.gl;
    x.shadowBlur = 8;
  }
  x.drawImage(rec.img, -A.ax, -A.ay);
  x.restore();
  return true;
}

// ===== SPRITES PROCEDURALES (formas por capas con animación) Y SONIDOS DE JEFE =====
// Los enemigos normales y el jugador se dibujan con siluetas propias, orientadas hacia su objetivo, con balanceo al moverse,
// anticipación de ataque (pulso), estiramiento en embestidas, destello al recibir daño y animación de muerte (FX 'dead').
const star = (n, r1, r2, o) => {
  x.beginPath();
  for (let i = 0; i < n * 2; i++) {
    const q = o + (i * Math.PI) / n,
      rr = i % 2 ? r2 : r1;
    x.lineTo(Math.cos(q) * rr, Math.sin(q) * rr);

// ---- src/js/spells/cards.js ----
/* ======================================================================
 * src/js/spells/cards.js
 * Cartas de hechizo (Mago): niveles, requisitos, desbloqueos, normalización del guardado y equipamiento.
 *
 * Define:
 * ETIER, EFORM, STARTERS, EREQ, FN, tsum, CARDS, CORDER, reqOK, reqTxt, checkUnlocks
 * normS, equipCard, unequipCard, castCard
 * ====================================================================== */

// ===== CARTAS DE HECHIZO (solo Mago), PROGRESO PERMANENTE Y HUD =====
// Progreso PERMANENTE (localStorage, S): mejor profundidad, jefes derrotados en partidas normales, cartas desbloqueadas y espacios equipados.
// Progreso TEMPORAL (P, se reinicia en cada run): vida, maná, nivel, equipo, reliquias, talentos. La práctica (Arena) no escribe nada permanente.
const ETIER = {
    fire: 0,
    ice: 0,
    light: 0,
    water: 1,
    plant: 1,
    wind: 1,
    rock: 2,
    dark: 2,
    blood: 3,
    corr: 3,
  },
  EFORM = {
    fire: "bolt",
    ice: "nova",
    light: "bolt",
    water: "zone",
    plant: "zone",
    wind: "cone",
    rock: "bolt",
    dark: "cone",
    blood: "bolt",
    corr: "zone",
  },
  STARTERS = ["fire", "ice", "light"];
const EREQ = {
    water: [["depth", 2]],
    plant: [["depth", 3]],
    wind: [["depth", 4]],
    rock: [["boss", 0]],
    dark: [["boss", 2]],
    blood: [["boss", 4]],
    corr: [["boss", 6]],
  },
  FN = { bolt: "Proyectil", nova: "Nova", cone: "Cono", zone: "Zona" };
const tsum = (k) => k.split("+").reduce((s, z) => s + ETIER[z], 0),
  CARDS = {},
  CORDER = [];
Object.keys(EL)
  .sort((a, b) => ETIER[a] - ETIER[b])
  .forEach((k) => {
    CARDS[k] = { k, a: k, b: "", f: EFORM[k], n: EL[k].n, req: EREQ[k] || [] };
    CORDER.push(k);
  });
Object.keys(CB)
  .sort((p, q) => tsum(p) - tsum(q) || p.localeCompare(q))
  .forEach((k) => {
    const [a, b] = k.split("+"),
      t = tsum(k),
      req = [
        ["card", a],
        ["card", b],
        ["depth", 2 + t],
      ];
    if (t >= 4) req.push(["boss", t - 2]);
    CARDS[k] = { k, a, b, f: CB[k].f || "bolt", n: CB[k].n, req };
    CORDER.push(k);
  });
const reqOK = (r) =>
  r[0] == "depth"
    ? S.best >= r[1]
    : r[0] == "boss"
      ? Object.keys(S.bosses).length > r[1]
      : !!S.cards.unlocked[r[1]];
const reqTxt = (r) =>
  r[0] == "depth"
    ? `Alcanzar la profundidad ${r[1]} (tu mejor: ${S.best})`
    : r[0] == "boss"
      ? `Derrotar a ${r[1] + 1} jefes distintos en partidas normales`
      : `Tener la carta de ${EL[r[1]].n}`;
function checkUnlocks() {
  const nu = [];
  let ch = 1;
  while (ch) {
    ch = 0;
    for (const k of CORDER)
      if (!S.cards.unlocked[k] && CARDS[k].req.every(reqOK)) {
        S.cards.unlocked[k] = 1;
        nu.push(CARDS[k].n);
        ch = 1;
      }
  }
  return nu;
}
// Guardado: tolera datos inexistentes, incompletos, corruptos o antiguos (v1 sin cartas → v2; los jefes de profundidades superadas se dan por derrotados)
function normS() {
  const o = (v) => (v && typeof v == "object" && !Array.isArray(v) ? v : {});
  S.best = +S.best || 0;
  S.souls = +S.souls || 0;
  S.pw = +S.pw || 0;
  S.hard = !!S.hard;
  if (S.hard && !S.hv2 && S.best < 11) S.hard = false;
  if (S.best >= 11) S.hard = true;
  if (S.hard) S.hv2 = 1;
  S.st = o(S.st);
  S.up = o(S.up);
  if (S.fv !== 2) {
    S.fv = 2;
    S.souls += (40 * S.pw * (S.pw + 1)) / 2;
    S.pw = 0;
  }
  S.bk = o(S.bk);
  S.ach = o(S.ach);
  S.bosses = o(S.bosses);
  S.cards = o(S.cards);
  S.cards.unlocked = o(S.cards.unlocked);
  const sl = Array.isArray(S.cards.slots) ? S.cards.slots.slice(0, 4) : [];
  while (sl.length < 4) sl.push(null);
  if (S.v !== 2) {
    S.v = 2;
    for (let i = 0; i < 7; i++) if (S.best > i + 1) S.bosses[i] = 1;
    STARTERS.forEach((k, i) => {
      S.cards.unlocked[k] = 1;
      sl[i] = k;
    });
  }
  checkUnlocks();
  for (const k in S.cards.unlocked) if (!CARDS[k]) delete S.cards.unlocked[k];
  S.cards.slots = sl.map((k) => (CARDS[k] && S.cards.unlocked[k] ? k : null));
  save();
}
normS();
function equipCard(k, sl) {
  if (!P || P.cls != "g" || !CARDS[k] || sl < 0 || sl > 3) return false;
  if (!S.cards.unlocked[k]) {
    flash("Carta bloqueada: " + CARDS[k].req.filter((r) => !reqOK(r)).map(reqTxt)[0]);
    return false;
  }
  const s = S.cards.slots,
    o = s.indexOf(k);
  if (o >= 0) s[o] = s[sl];
  s[sl] = k;
  save();
  return true;
}
function unequipCard(sl) {
  S.cards.slots[sl] = null;
  save();
}
function castCard(i) {
  const k = S.cards.slots[i];
  if (!k || !S.cards.unlocked[k] || !P || P.cls != "g") return;
  const c = CARDS[k];
  castSp({ a: c.a, b: c.b, f: c.f }, 4 + i);
}

/* ======================================================================
 * src/js/ui/spell-book.js

 * slotAt, drop, dragify, book
 * ====================================================================== */

// ---- ventana de cartas: arrastrar (ratón y táctil) o tocar carta y luego espacio ----
function slotAt(ev) {
  const el = document.elementFromPoint(ev.clientX, ev.clientY),
    s = el && el.closest && el.closest("[data-slot]");
  return s ? +s.dataset.slot : -1;
}
function drop(k, s, from) {
  if (s >= 0) {
    if (!S.cards.unlocked[k]) flash("Carta bloqueada");
    else equipCard(k, s);

  book(1);
}
function dragify(el, k, from) {
  el.style.touchAction = "none";
  el.onpointerdown = (e) => {
    const sx = e.clientX,
      sy = e.clientY;
    let g = null;
    const mv = (ev) => {
        if (!g && Math.hypot(ev.clientX - sx, ev.clientY - sy) > 6) {
          g = el.cloneNode(true);
          g.style.cssText += ";position:fixed;pointer-events:none;opacity:.85;z-index:99";
          ov.appendChild(g);
          el.style.opacity = 0.4;
        }
        if (g) {
          g.style.left = ev.clientX - 60 + "px";
          g.style.top = ev.clientY - 40 + "px";
        }
      },
      up = (ev) => {
        window.removeEventListener("pointermove", mv);
        window.removeEventListener("pointerup", up);
        if (g) {
          g.remove();
          el.style.opacity = 1;
          drop(k, slotAt(ev), from);
        } else {
          G.csel = k;

    window.addEventListener("pointerup", up);
  };
}
function book(f) {

  if (G.bk && !f) {
    hide();
    return;
  }

  G.pz = 1;

    PS = 6,

        `padding:4px 9px;font-size:12px;border-color:${c || "#c9a24a"};` +

  let r = row();
  r.appendChild(mkb("Cerrar (B)", hide));

    d.innerHTML = `<small>Espacio ${i + 1} \u00b7 tecla ${KL(KY["c" + (i + 1)])}</small><br><b>${k ? CARDS[k].n : "(vac\u00edo)"}</b>`;
    d.onclick = () => {

    r.appendChild(d);
  }
  ov.insertAdjacentHTML(
    "beforeend",
    `<small>${G.csel ? "Seleccionada: " + CARDS[G.csel].n + " \u2192 toca un espacio" : "Toca un espacio ocupado para vaciarlo"}</small>`,
  );
  r = row();

    ([k, n]) =>
      r.appendChild(
        mkb(

    r.appendChild(d);
  });
  if (L.length > PS) {
    r = row();
    const pv = mkb(
      "\u2039 Anterior",
      () => {

        book(1);
      },

    );

      () => {

      },
      0,

    nx.disabled = (pg + 1) * PS >= L.length;
    r.appendChild(nx);
    ov.insertAdjacentHTML(
      "beforeend",
      `<small>P\u00e1gina ${pg + 1}/${Math.ceil(L.length / PS)}</small>`,
    );
  }
}

// ---- src/js/render/hud-slots.js ----
/* ======================================================================
 * src/js/render/hud-slots.js
 * Casillas del HUD con iconos, teclas, estado y etiquetas.
 *
 * Define:
 * KL, rr, ico, HT, slot, hudSlots
 * ====================================================================== */

// ---- HUD: casillas con icono, tecla, estado (listo, enfriamiento, sin maná, seleccionado) y etiqueta contextual al pasar el ratón ----
const KL = (c) =>
  (c || "").replace("Key", "").replace("Digit", "").replace("Space", "ESP").replace("Arrow", "");
function rr(px, py, w, h, r) {
  x.beginPath();
  x.moveTo(px + r, py);
  x.arcTo(px + w, py, px + w, py + h, r);
  x.arcTo(px + w, py + h, px, py + h, r);
  x.arcTo(px, py + h, px, py, r);
  x.arcTo(px, py, px + w, py, r);
  x.closePath();
}
function ico(id, cx, cy, s, c) {
  x.save();
  x.translate(cx, cy);
  x.strokeStyle = c;
  x.fillStyle = c;
  x.lineWidth = 2;
  const r = s / 2;
  switch (id) {
    case "whirl":
      x.beginPath();
      x.arc(0, 0, r * 0.7, 0, 4.7);
      x.stroke();
      x.beginPath();
      x.moveTo(r * 0.7, -r * 0.1);
      x.lineTo(r * 0.4, -r * 0.5);
      x.lineTo(r * 0.95, -r * 0.45);
      x.fill();
      break;
    case "leap":
      x.beginPath();
      x.moveTo(-r * 0.7, r * 0.6);
      x.quadraticCurveTo(0, -r, r * 0.7, r * 0.6);
      x.stroke();
      x.fillRect(-r * 0.8, r * 0.6, r * 1.6, 3);
      break;
    case "guard":
      x.beginPath();
      x.moveTo(0, -r * 0.8);
      x.lineTo(r * 0.7, -r * 0.4);
      x.lineTo(r * 0.5, r * 0.5);
      x.lineTo(0, r * 0.85);
      x.lineTo(-r * 0.5, r * 0.5);
      x.lineTo(-r * 0.7, -r * 0.4);
      x.closePath();
      x.stroke();
      break;
    case "volley":
      for (let i = -1; i <= 1; i++) {
        x.beginPath();
        x.moveTo(-r * 0.7, i * r * 0.45);
        x.lineTo(r * 0.7, i * r * 0.45);
        x.lineTo(r * 0.45, i * r * 0.45 - 4);
        x.stroke();
      }
      break;
    case "bomb":
      x.beginPath();
      x.arc(0, r * 0.1, r * 0.5, 0, 7);
      x.fill();
      x.beginPath();
      x.moveTo(0, -r * 0.4);
      x.lineTo(r * 0.3, -r * 0.8);
      x.stroke();
      break;
    case "drop":
      x.beginPath();
      x.moveTo(0, -r * 0.8);
      x.quadraticCurveTo(r * 0.7, r * 0.2, 0, r * 0.8);
      x.quadraticCurveTo(-r * 0.7, r * 0.2, 0, -r * 0.8);
      x.fill();
      break;
    case "orb":
      x.beginPath();
      x.arc(0, 0, r * 0.55, 0, 7);
      x.fill();
      break;
    case "nova":
      for (let i = 0; i < 8; i++) {
        x.beginPath();
        x.moveTo(Math.cos(i * 0.785) * r * 0.3, Math.sin(i * 0.785) * r * 0.3);
        x.lineTo(Math.cos(i * 0.785) * r * 0.85, Math.sin(i * 0.785) * r * 0.85);
        x.stroke();
      }
      break;
    case "bolt":
      x.beginPath();
      x.moveTo(r * 0.2, -r * 0.9);
      x.lineTo(-r * 0.4, r * 0.1);
      x.lineTo(0, r * 0.1);
      x.lineTo(-r * 0.2, r * 0.9);
      x.lineTo(r * 0.5, -r * 0.2);
      x.lineTo(r * 0.1, -r * 0.2);
      x.closePath();
      x.fill();
      break;
    case "cone":
      x.beginPath();
      x.moveTo(-r * 0.8, 0);
      x.lineTo(r * 0.8, -r * 0.6);
      x.lineTo(r * 0.8, r * 0.6);
      x.closePath();
      x.stroke();
      break;
    case "zone":
      x.setLineDash([3, 3]);
      x.beginPath();
      x.arc(0, 0, r * 0.7, 0, 7);
      x.stroke();
      x.setLineDash([]);
      break;
    case "rage":
      x.beginPath();
      for (let i = 0; i < 10; i++) {
        const q = i * 0.628 - 1.57,
          rr2 = i % 2 ? r * 0.35 : r * 0.85;
        x.lineTo(Math.cos(q) * rr2, Math.sin(q) * rr2);
      }
      x.closePath();
      x.fill();
      break;
    case "reload":
      x.beginPath();
      x.arc(0, 0, r * 0.65, 0.5, 5.8);
      x.stroke();
      x.beginPath();
      x.moveTo(r * 0.6, -r * 0.5);
      x.lineTo(r * 0.9, -r * 0.1);
      x.lineTo(r * 0.3, -r * 0.05);
      x.fill();
      break;
    case "dodge":
      for (let i = 0; i < 2; i++) {
        x.beginPath();
        x.moveTo(-r * 0.6 + i * r * 0.5, -r * 0.6);
        x.lineTo(-r * 0.1 + i * r * 0.5, 0);
        x.lineTo(-r * 0.6 + i * r * 0.5, r * 0.6);
        x.stroke();
      }
      break;
    default:
      x.beginPath();
      x.arc(0, 0, r * 0.4, 0, 7);
      x.fill();
  }
  x.restore();
}
let HT = null;
function slot(px, py, s, o) {
  const hov = M.x >= px && M.x <= px + s && M.y >= py && M.y <= py + s;
  x.save();
  rr(px, py, s, s, 7);
  x.fillStyle = o.off ? "#0c0a10dd" : "#161120dd";
  x.fill();
  x.lineWidth = o.sel ? 3 : 2;
  x.strokeStyle = o.sel ? "#fff" : o.col || "#6a5d80";
  if (o.empty) x.setLineDash([4, 3]);
  x.stroke();
  x.setLineDash([]);
  if (o.ico) ico(o.ico, px + s / 2, py + s / 2 + 2, s * 0.8, o.off ? "#666" : o.col || "#ddd");
  else if (o.em) spr(o.em, px + s / 2, py + s / 2 + 1, s * 0.6);
  if (o.cd > 0) {
    x.fillStyle = "#000b";
    x.fillRect(px + 2, py + 2, s - 4, (s - 4) * cl(o.cd / (o.cdm || 1), 0, 1));
    x.fillStyle = "#fff";
    x.font = "bold 13px Georgia";
    x.textAlign = "center";
    x.fillText(o.cd.toFixed(o.cd < 10 ? 1 : 0), px + s / 2, py + s / 2 + 5);
  } else if (o.nomp) {
    x.fillStyle = "#2a4cc088";
    x.fillRect(px + 2, py + 2, s - 4, s - 4);
  }
  if (o.key) {
    x.font = "bold 10px Georgia";
    const w = x.measureText(o.key).width + 8;
    rr(px - 2, py - 4, w, 13, 4);
    x.fillStyle = "#c9a24a";
    x.fill();

}
function hudSlots() {
  const s = 42,
    g = 7,
    y = H - s - 14,
    w = P.w.s,
    A = AB[w],
    mg = P.cls == "g",

    },

  tcSync();
  let px = TOUCH ? Math.max(12, (W - (5 + (mg ? 4 : 0)) * (s + g)) / 2) : 12;

      nomp: a.mp && P.mp < a.mp,
      sel: i == 2 && P.g,
      mp: a.mp || "",
      tip: [
        NM[w][i],
        ok
          ? `Enfriamiento ${a.cd || 0}s${a.mp ? " \u00b7 " + a.mp + " man\u00e1" : ""}`

      ],
    });
    px += s + g;
  }
  const tm = P.tm,
    rI = tm
      ? { shield: "guard", trap: "zone", summon: "orb", beam: "bolt", cone: "cone" }[tm]
      : w == "m"

  slot(px, y, s, {

  px += s + g;
  slot(px, y, s, {
    ico: "dodge",

    cd: P.dcd,
    cdm: 0.8,
    tip: ["Esquivar", "Breve invulnerabilidad"],

  px += s + g * 2;
  if (mg)
    for (let i = 0; i < 4; i++) {
      const k = S.cards.slots[i],
        c = k && CARDS[k];
      if (!c) {
        slot(px, y, s, {
          empty: 1,
          key: KL(KY["c" + (i + 1)]),
          tip: ["Espacio de carta vac\u00edo", "Pulsa B para equipar una carta"],
        });
      } else {
        const sp = build(c.a, c.b, c.f);
        slot(px, y, s, {
          ico: { bolt: "orb", nova: "nova", cone: "cone", zone: "zone" }[sp.f],
          key: KL(KY["c" + (i + 1)]),
          col: EL[c.a].c,
          cd: P["cd"][4 + i],
          cdm: sp.cd,
          nomp: P.mp < sp.cost,
          mp: Math.ceil(sp.cost),
          tip: [
            c.n,
            `Coste ${Math.ceil(sp.cost)} \u00b7 Enfr. ${sp.cd.toFixed(1)}s \u00b7 Da\u00f1o ${Math.round(sp.dmg)}`,
          ],
        });
      }
      px += s + g;
    }
  if (TOUCH) return;
  // equipo visible a la derecha
  const eq = [
    ["w", { i: WI[P.w.n] || "\u2694\ufe0f", n: P.w.n, r: RN.indexOf(P.w.rn), st: {} }],
    ...["h", "b", "g", "f", "a"].map((k) => [k, P.eq[k]]),
  ];
  let ex = W - 12 - eq.length * (s - 4 + g);
  eq.forEach(([k, it]) => {
    slot(ex, y, s - 4, {
      em: it && it.i,
      col: it ? RC[it.r || 0] : "#4a4258",
      empty: !it,
      key: "",
      tip: it
        ? [it.n, it.st && Object.keys(it.st).length ? stT(it.st) : `${SLOT[k]}`]
        : [SLOT[k] + " vac\u00edo", "Abre el inventario (I)"],
    });
    ex += s - 4 + g;
  });
  x.fillStyle = "#fffb";
  x.font = "11px Georgia";
  x.textAlign = "center";
  x.fillText(
    `[${KL(KY.inv)}] Inventario   [${KL(KY.tal)}] Talentos${mg ? "   [" + KL(KY.book) + "] Cartas" : ""}   [${KL(KY.map)}] Mapa`,
    W / 2,
    H - 2,
  );
  if (HT) {
    x.font = "12px Georgia";
    const w1 = Math.max(x.measureText(HT[0]).width, x.measureText(HT[1]).width) + 16,
      tx = cl(M.x - w1 / 2, 6, W - w1 - 6),

    x.stroke();

    x.textAlign = "left";
    x.fillText(HT[0], tx + 8, ty + 16);
    x.fillStyle = "#bbb";
    x.fillText(HT[1], tx + 8, ty + 32);
  }
}

// ===== RENDER =====
function ammoBar() {
  const w = P.w;
  if (!w.mag) return;
  const m = w.mag,
    rl = P.rl > 0,
    f = rl ? 1 - P.rl / (w.rt || 1.6) : (P.am ?? m) / m,
    bw = Math.min(40, 10 + m * 3),
    bx = P.x - bw / 2,
    by = P.y + 20;
  x.save();
  x.fillStyle = "#000a";
  x.fillRect(bx - 1, by - 1, bw + 2, 6);
  x.fillStyle = rl ? "#fb3" : f <= 0.25 ? "#f55" : "#8cf";
  x.fillRect(bx, by, bw * cl(f, 0, 1), 4);
  x.restore();
}
function draw() {
  x.save();
  x.clearRect(0, 0, W, H);
  if (G.st != "play") {
    x.fillStyle = "#0b0a10";
    x.fillRect(0, 0, W, H);
    x.restore();
    return;
  }
  const sk = S.nosh ? 0 : shake;
  x.translate(rnd(-sk, sk), rnd(-sk, sk));
  for (const a of AMB) {
    x.globalAlpha = 0.25;
    x.fillStyle = G.bi[3];
    x.fillRect(a.x, a.y, a.s, a.s);
  }
  x.globalAlpha = 1;
  const b = G.bi,
    r = RM_;
  x.fillStyle = b[1];
  x.fillRect(0, 0, W, H);
  x.fillStyle = b[2];
  x.fillRect(50, 50, 860, 500);
  x.strokeStyle = b[1];
  x.lineWidth = 1;
  x.globalAlpha = 0.35;
  for (let i = 50; i <= 910; i += 40) {
    x.beginPath();
    x.moveTo(i, 50);
    x.lineTo(i, 550);
    x.stroke();
  }
  for (let i = 50; i <= 550; i += 40) {
    x.beginPath();
    x.moveTo(50, i);
    x.lineTo(910, i);
    x.stroke();
  }
  x.globalAlpha = 1;
  x.fillStyle = b[1];
  for (let i = 0; i < 24; i++) {
    const px = 50 + i * 36 + ((r.gx * 7) & 7),
      hh = 10 + ((i * 37 + r.gy * 13 + G.d) % 5) * 5;
    x.beginPath();
    x.moveTo(px, 50);
    x.lineTo(px + 18, 50);
    x.lineTo(px + 9, 50 + hh);
    x.fill();
    x.beginPath();
    x.moveTo(px, 550);
    x.lineTo(px + 18, 550);
    x.lineTo(px + 9, 550 - hh);
    x.fill();
  }
  for (const o of r.obs) {
    if (o.pit) {
      pitDraw(o);
      continue;
    }
    x.fillRect(o.x, o.y, o.w, o.h);
    x.strokeStyle = b[3];
    x.lineWidth = 2;
    x.strokeRect(o.x, o.y, o.w, o.h);
  }
  for (const k in r.nb) {
    if (!doorVis(r, k)) continue;
    const d = [
      [430, 38, 100, 14],
      [896, 250, 14, 100],
      [430, 548, 100, 14],
      [48, 250, 14, 100],
    ][k];
    x.save();
    x.shadowColor = r.cl ? b[3] : "#f33";
    x.shadowBlur = r.cl ? 16 : 10;
    x.fillStyle = "#000";
    x.fillRect(d[0] - 3, d[1] - 3, d[2] + 6, d[3] + 6);
    x.fillStyle = r.cl ? b[3] : "#922";
    x.fillRect(...d);
    x.restore();
    if (!r.cl) {
      x.fillStyle = "#000";
      for (let i = 1; i < 5; i++) {
        if (k % 2) x.fillRect(d[0], d[1] + i * 20 - 2, d[2], 3);
        else x.fillRect(d[0] + i * 20 - 2, d[1], 3, d[3]);
      }
    }
  }
  x.textAlign = "center";
  const cx = 480,
    cy = 300;
  if (["treasure", "shrine", "shop", "event"].includes(r.tp)) {
    x.fillStyle =
      r.used && r.tp != "shop"
        ? "#444"
        : r.tp == "treasure"
          ? "#c9a24a"
          : r.tp == "shrine"
            ? "#b07af0"
            : r.tp == "event"
              ? "#e66"
              : "#5c8";
    x.fillRect(cx - 16, cy - 12, 32, 24);
    x.fillStyle = "#fff";
    x.font = "12px Georgia";
    x.fillText(
      { treasure: "Cofre [F]", shrine: "Santuario [F]", shop: "Mercader [F]", event: "Suceso [F]" }[
        r.tp
      ],
      cx,
      cy - 20,
    );
  }
  if (r.tp == "boss" && r.cl) {
    x.fillStyle = "#5ff";
    x.beginPath();
    x.arc(cx, cy, 24 + Math.sin(Date.now() / 150) * 3, 0, 7);
    x.fill();
    x.fillStyle = "#fff";
    x.font = "12px Georgia";
    x.fillText(G.train ? "Salir al hub [F]" : "Descender [F]", cx, cy - 34);
  }
  for (const o of O) {
    if (o.k == "i") spr(o.it.i, o.x, o.y, 20);
    else {
      x.fillStyle = o.k == "g" ? "#ffd34a" : "#f55";
      x.beginPath();
      x.arc(o.x, o.y, o.k == "g" ? 4 : 6, 0, 7);
      x.fill();
    }
  }
  for (const h of r.hz || []) {
    x.globalAlpha = 0.4;
    x.fillStyle = ["", "", "", "#3a6", "", "#f60", "#8ef", "#c3a"][(G.d - 1) % 8];
    x.beginPath();
    x.arc(h.x, h.y, h.r, 0, 7);
    x.fill();
    x.globalAlpha = 1;
  }
  if (G.dk) {
    const g = x.createRadialGradient(P.x, P.y, G.dk * 0.5, P.x, P.y, G.dk);
    g.addColorStop(0, "#0000");
    g.addColorStop(1, "#000c");
    x.fillStyle = g;
    x.fillRect(0, 0, W, H);
  }
  for (const z of ZN) {
    x.globalAlpha = 0.22;
    x.fillStyle = EL[z.sp.a].c;
    x.beginPath();
    x.arc(z.x, z.y, z.r, 0, 7);
    x.fill();
    x.globalAlpha = 1;
  }
  for (const t of TR) {
    x.strokeStyle = "#9fe8ff";
    x.beginPath();
    x.arc(t.x, t.y, 30, 0, 7);
    x.stroke();
  }
  for (const a of AL) {
    x.fillStyle = "#8fe";
    x.beginPath();
    x.arc(a.x, a.y, 8, 0, 7);
    x.fill();
  }
  for (const z of Z) {
    x.strokeStyle = z.c;
    x.fillStyle = z.c;
    x.globalAlpha = 0.25 + 0.3 * (1 - z.t / (z.m || 1));
    x.beginPath();
    x.arc(z.x, z.y, z.r, 0, 7);
    x.fill();
    x.globalAlpha = 1;
    x.stroke();
  }
  for (const e of E) {
    const T = ET[e.t];
    x.globalAlpha = e.sp > 0 ? 0.3 : 1;
    if (e.t == "boss" || e.t == "decoy" || e.t == "orb") safe(drawBoss, e);
    else safe(drawEnemy, e);
    if (e.sh > 0) {
      x.strokeStyle = "#4fa";
      x.beginPath();
      x.arc(e.x, e.y, e.r + 5, 0, 7);
      x.stroke();
    }
    if (e.st.slow > 0) {
      x.strokeStyle = "#9ef";
      x.beginPath();
      x.arc(e.x, e.y, e.r + 2, 0, 7);
      x.stroke();
    }
    if (e.st.burn > 0) {
      x.fillStyle = "#f80";
      x.fillRect(e.x - 3, e.y - e.r - 10, 6, 6);
    }
    if (e.st.poison > 0) {
      x.fillStyle = "#6c4";
      x.fillRect(e.x + 4, e.y - e.r - 10, 6, 6);
    }
    if (e.st.stun > 0) {
      x.fillStyle = "#ff4";
      x.fillRect(e.x - 10, e.y - e.r - 10, 6, 6);
    }
    if (e.st.bleed > 0) {
      x.fillStyle = "#d22";
      x.fillRect(e.x - 16, e.y - e.r - 10, 6, 6);
    }
    if (e.st.wet > 0) {
      x.fillStyle = "#4af";
      x.fillRect(e.x + 10, e.y - e.r - 10, 6, 6);
    }
    if (e.st.root > 0) {
      x.fillStyle = "#4a4";
      x.fillRect(e.x - 16, e.y - e.r - 18, 6, 6);
    }
    if (e.st.frac > 0) {
      x.fillStyle = "#999";
      x.fillRect(e.x - 8, e.y - e.r - 18, 6, 6);
    }
    if (e.st.curse > 0) {
      x.fillStyle = "#a4f";
      x.fillRect(e.x, e.y - e.r - 18, 6, 6);
    }
    if (e.st.cor > 0) {
      x.fillStyle = "#c2a";
      x.fillRect(e.x + 8, e.y - e.r - 18, 6, 6);
    }
    {
      const a = Math.atan2(P.y - e.y, P.x - e.x);
      x.fillStyle = "#fff";
      x.beginPath();
      x.arc(e.x + Math.cos(a) * e.r * 0.5, e.y + Math.sin(a) * e.r * 0.5, e.r * 0.2, 0, 7);
      x.fill();
    }

    if (e.wind > 0) {
      x.strokeStyle = "#f44";
      x.beginPath();
      x.arc(e.x, e.y, e.r + 26, 0, 7);
      x.stroke();
    }
    if (e.t != "decoy" && e.t != "orb" && (e.hp < e.mhp || e.t == "boss")) {
      x.fillStyle = "#000";
      x.fillRect(e.x - e.r, e.y - e.r - 12, e.r * 2, 4);
      x.fillStyle = "#e44";
      x.fillRect(e.x - e.r, e.y - e.r - 12, e.r * 2 * cl(e.hp / e.mhp, 0, 1), 4);
    }
    x.globalAlpha = 1;
  }
  for (const p of PR) {
    if (p.spr && drawProj(p)) continue;
    x.fillStyle = p.c;
    x.beginPath();
    x.arc(p.x, p.y, p.r, 0, 7);
    x.fill();
  }
  for (const f of FX) {
    const a = f.t / (f.m || 1);
    x.globalAlpha = a;
    if (f.k == "trail") {
      drawSwingTrail(f);
    } else if (f.k == "arc") {
      x.fillStyle = "#fff";
      x.beginPath();
      x.moveTo(f.x, f.y);
      x.arc(f.x, f.y, f.r, f.a - f.w / 2, f.a + f.w / 2);
      x.fill();
    } else if (f.k == "ring") {
      x.strokeStyle = f.c;
      x.lineWidth = 4;
      x.beginPath();
      x.arc(f.x, f.y, f.r * (1.1 - a * 0.3), 0, 7);
      x.stroke();
    } else if (f.k == "dead") {
      const q = 1 - a;
      x.fillStyle = f.c;
      x.save();
      x.translate(f.x, f.y);
      x.rotate(q * 3);
      x.scale(1 + q * 0.3, 1 - q * 0.8);
      x.beginPath();
      x.arc(0, 0, f.r, 0, 7);
      x.fill();
      x.restore();
    } else if (f.k == "line") {
      x.strokeStyle = "#fff27a";
      x.lineWidth = 3;
      x.beginPath();
      x.moveTo(f.x, f.y);
      x.lineTo(f.x2, f.y2);
      x.stroke();
    } else {
      x.fillStyle = f.c;
      x.fillRect(f.x, f.y, 3, 3);
    }
    x.globalAlpha = 1;
  }
  x.globalAlpha = P.inv > 0 && Math.floor(Date.now() / 60) % 2 ? 0.4 : 1;
  safe(drawP);
  ammoBar();
  x.globalAlpha = 1;
  for (const n of NM) {
    x.fillStyle = n.c;
    x.font = "bold 14px Georgia";
    x.fillText(n.t, n.x, n.y);
  }
  x.restore();
  hud();
}

    x.font = "14px Georgia";

    x.globalAlpha = 1;
  }
  if (S.hard) {

    x.fillStyle = "#f55";
    x.font = "bold 12px Georgia";
    x.fillText("☠ MODO DIFÍCIL", 948, H - 64);
  }
  if (G.ban && G.ban[1] > 0) {

    x.globalAlpha = Math.min(1, G.ban[1]);
    x.fillStyle = "#000b";
    x.fillRect(0, 130, W, 56);
    x.fillStyle = "#f55";
    x.font = "bold 28px Georgia";

    x.fillText(msg[0], 480, 100);
  }
}

/* ======================================================================
 * src/js/game/loop.js
 * Bucle principal con paso fijo, música y manejo de errores de render.
 *
 * Define:
 * lt, mi, music, ACC, loop
 * ====================================================================== */

let lt = performance.now(),
  mi;
function music() {
  if (mi) return;
  mi = setInterval(() => {
    if (G.st != "play" || S.mute) return;
    snd(
      pick([110, 130.8, 146.8, 164.8, 196, 220]) * (Math.random() < 0.3 ? 2 : 1),
      1.6,
      "triangle",
      0.02,
      1,
    );
  }, 900);
}
let ACC = 0;
function loop(t) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.1, (t - lt) / 1000);
  lt = t;
  ACC += dt;
  try {
    let n = 0;
    while (ACC >= 1 / 60 && n++ < 6) {
      ACC -= 1 / 60;
      if (G.st == "play" && !G.ov && !ROT && !(G.hs > 0 && ((G.hs -= 1 / 60), 1))) {
        const h = 1 / 60;
        upP(h);
        if (G.st == "play") {
          upE(h);
          upPR(h);
          upMisc(h);
          amb(h);
          if (P.pend > 0 && !G.ov) lvUp();
        }
      }
    }
    if (n >= 6) ACC = 0;
    G.st == "title" ? titleFrame(dt) : G.st == "hub" ? hubFrame(dt) : draw();
  } catch (er) {
    console.error(er);
    cv.width = W;
  }
}

// ---- src/js/input/touch.js ----
/* ======================================================================
 * src/js/input/touch.js
 * Controles táctiles (Android/iOS), modo ligero y reinicio de entradas.
 *
 * Define:
 * TOUCH_AUTO, TOUCH, LOW, ROT, TC, tcReset, tcAim, bind, mkBtn, hold, buildTouch
 * tcApply, tcSync, tcFS
 * ====================================================================== */

// ===== CONTROLES TÁCTILES (Android/iOS), MODO LIGERO Y PWA =====
// Los controles se dibujan como HTML encima del juego y reutilizan exactamente las mismas acciones que el teclado (K[...], M.d/M.r, dodge(), interact()...).
// Cada control captura su propio puntero (setPointerCapture): un dedo no activa dos botones y soltar o cancelar siempre libera la acción.
const TOUCH_AUTO =
  (typeof matchMedia == "function" && matchMedia("(pointer:coarse)").matches) ||
  (typeof navigator != "undefined" && navigator.maxTouchPoints > 0);
let TOUCH = S.touch == "on" || (S.touch != "off" && TOUCH_AUTO),
  LOW = TOUCH && !S.hq,
  ROT = false;
const TC = { ah: 0, am: 0, ap: null, jp: null, els: {}, wasOv: 0, box: null };
if (LOW)
  Object.defineProperty(x, "shadowBlur", {
    set() {},
    get() {
      return 0;
    },
    configurable: true,
  });
function tcReset() {
  for (const k of ["up", "down", "left", "right", "q", "e", "r", "c1", "c2", "c3", "c4"])
    K[KY[k]] = 0;
  M.d = 0;
  M.r = 0;
  TC.ah = 0;
  TC.am = 0;
  TC.ap = null;
  TC.jp = null;
  if (TC.els.knob) TC.els.knob.style.transform = "translate(0,0)";
  for (const id in TC.els) {
    const el = TC.els[id];
    if (el._pid != null) el._pid = null;
  }
}
function tcAim() {
  if (TC.am || !P) return;
  let b = null,
    bd = 420;
  for (const e of E)
    if (e.hp > 0 && e.sp <= 0 && e.t != "decoy") {
      const d = dist(P, e);
      if (d < bd) {
        bd = d;
        b = e;
      }
    }
  if (b) {
    M.x = b.x;
    M.y = b.y;
  } else {
    const a = Math.hypot(P.vx, P.vy) > 20 ? Math.atan2(P.vy, P.vx) : P.face;
    M.x = P.x + Math.cos(a) * 200;
    M.y = P.y + Math.sin(a) * 200;
  }
}
function bind(el, down, up) {
  el.style.touchAction = "none";
  el.onpointerdown = (e) => {
    if (el._pid != null) return;
    el._pid = e.pointerId;
    el.setPointerCapture && el.setPointerCapture(e.pointerId);
    el.classList && el.classList.add("p");
    down(e);
  };
  const end = (e) => {
    if (el._pid !== e.pointerId) return;
    el._pid = null;
    el.classList && el.classList.remove("p");
    up && up(e);
  };
  el.onpointerup = end;
  el.onpointercancel = end;
  el.onlostpointercapture = end;
}
function mkBtn(id, label, cls, css) {
  const b = document.createElement("div");
  b.className = "tb " + cls;
  b.textContent = label;
  b.style.cssText = css;
  TC.box.appendChild(b);
  TC.els[id] = b;
  return b;
}
const hold = (k) => [
  () => {
    K[KY[k]] = 1;
  },
  () => {
    K[KY[k]] = 0;
  },
];
function buildTouch() {
  if (TC.box) return;
  TC.box = document.createElement("div");
  TC.box.className = "tc";
  $("w").appendChild(TC.box);
  const jb = document.createElement("div");
  jb.className = "tj";
  TC.box.appendChild(jb);
  TC.els.joy = jb;
  const knob = document.createElement("div");
  knob.className = "tk";
  jb.appendChild(knob);
  TC.els.knob = knob;
  const jv = (e) => {
    const r = jb.getBoundingClientRect(),
      m = r.width / 2,
      dx = e.clientX - (r.left + m),
      dy = e.clientY - (r.top + m),
      l = Math.hypot(dx, dy) || 1,
      k = Math.min(1, l / m),
      vx = (dx / l) * k,
      vy = (dy / l) * k;
    knob.style.transform = `translate(${vx * m * 0.6}px,${vy * m * 0.6}px)`;
    K[KY.right] = vx > 0.35 ? 1 : 0;
    K[KY.left] = vx < -0.35 ? 1 : 0;
    K[KY.down] = vy > 0.35 ? 1 : 0;
    K[KY.up] = vy < -0.35 ? 1 : 0;
  };
  jb.style.touchAction = "none";
  jb.onpointerdown = (e) => {
    if (TC.jp != null) return;
    TC.jp = e.pointerId;
    jb.setPointerCapture && jb.setPointerCapture(e.pointerId);
    jv(e);
  };
  jb.onpointermove = (e) => {
    if (e.pointerId === TC.jp) jv(e);
  };
  const jend = (e) => {
    if (e.pointerId !== TC.jp) return;
    TC.jp = null;
    for (const k of ["up", "down", "left", "right"]) K[KY[k]] = 0;
    knob.style.transform = "translate(0,0)";
  };
  jb.onpointerup = jend;
  jb.onpointercancel = jend;
  jb.onlostpointercapture = jend;
  const at = mkBtn("atk", "ATACAR", "big", "right:30px;bottom:30px");
  at.onpointermove = (e) => {
    if (e.pointerId !== TC.ap) return;
    const r = at.getBoundingClientRect(),
      dx = e.clientX - (r.left + r.width / 2),
      dy = e.clientY - (r.top + r.height / 2),
      l = Math.hypot(dx, dy);
    if (l > 14 && P) {
      TC.am = 1;
      M.x = P.x + (dx / l) * 300;
      M.y = P.y + (dy / l) * 300;
    }
  };
  bind(
    at,
    (e) => {
      TC.ap = e.pointerId;
      TC.ah = 1;
      M.d = 1;
      TC.am = 0;
      tcFS();
    },
    () => {
      TC.ah = 0;
      M.d = 0;
      TC.am = 0;
      TC.ap = null;
    },
  );
  const B = (id, t, css, d, u) => bind(mkBtn(id, t, "", css), d, u);
  B(
    "skill",
    "HAB",
    "right:138px;bottom:40px",
    () => {
      M.r = 1;
    },
    () => {
      M.r = 0;
    },
  );
  B("q", "Q", "right:120px;bottom:112px", ...hold("q"));
  B("e", "E", "right:120px;bottom:176px", ...hold("e"));
  B("r", "R", "right:200px;bottom:112px", ...hold("r"));
  B("dodge", "ESQ", "right:30px;bottom:138px", () => {
    if (!G.ov && G.st == "play") dodge();
  });
  B("use", "F", "right:30px;bottom:206px", () => interact());
  B("pause", "II", "right:12px;top:10px;--z:.7", () => pause());
  B("inv", "INV", "right:66px;top:10px;--z:.7", () => inv());
  B("map", "MAPA", "right:120px;top:10px;--z:.7", () => {
    bigmap ^= 1;
  });
  B("tal", "T", "right:174px;top:10px;--z:.7", () => tal());
  B("book", "B", "right:228px;top:10px;--z:.7", () => book());
  for (let i = 0; i < 4; i++)
    B(
      "c" + (i + 1),
      String(i + 1),
      `left:calc(50% + ${(i - 2) * 58 + 4}px);bottom:8px;--z:.85`,
      ...hold("c" + (i + 1)),
    );
  const rot = document.createElement("div");
  rot.className = "rot";
  rot.textContent = "Gira el tel\u00e9fono: se juega en horizontal";
  TC.box.appendChild(rot);
  TC.els.rot = rot;
  tcApply();
}
function tcApply() {
  if (!TC.box) return;
  TC.box.className = "tc" + (TOUCH ? " on" : "");
  TC.box.style.setProperty && TC.box.style.setProperty("--s", S.tscale || 1);
  const w = typeof window == "object" ? window : {},
    ro = TOUCH && (w.innerHeight || 0) > (w.innerWidth || 1e9);
  ROT = !!ro;
  if (TC.els.rot) TC.els.rot.style.display = ROT ? "flex" : "none";
}
function tcSync() {
  if (!TOUCH) return;
  if (!TC.box) buildTouch();
  const mg = P && P.cls == "g";
  for (let i = 1; i <= 4; i++) TC.els["c" + i].style.display = mg ? "flex" : "none";
  TC.els.book.style.display = mg ? "flex" : "none";
  if (G.ov && !TC.wasOv) tcReset();
  TC.wasOv = G.ov ? 1 : 0;
  TC.box.style.display = G.st == "play" || G.st == "hub" || ROT ? "block" : "none";
}
function tcFS() {
  try {
    const d = document.documentElement;
    if (d && d.requestFullscreen && !document.fullscreenElement)
      d.requestFullscreen()
        .then(
          () =>
            screen.orientation &&
            screen.orientation.lock &&
            screen.orientation.lock("landscape").catch(() => {}),
        )
        .catch(() => {});
  } catch (e) {}
}
if (typeof window == "object" && window.addEventListener) {
  window.addEventListener("blur", tcReset);
  window.addEventListener("resize", tcApply);
  window.addEventListener("orientationchange", tcApply);
  if (document.addEventListener)
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) tcReset();
    });
}
if (TOUCH) buildTouch();
