<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0a10" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="src/public/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="src/public/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="src/public/icons/icon-512.png" />
    <title>Average roguelike game</title>
    <link rel="stylesheet" href="src/css/base.css" />
    <link rel="stylesheet" href="src/css/touch.css" />
  </head>
  <body>
    <div id="w">
      <canvas id="c" width="960" height="600"></canvas>
      <div id="ov"></div>
    </div>
  <!-- El orden importa: son scripts clásicos que comparten el ámbito global (mismo orden que src/modules.json). -->
  <script src="src/js/core/helpers.js"></script>
  <script src="src/js/core/storage.js"></script>
  <script src="src/js/core/audio.js"></script>
  <script src="src/js/data/world.js"></script>
  <script src="src/js/data/weapons.js"></script>
  <script src="src/js/data/weapon-sprites.js"></script>
  <script>
    /* Modo sin build: los sprites no vienen incrustados, así que se cargan desde src/assets/sprites/.
       (weapon-sprites.js ya registró en WSPR todas las claves necesarias.) */
    for (const k of Object.keys(WSPR)) WEAPON_SPRITE_DATA[k] = "src/assets/sprites/" + k + "_16x16.png";
    loadWeaponSprites();
  </script>
  <script src="src/js/data/relics.js"></script>
  <script src="src/js/data/enemy-types.js"></script>
  <script src="src/js/game/state.js"></script>

  <script src="src/js/spells/casting.js"></script>
  <script src="src/js/ui/overlay.js"></script>
  <script src="src/js/game/run.js"></script>
  <script src="src/js/combat/damage.js"></script>
  <script src="src/js/game/levels.js"></script>
  <script src="src/js/game/progression.js"></script>
  <script src="src/js/combat/melee-swing.js"></script>
  <script src="src/js/combat/ranged-hold.js"></script>
  <script src="src/js/combat/player-actions.js"></script>
  <script src="src/js/game/player-update.js"></script>
  <script src="src/js/ui/windows.js"></script>
  <script src="src/js/render/sprites-emoji.js"></script>
  <script src="src/js/render/item-icons.js"></script>
  <script src="src/js/data/items.js"></script>
  <script>
    /* Modo sin build: sprites de equipo y reliquias (el nombre del objeto -> src/assets/sprites/<nombre>_16x16.png).
       Se registran aquí porque IT (items.js) y RL (relics.js) ya existen, y slug() viene de item-icons.js. */
    for (const it of IT) WEAPON_SPRITE_DATA[slug(it.n)] = "src/assets/sprites/" + slug(it.n) + "_16x16.png";
    for (const r of RL) WEAPON_SPRITE_DATA[slug(r[0])] = "src/assets/sprites/" + slug(r[0]) + "_16x16.png";
  </script>
  <script src="src/js/ui/inventory.js"></script>
  <script src="src/js/ui/controls-menu.js"></script>

  <script src="src/js/core/pwa.js"></script>
  <script src="src/js/main.js"></script>
</body>
</html>
