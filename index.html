<!DOCTYPE html>

    <script>
  (function () {
    const VERSION = "2026.10.20.2";
    const KEY = "average_game_version";

    let previousVersion;

    try {
      previousVersion = localStorage.getItem(KEY);

      if (previousVersion !== VERSION) {
        localStorage.clear();
        sessionStorage.clear();
        localStorage.setItem(KEY, VERSION);
      }
    } catch (e) {
      console.error("Error limpiando el almacenamiento:", e);
    }

    // Si había una versión anterior, recargar una sola vez.
    if (previousVersion && previousVersion !== VERSION) {
      location.reload();
    }
  })();
</script>
